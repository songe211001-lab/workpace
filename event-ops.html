    activityLog: [{_uid:'a2', at:'2026-09-02T00:00:00.000Z', icon:'☑️', action:'두 번째', detail:'', tab:'events', monthKey:'2026-09'}, {_uid:'a1', at:'2026-09-01T00:00:00.000Z', icon:'📅', action:'테스트', detail:'', tab:null, monthKey:null}],
    trash: [{_uid:'t1', at:'2026-09-03T00:00:00.000Z', type:'rows', label:'26년 8월 이벤트 · 지운 행', payload:[ev('e9','지운 이벤트')], cid:'event:2026-08', recKind:'event'}],
    customEventColumns: [],
  };

  try{
    // (a) STATE → rows → STATE 왕복 (행 순서 포함). 행 배열을 뒤섞어서 순서가 sort 값에서 온다는 것도 확인
    const rows = stateToRows(sample);
    const ids = rows.containers.map(c=>c.id);
    assert(new Set(ids).size===ids.length, '(a) 컨테이너 id가 겹치지 않음 (event:·banner: 접두어)');
    assert(new Set(rows.records.map(r=>r.id)).size===rows.records.length, '(a) 레코드 id가 겹치지 않음');
    const back = rowsToState(rows.containers.slice().reverse(), rows.records.slice().reverse());
    assert(deepEq(back, sample), '(a) stateToRows → rowsToState 결과가 원래 STATE와 깊은 비교로 같음');
    const maps = rowsToMaps(rows);
    assert(diffRows(maps, cloneMaps(maps))===null, '(a) 바뀐 게 없으면 보낼 쓰기도 없음');
    const edited = structuredClone(sample); edited.eventMonths[1].events[0].name = '바뀐 이름';
    const op = diffRows(maps, rowsToMaps(stateToRows(edited)));
    assert(op && op.p && op.p.length===1 && deepEq(op.p[0], {id:'e3', patch:{name:'바뀐 이름'}}) && Object.keys(op).length===1, '(a) 셀 하나 수정 → patch_record 한 건(바뀐 필드만)');
    assert(rows.records.filter(r=>r.kind==='activity').length===2 && rows.records.some(r=>r.kind==='trash' && r.container_id==='settings'), '(a) 활동 기록·휴지통은 settings 아래 레코드 한 건씩');
    const legacy = rowsToState([{id:'settings', kind:'settings', sort_key:'', data:{partnerNameMap:{}, activityLog:[{id:'old1', at:'2026-01-01T00:00:00.000Z', action:'옛 기록'}]}}], []);
    assert(legacy.activityLog.length===1 && legacy.activityLog[0]._uid==='old1', '(a) 옛 버전(settings 안 배열) 활동 기록도 이어받음');
    const withLog = structuredClone(sample); withLog.activityLog.unshift({_uid:'a3', at:'2026-09-04T00:00:00.000Z', action:'새 기록'}); withLog.eventMonths[0].events[0].status = '보류';
    const nextMaps = rowsToMaps(stateToRows(withLog, (id,i)=> id==='a3' ? -1 : (maps.records.get(id)||{}).sort_order ?? i));
    const [mainOp, auxOp] = splitAuxOp(diffRows(maps, nextMaps), maps, nextMaps);
    assert(mainOp && mainOp.p && !mainOp.r && auxOp && auxOp.aux && auxOp.r.length===1 && auxOp.r[0].kind==='activity', '(a) 활동 기록은 편집과 다른 묶음으로 보냄');
    STATE = structuredClone(sample);
    STATE.eventMonths[1].events[0].id = '7001'; STATE.eventMonths[1].events[5].id = '7001'; STATE.eventMonths[0].events[0].id = '7001';
    const dupHere = idOwners('7001', STATE.eventMonths[1].events[0]._uid);
    assert(dupHere.length===1 && dupHere[0]==='26년 9월 6행', '(a) 같은 달 안의 같은 이벤트ID만 중복으로 봄 (다른 달 이월 건은 제외)');
    STATE.eventMonths[1].events[1].id = '친구추천'; STATE.eventMonths[1].events[2].id = '친구추천';
    assert(idOwners('친구추천', STATE.eventMonths[1].events[1]._uid).length===0, '(a) 친구추천 같은 전용 페이지 이름은 중복으로 보지 않음');
    assert(eventIdToUrl('친구추천').endsWith('/benefit/recommendation') && eventIdToUrl('롯데카드').endsWith('/benefit/affiliate-card') && eventIdToUrl('삼성카드').endsWith('mvnopPpCprtCardId=CC0000000029') && eventIdToUrl('CC29').endsWith('CC0000000029') && eventIdToUrl('1203').endsWith('EV0000001203'), '(a) 이벤트ID별 링크: 이벤트·친구추천·롯데카드·삼성카드·카드ID');
    assert(buildMonthSummaryWorkbook('2026-09').SheetNames[0]==='요약', '(a) 월간 요약 시트 생성');
    STATE = null;

    // (b) sort_order 중간값과 다시 매기기
    const S = new Map([['x',0],['y',1],['z',2]]);
    let order = ['x','z','y']; S.delete('z');
    assert(fillSort(order, S)===false && S.get('z')===0.5 && S.get('x')===0 && S.get('y')===1, '(b) 옮긴 행 하나만 이웃의 중간값(0.5)으로 바뀜');
    let renumbered = false, n = 0;
    while(!renumbered && n < 100){ order = ['x','m'+n, ...order.slice(1)]; renumbered = fillSort(order, S); n++; }
    assert(renumbered, `(b) 간격이 1e-9보다 작아지면 다시 매김 (${n}번째 삽입에서)`);
    assert(order.every((id,k)=> S.get(id)===k), '(b) 다시 매긴 뒤 순서값이 0,1,2… 정수');
    const B = new Map([['b1',0]]);
    fillSort(['new','b1'], B, true);
    assert(B.get('new')===-1 && encodeBlockKey(-1) < encodeBlockKey(0), '(b) 혜택 블록을 맨 앞에 추가하면 sort_key가 더 작음');

    // (c) 엑셀 내보내기 → 불러오기 왕복
    const wb = XLSX.read(new Uint8Array(XLSX.write(buildExportWorkbook(sample), {type:'array', bookType:'xlsx'})), {type:'array'});
    const imp = importFromWorkbook(wb);
    const strip = arr => arr.map(({_uid, ...rest})=> rest);
    const evFields = e => Object.fromEntries([...EVENT_FIELDS, 'id'].map(f=>[f, String(e[f] ?? '')]));
    assert(deepEq(imp.eventMonths.map(m=>({key:m.key, events:m.events.map(evFields)})), sample.eventMonths.map(m=>({key:m.key, events:m.events.map(evFields)}))), '(c) 이벤트 월·모든 EVENT_FIELDS가 같음 (이름이 빈 행 3개가 이어져도 뒤 행이 살아남음)');
    const rankView = mo => ({key:mo.key, columns:mo.columns, ranks:mo.ranks.map(r=> mo.columns.map(c=> r.values[c] ?? ''))});
    assert(deepEq(imp.bannerMonths.map(rankView), sample.bannerMonths.map(rankView)), '(c) 배너 구좌 순위가 같음');
    assert(deepEq(imp.benefitBlocks.map(b=>({label:b.label, items:strip(b.items)})), sample.benefitBlocks.map(b=>({label:b.label, items:strip(b.items)}))), '(c) 혜택 항목과 expiryDate가 같음');
    const pmView = mo => ({key:mo.key, cycleWeeks:mo.cycleWeeks, weekAnchor:mo.weekAnchor, entries:strip(mo.preMarketingPartners||[])});
    assert(deepEq(imp.bannerMonths.map(pmView), sample.bannerMonths.map(pmView)), '(c) 프리마케팅(주차·순위·파트너, 배치 주기, 기준일시)이 같음');

    // (d) 마감 알림은 reflectStatus(종료일)를 먼저 봄
    const dl = scanDeadlines([
      {_uid:'d1', name:'종료일 지남', status:'진행', dueDate:iso(addDays(10)), reflectStatus:iso(addDays(-3))},
      {_uid:'d2', name:'종료일 없음', status:'진행', dueDate:iso(addDays(2)), reflectStatus:''},
      {_uid:'d3', name:'종료일 여유', status:'진행', dueDate:iso(addDays(-5)), reflectStatus:iso(addDays(30))},
    ]);
    assert(dl.overdue.length===1 && dl.overdue[0]._uid==='d1', '(d) 시작일이 미래여도 종료일이 지났으면 지연');
    assert(dl.dueSoon.length===1 && dl.dueSoon[0]._uid==='d2', '(d) 종료일이 없으면 시작일 기준으로 임박');
    assert(!dl.overdue.concat(dl.dueSoon).some(x=>x._uid==='d3'), '(d) 시작일이 지나도 종료일이 30일 남았으면 알림 없음');

    // (e) 중복 ID 막기 · 칸 설정 없음 · Ctrl+Z · 이 달을 현재로 보기
    //     sb는 가짜, CONNECTED=false라 아무것도 보내지 않아요. 저장 대기열(localStorage)은 끝나면 원래대로 돌려놔요.
    // 이 브라우저에 남아 있던 실제 전송 대기열은 통째로 보관했다가 끝나면 그대로 돌려놔요
    const pendingKeys = ()=> Object.keys(localStorage).filter(k=> k===PENDING_KEY || k.startsWith(PENDING_KEY + ':'));
    const savedPending = pendingKeys().map(k=> [k, localStorage.getItem(k)]);
    try{
      sb = {};
      STATE = structuredClone(sample); STATE.uiPrefs = {}; ensureStateShape();
      STATE.eventMonths.forEach(m=> m.events.forEach((x,i)=>{ x.id = m.key.slice(5) + '0' + i; }));
      SHADOW = snapshotRows(); UNDO.length = 0;
      activeMainTab = 'events'; activeEventMonthKey = '2026-09'; activeBannerMonthKey = '2026-09';
      renderEventsTab();
      const ctrlZ = ()=> document.dispatchEvent(new KeyboardEvent('keydown', {key:'z', ctrlKey:true, bubbles:true}));
      const evOf = u=> getEventMonth('2026-09').events.find(x=>x._uid===u);
      assert(!document.getElementById('colSettingsBtn') && typeof openColumnSettings==='undefined', '(e) 칸 설정 버튼·기능이 없음');
      const idInp = document.querySelector('#tab-events tr[data-uid="e3"] input[data-field="id"]');
      const origId = evOf('e3').id;
      idInp.dispatchEvent(new Event('focus'));
      idInp.value = evOf('e5').id;
      idInp.dispatchEvent(new Event('input')); idInp.dispatchEvent(new Event('change'));
      assert(evOf('e3').id===origId && idInp.value===origId && SHADOW.records.get('e3').data.id===origId
        && /이미 사용 중인 ID예요: 26년 9월 6행/.test(document.getElementById('toastStack').textContent), '(e) 같은 달 중복 ID는 알림 후 직전 값으로 되돌리고 저장하지 않음');
      const ids0 = ['e6','e7','e8'].map(u=> evOf(u).id);
      handleTablePaste({clipboardData:{getData:()=> evOf('e5').id + '\n8888\n8888'}, preventDefault(){}}, '2026-09', 'e6', 'id', 'current');
      assert(evOf('e6').id===ids0[0] && evOf('e7').id==='8888' && evOf('e8').id===ids0[2], '(e) 붙여넣기도 중복 ID(기존 행·같이 붙여넣은 행)는 넣지 않고 원래 값을 둠');
      UNDO.pop(); evOf('e7').id = ids0[1]; SHADOW = snapshotRows();
      const nameInp = document.querySelector('#tab-events tr[data-uid="e3"] input[data-field="name"]');
      nameInp.value = '바뀐 이름'; nameInp.dispatchEvent(new Event('input'));
      assert(evOf('e3').name==='바뀐 이름', '(e) 칸 수정이 STATE에 반영됨');
      ctrlZ();
      assert(evOf('e3').name==='가을 이벤트' && SHADOW.records.get('e3').data.name==='가을 이벤트', '(e) Ctrl+Z → 수정한 칸이 원래 값으로 돌아옴');
      setCurrentDroppingLater('event', '2026-08');
      assert(/26년 9월/.test(document.getElementById('confirmModalMessage').textContent), '(e) 현재로 보기 확인 문구에 삭제될 달이 나옴');
      document.getElementById('confirmModalOkBtn').click();
      assert(!getEventMonth('2026-09') && activeEventMonthKey==='2026-08' && STATE.trash.some(t=>t.type==='event_month' && t.payload.key==='2026-09'), '(e) 지난달을 현재로 보기 → 이후 달이 지워지고(휴지통 보관) 그 달이 현재가 됨');
      ctrlZ();
      assert(getEventMonth('2026-09') && getEventMonth('2026-09').events.length===6 && activeEventMonthKey==='2026-09' && !STATE.trash.some(t=>t.type==='event_month'), '(e) Ctrl+Z → 지운 달과 현재 달이 돌아옴');
      assert([...SHADOW.records.keys()].every(Boolean) && STATE.activityLog.every(a=>a._uid), '(e) 새 활동 기록도 행 id(_uid)를 가짐');

      // (f) 다음 달 한 번에 만들기 → Ctrl+Z 한 번에 모두 되돌림
      const nUndo = UNDO.length;
      addAllNextMonths();
      assert(getEventMonth('2026-10') && getBannerMonth('2026-10') && STATE.benefitBlocks[0].label==='26년 10월' && UNDO.length===nUndo+1, '(f) 다음 달 한 번에 만들기 → 이벤트·배너·혜택 10월이 생기고 되돌리기 기록은 한 단계');
      ctrlZ();
      assert(!getEventMonth('2026-10') && !getBannerMonth('2026-10') && STATE.benefitBlocks[0].label==='26년 9월', '(f) Ctrl+Z 한 번 → 세 탭의 새 달이 모두 사라짐');

      // (f) 다른 사람이 달을 지우면 알림을 모아요
      onRealtime('containers', {eventType:'DELETE', old:{id:'event:2026-08'}});
      assert(!getEventMonth('2026-08') && REMOTE_DEL && REMOTE_DEL.labels.includes('26년 8월'), '(f) 다른 사람이 지운 달은 알림 대기열에 이름이 올라감');
      clearTimeout(REMOTE_DEL.timer); REMOTE_DEL = null;

      // (f) 탭마다 따로 저장하는 대기열: 닫힌 탭·예전 형식은 이어받고, 열려 있는 다른 탭 것은 건드리지 않음
      pendingKeys().forEach(k=> localStorage.removeItem(k));
      localStorage.setItem(PENDING_KEY + ':dead', JSON.stringify({at: Date.now() - PENDING_STALE_MS - 1, q:[{dr:['x']}]}));
      localStorage.setItem(PENDING_KEY + ':live', JSON.stringify({at: Date.now(), q:[{dr:['y']}]}));
      localStorage.setItem(PENDING_KEY, JSON.stringify([{dr:['z']}]));
      loadPendingQueue();
      const got = QUEUE.map(o=> o.dr[0]).sort().join();
      assert(got==='x,z' && localStorage.getItem(PENDING_KEY + ':live') && !localStorage.getItem(PENDING_KEY + ':dead') && !localStorage.getItem(PENDING_KEY) && JSON.parse(localStorage.getItem(MY_PENDING_KEY)).q.length===2, '(f) 대기열: 닫힌 탭·예전 형식은 이어 보내고 열린 탭 것은 그대로 둠');
    }finally{
      DEBOUNCE.forEach(e=> clearTimeout(e.timer)); DEBOUNCE.clear(); QUEUE.length = 0;
      pendingKeys().forEach(k=> localStorage.removeItem(k));
      savedPending.forEach(([k, v])=> localStorage.setItem(k, v));
      sb = null;
    }

    console.log('SELFTEST PASS\n' + results.join('\n'));
    showSetup('✅ 셀프테스트 통과 (' + results.length + '개)\n' + results.join('\n'));
  }catch(err){
    console.error('SELFTEST FAIL', err);
    showSetup('❌ 셀프테스트 실패: ' + err.message + '\n' + results.join('\n'));
  }
})();
</script>
