<title>업무 관리 대시보드</title>
<style>
/* Layout: 상단 요약 스트립 → 프로젝트 탭 + 필터 바 → 목록/보드/파트 현황 3개 뷰. 표 중심의 운영 툴
   토큰: 알닷 운영툴 디자인 시스템(alddot-design-system/DESIGN.md) 값. 라이트 테마만 있어요. */
:root{
  color-scheme:light;
  --bg:#f6f8fa; --surface:#ffffff; --sunk:#eef1f4; --line:#dee3e7;
  --fg:#141f2c; --ink-soft:#4b5765; --muted:rgba(1,10,37,.58); --grey-400:#a7b0b9; --na:#87919c;
  --accent:#fc6969; --accent-dark:#d74844; --accent-soft:#ffeeee; --accent-fg:#ffffff;
  --ok:#005927; --ok-strong:#007738; --ok-soft:#dafae3; --ok-border:#9fe0b3;
  --warn:#993f00; --warn-strong:#ff8800; --warn-soft:#ffe8d1; --warn-border:#ffbd8d;
  --bad:#b00727; --bad-strong:#f03848; --bad-soft:#ffe1df; --bad-border:#febab6;
  --overlay:rgba(43,37,35,.4);
  --shadow-3:0 12px 32px rgba(1,10,37,.10),0 2px 6px rgba(1,10,37,.06);
  --shadow-toast:0 8px 24px rgba(1,10,37,.16);
  --font-ui:Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --font-num:var(--font-ui);
  --r:7px; --r-sm:6px; --r-lg:9px; --r-xl:11px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
@media (max-width:600px){.wrap{padding-inline:16px}}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-dark);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.brand h1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.editBtn{font-size:12px;font-weight:500;padding:2px 8px}
.brand:hover .editBtn,.editBtn:focus-visible{color:var(--accent-dark)}
.brandEdit{display:flex;flex-direction:column;gap:6px;width:min(460px,100%)}
.brandEdit input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;width:100%}
.brandEdit #bTitle{font-size:18px;font-weight:700}
.brandBtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.brandBtns .btn{padding:5px 12px}
.brand{min-width:0;flex:1 1 280px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:var(--r);padding:8px 14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent-dark)}
/* 흰 글자 대비: coral 바탕 2.85:1 → primary-dark 바탕 4.27:1 (DESIGN.md 접근성 메모의 개선안) */
.btn.primary{background:var(--accent-dark);border-color:var(--accent-dark);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:var(--accent-fg);filter:brightness(.92)}
.btn.danger{color:var(--bad);border-color:var(--bad-border)}
.btn.danger:hover{color:var(--bad);border-color:var(--bad-strong)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{border-color:transparent;color:var(--accent-dark)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border);border-radius:var(--r);padding:12px 14px;font-size:12.5px;line-height:1.6}

/* summary strip */
.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px 0}
.stat{padding:10px 18px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .k{font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:.04em}
.stat .v{font-size:26px;font-weight:700;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--muted);margin-left:2px}
.stat.alert .v{color:var(--bad)}
.bar{height:4px;background:var(--sunk);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok-strong)}
@media (max-width:900px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(4){border-left:0}.stat:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:480px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-left:0!important;border-top:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}.stat:nth-child(even){border-left:1px solid var(--line)!important}}

/* mode tabs */
.modeRow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.modes{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);flex:1 1 auto}
.modes button{border:0;border-bottom:2.5px solid transparent;background:transparent;padding:10px 16px;border-radius:var(--r) var(--r) 0 0;font-weight:600;color:var(--muted)}
.modes button:hover{color:var(--accent-dark)}
.modes button[aria-selected="true"]{color:var(--accent-dark);border-bottom-color:var(--accent)}
.todayOff{font-size:13px;color:var(--muted);min-width:0}
.todayOff b{color:var(--fg);font-weight:600}
.area{display:flex;flex-direction:column;gap:16px}

/* leave */
.lgrid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.lgrid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0;overflow:hidden}
.panel>h3{margin:0;font-size:14px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel>h3 .legend{font-weight:400}
.panel table{min-width:0}
.panel .scroll{overflow-x:auto}
.mrow{cursor:pointer}
.mrow.on{background:var(--accent-soft)}
.mrow td{padding:9px 12px}
.mname{font-weight:600}
.mpart{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.mpart .sw{width:6px;height:6px;border-radius:2px}
.qbar{display:flex;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:4px;min-width:80px}
.qbar .u{background:var(--ink-soft)}
.qbar .p{background:var(--ink-soft);opacity:.35}
.qbar .x{background:var(--bad-strong)}
td.r,th.r{text-align:right}
.rem{font-weight:600;font-variant-numeric:tabular-nums}
.rem.neg{color:var(--bad)}
.calnav{display:flex;align-items:center;gap:4px}
.calnav .btn{padding:4px 10px}
.calnav .mlabel{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;min-width:84px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .dow{font-size:11px;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);background:var(--sunk)}
.cal .dow.we{color:var(--bad)}
.day{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:default}
.day:nth-child(7n){border-right:0}
.day.can{cursor:copy}
.day.can:hover{background:var(--accent-soft)}
.day.out{background:var(--bg)}
.day.out .dn{opacity:.4}
.day.we{background:var(--bg)}
.dn{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);width:fit-content;padding:0 4px;border-radius:4px}
.day.we .dn{color:var(--bad)}
.day.today .dn{background:var(--accent-dark);color:var(--accent-fg)}
.lv{font-size:11px;line-height:1.5;border-radius:3px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid currentColor}
.lv:hover{filter:brightness(.96)}
.lt-a{background:var(--accent-soft);color:var(--fg);border-left-color:var(--accent)}
.lt-h{background:var(--ok-soft);color:var(--ok)}
.lt-q{background:var(--warn-soft);color:var(--warn)}
.lt-o{background:var(--sunk);color:var(--ink-soft)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
@media (max-width:600px){.day{min-height:64px;padding:3px}.lv{font-size:10px;padding:0 3px}}
.ltable td,.ltable th{padding:8px 12px}
.ltable tbody tr{cursor:pointer}

/* period bar */
.periodBar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.plabel{min-width:130px}
.periodBar .sel{padding:4px 8px}

/* weekly report */
.rtool{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mlabel.wk{min-width:150px}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}
@media (max-width:980px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.report{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
@media (max-width:600px){.report{padding:16px}}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:10px}
.rhead h2{margin:2px 0 0;font-size:20px;text-wrap:balance}
.rhead>.legend{text-align:right}
.rkpi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:6px}
.rkpi>div{padding:8px 12px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.rkpi>div:first-child{border-left:0}
.rkpi .k{font-size:11px;color:var(--muted)}
.rkpi .v{font-size:18px}
.rkpi small{font-size:11px;color:var(--muted);margin-left:2px}
@media (max-width:700px){.rkpi{grid-template-columns:repeat(3,minmax(0,1fr))}.rkpi>div:nth-child(4){border-left:0}.rkpi>div:nth-child(n+4){border-top:1px solid var(--line)}}
.rsecs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}
@media (max-width:760px){.rsecs{grid-template-columns:minmax(0,1fr)}}
.rsec{min-width:0}
.rsec h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.rsec h4 .num{font-size:12px;color:var(--muted);font-weight:500}
.rsec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.rsec li{font-size:13px;overflow-wrap:anywhere}
.rsec .legend{margin:4px 0 0}
.rgrp{margin-top:6px}
.rbody{display:flex;flex-direction:column;gap:22px}
.rproj h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rproj h3 .legend{font-weight:400;margin-left:auto}
.rdot{width:10px;height:10px;border-radius:50%;flex:none}
.rparts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.rparts{grid-template-columns:minmax(0,1fr)}}
.rpartcard{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rpartcard .rpart{font-size:13px;color:var(--fg);margin:0}
.rpartcard .rpart .sw{height:14px}
.rpartcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.rpartcard li{font-size:13px;overflow-wrap:anywhere}
.rblkT{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:2px}
.rblkT .num{font-weight:500}
.rb-done .rblkT{color:var(--ok)}
.rb-late .rblkT{color:var(--bad)}
.rb-next .rblkT{color:var(--accent-dark)}
.rpart{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px;margin-bottom:2px}
.rpart .sw{width:3px;height:12px;border-radius:2px}
.rnotes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.rnotes.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.rnotes.three{grid-template-columns:minmax(0,1fr)}}
.rnotes textarea{min-height:76px}
.rsave{margin:0;text-align:right}
.rarch>h3{margin:0;font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line)}
.alist{list-style:none;margin:0;padding:6px}
.aitem{width:100%;border:0;background:transparent;border-radius:6px;padding:7px 8px;display:flex;justify-content:space-between;gap:8px;text-align:left}
.aitem:hover{background:var(--sunk)}
.aitem.on{background:var(--accent-soft);color:var(--fg);font-weight:600}

/* history */
.hday h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.hlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.hitem{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.hitem:last-child{border-bottom:0}
.htime{font-size:12px;color:var(--muted);padding-top:2px;flex:none;width:40px}
.hbody{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
.hline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hlabel{font-weight:500;overflow-wrap:anywhere}
.hlink{border:0;background:none;padding:0;font-weight:600;color:var(--accent-dark);text-decoration:underline;text-underline-offset:2px;text-align:left;overflow-wrap:anywhere}
.h-del{background:var(--bad-soft);color:var(--bad)}
.hchg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.hchg li{display:flex;gap:6px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.hf{color:var(--muted);min-width:76px}
.harr{color:var(--muted)}
.hsw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle}

/* people hours */
.rpeople h3{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rpeople h3 .legend{font-weight:400}
.ptable{min-width:720px}
.ptable td,.ptable th{padding:7px 10px}
.ptable tbody tr{cursor:default}
.hsum{grid-template-columns:repeat(6,minmax(0,1fr))}
.hrow{cursor:pointer}
.hrow.on{background:var(--accent-soft)}
.caret{display:inline-block;width:14px;color:var(--muted)}
.hdet td{background:var(--bg);padding:8px 14px 10px 34px}
.hdet:hover{background:transparent!important}
.hitems{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.hitems li{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hitems .hh{margin-left:auto;color:var(--muted)}
.hbar{position:relative;display:flex;height:10px;background:var(--sunk);border-radius:3px;overflow:visible}
.hbar i{display:block;height:100%}
.hbar .d{background:var(--ok-strong);border-radius:3px 0 0 3px}
.hbar .g{background:var(--na)}
.hbar .cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.6}
.lgd{display:inline-block;width:10px;height:8px;border-radius:2px;margin:0 3px 0 6px;vertical-align:middle}
.lgd.d{background:var(--ok-strong)}.lgd.g{background:var(--na)}

/* staffing */
.ssum{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.ssum{grid-template-columns:repeat(2,minmax(0,1fr))}.ssum .stat:nth-child(3){border-left:0}.ssum .stat:nth-child(n+3){border-top:1px solid var(--line)}}
.scard>h3{gap:8px 10px}
.scard>h3 .legend{font-weight:400}
.scount{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto;font-size:12px;font-weight:500}
.chip.sm{padding:1px 8px;font-size:11px;cursor:default}
.scard>h3 .btn{padding:4px 10px;font-size:12px}
.stable{min-width:760px}
.stable td,.stable th{padding:8px 12px}
.snote{color:var(--muted);font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* project tabs */
.ptabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;flex:1 1 320px;min-width:0}
.ptRow{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ptRow .periodBar{padding-block:4px}
.ptab{border:0;background:transparent;padding:8px 12px;border-bottom:2.5px solid transparent;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;font-weight:600}
.ptab:hover{color:var(--accent-dark)}
.ptab .dot{width:8px;height:8px;border-radius:50%}
.ptab .c{font-variant-numeric:tabular-nums;font-size:12px;background:var(--sunk);border-radius:10px;padding:0 6px}
.ptab[aria-selected="true"]{color:var(--accent-dark);border-bottom-color:var(--accent)}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:var(--r-sm);padding:5px 12px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent);color:var(--accent-dark)}
.chip[aria-pressed="true"]{background:var(--accent-dark);color:var(--accent-fg);border-color:var(--accent-dark)}
.chip .sw{width:8px;height:8px;border-radius:2px}
.sel,.search{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;font-size:13px}
.search{min-width:0;flex:1 1 180px;max-width:280px}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:700}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

/* table */
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1080px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:12.5px}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;user-select:none}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--fg)}
th .arr{font-size:10px;margin-left:3px}
tbody tr{cursor:pointer}
tbody tr:nth-child(even){background:var(--bg)}
tbody tr:hover{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
td.title{max-width:340px}
td.title .t{font-weight:500}
td.title .n{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.nowrap{white-space:nowrap}
.part{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.part .sw{width:3px;height:14px;border-radius:2px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.s-wait{background:var(--sunk);color:var(--ink-soft)}
.s-doing{background:var(--warn-soft);color:var(--warn)}
.s-review{background:var(--accent-soft);color:var(--fg)}
tbody tr.is-late td:first-child{box-shadow:inset 3px 0 0 var(--bad-strong)}
.card.is-late{box-shadow:inset 3px 0 0 var(--bad-strong)}
/* A3: 마감일에 담당자 휴가 */
.leaveTag{display:block;width:fit-content;margin-top:2px;padding:0 6px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700}
.wlAdd{display:grid;grid-template-columns:150px minmax(0,1fr) 90px minmax(0,1.4fr) auto;gap:6px;align-items:center;margin-top:4px}
.wlAdd input,.wlAdd select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
.wlBox .hitems li{gap:8px}

.cmList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

/* 동기화 상태 · 접속자 */
.syncBox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap;min-width:0}

.onlineWrap{position:relative}

.lvRange{display:block!important;font-size:13px;background:var(--sunk);border-radius:var(--r);padding:8px 12px}
.day.pick{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 1px var(--accent)}
.areaBar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.tplList{display:flex;flex-direction:column;gap:8px}

.tplName{display:flex;flex-direction:column;gap:2px;flex:1 1 240px;min-width:0}
.warnHint{color:var(--warn);font-weight:600}

.late{color:var(--bad);font-weight:600}
.dday{font-size:11px;margin-left:4px}
.hrs .over{color:var(--bad)}
.rms{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 5px;margin-right:6px;white-space:nowrap;text-decoration:none}
a.rms:hover{text-decoration:underline}
.rmsRow{flex-direction:row!important;align-items:center;gap:8px!important;flex-wrap:wrap}
.rmsRow .btn{padding:2px 8px;font-size:12px}
.rmsRow a.rms{font-size:12px;padding:2px 8px}

.rmsRule input{flex:1 1 260px;min-width:0}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--sunk);border-radius:var(--r-lg);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:160px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:grab}

/* matrix */
.matrix{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto}
.matrix table{min-width:760px}

.cell{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.cell .main{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.cell .sub{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell .sub .late{font-weight:500}
.cell.zero .main{color:var(--line)}
.mini{width:72px;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ok-strong)}
.matrix tfoot td{background:var(--sunk);font-weight:600}
.legend{font-size:12px;color:var(--muted)}

/* empty */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);padding:48px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{margin:0;font-size:17px}
.empty p{margin:0;color:var(--muted);max-width:46ch}

/* modal */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:var(--r-xl);width:100%;max-width:720px;box-shadow:var(--shadow-3)}

.modal .body{padding:16px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.modal footer{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal footer .r{display:flex;gap:8px;margin-left:auto}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--ink-soft)}
.f label b{color:var(--bad-strong)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 10px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus,.sel:focus,.search:focus{outline:none;border-color:var(--accent)}
.f textarea{min-height:72px;resize:vertical}
.moreF{border-top:1px solid var(--line);padding-top:10px}
.moreF>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-soft);width:fit-content}
.moreF>summary:hover{color:var(--accent-dark)}
.modal .body.sub{padding:12px 0 0}
/* 내보내기 같은 접이식 메뉴 */
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.menuList{position:absolute;right:0;top:calc(100% + 4px);z-index:15;min-width:170px;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-3)}
.menuList .btn{border-color:transparent;justify-content:flex-start;width:100%}
.f .hint{font-size:11px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dcell{display:flex;flex-direction:column;gap:1px;line-height:1.35}
.dcell .dl{font-size:10px;color:var(--muted);margin-right:4px}
.dcell .exp{font-size:12px;color:var(--muted)}
.dcell .act{color:var(--ok);font-weight:600}
.dcell .due{font-size:12px}
.dcell .exp.slip{color:var(--warn);font-weight:600}
@media (max-width:560px){.modal .body{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:13px}
.confirm{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-border);border-radius:var(--r);padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.prow input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%}
.swatches{display:flex;gap:4px}
.swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--fg)}
.swatches.wrap{flex-wrap:wrap;padding-left:2px}
.pcard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.pcTop{display:flex;align-items:center;gap:8px}
.pcTop .order{display:flex;flex-direction:column}
.pcTop .order .btn{padding:0 6px;font-size:10px;line-height:16px}
.pcSw{width:12px;height:12px;border-radius:3px;flex:none}
.pcName{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px}
.pcUse{font-size:12px;color:var(--muted);white-space:nowrap}
.mrowEdit,.mhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,.9fr) 84px 52px;gap:8px;align-items:center}

.mhead{font-size:11px;font-weight:600;color:var(--muted);padding:0 2px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--accent-fg);padding:12px 16px;border-radius:var(--r);font-size:13px;font-weight:600;box-shadow:var(--shadow-toast);z-index:30}

/* 좁은 화면: 첫 화면에 업무 목록이 보이도록 머리말·버튼·탭·요약을 줄임 */
@media (max-width:600px){
  .sLong,#syncNow{display:none}
  .todayOff{flex-basis:100%}
  .modeRow{gap:6px 10px}
  .brand h1{font-size:22px}
  .actions{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}

}

  .summary .stat:nth-child(3n+1){border-left:0!important}

  .summary .stat .v{font-size:20px}

/* ---------- 화면 틀: 밝은 왼쪽 메뉴 + 위 헤더 + 넓은 여백의 흰 본문 ---------- */
.shell{display:flex;min-height:100vh;align-items:stretch}
.side{width:236px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);color:var(--fg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;padding:18px 12px 24px;z-index:13}
.sideHead{display:flex;align-items:flex-start;gap:6px;padding:0 4px}
.side .brand{flex:1;min-width:0}
.side .brand h1{font-size:15px;font-weight:800;line-height:1.35;letter-spacing:-.01em}
.side .brand p{font-size:12px;margin-top:4px}
.side .editBtn{font-size:11px;padding:0 4px}
.side .brandEdit{width:100%}
.sideFold{flex:none;border:0;background:none;color:var(--ink-soft);font-size:15px;line-height:1;padding:4px 6px;border-radius:var(--r-sm);cursor:pointer}
.sideFold:hover{background:var(--sunk);color:var(--fg)}
.sideNav{display:flex;flex-direction:column;gap:6px}
.sideSec{display:flex;flex-direction:column}
.secHead{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;padding:8px 10px 6px;cursor:pointer;border-radius:var(--r-sm)}
.secHead:hover{color:var(--fg)}
.chev{transition:transform .12s var(--ease)}
.sideSec.closed .chev{transform:rotate(-90deg)}
.sideSec.closed .secBody{display:none}
.secBody{display:flex;flex-direction:column;gap:2px}
.navItem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--fg);font-size:13.5px;font-weight:500;padding:8px 10px;border-radius:var(--r);text-align:left;cursor:pointer}
.navItem:hover{background:var(--sunk)}
/* 선택 항목: --accent-dark 글자는 --accent-soft 위에서 대비 3.8이라 글자는 --fg, 강조는 아이콘 테두리로 */
.navItem[aria-selected="true"]{background:var(--accent-soft);font-weight:700}
.navItem:disabled{opacity:.45;cursor:not-allowed}
.navItem .ico{width:18px;height:18px;flex:none;color:var(--ink-soft)}
.navItem:hover .ico{color:var(--fg)}
.navItem[aria-selected="true"] .ico{color:var(--accent-dark)}
/* 전체 접기: 아이콘만 보이는 좁은 폭. 접힌 섹션도 아이콘은 보여 줌 */
.shell.fold .side{width:60px;padding-inline:8px}
.shell.fold .side .brand,.shell.fold .secHead .lbl,.shell.fold .navItem .lbl{display:none}
.shell.fold .sideHead{justify-content:center;padding:0}
.shell.fold .secHead{justify-content:center;padding:6px 0;border-top:1px solid var(--line);border-radius:0}
.shell.fold .secHead .chev{display:none}
.shell.fold .sideSec.closed .secBody{display:flex}
.shell.fold .navItem{justify-content:center;padding:8px 0}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface)}
.main>.wrap{width:100%;padding-inline:56px;padding-top:28px}
.topbar{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:56px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-inline:max(24px,env(safe-area-inset-left,0px)) max(24px,env(safe-area-inset-right,0px))}
.pageTitle{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1 1 auto;min-width:0}
.topRight{justify-content:flex-end}
.sideOpen{display:none;font-size:18px;padding:4px 10px}
.todayLine{font-size:13px;color:var(--muted)}
.todayLine:has(#todayOff:empty){display:none}
/* 본문: 카드 대신 구분선과 제목 위계로 나눔 */
.wrap .area[hidden]{display:none}
.main th{font-weight:700;color:var(--fg);border-bottom-width:1px}
.sideBackdrop{display:none}
/* 좁은 화면: 메뉴는 서랍. ☰로 열고, 바깥·메뉴 항목·Esc로 닫힘 */
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(260px,82vw)!important;padding-inline:12px!important;transform:translateX(-100%);transition:transform .18s var(--ease);z-index:25;padding-top:max(18px,env(safe-area-inset-top,0px));box-shadow:var(--shadow-3)}
  .shell.drawer .side{transform:none}
  .shell.drawer .sideBackdrop{display:block;position:fixed;inset:0;background:var(--overlay);z-index:24}
  .shell.fold .side .brand,.shell.fold .secHead .lbl,.shell.fold .navItem .lbl,.shell.fold .secHead .chev{display:revert}
  .shell.fold .navItem{justify-content:flex-start;padding:8px 10px}
  .shell.fold .secHead{justify-content:space-between;padding:8px 10px 6px;border-top:0}
  .sideFold{display:none}
  .sideOpen{display:inline-flex}
  .main>.wrap{padding-inline:24px;padding-top:20px}
  .topbar{padding-inline:16px}
  .pageTitle{font-size:16px}
}
@media (max-width:600px){.main>.wrap{padding-inline:16px}.topbar{position:static}}
/* 헤더: 화면 이름 → 그 화면의 필터·등록 버튼 → (오른쪽) 프로필·로그아웃 */
.pageTitle{flex:none}
.pageTools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.pageTools:empty{display:none}
.pageTools .rtool{flex-wrap:wrap}

#syncBox{display:none!important}

@media (max-width:1200px){.main>.wrap{padding-inline:48px}}
@media (max-width:900px){.main>.wrap{padding-inline:24px}.pageTools,.topbar>.actions{order:5}.pageTools{flex-basis:100%}}
@media (max-width:600px){.main>.wrap{padding-inline:16px}.topbar{position:static}}
/* ---------- 버튼 통일: 높이 32(작은 것 28) · 역할 4종(primary/기본/ghost/danger) · 포커스·눌림·비활성 ---------- */
.btn{height:32px;padding:0 12px;font-size:13px;font-weight:600;border-radius:var(--r);justify-content:center;line-height:1}
.btn.sm,.editBtn,td .btn,th .btn,.panel h3 .btn,.scard h3 .btn,.menuList .btn{height:28px;padding:0 10px;font-size:12px}
.menuList .btn{justify-content:flex-start;height:32px}
.sel,.search{height:32px;padding-block:0}
.seg{height:32px}
.seg button{padding:0 12px}
.chip{height:28px;padding:0 10px}
.chip.sm{height:auto;padding:1px 8px}
.calnav .btn[aria-label],.sideOpen,.sideFold{width:32px;height:32px;padding:0;justify-content:center}
.btn.ghost{color:var(--ink-soft)}
.btn.ghost:hover{background:var(--sunk);color:var(--fg)}
.btn.danger:hover{background:var(--bad-soft)}
.btn:active:not(:disabled),.chip:active,.seg button:active,.navItem:active{transform:translateY(1px)}
.btn.primary:active:not(:disabled){filter:brightness(.85)}
.btn:disabled,.chip:disabled,.seg button:disabled,.navItem:disabled{opacity:.4;cursor:not-allowed;filter:none}
/* 잘리는 곳(overflow:hidden·스크롤 영역)은 윤곽선을 안쪽으로 */
.seg button:focus-visible,.navItem:focus-visible,.secHead:focus-visible,.ptab:focus-visible,.menuList .btn:focus-visible{outline:2px solid var(--accent-dark);outline-offset:-2px}
.menu>summary:focus-visible{outline:2px solid var(--accent-dark);outline-offset:2px;border-radius:var(--r)}
@media (max-width:900px){
  .btn,.sel,.search,.seg,.calnav .btn[aria-label],.sideOpen{height:36px;min-height:36px}
  .calnav .btn[aria-label],.sideOpen{width:36px}
  .btn.sm,.editBtn,td .btn,.panel h3 .btn,.scard h3 .btn,.chip{height:32px}
}
/* ---------- 프로젝트 탭 + / ⋯ · 휴가 연차 띠 · 보고서 확정 줄 ---------- */
.ptabW{display:inline-flex;align-items:center;flex:none}
.ptabMore{border:0;background:none;color:var(--ink-soft);width:24px;height:24px;border-radius:var(--r-sm);cursor:pointer;opacity:0;font-weight:700}
.ptabW:hover .ptabMore,.ptabW:focus-within .ptabMore{opacity:1}
.ptabMore:hover{background:var(--sunk);color:var(--fg)}
@media (hover:none){.ptabMore{opacity:1}}

<script>
/* 파트(카테고리): 저장소의 parts 컬렉션에서 불러오고, 비어 있으면 기본 5개를 사용 */
const PART_COLORS=['#3b7dc4','#d0558a','#c48a1e','#3a9a68','#7d8196','#8a5cc2','#d06a3a','#3f97a6'];
const DEFAULT_PARTS=[
  {k:'plan',label:'기획',c:PART_COLORS[0]},
  {k:'design',label:'디자인',c:PART_COLORS[1]},
  {k:'pub',label:'퍼블',c:PART_COLORS[2]},
  {k:'dev',label:'개발',c:PART_COLORS[3]},
  {k:'qa',label:'QA',c:PART_COLORS[4]}
];
let PARTS=DEFAULT_PARTS.slice(), partsStored=false;
const STATUSES=[
  {k:'wait',label:'대기'},{k:'doing',label:'진행중'},{k:'review',label:'검토중'},{k:'hold',label:'보류'},{k:'done',label:'완료'}
];
const PRIS=['긴급','높음','보통','낮음'];
const PCOLORS=['#1d5c84','#c2457a','#b57a12','#2f8a5b','#7a4fb0','#c4552f','#4b7f8c','#6b6f86'];

let db=null, downloads=null, canWrite=false, storeReady=false;
let projects=[], tasks=[], wlogs=[], comments=[], templates=[], wlRefresh=null;
const state={mode:'tasks',period:'all',pBasis:'active',pAnchor:null,view:'list',project:'all',part:'all',status:'all',assignee:'all',q:'',late:false,sort:{key:'dueDate',dir:1}};
try{const s=JSON.parse(localStorage.getItem('wb-ui')||'{}');Object.assign(state,s);state.pAnchor=null;state.pBasis='active';}catch(e){}
// 링크 끝의 #report 같은 이름으로 그 화면을 바로 열 수 있게 함 (tasks·staff·leave·report·hours·history)
{const h=location.hash.slice(1);if(['tasks','staff','leave','report','hours','history'].includes(h))state.mode=h;}
// 열린 접이식 메뉴는 바깥을 누르거나 항목을 고르면 닫음
document.addEventListener('click',e=>{document.querySelectorAll('details.menu[open]').forEach(d=>{if(!d.contains(e.target)||e.target.closest('.menuList button'))d.open=false;});});
function persistUI(){try{localStorage.setItem('wb-ui',JSON.stringify({mode:state.mode,period:state.period,pBasis:state.pBasis,view:state.view,project:state.project,part:state.part,sort:state.sort,status:state.status,assignee:state.assignee,late:state.late,sview:state.sview,cf:state.cf,post:state.post,yfold:state.yfold}));}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const partOf=k=>PARTS.find(p=>p.k===k)||{k,label:'미지정',c:'var(--muted)'};
const statusOf=k=>STATUSES.find(s=>s.k===k)||STATUSES[0];
const projOf=id=>projects.find(p=>p.id===id);
// 수정 저장은 연 시점의 값(base)과 달라진 필드만 update로 보냄. 다른 사람이 동시에 고친 다른 필드를 지우지 않게
const sameVal=(a,b)=>String(a??'')===String(b??'');
const changedKeys=(data,base)=>Object.keys(data).filter(k=>k!=='updatedAt'&&k!=='createdAt'&&!sameVal(data[k],base[k]));
function patchOf(data,base){const ks=changedKeys(data,base);return ks.length?{...Object.fromEntries(ks.map(k=>[k,data[k]])),updatedAt:data.updatedAt||new Date().toISOString()}:null;}
const isLate=t=>t.status!=='done'&&t.status!=='hold'&&t.dueDate&&t.dueDate<todayStr();
const fmtDate=d=>d?d.slice(2).replace(/-/g,'.'):'—';
const hrs=v=>(v===''||v==null||isNaN(v))?'—':(+v).toFixed(+v%1?1:0);
function dday(d){if(!d)return'';const ms=new Date(d+'T00:00:00')-new Date(todayStr()+'T00:00:00');const n=Math.round(ms/864e5);return n===0?'D-day':n>0?'D-'+n:'D+'+(-n);}

/* RMS: 업무별 링크가 있으면 그 주소로, 없으면 공용 주소 규칙({no} 자리에 번호)으로 연결 */
function rmsHref(t){
  let u=(t.rmsUrl||'').trim();
  if(!u&&t.rmsNo&&site?.rmsTemplate)u=site.rmsTemplate.replace(/\{no\}/g,encodeURIComponent(String(t.rmsNo).trim()));
  if(!u)return '';
  return /^https?:\/\//i.test(u)?u:'https://'+u;
}
function rmsBadge(t){
  if(!t.rmsNo&&!t.rmsUrl)return '';
  const h=rmsHref(t), lab=`RMS ${esc(t.rmsNo||'링크')}`;
  return h?`<a class="rms" href="${esc(h)}" target="_blank" rel="noopener" title="RMS 바로가기">${lab} ↗</a>`:`<span class="rms" title="RMS 주소 규칙을 설정하면 바로가기가 생깁니다">${lab}</span>`;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200);}

/* ---------- period (주간·월간 보기) ---------- */
// 기준: active=기간 중 요청~완료가 겹치는 업무, request=요청일, due=완료 일정, done=실제 완료일
/* ---------- 기간 선택 상자: 주(월요일 시작, 그 주 목요일이 속한 달의 n번째 주) · 월 ---------- */
const dowOf=d=>new Date(d+'T00:00:00').getDay();
function weekLabel(mon){
  const th=addDays(mon,3), m1=th.slice(0,8)+'01', firstThu=addDays(m1,(4-dowOf(m1)+7)%7);
  const n=Math.round((new Date(th+'T00:00:00')-new Date(firstThu+'T00:00:00'))/(7*864e5))+1;
  return `${th.slice(2,4)}년 ${+th.slice(5,7)}월 ${n}주`;
}
const mdot=d=>`${+d.slice(5,7)}/${+d.slice(8,10)}`;
// 그 기간에 등록된 내용이 있는지: 요청·마감·완료일, 업무 시간 기록, 저장된 보고서, 연차·프로젝트 일정(진행 중이라는 이유만으로는 넣지 않음)
function hasContent(a,b){const inR=d=>!!d&&d>=a&&d<=b;
  return tasks.some(t=>inR(t.requestDate)||inR(t.dueDate)||inR(t.doneDate))||wlogs.some(l=>inR(l.date))||reports.some(r=>inR(r.week))
    ||leaves.some(l=>l.date<=b&&(l.endDate||l.date)>=a)||events.some(e=>e.kind==='project'&&e.start<=b&&(e.end||e.start)>=a);}
// 기간 종류: week=월요일 시작 주(목요일의 연도), rweek=주간 보고 목~수 주(수요일의 연도), month=월
const PKIND={
  week:{start:s=>mondayOf(s),next:v=>addDays(v,7),end:v=>addDays(v,6),year:v=>addDays(v,3).slice(0,4),label:v=>weekLabel(v).slice(4),title:v=>`${mdot(v)}~${mdot(addDays(v,6))}`},
  rweek:{start:s=>thursdayOf(s),next:v=>addDays(v,7),end:v=>addDays(v,6),year:v=>addDays(v,6).slice(0,4),label:v=>`${rWeekLabel(v).slice(4)} (${rRange(v)})`},
  month:{start:s=>s.slice(0,7)+'-01',next:v=>ymd(new Date(+v.slice(0,4),+v.slice(5,7),1)),end:v=>ymd(new Date(+v.slice(0,4),+v.slice(5,7),0)),year:v=>v.slice(0,4),label:v=>`${+v.slice(5,7)}월`}
};
// 그 연도의 기간 중 등록된 내용이 있는 것(cur는 항상 포함)
function periodsOf(kind,y,cur){const K=PKIND[kind],out=[];for(let v=K.start(`${y}-01-01`);v<=`${y}-12-31`;v=K.next(v))if(K.year(v)===String(y)&&(v===cur||hasContent(v,K.end(v))))out.push(v);return out;}
// 헤더 기간 선택: 연도 select(id+'Y') + 주/월 select(id). 연도·기간 모두 내용이 있는 것만, 올해와 현재 값은 항상
function periodSelects(kind,cur,id){
  const K=PKIND[kind],T=todayStr(),cy=+T.slice(0,4);cur=cur||K.start(T);const sy=+K.year(cur);
  const ds=[...tasks.flatMap(t=>[t.requestDate,t.dueDate,t.doneDate]),...wlogs.map(l=>l.date),...reports.map(r=>r.week),...leaves.map(l=>l.date),...events.map(e=>e.start)].filter(d=>/^\d{4}-/.test(d||'')).map(d=>+d.slice(0,4)).filter(y=>y>=cy-10&&y<=cy+2);
  const years=[];for(let y=Math.max(cy,sy,...ds);y>=Math.min(cy,sy,...ds);y--)if(y===cy||y===sy||periodsOf(kind,y).length)years.push(y);
  let list=periodsOf(kind,sy,cur);
  return `<select class="sel" id="${id}Y" aria-label="연도">${years.map(y=>`<option value="${y}" ${y===sy?'selected':''}>${y}년</option>`).join('')}</select><select class="sel" id="${id}" aria-label="${kind==='month'?'월':'주'}">${list.map(v=>`<option value="${v}" ${v===cur?'selected':''}${K.title?` title="${K.title(v)}"`:''}>${esc(K.label(v))}</option>`).join('')}</select>`;
}
// 연도를 바꾸면 그 연도에서 오늘 이전의 가장 최근 기간(내용 있는 것) → 없으면 그 연도의 마지막 기간 → 그것도 없으면 이번 기간
function latestIn(kind,y){const K=PKIND[kind],T=K.start(todayStr()),l=periodsOf(kind,y);return l.filter(v=>v<=T).pop()||l.pop()||T;}
// 내보내기 메뉴: 화면마다 같은 모양, 헤더 도구 줄 맨 오른쪽. items=[[id,label,title]] 없으면 메뉴도 숨김
const exportMenu=items=>items.length?`<details class="menu"><summary class="btn">내보내기 ▾</summary><div class="menuList">${items.map(([id,l,t])=>`<button class="btn" type="button" id="${id}"${t?` title="${t}"`:''}>${l}</button>`).join('')}</div></details>`:'';
function periodRange(){
  if(state.period==='all')return null;
  const t=todayStr();
  if(!state.pAnchor)state.pAnchor=state.period==='week'?mondayOf(t):t.slice(0,7)+'-01';
  if(state.period==='week'){state.pAnchor=mondayOf(state.pAnchor);return [state.pAnchor,addDays(state.pAnchor,6)];}
  const a=state.pAnchor.slice(0,7)+'-01';state.pAnchor=a;const d=new Date(a+'T00:00:00');return [a,ymd(new Date(d.getFullYear(),d.getMonth()+1,0))];
}
function inPeriod(t,r){
  if(!r)return true;const [a,b]=r, inR=d=>!!d&&d>=a&&d<=b;
  if(state.pBasis==='request')return inR(t.requestDate);
  if(state.pBasis==='due')return inR(t.dueDate);
  if(state.pBasis==='done')return t.status==='done'&&inR(t.doneDate);
  const start=t.requestDate||(t.createdAt||'').slice(0,10)||t.dueDate||'';
  const end=t.status==='done'?(t.doneDate||t.dueDate||start):'9999-12-31';
  return (!start||start<=b)&&end>=a;
}
function periodTasks(){const r=periodRange(),w=workItems();return r?w.filter(t=>inPeriod(t,r)):w;}
function periodLabel(r){
  if(!r)return '전체 기간';
  if(state.period==='month')return `${r[0].slice(0,4)}년 ${+r[0].slice(5,7)}월`;
  return `${r[0].slice(2).replace(/-/g,'.')} ~ ${r[1].slice(5).replace('-','.')}`;
}
function renderPeriodBar(){
  const on=state.period!=='all';if(on)periodRange();
  $('#periodSel').value=state.period;$('#pPick').hidden=!on;
  if(on)$('#pPick').innerHTML=periodSelects(state.period,state.pAnchor,'pPickV');
}
$('#periodSel').addEventListener('change',e=>{state.period=e.target.value;state.pAnchor=null;persistUI();render();});
$('#pPick').addEventListener('change',e=>{state.pAnchor=e.target.id==='pPickVY'?latestIn(state.period,+e.target.value):e.target.value;render();});

/* ---------- filtering ---------- */
function scoped(){return periodTasks().filter(t=>state.project==='all'||t.projectId===state.project);}
function passF(t){
  const q=state.q.trim().toLowerCase();
  return (state.part==='all'||t.part===state.part)&&
    (state.status==='all'||(state.status==='open'?t.status!=='done':t.status===state.status))&&
    (state.assignee==='all'||(state.assignee==='me'?isMine(t):t.assignee===state.assignee))&&
    (!state.late||isLate(t))&&
    (!q||[t.title,t.requester,t.assignee,t.jiraKey,t.rmsNo,t.note,projOf(t.projectId)?.name].some(v=>(v||'').toLowerCase().includes(q)));
}
function filtered(){return scoped().filter(passF);}
function sorted(list){
  const {key,dir}=state.sort;
  const val=t=>{
    if(key==='project')return projOf(t.projectId)?.name||'';
    if(key==='part')return PARTS.findIndex(p=>p.k===t.part);
    if(key==='status')return STATUSES.findIndex(s=>s.k===t.status);
    if(key==='priority')return t.priority??2;
    if(key==='estHours'||key==='actHours')return t[key]===''||t[key]==null?-1:+t[key];
    return t[key]||'￿';
  };
  // 완료 일정 순일 때는 완료·보류를 뒤로 보내서 지연·임박 업무가 맨 위에 오게 함
  const g=t=>key==='dueDate'&&(t.status==='done'||t.status==='hold')?1:0;
  return [...list].sort((a,b)=>{const x=val(a),y=val(b);return g(a)-g(b)||(x>y?1:x<y?-1:0)*dir;});
}

/* ---------- render ---------- */
function applyMode(){
  if(state.mode==='history'&&!canWrite&&storeReady)state.mode='tasks';
  $('#tabHistory').hidden=!canWrite;
  const AREAS={tasks:'taskArea',staff:'staffArea',leave:'leaveArea',report:'reportArea',hours:'hoursArea',history:'historyArea'};
  if(!AREAS[state.mode])state.mode='tasks';
  for(const [k,id] of Object.entries(AREAS))$('#'+id).hidden=state.mode!==k;
  $('#taskActions').hidden=state.mode!=='tasks';$('#leaveActions').hidden=state.mode!=='leave';
  $('#btnLeaveAdd').disabled=!canWrite;
  const navMode=state.mode==='hours'?'report':state.mode; // 업무 시간은 주간 보고 안의 탭
  document.querySelectorAll('#modeTabs [data-mode]').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===navMode));
  $('#pageTitle').textContent=document.querySelector(`#modeTabs [data-mode="${navMode}"] .lbl`)?.textContent||'';
}
function render(){
  renderBody();liftTools();
}
function liftTools(){
  // 화면별 도구 줄(.rtool)을 헤더로. 다시 그리지 않은 경우(입력 중 보호)엔 기존 것을 둠
  const t=document.querySelector('.wrap > .area:not([hidden]) > .rtool'),pt=$('#pageTools');
  if(t){pt.replaceChildren(t);pt.dataset.mode=state.mode;}else if(pt.dataset.mode!==state.mode){pt.replaceChildren();pt.dataset.mode=state.mode;}
  // 쓰기 권한이 없어 막힌 버튼엔 이유를 툴팁으로
  document.querySelectorAll('button[data-np]').forEach(b=>{if(canWrite||!b.disabled){b.removeAttribute('title');delete b.dataset.np;}});
  if(!canWrite)document.querySelectorAll('button:disabled:not([title])').forEach(b=>{b.title='편집 권한이 필요해요';b.dataset.np='1';});
}
// 헤더로 옮긴 도구 줄에서도 그 화면의 이벤트 처리가 그대로 동작하게
// 헤더 도구 줄 안 화면 탭(보고서/업무 시간): 화면 모드만 바꿈
document.querySelector('.wrap').addEventListener('click',e=>{const b=e.target.closest('[data-goto]');if(!b)return;const v=b.dataset.rview;if(b.dataset.goto===state.mode&&(!v||v===rstate.view))return;if(v)rstate.view=v;if(state.mode==='report')v3Flush();state.mode=b.dataset.goto;persistUI();render();});
function onArea(sel,type,fn){$(sel).addEventListener(type,fn);$('#pageTools').addEventListener(type,e=>{if(!$(sel).hidden)fn(e);});}
function renderBody(){
  renderBrand();applyMode();renderTodayOff();
  if(state.mode==='leave'){renderLeave();return;}
  if(state.mode==='hours'){renderHours();return;}
  if(state.mode==='staff'){if(document.activeElement?.id!=='mQ'){renderStaff();applyMQ();}return;}
  if(state.mode==='history'){if(document.activeElement?.id!=='hQ')renderHistory();return;}
  if(state.mode==='report'){if(!document.activeElement?.dataset?.note)renderReport();return;}
  renderPeriodBar();renderSummary();renderTabs();renderFilters();
  const main=$('#main');
  $('#btnAdd').hidden=!canWrite;
  renderPostNew();
  if(state.post&&storeReady&&!tasks.some(x=>x.id===state.post))state.post=null;
  const post=state.post&&tasks.find(x=>x.id===state.post);
  $('#taskArea').classList.toggle('postOpen',!!post);if(!post)main.dataset.post='';
  if(!storeReady){main.innerHTML=`<div class="empty"><h2>업무를 불러오는 중입니다</h2><p>잠시만 기다려 주세요.</p></div>`;return;}
  if(!projects.length){
    main.innerHTML=`<div class="empty"><h2>첫 프로젝트를 등록해 주세요</h2><p>파견 중인 프로젝트를 먼저 추가하면, 그 아래에 기획·디자인·퍼블·개발·QA 업무를 등록하고 함께 볼 수 있습니다.</p>${canWrite?'<button class="btn primary" type="button" id="emptyProj">프로젝트 추가</button>':''}</div>`;
    $('#emptyProj')?.addEventListener('click',()=>openProject(null));return;
  }
  const list=filtered();
  if(!tasks.length){
    main.innerHTML=`<div class="empty"><h2>아직 등록된 업무가 없습니다</h2><p>${canWrite?"위 '프로젝트 등록하기'에서 첫 업무를 등록하고, 게시물에 댓글로 업무를 요청해 보세요.":'등록된 업무가 생기면 여기에 보여요.'}</p></div>`;return;
  }
  if(post){renderPost(post);return;}
  if(state.view==='board')renderBoard(list);
  else if(state.view==='matrix')renderMatrix();
  else renderList();
}

// 상단 요약 표: [항목, 값 HTML, 칸 class] 목록 → 한 줄 표(좁은 화면은 가로 스크롤)
const statTable=list=>`<div class="statWrap"><table class="statTable"><thead><tr>${list.map(([k,,c])=>`<th class="${c}">${k}</th>`).join('')}</tr></thead><tbody><tr>${list.map(([,v,c])=>`<td class="${c}">${v}</td>`).join('')}</tr></tbody></table></div>`;
function renderSummary(){
  const s=scoped(), t=todayStr();
  const done=s.filter(x=>x.status==='done').length;
  const doing=s.filter(x=>x.status==='doing'||x.status==='review').length;
  const late=s.filter(isLate).length;
  const pr=periodRange(), wS=pr?pr[0]:mondayOf(t), wE=pr?pr[1]:addDays(wS,6);
  const doneWeek=s.filter(x=>x.status==='done'&&x.doneDate&&x.doneDate>=wS&&x.doneDate<=wE).length;
  const doneLabel=!pr?'이번 주 완료':state.period==='month'?'이 달 완료':'이 주 완료';
  const est=s.reduce((a,x)=>a+(+x.estHours||0),0), act=s.reduce((a,x)=>a+(+x.actHours||0),0);
  const rate=s.length?Math.round(done/s.length*100):0;
  $('#summary').innerHTML=statTable([[`전체 업무`,`${s.length}<small>건</small>`,``],[`진행·검토중`,`${doing}<small>건</small>`,``],[`일정 지연`,`${late}<small>건</small>`,`${late?'alert':''}`],[`${doneLabel} <span class="num" style="font-size:11px">${md(wS)}~${md(wE)}</span>`,`${doneWeek}<small>건</small>`,``],[`완료율`,`${rate}<small>%</small><div class="bar"><i style="width:${rate}%"></i></div>`,``],[`소요시간 실제/예상`,`${hrs(act)}<small>/ ${hrs(est)}h</small>`,``]]);
}

function renderTabs(){
  const pt=periodTasks(), count=id=>pt.filter(t=>(id==='all'||t.projectId===id)&&(state.period!=='all'||t.status!=='done')).length;
  const tabs=[{id:'all',name:'전체 프로젝트'},...projects];
  if(state.project!=='all'&&!projOf(state.project))state.project='all';
  const admin=canWrite&&!!db&&(typeof adminUI!=='function'||adminUI());

/* ---------- 게시물(최상위 업무) · 요청(parentId로 게시물에 붙은 하위 업무) ---------- */
const isPost=t=>!t.parentId||!tasks.some(x=>x.id===t.parentId);
function rootOf(t){for(let i=0;i<20&&t.parentId;i++){const p=tasks.find(x=>x.id===t.parentId);if(!p)break;t=p;}return t;}
const kidsOf=p=>tasks.filter(x=>x.id!==p.id&&!isPost(x)&&rootOf(x).id===p.id);
// 집계 단위: 요청은 모두 세고, 게시물은 요청이 없거나 게시물 자체를 끝낸 경우(넘기기 등)만 셈 → 이중 집계 없음
function workItems(list=tasks){const ids=new Set(tasks.map(x=>x.id)),par=new Set(tasks.map(x=>x.parentId).filter(Boolean));
  return list.filter(t=>(t.parentId&&ids.has(t.parentId))||t.status==='done'||!par.has(t.id));}
// 요청이 있는 게시물의 표시 상태: 게시물을 직접 끝냈으면 완료, 아니면 요청들로 판단
function postStatus(p,k){if(!k.length||p.status==='done')return p.status;
  if(k.every(x=>x.status==='done'))return 'done';if(k.some(x=>x.status==='doing'||x.status==='review'))return 'doing';
  if(k.every(x=>x.status==='done'||x.status==='hold'))return 'hold';return 'wait';}
// 다시 그려도 입력 중인 값·포커스 유지
function keepVals(box,html){
  const v={};box.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>v[e.id]=e.type==='checkbox'?e.checked:e.value);
  const f=box.contains(document.activeElement)?document.activeElement.id:'';box.innerHTML=html;
  for(const [k,x] of Object.entries(v)){const e=box.querySelector('#'+k);if(!e)continue;if(e.type==='checkbox')e.checked=x;else if(e.tagName!=='SELECT'||[...e.options].some(o=>o.value===x))e.value=x;}
  if(f)box.querySelector('#'+f)?.focus();
}
const optH=(arr,cur)=>arr.map(([k,l])=>`<option value="${esc(k)}" ${String(cur)===String(k)?'selected':''}>${esc(l)}</option>`).join('');
const stamp=s=>(s||'').slice(0,16).replace('T',' ');

function postList(){
  const r=periodRange(), byRoot=new Map();
  for(const t of tasks){if(state.project!=='all'&&t.projectId!==state.project)continue;if(r&&!inPeriod(t,r))continue;if(!passF(t))continue;const p=rootOf(t);byRoot.set(p.id,p);}
  const key=p=>(p.requestDate||(p.createdAt||'').slice(0,10))+'|'+(p.createdAt||'');
  return [...byRoot.values()].sort((a,b)=>key(b).localeCompare(key(a)));
}
function postRow(p){
  const pj=projOf(p.projectId), k=kidsOf(p), doing=k.filter(x=>x.status==='doing'||x.status==='review').length, st=statusOf(postStatus(p,k));

}

      ${p.note?`<p class="pcNote">${esc(p.note)}</p>`:''}</div>
    <h3 class="tlTitle">댓글 · 업무 요청 <span class="legend">${items.length}</span></h3>

async function sendPost(p,btn){

  if(!isReq&&!actorId){$('#cpErr').textContent='사용자 정보를 확인할 수 없어 댓글을 남길 수 없어요.';return;}

async function setReqStatus(id,st){

/* ---------- 왼쪽 메뉴: 전체 접기 · 좁은 화면 서랍 (접힘 상태는 이 브라우저에 기억) ---------- */
(()=>{
  const shell=$('#shell');let st={fold:false,gc:[]};
  try{st={...st,...JSON.parse(localStorage.getItem('wb-side')||'{}')};}catch(e){}
  if(!Array.isArray(st.gc))st.gc=[];
  const save=()=>{try{localStorage.setItem('wb-side',JSON.stringify({fold:!!st.fold,gc:st.gc}));}catch(e){}};
  const draw=()=>{
    shell.classList.toggle('fold',!!st.fold);
    const lb=st.fold?'메뉴 펼치기':'메뉴 접기';$('#sideFold').setAttribute('aria-label',lb);$('#sideFold').title=lb;
    document.querySelectorAll('.gnbGroup').forEach(g=>{const c=st.gc.includes(g.dataset.grp);g.classList.toggle('closed',c);g.querySelector('.gnbHead').setAttribute('aria-expanded',String(!c));});
  };
  $('#sideFold').onclick=()=>{st.fold=!st.fold;save();draw();};
  document.querySelectorAll('.gnbHead').forEach(h=>h.addEventListener('click',()=>{const k=h.closest('.gnbGroup').dataset.grp;st.gc=st.gc.includes(k)?st.gc.filter(x=>x!==k):[...st.gc,k];save();draw();}));
  const setDrawer=o=>{shell.classList.toggle('drawer',o);$('#sideOpen').setAttribute('aria-expanded',String(o));};
  $('#sideOpen').onclick=()=>setDrawer(!shell.classList.contains('drawer'));
  $('#sideBackdrop').onclick=()=>setDrawer(false);
  $('#side').addEventListener('click',e=>{if(e.target.closest('.navItem'))setDrawer(false);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&shell.classList.contains('drawer'))setDrawer(false);});
  draw();
})();

$('#partChips').addEventListener('click',e=>{const b=e.target.closest('[data-part]');if(!b)return;state.part=b.dataset.part;persistUI();render();});
$('#fStatus').addEventListener('change',e=>{state.status=e.target.value;persistUI();render();});
$('#fAssignee').addEventListener('change',e=>{if(e.target.value==='me'&&!myMember()){e.target.value=state.assignee;openWhoAmI();return;}state.assignee=e.target.value;persistUI();render();});
$('#fLate').addEventListener('change',e=>{state.late=e.target.checked;persistUI();render();});
let qT;$('#fSearch').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{state.q=e.target.value;render();},150);});
$('#viewSeg').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;state.view=b.dataset.view;persistUI();render();});
$('#btnAdd').addEventListener('click',()=>{if(state.post){state.post=null;persistUI();render();}const t=$('#pnTitle');if(t){t.scrollIntoView({block:'center',behavior:'smooth'});t.focus({preventScroll:true});}});
$('#modeTabs').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;if(state.mode==='report')flushNotes();state.mode=b.dataset.mode;persistUI();render();});
$('#btnLeaveAdd').addEventListener('click',()=>openLeave());
$('#main').addEventListener('click',async e=>{
  if(e.target.closest('a'))return;
  const yh=e.target.closest('[data-year]');if(yh){const f=new Set(state.yfold||[]),y=yh.dataset.year;f.has(y)?f.delete(y):f.add(y);state.yfold=[...f];persistUI();render();return;}
  if(e.target.id==='postBack'){openPost(null);return;}
  const p=state.post&&tasks.find(x=>x.id===state.post);
  if(p){
    if(e.target.id==='postEdit'){openTask(p);return;}
    if(e.target.id==='cpSend'){sendPost(p,e.target);return;}
    const ed=e.target.closest('[data-rqe]');if(ed){openTask(tasks.find(x=>x.id===ed.dataset.rqe));return;}
    const del=e.target.closest('.cmDel');if(!del)return;
    if(!del.dataset.sure){del.dataset.sure='1';del.textContent='정말 삭제';return;}
    try{await db.collection('comments').doc(del.dataset.cm).delete();}catch(err){handleWriteError(err,'#cpErr');}
    return;
  }
  // 게시물 행·보드 카드를 누르면 그 게시물 상세로(요청이면 속한 게시물)
  const row=e.target.closest('[data-post],[data-id]');if(!row)return;const t=tasks.find(x=>x.id===(row.dataset.post||row.dataset.id));if(t)openPost(rootOf(t).id);
});
$('#main').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const row=e.target.closest('[data-post],.card[data-id]');if(row&&row===e.target)row.click();});
$('#main').addEventListener('change',e=>{
  const el=e.target;
  if(el.classList.contains('rqSt')){setReqStatus(el.dataset.rq,el.value);return;}
  if(el.id==='cpReq')$('#cpFields').hidden=!el.checked;
});
let dragId=null;
$('#main').addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c)return;dragId=c.dataset.id;e.dataTransfer.effectAllowed='move';});
$('#main').addEventListener('dragover',e=>{const col=e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();document.querySelectorAll('.col.drop').forEach(c=>c!==col&&c.classList.remove('drop'));col.classList.add('drop');});
$('#main').addEventListener('dragleave',e=>{const col=e.target.closest('.col');if(col&&!col.contains(e.relatedTarget))col.classList.remove('drop');});
$('#main').addEventListener('drop',async e=>{
  const col=e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();col.classList.remove('drop');
  const t=tasks.find(x=>x.id===dragId);dragId=null;if(!t||t.status===col.dataset.status)return;
  const patch={status:col.dataset.status,updatedAt:new Date().toISOString()};
  if(patch.status==='done'&&!t.doneDate)patch.doneDate=todayStr();
  if(patch.status!=='done')patch.doneDate='';
  try{await db.collection('tasks').doc(t.id).update(patch);logChange('task','update',t.id,t.title,t,{...t,...patch});toast(`'${statusOf(patch.status).label}'(으)로 변경했습니다`);}catch(err){handleWriteError(err);}
});
$('#main').addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.drop').forEach(c=>c.classList.remove('drop'));});

/* ---------- 내 업무: 로그인 계정을 구성원 한 명과 연결(members.userId) ---------- */
function myMember(){return actorId?members.find(m=>m.userId===actorId):null;}
function isMine(t){const m=myMember();return !!m&&(t.assigneeId===m.id||(!t.assigneeId&&t.assignee===m.name));}
function openWhoAmI(){
  if(!actorId){toast('로그인 정보를 확인할 수 없어 내 업무를 쓸 수 없어요.');return;}
  if(!members.length){toast('휴가 관리 › 구성원 관리에서 구성원을 먼저 추가해 주세요.');return;}
  const cur=myMember();
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="whoForm" style="max-width:420px" novalidate>
    <header><h2>내 이름 선택</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>
    <div class="body" style="grid-template-columns:1fr"><div class="f"><label for="whoSel">구성원 목록에서 나를 골라 주세요</label>
      <select id="whoSel">${members.map(m=>`<option value="${esc(m.id)}" ${cur?.id===m.id?'selected':''}>${esc(m.name)}${projOf(m.projectId)?` · ${esc(projOf(m.projectId).name)}`:''}</option>`).join('')}</select>
      <span class="hint">한 번 고르면 이 계정으로 열 때마다 '내 업무'에서 내 담당 업무만 볼 수 있어요.</span></div></div>
    <footer><span class="err" id="whoErr"></span><div class="r"><button class="btn" type="button" id="whoCancel">취소</button><button class="btn primary" type="submit" id="whoSave">저장</button></div></footer>
  </form></div>`;
  $('#xClose').onclick=$('#whoCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  $('#whoForm').addEventListener('submit',async e=>{
    e.preventDefault();const id=$('#whoSel').value;$('#whoSave').disabled=true;
    try{
      for(const m of members.filter(m=>m.userId===actorId&&m.id!==id))await db.collection('members').doc(m.id).update({userId:''});
      await db.collection('members').doc(id).update({userId:actorId});
      state.assignee='me';persistUI();closeModal();toast('내 업무로 설정했어요');render();
    }catch(err){$('#whoSave').disabled=false;handleWriteError(err,'#whoErr');}
  });
}

/* ---------- task modal ---------- */
function closeModal(){$('#modalRoot').innerHTML='';modalDirty=false;closeWarned=false;wlRefresh=null;}
// 입력한 내용이 있으면 바깥 클릭·Esc·취소로 바로 닫지 않고 한 번 알려 줌. 한 번 더 하면 닫힘
let modalDirty=false, closeWarned=false;
$('#modalRoot').addEventListener('input',()=>{modalDirty=true;closeWarned=false;});
function askClose(){if(modalDirty&&!closeWarned){closeWarned=true;toast('저장하지 않은 내용이 있어요. 한 번 더 누르면 닫혀요.');return;}closeModal();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML)askClose();});

function openTask(t,prefill){
  if(!projects.length){openProject(null);return;}
  const isNew=!t;
  t=t||{projectId:state.project!=='all'?state.project:projects[0].id,part:state.part!=='all'?state.part:PARTS[0].k,status:'wait',priority:2,requestDate:todayStr(),...prefill};
  const ro=!canWrite;
  const base={...t}; // 연 시점의 값. 저장할 때 다른 사람의 변경과 비교
  const people=[...new Set([...members.map(m=>m.name),...tasks.flatMap(x=>[x.assignee,x.requester])].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
  // 담당자는 구성원에서 고름. 예전 업무는 이름이 같은 구성원과 연결, 구성원에 없는 이름은 그대로 보여 줌
  const curMem=(t.assigneeId&&memOf(t.assigneeId))||members.find(m=>m.name===t.assignee);
  const orphan=t.assignee&&!curMem?t.assignee:'';
  const opt=(arr,cur)=>arr.map(([k,l])=>`<option value="${esc(k)}" ${String(cur)===String(k)?'selected':''}>${esc(l)}</option>`).join('');
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="taskForm" novalidate>
    <header><h2>${isNew?(t.parentId?'업무 요청 등록':'업무 등록'):ro?'업무 상세':'업무 수정'}</h2><button class="btn ghost" type="button" id="xClose" aria-label="닫기">닫기</button></header>
    <fieldset ${ro?'disabled':''} style="border:0;margin:0;padding:0;min-width:0"><div class="body">
      <div class="f"><label for="tProject">프로젝트 <b>*</b></label><select id="tProject">${opt(projects.map(p=>[p.id,p.name]),t.projectId)}</select></div>
      <div class="f"><label for="tPart">파트 <b>*</b></label><select id="tPart">${opt(PARTS.map(p=>[p.k,p.label]),t.part)}</select></div>
      ${t.parentId&&tasks.some(x=>x.id===t.parentId)?`<div class="f full"><button type="button" class="hlink" id="tParent">게시물 열기: ${esc(rootOf(t).title)}</button></div>`:''}
      <div class="f full"><label for="tTitle">요청내용 <b>*</b></label><input id="tTitle" value="${esc(t.title||'')}" placeholder="예: 메인 배너 영역 반응형 수정" maxlength="200"></div>
      <div class="f"><label for="tAssignee">담당자</label><select id="tAssignee"><option value="">미지정</option>${orphan?`<option value="name:${esc(orphan)}" selected>${esc(orphan)} (구성원 아님)</option>`:''}${members.map(m=>`<option value="${esc(m.id)}" ${curMem?.id===m.id?'selected':''}>${esc(m.name)}${projOf(m.projectId)?` · ${esc(projOf(m.projectId).name)}`:''}</option>`).join('')}</select>${members.length?'':'<span class="hint">휴가 관리 › 구성원 관리에서 구성원을 먼저 추가해 주세요.</span>'}${orphan?'<span class="hint">구성원 목록에 없는 이름이에요. 구성원을 골라 연결해 주세요.</span>':''}</div>
      <div class="f"><label for="tRequester">요청자</label><input id="tRequester" list="peopleList" value="${esc(t.requester||'')}" placeholder="이름 또는 부서"><span class="hint" id="reqHint"></span></div>
      <div class="f"><label for="tStatus">진행 현황</label><select id="tStatus">${opt(STATUSES.map(s=>[s.k,s.label]),t.status)}</select></div>
      <div class="f"><label for="tPri">우선순위</label><select id="tPri">${opt(PRIS.map((l,i)=>[i,l]),t.priority??2)}</select></div>
      <div class="f full"><div class="grid3">
        <div class="f"><label for="tReq">요청일자</label><input type="date" id="tReq" value="${esc(t.requestDate||'')}"></div>
        <div class="f"><label for="tDue">완료 일정</label><input type="date" id="tDue" value="${esc(t.dueDate||'')}"><span class="hint warnHint" id="dueLeave"></span></div>
        <div class="f"><label for="tDone">실제 완료일</label><input type="date" id="tDone" value="${esc(t.doneDate||'')}"></div>
      </div></div>
      <div class="f"><label for="tEst">예상 소요시간 (h)</label><input type="number" id="tEst" min="0" step="0.5" inputmode="decimal" value="${esc(t.estHours??'')}"><span class="hint">MD로 받았다면 1MD = 8h로 입력</span></div>
      <div class="f"><label for="tAct">실제 소요시간 (h)</label><input type="number" id="tAct" min="0" step="0.5" inputmode="decimal" value="${esc(t.actHours??'')}"></div>
      ${isNew?'':'<div class="f full wlBox" id="wlBox"></div><div class="f full cmBox" id="cmBox"></div>'}
      <!-- 자주 안 쓰는 칸은 접어 둠. 값이 있으면 펼친 채로 열림 -->
      <details class="f full moreF" ${t.jiraKey||t.rmsNo||t.rmsUrl||t.link||t.note?'open':''}><summary>상세 입력 <span class="hint">Jira · RMS · 관련 링크 · 메모</span></summary><div class="body sub">
      <div class="f"><label for="tJira">Jira 키</label><input id="tJira" value="${esc(t.jiraKey||'')}" placeholder="예: PROJ-123" autocapitalize="characters" spellcheck="false"></div>
      <div class="f"><label for="tRms">RMS 번호</label><input id="tRms" value="${esc(t.rmsNo||'')}" placeholder="예: 2026-00123" spellcheck="false"></div>
      <div class="f full"><label for="tRmsUrl">RMS 바로가기 링크</label><input id="tRmsUrl" value="${esc(t.rmsUrl||'')}" placeholder="${site?.rmsTemplate?'비워 두면 주소 규칙으로 자동 연결':'RMS 화면 주소 붙여넣기'}" spellcheck="false"></div>
      <div class="f full rmsRow"><span class="hint" id="rmsInfo"></span>${canWrite?'<button type="button" class="btn ghost" id="rmsRuleBtn">주소 규칙 설정</button>':''}<a class="rms" id="rmsGo" target="_blank" rel="noopener" hidden>RMS 바로가기 ↗</a>
        <div class="rmsRule" id="rmsRule" hidden><input id="rmsTpl" value="${esc(site?.rmsTemplate||'')}" placeholder="예: https://rms.회사.com/request/{no}" spellcheck="false"><button type="button" class="btn" id="rmsTplSave">저장</button><span class="hint">{no} 자리에 RMS 번호가 들어갑니다. 모든 업무에 공통 적용</span></div></div>
      <div class="f full"><label for="tLink">관련 링크</label><input id="tLink" value="${esc(t.link||'')}" placeholder="Figma, 설계서, Jira 등 URL"></div>
      <div class="f full"><label for="tNote">메모</label><textarea id="tNote" placeholder="요청 배경, 변경 이력, 이슈">${esc(t.note||'')}</textarea></div>
      ${t.link?`<div class="f full"><a href="${esc(/^https?:\/\//.test(t.link)?t.link:'https://'+t.link)}" target="_blank" rel="noopener" style="color:var(--accent-dark)">관련 링크 열기 ↗</a></div>`:''}
      </div></details>
    </div></fieldset>
    <datalist id="peopleList">${people.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <footer>
      <div id="delZone">${!isNew&&canWrite?'<button class="btn danger" type="button" id="tDel">삭제</button>':''}${!isNew&&canWrite&&nextPart(t.part)?`<button class="btn" type="button" id="tNext" title="같은 요청으로 다음 파트 업무를 만들어요">${esc(nextPart(t.part).label)}(으)로 넘기기</button>`:''}</div>
      <span class="err" id="tErr"></span>
      <div class="r"><button class="btn" type="button" id="tCancel">${ro?'닫기':'취소'}</button>${ro?'':`<button class="btn primary" type="submit" id="tSave">${isNew?'등록':'저장'}</button>`}</div>
    </footer>
  </form></div>`;
  $('#xClose').onclick=$('#tCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  $('#tStatus').addEventListener('change',e=>{if(e.target.value==='done'&&!$('#tDone').value)$('#tDone').value=todayStr();});
  const rmsSync=()=>{const h=rmsHref({rmsNo:$('#tRms').value,rmsUrl:$('#tRmsUrl').value});$('#rmsGo').hidden=!h;if(h)$('#rmsGo').href=h;
    $('#rmsInfo').textContent=site?.rmsTemplate?`주소 규칙: ${site.rmsTemplate}`:'RMS 주소 규칙이 없으면 링크를 직접 붙여넣어 주세요.';};
  rmsSync();['tRms','tRmsUrl'].forEach(id=>$('#'+id).addEventListener('input',rmsSync));
  $('#rmsRuleBtn')?.addEventListener('click',()=>{$('#rmsRule').hidden=!$('#rmsRule').hidden;if(!$('#rmsRule').hidden)$('#rmsTpl').focus();});
  $('#rmsTplSave')?.addEventListener('click',async()=>{
    const tpl=$('#rmsTpl').value.trim();
    if(tpl&&!tpl.includes('{no}')){$('#tErr').textContent='주소 규칙에 {no}를 넣어 주세요. 예: https://rms.회사.com/request/{no}';return;}
    try{const before={...site};await db.doc('settings/site').set({title:site.title,subtitle:site.subtitle||'',rmsTemplate:tpl,updatedAt:new Date().toISOString()});site={...site,rmsTemplate:tpl};logChange('site','update','site','RMS 주소 규칙',before,site);

  // 날짜별 작업 시간 기록(worklogs). 기록이 있으면 실제 소요시간 = 기록 합계
  if(!isNew){
    const wlSum=list=>Math.round(list.reduce((a,w)=>a+(+w.hours||0),0)*100)/100;
    const syncAct=async list=>{const sum=list.length?wlSum(list):'';$('#tAct').value=sum;base.actHours=sum;await db.collection('tasks').doc(t.id).update({actHours:sum,updatedAt:new Date().toISOString()});};
    wlRefresh=()=>{
      const box=$('#wlBox');if(!box)return;
      const list=wlogs.filter(w=>w.taskId===t.id).sort((x,y)=>x.date.localeCompare(y.date));
      $('#tAct').disabled=list.length>0;
      const keep={d:$('#wlDate')?.value||todayStr(),m:$('#wlMem')?.value||taskMember(t)?.id||'',h:$('#wlH')?.value||'',n:$('#wlNote')?.value||''};
      box.innerHTML=`<label>작업 시간 기록 <span class="legend">${list.length?`합계 ${hrs(wlSum(list))}h`:'아직 없음'}</span></label>
        ${list.length?`<ul class="hitems">${list.map(w=>`<li><span class="num">${md(w.date)}</span><b>${esc(memOf(w.memberId)?.name||w.member||'')}</b><span class="legend">${esc(w.note||'')}</span><span class="num hh">${hrs(w.hours)}h</span>${canWrite?`<button type="button" class="btn ghost wlDel" data-wl="${esc(w.id)}">삭제</button>`:''}</li>`).join('')}</ul>`:''}
        ${canWrite?`<div class="wlAdd"><input type="date" id="wlDate" value="${esc(keep.d)}" aria-label="작업한 날짜"><select id="wlMem" aria-label="작업한 사람">${members.map(m=>`<option value="${esc(m.id)}" ${keep.m===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><input type="number" id="wlH" min="0.25" step="0.25" inputmode="decimal" placeholder="시간(h)" value="${esc(keep.h)}" aria-label="작업 시간"><input id="wlNote" placeholder="메모 (선택)" value="${esc(keep.n)}" maxlength="80" aria-label="메모"><button type="button" class="btn" id="wlAddBtn">기록 추가</button></div>`:''}
        <span class="hint">기록이 있으면 실제 소요시간은 합계로 자동 계산되고, 업무 시간 화면은 기록한 날짜 기준으로 집계돼요.</span><span class="err" id="wlErr"></span>`;
    };
    wlRefresh();
    const addWl=async()=>{
      const h=+$('#wlH').value, d=$('#wlDate').value, m=memOf($('#wlMem').value);
      if(!d||!m){$('#wlErr').textContent='날짜와 작업한 사람을 골라 주세요.';return;}
      if(!(h>0)||h>24){$('#wlErr').textContent='시간은 0보다 크고 24 이하로 입력해 주세요.';return;}
      $('#wlAddBtn').disabled=true;
      try{const w={taskId:t.id,memberId:m.id,member:m.name,date:d,hours:h,note:$('#wlNote').value.trim(),by:actorId||'',createdAt:new Date().toISOString()};
        await db.collection('worklogs').add(w);$('#wlH').value='';$('#wlNote').value='';
        await syncAct([...wlogs.filter(x=>x.taskId===t.id&&!(x.date===w.date&&x.createdAt===w.createdAt)),w]);
        logChange('task','update',t.id,t.title,null,null,`작업 시간 기록 ${md(d)} ${m.name} ${hrs(h)}h`);toast('작업 시간을 기록했어요');
      }catch(err){handleWriteError(err,'#wlErr');}finally{if($('#wlAddBtn'))$('#wlAddBtn').disabled=false;}
    };
    $('#wlBox').addEventListener('click',async e=>{
      if(e.target.id==='wlAddBtn'){addWl();return;}
      const del=e.target.closest('.wlDel');if(!del)return;
      if(!del.dataset.sure){del.dataset.sure='1';del.textContent='정말 삭제';return;}
      try{const id=del.dataset.wl;await db.collection('worklogs').doc(id).delete();await syncAct(wlogs.filter(x=>x.taskId===t.id&&x.id!==id));toast('기록을 삭제했어요');}catch(err){handleWriteError(err,'#wlErr');}
    });
    $('#wlBox').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();addWl();}});
  }
  // A7: 댓글(comments 컬렉션, taskId로 연결). 내가 쓴 댓글만 지울 수 있음
  const cmDraw=()=>{
    const box=$('#cmBox');if(!box)return;
    const list=comments.filter(c=>c.taskId===t.id).sort((x,y)=>x.at.localeCompare(y.at));
    resolveNames(list.map(c=>c.by)).then(()=>{if($('#cmList'))$('#cmList').querySelectorAll('[data-by]').forEach(el=>el.textContent=actorName(el.dataset.by));});
    const draft=$('#cmText')?.value||'';
    box.innerHTML=`<label>댓글 <span class="legend">${list.length?list.length+'개':''}</span></label>
      <ul class="cmList" id="cmList">${list.map(c=>`<li><div class="cmHead"><b data-by="${esc(c.by)}">${esc(actorName(c.by))}</b><span class="legend">${esc(c.at.slice(0,16).replace('T',' '))}</span>${c.by&&c.by===actorId?`<button type="button" class="btn ghost cmDel" data-cm="${esc(c.id)}">삭제</button>`:''}</div><div class="cmBody">${esc(c.text)}</div></li>`).join('')}</ul>
      ${canWrite&&actorId?`<div class="cmAdd"><textarea id="cmText" rows="2" placeholder="진행 상황, 확인 요청 등을 남겨 주세요" maxlength="1000">${esc(draft)}</textarea><button type="button" class="btn" id="cmAddBtn">댓글 등록</button></div>`:''}<span class="err" id="cmErr"></span>`;
  };
  if(!isNew){
    const wlDraw=wlRefresh;wlRefresh=()=>{wlDraw?.();cmDraw();};cmDraw();
    $('#cmBox').addEventListener('click',async e=>{
      if(e.target.id==='cmAddBtn'){
        const text=$('#cmText').value.trim();if(!text){$('#cmErr').textContent='댓글 내용을 입력해 주세요.';return;}
        e.target.disabled=true;
        try{await db.collection('comments').add({taskId:t.id,text,by:actorId,at:new Date().toISOString()});$('#cmText').value='';$('#cmErr').textContent='';cmDraw();}
        catch(err){handleWriteError(err,'#cmErr');}finally{if($('#cmAddBtn'))$('#cmAddBtn').disabled=false;}
        return;}
      const del=e.target.closest('.cmDel');if(!del)return;
      if(!del.dataset.sure){del.dataset.sure='1';del.textContent='정말 삭제';return;}
      try{await db.collection('comments').doc(del.dataset.cm).delete();}catch(err){handleWriteError(err,'#cmErr');}
    });
    // 댓글 입력은 업무 저장과 상관없으니 닫기 경고 대상에서 뺌
    $('#cmBox').addEventListener('input',e=>e.stopPropagation());

  // 담당자 휴가일에 마감이 걸리면 알려 줌
  const dueSync=()=>{const av=$('#tAssignee').value,m=av.startsWith('name:')?null:memOf(av),l=m&&leaveOn(m.id,$('#tDue').value);$('#dueLeave').textContent=l?`담당자가 이날 휴가예요 (${leaveLabel(l)})`:'';};
  dueSync();$('#tAssignee').addEventListener('change',dueSync);$('#tDue').addEventListener('change',dueSync);
  // 다음 파트로 넘기기: 같은 요청을 다음 파트 업무로 새로 만듦(parentId로 연결)
  $('#tParent')?.addEventListener('click',()=>{const r=rootOf(t);closeModal();openPost(r.id);});
  $('#tNext')?.addEventListener('click',()=>{const np=nextPart(t.part),pt=partOf(t.part);
    openTask(null,{projectId:t.projectId,part:np.k,title:t.title,jiraKey:t.jiraKey||'',rmsNo:t.rmsNo||'',rmsUrl:t.rmsUrl||'',link:t.link||'',requester:t.assignee||t.requester||'',priority:t.priority??2,parentId:rootOf(t).id,prevId:t.id,note:`이전 단계: ${pt.label} · ${t.title}`});});
  setTimeout(()=>{if(!ro)$('#tTitle').focus();},0);
  $('#tDel')?.addEventListener('click',()=>{
    $('#delZone').innerHTML=`<div class="confirm">이 업무를 삭제할까요? <button class="btn danger" type="button" id="tDelYes">삭제</button><button class="btn ghost" type="button" id="tDelNo">취소</button></div>`;
    $('#tDelNo').onclick=()=>openTask(t);
    $('#tDelYes').onclick=async()=>{try{await db.collection('tasks').doc(t.id).delete();logChange('task','delete',t.id,t.title);closeModal();toast('삭제했습니다');}catch(err){handleWriteError(err,'#tErr');}};
  });
  $('#taskForm').addEventListener('submit',async e=>{
    e.preventDefault();if(ro)return;
    const num=v=>v===''?'':Math.max(0,+v);
    const av=$('#tAssignee').value, am=av.startsWith('name:')?null:memOf(av);
    const data={
      projectId:$('#tProject').value,part:$('#tPart').value,title:$('#tTitle').value.trim(),
      assignee:am?am.name:av.slice(5),assigneeId:am?am.id:'',parentId:t.parentId||'',requester:$('#tRequester').value.trim(),
      jiraKey:$('#tJira').value.trim().toUpperCase(),rmsNo:$('#tRms').value.trim(),rmsUrl:$('#tRmsUrl').value.trim(),
      status:$('#tStatus').value,priority:+$('#tPri').value,
      requestDate:$('#tReq').value,dueDate:$('#tDue').value,doneDate:$('#tDone').value,
      estHours:num($('#tEst').value),actHours:num($('#tAct').value),
      link:$('#tLink').value.trim(),note:$('#tNote').value.trim(),
      updatedAt:new Date().toISOString(),createdAt:t.createdAt||new Date().toISOString()
    };
    if(!data.title){$('#tErr').textContent='요청내용을 입력해 주세요.';$('#tTitle').focus();return;}
    if(data.status!=='done'&&data.doneDate&&!t.doneDate)data.doneDate=data.doneDate; // 사용자가 직접 입력한 값 유지
    // 수정은 내가 바꾼 칸만 update로 저장해서, 같은 업무를 다른 사람이 동시에 고쳐도 서로 다른 칸은 둘 다 남게 함.
    // 같은 칸을 다른 사람이 먼저 바꿨으면 한 번 경고하고, 다시 누르면 내 값으로 저장
    // ponytail: 저장소에 트랜잭션이 없어 확인과 저장 사이 아주 짧은 순간의 충돌은 못 막음. 필요하면 doc.acquire() 잠금으로
    let patch=null, live=null;
    if(!isNew){
      live=tasks.find(x=>x.id===t.id);
      if(!live){$('#tErr').textContent='다른 사람이 이 업무를 삭제했어요. 창을 닫고 목록을 확인해 주세요.';return;}
      const same=sameVal, changed=changedKeys(data,base);
      if(!changed.length){closeModal();return;}
      const theirs=changed.filter(k=>!same(live[k],base[k])&&!same(live[k],data[k]));
      if(theirs.length&&!$('#taskForm').dataset.ok){
        const lab=k=>(HFIELDS.task.find(f=>f[0]===k)||[k,k==='assigneeId'?'담당자':k])[1];
        $('#tErr').textContent=`다른 사람이 먼저 ${[...new Set(theirs.map(lab))].join(', ')} 값을 바꿨어요. 그래도 내 값으로 저장하려면 한 번 더 누르세요.`;
        $('#taskForm').dataset.ok='1';return;
      }
      patch=Object.fromEntries(changed.map(k=>[k,data[k]]));patch.updatedAt=data.updatedAt;
    }
    $('#tSave').disabled=true;
    try{
      if(isNew){const ref=await db.collection('tasks').add(data);logChange('task','create',ref.id,data.title,null,data);
        // 다음 파트로 넘긴 업무면 이전 단계 업무를 완료로 바꿔 그 파트의 미완료 목록·현황에서 빠지게 함
        const prev=t.prevId&&tasks.find(x=>x.id===t.prevId);
        if(prev&&prev.status!=='done'){const pp={status:'done',doneDate:todayStr(),updatedAt:data.updatedAt};await db.collection('tasks').doc(prev.id).update(pp);logChange('task','update',prev.id,prev.title,prev,{...prev,...pp},`${partOf(data.part).label}(으)로 넘김`);}}
      else{await db.collection('tasks').doc(t.id).update(patch);logChange('task','update',t.id,data.title,live,{...live,...patch});}
      closeModal();toast(isNew?'등록했습니다':'저장했습니다');
    }catch(err){$('#tSave').disabled=false;handleWriteError(err,'#tErr');}
  });
}

    <div class="body" style="grid-template-columns:1fr">

      <div class="f"><label for="pClient">고객사 · 기간</label><input id="pClient" value="${esc(p?.client||'')}" maxlength="60" placeholder="고객사 · 기간"></div>

      <div id="pConfirm"></div>
    </div>
    <footer>${isNew?'<span></span>':'<button class="btn danger" type="button" id="pDel">삭제</button>'}<span class="err" id="pErr"></span><div class="r"><button class="btn" type="button" id="pCancel">취소</button><button class="btn primary" type="submit">저장</button></div></footer>
  </form></div>`;
  $('#xClose').onclick=$('#pCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  $('#projForm').querySelector('.swatches').addEventListener('click',e=>{const sw=e.target.closest('.swatch');if(sw)sw.parentElement.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed',s===sw));});
  $('#pName').focus();

    const list=projects.slice(), j=idx+dir;[list[idx],list[j]]=[list[j],list[idx]];
    try{for(const [i,q] of list.entries())if(q.order!==i)await db.collection('projects').doc(q.id).update({order:i});
      logChange('project','update',p.id,p.name,{order:idx},{order:j},'탭 순서 변경');closeModal();toast('순서를 바꿨습니다');}
    catch(err){handleWriteError(err,'#pErr');}

    $('#pConfirm').innerHTML=`<div class="confirm">'${esc(p.name)}' 프로젝트${n?`와 업무 ${n}건`:''}을 삭제할까요? <button class="btn danger" type="button" id="pDelYes">삭제</button><button class="btn ghost" type="button" id="pDelNo">취소</button></div>`;
