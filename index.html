<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>업무 관리 대시보드</title>
<meta name="description" content="프로젝트·파트별 업무, 휴가, 투입 인력, 주간 보고를 한곳에서 관리하는 팀 업무 관리 대시보드">
<meta property="og:type" content="website">
<meta property="og:title" content="업무 관리 대시보드">
<meta property="og:description" content="프로젝트·파트별 업무, 휴가, 투입 인력, 주간 보고를 한곳에서. 회사 메일로 로그인해요.">
<meta name="theme-color" content="#f6f8fa">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d74844'/%3E%3Cpath d='M8 11l2.5 2.5L15 9M8 20l2.5 2.5L15 18' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M18 11.5h6M18 20.5h6' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Layout: 상단 요약 스트립 → 프로젝트 탭 + 필터 바 → 목록/보드/파트 현황 3개 뷰. 표 중심의 운영 툴
   토큰: 알닷 운영툴 디자인 시스템(alddot-design-system/DESIGN.md) 값. 라이트 테마만 있어요. */
:root{
  color-scheme:light;
  --bg:#f6f8fa; --surface:#ffffff; --sunk:#eef1f4; --line:#dee3e7;
  --fg:#141f2c; --ink-soft:#4b5765; --muted:rgba(1,10,37,.58); --grey-400:#a7b0b9; --na:#87919c;
  --accent:#fc6969; --accent-dark:#d74844; --accent-soft:#ffeeee; --accent-fg:#ffffff;
  --ok:#005927; --ok-strong:#007738; --ok-soft:#dafae3; --ok-border:#9fe0b3;
  --warn:#993f00; --warn-strong:#ff8800; --warn-soft:#ffe8d1; --warn-border:#ffbd8d;
  --bad:#b00727; --bad-strong:#f03848; --bad-soft:#ffe1df; --bad-border:#febab6;
  --overlay:rgba(43,37,35,.4);
  --shadow-3:0 12px 32px rgba(1,10,37,.10),0 2px 6px rgba(1,10,37,.06);
  --shadow-toast:0 8px 24px rgba(1,10,37,.16);
  --font-ui:Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --font-num:var(--font-ui);
  --r:7px; --r-sm:6px; --r-lg:9px; --r-xl:11px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
/* 아티팩트가 자동으로 넣어 주던 기본 규칙. 독립 페이지라 직접 넣음 */
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
@media (max-width:600px){.wrap{padding-inline:16px}}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-dark);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.25;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.brand h1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.editBtn{font-size:14px;font-weight:500;padding:2px 8px}
.brand:hover .editBtn,.editBtn:focus-visible{color:var(--accent-dark)}
.brandEdit{display:flex;flex-direction:column;gap:6px;width:min(460px,100%)}
.brandEdit input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;width:100%}
.brandEdit #bTitle{font-size:18px;font-weight:700}
.brandBtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.brandBtns .btn{padding:5px 12px}
.brand{min-width:0;flex:1 1 280px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:var(--r);padding:8px 14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent-dark)}
/* 흰 글자 대비: coral 바탕 2.85:1 → primary-dark 바탕 4.27:1 (DESIGN.md 접근성 메모의 개선안) */
.btn.primary{background:var(--accent-dark);border-color:var(--accent-dark);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:var(--accent-fg);filter:brightness(.92)}
.btn.danger{color:var(--bad);border-color:var(--bad-border)}
.btn.danger:hover{color:var(--bad);border-color:var(--bad-strong)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{border-color:transparent;color:var(--accent-dark)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border);border-radius:var(--r);padding:12px 14px;font-size:14px;line-height:1.6}

/* summary strip */
.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px 0}
.stat{padding:10px 18px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .k{font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:.04em}
.stat .v{font-size:26px;font-weight:700;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--muted);margin-left:2px}
.stat.alert .v{color:var(--bad)}
.bar{height:4px;background:var(--sunk);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok-strong)}
@media (max-width:900px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(4){border-left:0}.stat:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:480px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-left:0!important;border-top:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}.stat:nth-child(even){border-left:1px solid var(--line)!important}}

/* mode tabs */
.modeRow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.modes{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);flex:1 1 auto}
.modes button{border:0;border-bottom:2.5px solid transparent;background:transparent;padding:10px 16px;border-radius:var(--r) var(--r) 0 0;font-weight:600;color:var(--muted)}
.modes button:hover{color:var(--accent-dark)}
.modes button[aria-selected="true"]{color:var(--accent-dark);border-bottom-color:var(--accent)}
.todayOff{font-size:14px;color:var(--muted);min-width:0}
.todayOff b{color:var(--fg);font-weight:600}
.area{display:flex;flex-direction:column;gap:16px}

/* leave */
.lgrid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.lgrid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0;overflow:hidden}
.panel>h3{margin:0;font-size:14px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel>h3 .legend{font-weight:400}
.panel table{min-width:0}
.panel .scroll{overflow-x:auto}
.mrow{cursor:pointer}
.mrow.on{background:var(--accent-soft)}
.mrow td{padding:9px 12px}
.mname{font-weight:600}
.mpart{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.mpart .sw{width:6px;height:6px;border-radius:2px}
.qbar{display:flex;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:4px;min-width:80px}
.qbar .u{background:var(--ink-soft)}
.qbar .p{background:var(--ink-soft);opacity:.35}
.qbar .x{background:var(--bad-strong)}
td.r,th.r{text-align:right}
.rem{font-weight:600;font-variant-numeric:tabular-nums}
.rem.neg{color:var(--bad)}
.calnav{display:flex;align-items:center;gap:4px}
.calnav .btn{padding:4px 10px}
.calnav .mlabel{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;min-width:84px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .dow{font-size:11px;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);background:var(--sunk)}
.cal .dow.we{color:var(--bad)}
.day{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:default}
.day:nth-child(7n){border-right:0}
.day.can{cursor:copy}
.day.can:hover{background:var(--accent-soft)}
.day.out{background:var(--bg)}
.day.out .dn{opacity:.4}
.day.we{background:var(--bg)}
.dn{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);width:fit-content;padding:0 4px;border-radius:4px}
.day.we .dn{color:var(--bad)}
.day.today .dn{background:var(--accent-dark);color:var(--accent-fg)}
.lv{font-size:14px;line-height:1.5;border-radius:3px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid currentColor}
.lv:hover{filter:brightness(.96)}
.lt-a{background:var(--accent-soft);color:var(--fg);border-left-color:var(--accent)}
.lt-h{background:var(--ok-soft);color:var(--ok)}
.lt-q{background:var(--warn-soft);color:var(--warn)}
.lt-o{background:var(--sunk);color:var(--ink-soft)}
.more{font-size:14px;color:var(--muted);padding-left:4px}
@media (max-width:600px){.day{min-height:64px;padding:3px}.lv{font-size:14px;padding:0 3px}}
.ltable td,.ltable th{padding:8px 12px}
.ltable tbody tr{cursor:pointer}

/* period bar */
.periodBar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.plabel{min-width:130px}
.periodBar .sel{padding:4px 8px}

/* weekly report */
.rtool{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mlabel.wk{min-width:150px}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}
@media (max-width:980px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.report{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
@media (max-width:600px){.report{padding:16px}}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:10px}
.rhead h2{margin:2px 0 0;font-size:20px;text-wrap:balance}
.rhead>.legend{text-align:right}
.rkpi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:6px}
.rkpi>div{padding:8px 12px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.rkpi>div:first-child{border-left:0}
.rkpi .k{font-size:11px;color:var(--muted)}
.rkpi .v{font-size:18px}
.rkpi small{font-size:11px;color:var(--muted);margin-left:2px}
@media (max-width:700px){.rkpi{grid-template-columns:repeat(3,minmax(0,1fr))}.rkpi>div:nth-child(4){border-left:0}.rkpi>div:nth-child(n+4){border-top:1px solid var(--line)}}
.rsecs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px}
@media (max-width:760px){.rsecs{grid-template-columns:minmax(0,1fr)}}
.rsec{min-width:0}
.rsec h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.rsec h4 .num{font-size:12px;color:var(--muted);font-weight:500}
.rsec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.rsec li{font-size:14px;overflow-wrap:anywhere}
.rsec .legend{margin:4px 0 0}
.rgrp{margin-top:6px}
.rbody{display:flex;flex-direction:column;gap:22px}
.rproj h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rproj h3 .legend{font-weight:400;margin-left:auto}
.rdot{width:10px;height:10px;border-radius:50%;flex:none}
.rparts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.rparts{grid-template-columns:minmax(0,1fr)}}
.rpartcard{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rpartcard .rpart{font-size:14px;color:var(--fg);margin:0}
.rpartcard .rpart .sw{height:14px}
.rpartcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.rpartcard li{font-size:14px;overflow-wrap:anywhere}
.rblkT{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:2px}
.rblkT .num{font-weight:500}
.rb-done .rblkT{color:var(--ok)}
.rb-late .rblkT{color:var(--bad)}
.rb-next .rblkT{color:var(--accent-dark)}
.rpart{font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px;margin-bottom:2px}
.rpart .sw{width:3px;height:12px;border-radius:2px}
.rnotes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.rnotes.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.rnotes.three{grid-template-columns:minmax(0,1fr)}}
.rnotes textarea{min-height:76px}
.rsave{margin:0;text-align:right}
.rarch>h3{margin:0;font-size:14px;padding:10px 14px;border-bottom:1px solid var(--line)}
.alist{list-style:none;margin:0;padding:6px}
.aitem{width:100%;border:0;background:transparent;border-radius:6px;padding:7px 8px;display:flex;justify-content:space-between;gap:8px;text-align:left}
.aitem:hover{background:var(--sunk)}
.aitem.on{background:var(--accent-soft);color:var(--fg);font-weight:600}

/* history */
.hday h3{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:600}
.hlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.hitem{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.hitem:last-child{border-bottom:0}
.htime{font-size:14px;color:var(--muted);padding-top:2px;flex:none;width:40px}
.hbody{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
.hline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hlabel{font-weight:500;overflow-wrap:anywhere}
.hlink{border:0;background:none;padding:0;font-weight:600;color:var(--accent-dark);text-decoration:underline;text-underline-offset:2px;text-align:left;overflow-wrap:anywhere}
.h-del{background:var(--bad-soft);color:var(--bad)}
.hchg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:14px}
.hchg li{display:flex;gap:6px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.hf{color:var(--muted);min-width:76px}
.harr{color:var(--muted)}
.hsw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle}

/* people hours */
.rpeople h3{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rpeople h3 .legend{font-weight:400}
.ptable{min-width:720px}
.ptable td,.ptable th{padding:7px 10px}
.ptable tbody tr{cursor:default}
.hsum{grid-template-columns:repeat(6,minmax(0,1fr))}
.hrow{cursor:pointer}
.hrow.on{background:var(--accent-soft)}
.caret{display:inline-block;width:14px;color:var(--muted)}
.hdet td{background:var(--bg);padding:8px 14px 10px 34px}
.hdet:hover{background:transparent!important}
.hitems{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.hitems li{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hitems .hh{margin-left:auto;color:var(--muted)}
.hbar{position:relative;display:flex;height:10px;background:var(--sunk);border-radius:3px;overflow:visible}
.hbar i{display:block;height:100%}
.hbar .d{background:var(--ok-strong);border-radius:3px 0 0 3px}
.hbar .g{background:var(--na)}
.hbar .cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.6}
.lgd{display:inline-block;width:10px;height:8px;border-radius:2px;margin:0 3px 0 6px;vertical-align:middle}
.lgd.d{background:var(--ok-strong)}.lgd.g{background:var(--na)}

/* staffing */
.ssum{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.ssum{grid-template-columns:repeat(2,minmax(0,1fr))}.ssum .stat:nth-child(3){border-left:0}.ssum .stat:nth-child(n+3){border-top:1px solid var(--line)}}
.scard>h3{gap:8px 10px}
.scard>h3 .legend{font-weight:400}
.scount{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto;font-size:12px;font-weight:500}
.chip.sm{padding:1px 8px;font-size:11px;cursor:default}
.scard>h3 .btn{padding:4px 10px;font-size:14px}
.stable{min-width:760px}
.stable td,.stable th{padding:8px 12px}
.snote{color:var(--muted);font-size:14px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* project tabs */
.ptabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;flex:1 1 320px;min-width:0}
.ptRow{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ptRow .periodBar{padding-block:4px}
.ptab{border:0;background:transparent;padding:8px 12px;border-bottom:2.5px solid transparent;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;font-weight:600}
.ptab:hover{color:var(--accent-dark)}
.ptab .dot{width:8px;height:8px;border-radius:50%}
.ptab .c{font-variant-numeric:tabular-nums;font-size:12px;background:var(--sunk);border-radius:10px;padding:0 6px}
.ptab[aria-selected="true"]{color:var(--accent-dark);border-bottom-color:var(--accent)}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:var(--r-sm);padding:5px 12px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent);color:var(--accent-dark)}
.chip[aria-pressed="true"]{background:var(--accent-dark);color:var(--accent-fg);border-color:var(--accent-dark)}
.chip .sw{width:8px;height:8px;border-radius:2px}
.sel,.search{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;font-size:14px}
.search{min-width:0;flex:1 1 180px;max-width:280px}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:700}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}

/* table */
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1080px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
th{font-size:14px;font-weight:600;color:var(--muted);background:var(--surface);border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;user-select:none}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--fg)}
th .arr{font-size:10px;margin-left:3px}
tbody tr{cursor:pointer}
tbody tr:nth-child(even){background:var(--bg)}
tbody tr:hover{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
td.title{max-width:340px}
td.title .t{font-weight:500}
td.title .n{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.nowrap{white-space:nowrap}
.part{display:inline-flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.part .sw{width:3px;height:14px;border-radius:2px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.s-wait{background:var(--sunk);color:var(--ink-soft)}
.s-doing{background:var(--warn-soft);color:var(--warn)}
.s-review{background:var(--accent-soft);color:var(--fg)}
tbody tr.is-late td:first-child{box-shadow:inset 3px 0 0 var(--bad-strong)}
.card.is-late{box-shadow:inset 3px 0 0 var(--bad-strong)}
/* A3: 마감일에 담당자 휴가 */
.leaveTag{display:block;width:fit-content;margin-top:2px;padding:0 6px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700}
.wlAdd{display:grid;grid-template-columns:150px minmax(0,1fr) 90px minmax(0,1.4fr) auto;gap:6px;align-items:center;margin-top:4px}
.wlAdd input,.wlAdd select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
.wlBox .hitems li{gap:8px}
.wlBox .wlDel{padding:2px 8px;font-size:14px}
@media (max-width:560px){.wlAdd{grid-template-columns:1fr 1fr}.wlAdd #wlNote{grid-column:1/-1}}
.cmList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cmList li{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--bg)}
.cmHead{display:flex;align-items:center;gap:8px;font-size:14px}
.cmHead .cmDel{margin-left:auto;padding:0 6px;font-size:14px}
.cmBody{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin-top:2px}
.cmAdd{display:flex;gap:6px;align-items:flex-end}
.cmAdd textarea{flex:1;min-height:52px}
.lvRange{display:block!important;font-size:14px;background:var(--sunk);border-radius:var(--r);padding:8px 12px}
.day.pick{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 1px var(--accent)}
.areaBar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.tplList{display:flex;flex-direction:column;gap:8px}
.tplRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tplName{display:flex;flex-direction:column;gap:2px;flex:1 1 240px;min-width:0}
.warnHint{color:var(--warn);font-weight:600}
.lateTag{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:var(--r-sm);background:var(--bad-soft);color:var(--bad);font-size:11px;font-weight:700;vertical-align:middle}
.s-hold{background:var(--sunk);color:var(--ink-soft);text-decoration:line-through}
.s-done{background:var(--ok-soft);color:var(--ok)}
.pri{font-size:12px;font-weight:600}
.pri-0{color:var(--bad)}.pri-1{color:var(--warn)}.pri-2{color:var(--muted)}.pri-3{color:var(--muted);opacity:.7}
.late{color:var(--bad);font-weight:600}
.dday{font-size:11px;margin-left:4px}
.hrs .over{color:var(--bad)}
.rms{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 5px;margin-right:6px;white-space:nowrap;text-decoration:none}
a.rms:hover{text-decoration:underline}
.rmsRow{flex-direction:row!important;align-items:center;gap:8px!important;flex-wrap:wrap}
.rmsRow .btn{padding:2px 8px;font-size:14px}
.rmsRow a.rms{font-size:14px;padding:2px 8px}
.rmsRule{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.rmsRule input{flex:1 1 260px;min-width:0}
.jira{font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--sunk);border-radius:4px;padding:0 5px;margin-right:6px;white-space:nowrap}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--sunk);border-radius:var(--r-lg);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col h3{margin:0;padding:4px 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.col h3 .num{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.card:hover{border-color:var(--accent)}
.card .meta{display:flex;justify-content:space-between;gap:6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.card .t{font-weight:500;overflow-wrap:anywhere}
.card .proj{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.card .proj .dot{width:6px;height:6px;border-radius:50%}

.legend{font-size:14px;color:var(--muted)}

/* empty */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);padding:48px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{margin:0;font-size:17px}
.empty p{margin:0;color:var(--muted);max-width:46ch}

/* modal */
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:var(--r-xl);width:100%;max-width:720px;box-shadow:var(--shadow-3)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:16px;font-weight:700}
.modal .body{padding:16px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.modal footer{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal footer .r{display:flex;gap:8px;margin-left:auto}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:14px;font-weight:600;color:var(--ink-soft)}
.f label b{color:var(--bad-strong)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 10px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus,.sel:focus,.search:focus{outline:none;border-color:var(--accent)}
.f textarea{min-height:72px;resize:vertical}
.moreF{border-top:1px solid var(--line);padding-top:10px}
.moreF>summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-soft);width:fit-content}
.moreF>summary:hover{color:var(--accent-dark)}
.modal .body.sub{padding:12px 0 0}
/* 내보내기 같은 접이식 메뉴 */
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.menuList{position:absolute;right:0;top:calc(100% + 4px);z-index:15;min-width:170px;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-3)}
.menuList .btn{border-color:transparent;justify-content:flex-start;width:100%}
.f .hint{font-size:14px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dcell{display:flex;flex-direction:column;gap:1px;line-height:1.35}
.dcell .dl{font-size:10px;color:var(--muted);margin-right:4px}
.dcell .exp{font-size:12px;color:var(--muted)}
.dcell .act{color:var(--ok);font-weight:600}
.dcell .due{font-size:12px}
.dcell .exp.slip{color:var(--warn);font-weight:600}
@media (max-width:560px){.modal .body{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:14px}
.confirm{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-border);border-radius:var(--r);padding:8px 12px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.prow input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%}
.swatches{display:flex;gap:4px}
.swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--fg)}
.swatches.wrap{flex-wrap:wrap;padding-left:2px}
.pcard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.pcTop{display:flex;align-items:center;gap:8px}
.pcTop .order{display:flex;flex-direction:column}
.pcTop .order .btn{padding:0 6px;font-size:10px;line-height:16px}
.pcSw{width:12px;height:12px;border-radius:3px;flex:none}
.pcName{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px}
.pcUse{font-size:12px;color:var(--muted);white-space:nowrap}
.mrowEdit,.mhead{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr) 76px 52px;gap:8px;align-items:center}
.mrowEdit .sel{width:100%;min-width:0}
.mhead{font-size:11px;font-weight:600;color:var(--muted);padding:0 2px}
@media (max-width:620px){.mhead{display:none}.mrowEdit{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-bottom:10px;border-bottom:1px solid var(--line)}.mrowEdit .mName,.mrowEdit .mEmail{grid-column:1/-1}}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--accent-fg);padding:12px 16px;border-radius:var(--r);font-size:14px;font-weight:600;box-shadow:var(--shadow-toast);z-index:30}
@media (prefers-reduced-motion:no-preference){.card,.btn,.chip,.modes button,.ptab{transition:border-color .12s var(--ease),background .12s var(--ease),color .12s var(--ease)}}
/* 좁은 화면: 첫 화면에 업무 목록이 보이도록 머리말·버튼·탭·요약을 줄임 */
@media (max-width:600px){
  .sLong,#syncNow{display:none}
  .todayOff{flex-basis:100%}
  .modeRow{gap:6px 10px}
  .brand h1{font-size:22px}
  .actions{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}
  .actions .btn{padding:6px 10px;font-size:14px}
  .actions .btn.primary{order:-1}
  .modes{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .modes button{padding:8px 12px;white-space:nowrap}
}
@media (max-width:480px){
  .summary{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .summary .stat{padding:8px 10px;border-left:1px solid var(--line)!important;border-top:0!important}
  .summary .stat:nth-child(3n+1){border-left:0!important}
  .summary .stat:nth-child(n+4){border-top:1px solid var(--line)!important}
  .summary .stat .v{font-size:20px}
  .summary .stat .k{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
/* 로그인·첫 프로필 등록 화면 */
#authGate{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(48px,env(safe-area-inset-top,0px)) 16px 32px}
.gateCard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-3);padding:28px 24px;display:flex;flex-direction:column;gap:12px}
.gateCard h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.gateCard p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.6}
.gateForm{display:flex;flex-direction:column;gap:6px}
.gateForm label{font-size:14px;font-weight:600;color:var(--ink-soft);margin-top:4px}
.gateForm input,.gateForm select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:14px;width:100%}
.gateForm input:focus,.gateForm select:focus{outline:none;border-color:var(--accent)}
.gateForm .btn{margin-top:8px;justify-content:center}
.gateLinks{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.gateOr{text-align:center;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.nfList{display:flex;flex-direction:column;gap:8px}
.gateTabs{display:flex;border-bottom:1px solid var(--line);margin:-4px 0 4px}
.gateTabs button{flex:1;border:0;border-bottom:2.5px solid transparent;background:none;padding:10px;font-weight:600;color:var(--muted);cursor:pointer}
.gateTabs button[aria-selected="true"]{color:var(--accent-dark);border-bottom-color:var(--accent)}
#gJoin:empty{display:none}
.f .nfItem{display:flex;align-items:flex-start;gap:8px;font-size:14px;font-weight:400;color:var(--fg);cursor:pointer}
.f .nfItem input{width:16px;height:16px;flex:none;margin:2px 0 0;accent-color:var(--accent-dark)}
.nfItem>span{display:flex;flex-direction:column}
.nfName{font-weight:600}
/* 프로필 사진 (원형) */
.avatar{border-radius:50%;object-fit:cover;flex:none;display:inline-block;vertical-align:middle;background:var(--sunk);max-width:none}
#pfAvatar{flex:none;line-height:0}
.avatarInit{display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink-soft);border:1px solid var(--line)}
.f.pfPhoto{flex-direction:row;align-items:center;gap:14px}
.pfPhotoBtns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pfPhotoBtns .hint{flex-basis:auto}
@media (max-width:600px){.f.pfPhoto{flex-direction:column;align-items:flex-start}#pfAvatar .avatar{width:80px!important;height:80px!important}#pfAvatar .avatarInit{font-size:34px!important}}
/* 동기화 상태 · 접속자 */
.syncBox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap;min-width:0}
.syncDot{width:7px;height:7px;border-radius:50%;background:var(--ok-strong);flex:none}
.syncBox[data-state=saving]>.syncDot{background:var(--warn-strong)}
.syncBox[data-state=offline]>.syncDot{background:var(--bad-strong)}
.syncBox[data-state=offline] .syncText{color:var(--bad);font-weight:600}
.syncBox .btn{padding:4px 8px;font-size:12px}
.onlineWrap{position:relative}
.onlineList{position:absolute;right:0;top:calc(100% + 4px);z-index:15;min-width:220px;display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-3);font-size:14px;color:var(--fg)}
.onlineItem{display:flex;align-items:center;gap:8px}
.onlineItem .legend{margin-left:auto;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.syncBox[data-state=saving]>.syncDot{animation:wbPulse .9s ease-in-out infinite}}
@keyframes wbPulse{50%{opacity:.35}}

/* ---------- 화면 틀: 밝은 왼쪽 메뉴 + 위 헤더 + 넓은 여백의 흰 본문 ---------- */
.shell{display:flex;min-height:100vh;align-items:stretch}
.side{width:236px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);color:var(--fg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;padding:18px 12px 24px;z-index:13}
.sideHead{display:flex;align-items:flex-start;gap:6px;padding:0 4px}
.side .brand{flex:1;min-width:0}
.side .brand h1{font-size:15px;font-weight:800;line-height:1.35;letter-spacing:-.01em}
.side .brand p{font-size:14px;margin-top:4px}
.side .editBtn{font-size:14px;padding:0 4px}
.side .brandEdit{width:100%}
.sideFold{flex:none;border:0;background:none;color:var(--ink-soft);font-size:15px;line-height:1;padding:4px 6px;border-radius:var(--r-sm);cursor:pointer}
.sideFold:hover{background:var(--sunk);color:var(--fg)}
.sideNav{display:flex;flex-direction:column;gap:6px}
.sideSec{display:flex;flex-direction:column}
.secHead{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;padding:8px 10px 6px;cursor:pointer;border-radius:var(--r-sm)}
.secHead:hover{color:var(--fg)}
.chev{transition:transform .12s var(--ease)}
.sideSec.closed .chev{transform:rotate(-90deg)}
.sideSec.closed .secBody{display:none}
.secBody{display:flex;flex-direction:column;gap:2px}
.navItem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--fg);font-size:14px;font-weight:500;padding:8px 10px;border-radius:var(--r);text-align:left;cursor:pointer}
.navItem:hover{background:var(--sunk)}
/* 선택 항목: --accent-dark 글자는 --accent-soft 위에서 대비 3.8이라 글자는 --fg, 강조는 아이콘 테두리로 */
.navItem[aria-selected="true"]{background:var(--accent-soft);font-weight:700}
.navItem:disabled{opacity:.45;cursor:not-allowed}
.navItem .ico{width:18px;height:18px;flex:none;color:var(--ink-soft)}
.navItem:hover .ico{color:var(--fg)}
.navItem[aria-selected="true"] .ico{color:var(--accent-dark)}
/* 전체 접기: 아이콘만 보이는 좁은 폭. 접힌 섹션도 아이콘은 보여 줌 */
.shell.fold .side{width:60px;padding-inline:8px}
.shell.fold .side .brand,.shell.fold .secHead .lbl,.shell.fold .navItem .lbl{display:none}
.shell.fold .sideHead{justify-content:center;padding:0}
.shell.fold .secHead{justify-content:center;padding:6px 0;border-top:1px solid var(--line);border-radius:0}
.shell.fold .secHead .chev{display:none}
.shell.fold .sideSec.closed .secBody{display:flex}
.shell.fold .navItem{justify-content:center;padding:8px 0}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface)}
.main>.wrap{width:100%;padding-inline:56px;padding-top:28px}
.topbar{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:56px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px;padding-inline:max(24px,env(safe-area-inset-left,0px)) max(24px,env(safe-area-inset-right,0px))}
.pageTitle{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1 1 auto;min-width:0}
.topRight{justify-content:flex-end}
.sideOpen{display:none;font-size:18px;padding:4px 10px}
.todayLine{font-size:14px;color:var(--muted)}
.todayLine:has(#todayOff:empty){display:none}
/* 본문: 카드 대신 구분선과 제목 위계로 나눔 */
.wrap .area[hidden]{display:none}
.main th{font-weight:700;color:var(--fg);border-bottom-width:1px}
.sideBackdrop{display:none}
/* 좁은 화면: 메뉴는 서랍. ☰로 열고, 바깥·메뉴 항목·Esc로 닫힘 */
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(260px,82vw)!important;padding-inline:12px!important;transform:translateX(-100%);transition:transform .18s var(--ease);z-index:25;padding-top:max(18px,env(safe-area-inset-top,0px));box-shadow:var(--shadow-3)}
  .shell.drawer .side{transform:none}
  .shell.drawer .sideBackdrop{display:block;position:fixed;inset:0;background:var(--overlay);z-index:24}
  .shell.fold .side .brand,.shell.fold .secHead .lbl,.shell.fold .navItem .lbl,.shell.fold .secHead .chev{display:revert}
  .shell.fold .navItem{justify-content:flex-start;padding:8px 10px}
  .shell.fold .secHead{justify-content:space-between;padding:8px 10px 6px;border-top:0}
  .sideFold{display:none}
  .sideOpen{display:inline-flex}
  .main>.wrap{padding-inline:24px;padding-top:20px}
  .topbar{padding-inline:16px}
  .pageTitle{font-size:16px}

const STAFF_DOMAIN_TEXT=STAFF_DOMAINS.map(d=>'@'+d).join(' · ');

(()=>{
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||!window.supabase)return; // 설정 전에는 화면이 '저장소에 연결되지 않아…' 안내를 띄움
  // 로그인 정보는 탭 저장소(sessionStorage)에만 둠: 창(탭)을 닫으면 로그아웃되고, 다시 열면 로그인 화면부터
  // 예전 버전이 브라우저 영구 저장소(localStorage)에 남긴 로그인 정보는 지움
  try{Object.keys(localStorage).filter(k=>/^sb-.+-auth-token/.test(k)).forEach(k=>localStorage.removeItem(k));}catch(e){}
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storage:window.sessionStorage,persistSession:true}});
  // 서버에 닿지 않을 때(무료 플랜 일시 정지 등) 보여 줄 안내
  const PAUSED_HINT='서버에 연결하지 못했어요. 무료 플랜 서버는 7일 동안 아무도 쓰지 않으면 잠시 멈춰요. 관리자에게 Supabase 대시보드에서 프로젝트를 다시 켜 달라고(Restore project) 알려 주세요.';
  const isNetErr=e=>!e?.status&&/fetch|network|load failed|timeout/i.test(String(e?.message||e||''));
  const escH=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- 문서 저장소: 컬렉션별로 한 번 다 받아 두고 Realtime으로 갱신 ---------- */
  // ponytail: 컬렉션을 통째로 받음. 업무가 수만 건이 되면 기간별로 나눠 받을 것
  const cache={}, subs={}, loading={};
  const newId=()=>crypto.randomUUID().replace(/-/g,'').slice(0,20);
  const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
  const merge=(a,b)=>{const o={...a};for(const k in b)o[k]=isObj(b[k])&&isObj(a?.[k])?merge(a[k],b[k]):b[k];return o;};
  const toErr=e=>{const m=String(e?.message||e||'');
    const code=e?.code==='42501'||e?.code==='P0002'||/row-level security|not_found|permission/i.test(m)?'invalid_argument':/too large|payload/i.test(m)?'quota_exceeded':'unavailable';
    return Object.assign(new Error(m),{code});};
  const fire=c=>subs[c]?.forEach(f=>f());
  // 동기화 상태: 저장 중인 쓰기 수, 마지막으로 서버와 맞춘 시각, 지금 접속 중인 사람
  const sync={pending:0,last:null,online:[]}, openedAt=new Date().toISOString();
  const touch=()=>{sync.last=new Date();drawSync();};
  function load(c,force){
    if(!loading[c]||force)loading[c]=(async()=>{
      const m=new Map();
      for(let f=0;;f+=1000){const {data,error}=await sb.from('wb_docs').select('id,data').eq('coll',c).range(f,f+999);if(error)throw toErr(error);data.forEach(r=>m.set(r.id,r.data));if(data.length<1000)break;}
      cache[c]=m;fire(c);touch();
    })().catch(e=>{delete loading[c];throw e;});
    return loading[c];
  }
  const snap=(c,q)=>{
    let docs=[...(cache[c]||[])].map(([id,d])=>({id,exists:true,data:()=>d}));
    if(q.order){const [f,dir]=q.order,s=dir==='desc'?-1:1;docs.sort((a,b)=>{const x=a.data()[f]??'',y=b.data()[f]??'';return (x>y?1:x<y?-1:0)*s;});}
    if(q.lim)docs=docs.slice(0,q.lim);
    return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{hasPendingWrites:false,fromCache:false}};
  };
  const listen=(c,f,error)=>{(subs[c]||=new Set()).add(f);load(c).then(f,e=>error?.(e));return()=>subs[c].delete(f);};
  async function write(c,id,op,d){
    await load(c).catch(()=>{});
    const m=cache[c]||(cache[c]=new Map()), prev=m.get(id);
    if(op==='update'&&prev===undefined)throw toErr({code:'P0002',message:'not_found'});
    // 내 변경은 바로 화면에 보이고, 서버가 거절하면 되돌림
    if(op==='delete')m.delete(id);else m.set(id,op==='update'?merge(prev,d):d);fire(c);
    let r;sync.pending++;drawSync();
    try{
      if(op==='add')r=await sb.from('wb_docs').insert({coll:c,id,data:d});
      else if(op==='set')r=await sb.from('wb_docs').upsert({coll:c,id,data:d});
      else if(op==='update')r=await sb.rpc('wb_patch',{p_coll:c,p_id:id,p_patch:d});
      else{r=await sb.from('wb_docs').delete().eq('coll',c).eq('id',id).select('id');if(!r.error&&!r.data?.length&&prev!==undefined)r={error:{code:'42501',message:'permission'}};}
    }catch(e){r={error:e};}finally{sync.pending--;}
    if(r.error){if(prev===undefined)m.delete(id);else m.set(id,prev);fire(c);drawSync();throw toErr(r.error);}
    touch();
  }
  const docRef=(c,id)=>({id,path:c+'/'+id,
    get:async()=>{await load(c);const d=cache[c].get(id);return {id,exists:!!d,data:()=>d};},
    set:d=>write(c,id,'set',d),update:p=>write(c,id,'update',p),delete:()=>write(c,id,'delete'),
    onSnapshot:(next,error)=>listen(c,()=>{const d=cache[c]?.get(id);next({id,exists:!!d,data:()=>d||{}});},error)});
  const query=(c,q={})=>({
    orderBy:(f,dir)=>query(c,{...q,order:[f,dir]}),limit:n=>query(c,{...q,lim:n}),
    get:async()=>{await load(c);return snap(c,q);},
    onSnapshot:(next,error)=>listen(c,()=>next(snap(c,q)),error),
    add:async d=>{const id=newId();await write(c,id,'add',d);return {id};},
    doc:id=>docRef(c,id)});
  const db={collection:c=>query(c),doc:p=>{const [c,id]=p.split('/');return docRef(c,id);}};

  // 실시간: 다른 사람 변경을 바로 받음. 끊기면 1분마다 새로 받아 옴
  let netDown=false, wasUp=false;
  const setNet=msg=>{const b=document.getElementById('banner');if(!b)return;
    if(msg){b.textContent=msg;b.hidden=false;b.dataset.net='1';}else if(b.dataset.net){b.hidden=true;delete b.dataset.net;}};
  // 접속자 현황: Realtime presence에 내 이름과 접속 시각을 올리고, 모두의 목록을 받음
  let ch=null, chUp=false, trackedName='';
  function trackMe(){const m=memberOf(me?.id);if(!ch||!chUp||!m)return;trackedName=m.name||'';ch.track({name:trackedName,since:openedAt});}
  function startRealtime(){
    ch=sb.channel('wb-docs',{config:{presence:{key:me.id}}});
    ch.on('postgres_changes',{event:'*',schema:'public',table:'wb_docs'},p=>{
      const row=p.eventType==='DELETE'?p.old:p.new, c=row?.coll;if(!c||!cache[c])return;
      if(p.eventType==='DELETE')cache[c].delete(row.id);else cache[c].set(row.id,row.data);fire(c);touch();
      if(c==='members'&&memberOf(me.id)&&memberOf(me.id).name!==trackedName)trackMe();
    }).on('presence',{event:'sync'},()=>{
      sync.online=Object.entries(ch.presenceState()).map(([uid,metas])=>({uid,name:metas[0]?.name||'',since:metas.map(x=>x.since).filter(Boolean).sort()[0]||''}));drawSync();
    }).subscribe(st=>{
      if(st==='SUBSCRIBED'){if(wasUp)Object.keys(loading).forEach(c=>load(c,true).catch(()=>{}));wasUp=true;chUp=true;netDown=false;setNet('');touch();trackMe();}
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){chUp=false;netDown=true;setNet('실시간 연결이 끊겼어요. 다시 연결하는 동안 1분마다 새로 받아 와요.');drawSync();}
    });
    setInterval(()=>{if(netDown)Object.keys(loading).forEach(c=>load(c,true).catch(()=>{}));},60000);
  }

  /* ---------- 사용자·다운로드 ---------- */
  let me=null, isAdmin=false;
  const memberOf=uid=>{for(const [id,d] of cache.members||[])if(d.userId===uid)return {id,...d};return null;};
  const user={isOwner:()=>isAdmin,canEdit:()=>isAdmin,
    can:async n=>n==='data.write'?true:n==='admin'?isAdmin:null,
    id:async()=>me.id,me:async()=>({id:me.id,name:memberOf(me.id)?.name||''}),
    profiles:async ids=>Object.fromEntries(ids.map(i=>[i,{id:i,name:memberOf(i)?.name||''}])),search:async()=>[]};
  const downloads={save:async({filename,data})=>{
    const blob=data instanceof Blob?data:new Blob([data],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);}};

  let readyRes;const ready=new Promise(r=>readyRes=r);
  const caps={};
  window.claude={use:async n=>{await ready;return caps[n]??null;}};
  window.wbAuth={get email(){return me?.email||'';},get isAdmin(){return isAdmin;},get uid(){return me?.id||'';},signOut:()=>sb.auth.signOut().then(()=>location.reload()),
    // 관리자 목록·지정 (서버 함수 wb_admin_ids, wb_set_admin). 오류 문구는 서버가 한국어로 돌려줌
    listAdmins:async()=>{const {data,error}=await sb.rpc('wb_admin_ids');if(error)throw toErr(error);return data||[];},
    setAdmin:async(uid,on)=>{const {error}=await sb.rpc('wb_set_admin',{p_user:uid,p_on:on});if(error)throw Object.assign(new Error(error.message),{code:'admin'});if(uid===me.id)isAdmin=on;}};

  /* ---------- 로그인 화면 (회사 메일 + 비밀번호) ---------- */
  // 회원가입 확인·비밀번호 찾기는 링크 대신 메일로 받은 6자리 코드로 해요. 회사 메일 보안 검사가 링크를 미리 열어 무효가 되는 경우가 있어서
  // 가입 뒤 처음 들어오면 파트·소속 프로젝트를 고르는 마무리 화면으로 이어짐(로그인 전에는 파트·프로젝트 목록을 읽을 수 없어서)
  const gate=document.createElement('div');gate.id='authGate';document.body.appendChild(gate);
  const card=html=>{gate.innerHTML=`<div class="gateCard"><h1>업무 관리 대시보드</h1>${html}</div>`;gate.hidden=false;};
  const $g=s=>gate.querySelector(s);
  const PW_MIN=8;
  const authErr=e=>{const m=String(e?.message||'');
    if(e?.status===429||/rate|security purposes/i.test(m))return '잠시 후 다시 시도해 주세요. 메일은 1분에 한 번 보낼 수 있어요.';
    if(isNetErr(e))return PAUSED_HINT;
    if(/invalid login credentials/i.test(m))return "메일 또는 비밀번호가 맞지 않아요. 예전에 코드로 들어오던 분은 '비밀번호 찾기'로 비밀번호를 먼저 만들어 주세요.";
    if(/same password|different from the old/i.test(m))return '지금 쓰는 비밀번호와 다른 비밀번호를 넣어 주세요.';
    if(/password/i.test(m)&&/weak|at least|should/i.test(m))return `비밀번호가 너무 쉬워요. ${PW_MIN}자 이상으로 영문·숫자를 섞어 주세요.`;
    if(/signups? not allowed|signup.*disabled/i.test(m))return '지금은 회원가입을 받지 않아요. 관리자에게 문의해 주세요.';
    return m||'잠시 후 다시 시도해 주세요.';};
  const savedEmail=()=>{try{return localStorage.getItem('wb-email')||'';}catch(e){return '';}};
  const keepEmail=e=>{try{localStorage.setItem('wb-email',e);}catch(x){}};
  const emailOk=email=>{if(isStaffEmail(email))return true;$g('#gErr').textContent=`${STAFF_DOMAIN_TEXT} 메일만 쓸 수 있어요.`;return false;};
  const tabs=t=>`<div class="gateTabs" role="tablist" aria-label="로그인 또는 회원가입"><button type="button" role="tab" class="gateTab" data-gt="login" aria-selected="${t==='login'}">로그인</button><button type="button" role="tab" class="gateTab" data-gt="signup" aria-selected="${t==='signup'}">회원가입</button></div>`;
  const emailField=v=>`<label for="gEmail">회사 메일</label><input id="gEmail" type="email" autocomplete="username" placeholder="name@${escH(STAFF_DOMAINS[0])}" value="${escH(v)}">`;
  const pwField=(id,lab,ac)=>`<label for="${id}">${lab}</label><div class="gatePw"><input id="${id}" type="password" autocomplete="${ac}"><button type="button" class="btn ghost sm" data-pw="${id}" aria-label="비밀번호 보기" aria-pressed="false">보기</button></div>`;
  gate.addEventListener('click',e=>{
    const t=e.target.closest('[data-gt]');if(t){const em=$g('#gEmail')?.value.trim()||'';t.dataset.gt==='login'?loginStep('',em):signupStep(em);return;}
    const b=e.target.closest('[data-pw]');if(b){const i=$g('#'+b.dataset.pw),show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'숨기기':'보기';b.setAttribute('aria-pressed',String(show));}
  });
  // 비밀번호 두 칸 확인(가입·새 비밀번호)
  const pwPair=()=>{const p=$g('#gPw').value;if(p.length<PW_MIN)return `비밀번호는 ${PW_MIN}자 이상으로 만들어 주세요.`;if(p!==$g('#gPw2').value)return '비밀번호 확인이 달라요.';return '';};

  function loginStep(msg,prefill){
    card(`${tabs('login')}<form id="gLoginF" class="gateForm" novalidate>${emailField(prefill??savedEmail())}${pwField('gPw','비밀번호','current-password')}
      <button class="btn primary" type="submit" id="gGo">로그인</button><p class="err" id="gErr" role="alert">${escH(msg||'')}</p></form>
      <div class="gateLinks"><button class="btn ghost" type="button" id="gForgot">비밀번호 찾기 · 처음 만들기</button></div>`);
    ($g('#gEmail').value?$g('#gPw'):$g('#gEmail')).focus();
    $g('#gForgot').onclick=()=>resetStep($g('#gEmail').value.trim());
    $g('#gLoginF').addEventListener('submit',async e=>{e.preventDefault();$g('#gErr').textContent='';
      const email=$g('#gEmail').value.trim().toLowerCase(),password=$g('#gPw').value;
      if(!emailOk(email))return;if(!password){$g('#gErr').textContent='비밀번호를 입력해 주세요.';return;}
      $g('#gGo').disabled=true;
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error){
        // 가입 확인을 안 끝낸 메일: 코드를 다시 보내고 코드 화면으로
        if(/not confirmed/i.test(error.message||'')){const r=await sb.auth.resend({type:'signup',email});keepEmail(email);codeStep(email,'signup',r.error?authErr(r.error):'가입 확인이 아직 안 끝났어요. 메일로 받은 코드를 넣어 주세요.');return;}
        $g('#gGo').disabled=false;$g('#gErr').textContent=authErr(error);return;}
      keepEmail(email);enter(data.session);});
  }

  function signupStep(prefill){
    card(`${tabs('signup')}<p>회사 메일(${escH(STAFF_DOMAIN_TEXT)})로 가입해요. 가입하면 메일로 확인 코드를 보내 드려요.</p>
      <form id="gSignF" class="gateForm" novalidate><label for="gName">이름</label><input id="gName" maxlength="20" autocomplete="name" placeholder="예: 홍길동">
      ${emailField(prefill||'')}${pwField('gPw',`비밀번호 <span class="legend">${PW_MIN}자 이상</span>`,'new-password')}${pwField('gPw2','비밀번호 확인','new-password')}
      <button class="btn primary" type="submit" id="gGo">회원가입</button><p class="err" id="gErr" role="alert"></p></form>`);
    $g('#gName').focus();
    $g('#gSignF').addEventListener('submit',async e=>{e.preventDefault();$g('#gErr').textContent='';
      const name=$g('#gName').value.trim(),email=$g('#gEmail').value.trim().toLowerCase();
      if(!name){$g('#gErr').textContent='이름을 입력해 주세요.';return;}
      if(!emailOk(email))return;const bad=pwPair();if(bad){$g('#gErr').textContent=bad;return;}
      $g('#gGo').disabled=true;
      const {data,error}=await sb.auth.signUp({email,password:$g('#gPw').value,options:{data:{name}}});
      if(error){$g('#gGo').disabled=false;$g('#gErr').textContent=authErr(error);return;}
      keepEmail(email);
      // 이미 가입된 메일이면 Supabase가 identities를 비워서 돌려줌
      if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length){loginStep("이미 가입된 메일이에요. 로그인하거나, 비밀번호를 모르면 '비밀번호 찾기'를 눌러 주세요.",email);return;}
      if(data.session){enter(data.session);return;} // 메일 확인을 끈 프로젝트
      codeStep(email,'signup');});
  }

  // 메일로 받은 코드 확인: signup = 가입 확인, recovery = 비밀번호 다시 만들기
  function codeStep(email,type,msg){
    const rec=type==='recovery';
    card(`<p><b>${escH(email)}</b>로 ${rec?'비밀번호 확인 코드':'가입 확인 코드'}를 보냈어요. 메일에 있는 숫자를 넣어 주세요.</p>
      <form id="gCodeF" class="gateForm" novalidate><label for="gCode">확인 코드</label><input id="gCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="숫자 6자리">
      <button class="btn primary" type="submit" id="gGo">${rec?'다음':'확인하고 시작'}</button><p class="err" id="gErr" role="alert">${escH(msg||'')}</p></form>
      <div class="gateLinks"><button class="btn ghost" type="button" id="gResend">코드 다시 받기</button><button class="btn ghost" type="button" id="gBack">로그인으로</button></div>`);
    $g('#gCode').focus();
    $g('#gBack').onclick=()=>loginStep('',email);
    $g('#gResend').onclick=async()=>{const {error}=rec?await sb.auth.resetPasswordForEmail(email):await sb.auth.resend({type:'signup',email});$g('#gErr').textContent=error?authErr(error):'코드를 다시 보냈어요.';};
    $g('#gCodeF').addEventListener('submit',async e=>{e.preventDefault();
      const token=$g('#gCode').value.replace(/\s/g,'');if(!token){$g('#gErr').textContent='코드를 입력해 주세요.';return;}
      $g('#gGo').disabled=true;
      const {data,error}=await sb.auth.verifyOtp({email,token,type});
      if(error||!data.session){$g('#gGo').disabled=false;$g('#gErr').textContent='코드가 맞지 않거나 시간이 지났어요. 코드를 다시 받아 주세요.';return;}
      rec?newPwStep(data.session):enter(data.session);});
  }

  function resetStep(prefill){
    card(`<p><b>비밀번호 찾기 · 처음 만들기</b><br>회사 메일로 확인 코드를 보내 드려요. 코드를 넣으면 새 비밀번호를 만들 수 있어요. 예전에 코드로만 들어오던 분도 여기서 비밀번호를 만들어요.</p>
      <form id="gResetF" class="gateForm" novalidate>${emailField(prefill||savedEmail())}
      <button class="btn primary" type="submit" id="gGo">확인 코드 받기</button><p class="err" id="gErr" role="alert"></p></form>
      <div class="gateLinks"><button class="btn ghost" type="button" id="gBack">로그인으로</button></div>`);
    $g('#gEmail').focus();$g('#gBack').onclick=()=>loginStep('',$g('#gEmail').value.trim());
    $g('#gResetF').addEventListener('submit',async e=>{e.preventDefault();$g('#gErr').textContent='';
      const email=$g('#gEmail').value.trim().toLowerCase();if(!emailOk(email))return;
      $g('#gGo').disabled=true;const {error}=await sb.auth.resetPasswordForEmail(email);
      if(error){$g('#gGo').disabled=false;$g('#gErr').textContent=authErr(error);return;}
      keepEmail(email);codeStep(email,'recovery');});
  }

  function newPwStep(session){
    card(`<p><b>새 비밀번호 만들기</b> · ${escH(session.user.email||'')}</p><form id="gPwF" class="gateForm" novalidate>
      ${pwField('gPw',`새 비밀번호 <span class="legend">${PW_MIN}자 이상</span>`,'new-password')}${pwField('gPw2','새 비밀번호 확인','new-password')}
      <button class="btn primary" type="submit" id="gGo">저장하고 시작</button><p class="err" id="gErr" role="alert"></p></form>`);
    $g('#gPw').focus();
    $g('#gPwF').addEventListener('submit',async e=>{e.preventDefault();const bad=pwPair();if(bad){$g('#gErr').textContent=bad;return;}
      $g('#gGo').disabled=true;const {error}=await sb.auth.updateUser({password:$g('#gPw').value});
      if(error){$g('#gGo').disabled=false;$g('#gErr').textContent=authErr(error);return;}
      enter(session);});
  }

  /* ---------- 첫 방문: 본인이 프로필(구성원)을 등록 ---------- */
  const DEF_PARTS=[['plan','기획'],['design','디자인'],['pub','퍼블'],['dev','개발'],['qa','QA']];
  const NOTIFY_ON={task:true,comment:true,leave:true,digest:true};
  function profileStep(){
    const ms=[...cache.members||[]].map(([id,d])=>({id,...d}));
    const free=ms.filter(m=>!m.userId&&(!m.email||m.email===me.email)).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));
    const parts=cache.parts?.size?[...cache.parts].map(([id,d])=>[id,d.name||id,d.order??0]).sort((a,b)=>a[2]-b[2]):DEF_PARTS;
    const projs=[...cache.projects||[]].map(([id,d])=>[id,d.name||'',d.order??0]).sort((a,b)=>a[2]-b[2]);
    const opt=list=>list.map(([v,l])=>`<option value="${escH(v)}">${escH(l)}</option>`).join('');
    const signName=me.name||'';
    card(`<p><b>회원가입 마무리</b> · 파트와 소속 프로젝트를 골라 주세요. 담당 업무·휴가·알림 메일이 이 프로필로 연결돼요.</p>
      ${free.length?`<form id="gClaimF" class="gateForm" novalidate><label for="gClaim">이미 등록된 이름이 있으면 고르세요</label><select id="gClaim">${free.map(m=>`<option value="${escH(m.id)}">${escH(m.name)}</option>`).join('')}</select>
        <button class="btn" type="submit">이 이름으로 시작</button></form><div class="gateOr">또는 새로 등록</div>`:''}
      <form id="gNewF" class="gateForm" novalidate>
        <label for="gName">이름</label><input id="gName" maxlength="20" placeholder="예: 홍길동" value="${escH(signName)}">
        <label for="gPart">파트</label><select id="gPart">${opt(parts)}</select>
        <label for="gProj">소속 프로젝트</label><select id="gProj"><option value="">아직 없음</option>${opt(projs)}</select>
        <button class="btn primary" type="submit" id="gNew">등록하고 시작</button></form>
      <p class="err" id="gErr"></p><div class="gateLinks"><span class="legend">${escH(me.email)}</span><button class="btn ghost" type="button" id="gOut">로그아웃</button></div>`);
    $g('#gOut').onclick=()=>window.wbAuth.signOut();
    $g('#gClaimF')?.addEventListener('submit',async e=>{e.preventDefault();const id=$g('#gClaim').value,m=ms.find(x=>x.id===id);
      try{await write('members',id,'update',{userId:me.id,...(m?.notify?{}:{notify:NOTIFY_ON})});finish();}
      catch(err){$g('#gErr').textContent='고르지 못했어요. 다른 사람이 먼저 이 이름을 연결했을 수 있어요. 새로 고침 후 다시 시도해 주세요.';}});
    $g('#gNewF').addEventListener('submit',async e=>{e.preventDefault();
      const name=$g('#gName').value.trim();if(!name){$g('#gErr').textContent='이름을 입력해 주세요.';return;}
      if(ms.some(m=>m.name===name)){$g('#gErr').textContent=free.some(m=>m.name===name)?'같은 이름이 이미 있어요. 위 목록에서 골라 주세요.':'같은 이름을 다른 계정이 쓰고 있어요. 이름 뒤에 구분을 붙여 주세요. 예: 홍길동B';return;}
      $g('#gNew').disabled=true;
      try{await write('members',newId(),'add',{name,part:$g('#gPart').value,projectId:$g('#gProj').value,quotas:{},userId:me.id,notify:NOTIFY_ON});finish();}
      catch(err){$g('#gNew').disabled=false;$g('#gErr').textContent='등록하지 못했어요. 잠시 후 다시 시도해 주세요.';}});
  }

  function finish(){gate.hidden=true;gate.innerHTML='';Object.assign(caps,{db,user,downloads});readyRes();trackMe();drawSync();}

  /* ---------- 화면 위 동기화 상태 · 접속자 ---------- */
  const hm=d=>d.toTimeString().slice(0,8);
  function drawSync(){
    let box=document.getElementById('syncBox');
    if(!box){
      const row=document.querySelector('.modeRow');if(!row)return;
      box=document.createElement('div');box.id='syncBox';box.className='syncBox';
      box.innerHTML=`<span class="syncDot"></span><span class="syncText" id="syncText"></span>
        <button class="btn ghost" type="button" id="syncNow" title="서버에서 전부 다시 받아 와요">지금 동기화</button>
        <div class="onlineWrap"><button class="btn ghost" type="button" id="onlineBtn" aria-expanded="false" aria-controls="onlineList"></button><div class="onlineList" id="onlineList" hidden></div></div>`;
      row.insertBefore(box,document.getElementById('btnProfile'));
      box.querySelector('#syncNow').onclick=()=>Promise.all(Object.keys(loading).map(c=>load(c,true))).catch(()=>{});
      const btn=box.querySelector('#onlineBtn'),list=box.querySelector('#onlineList');
      btn.onclick=()=>{list.hidden=!list.hidden;btn.setAttribute('aria-expanded',String(!list.hidden));};
      document.addEventListener('click',e=>{if(!box.querySelector('.onlineWrap').contains(e.target)){list.hidden=true;btn.setAttribute('aria-expanded','false');}});
    }
    const st=sync.pending?'saving':netDown?'offline':'ok', t=sync.last?hm(sync.last):'—';
    box.dataset.state=st;
    box.querySelector('#syncText').innerHTML=st==='saving'?'저장 중…':st==='offline'?`연결 끊김<span class="sLong"> · 마지막 동기화</span> ${t}`:`<span class="sLong">저장됨 · 마지막 동기화 </span>${t}`;
    const people=(sync.online.length?sync.online:me?[{uid:me.id,name:memberOf(me.id)?.name||'',since:openedAt}]:[])
      .sort((a,b)=>(b.uid===me?.id)-(a.uid===me?.id)||(a.name||'').localeCompare(b.name||'','ko'));
    box.querySelector('#onlineBtn').textContent=`접속 ${people.length}명`;
    box.querySelector('#onlineList').innerHTML=`<b>지금 접속 중</b>`+people.map(p=>`<div class="onlineItem">${typeof avatarHtml==='function'?avatarHtml(memberOf(p.uid)||{name:p.name},22):'<span class="syncDot"></span>'}<span>${escH(p.name||'이름 등록 전')}${p.uid===me?.id?' (나)':''}</span><span class="legend">${p.since?escH(hm(new Date(p.since)).slice(0,5))+'부터':''}</span></div>`).join('');
  }
  async function enter(session){
    me={id:session.user.id,email:(session.user.email||'').toLowerCase(),name:(session.user.user_metadata?.name||'').trim()};
    if(!isStaffEmail(me.email)){card(`<p>${escH(me.email)}은(는) 회사 메일이 아니라서 들어갈 수 없어요.</p><button class="btn" type="button" id="gOut">로그아웃</button>`);$g('#gOut').onclick=()=>window.wbAuth.signOut();return;}
    try{
      const {data}=await sb.rpc('wb_is_admin');isAdmin=data===true;
      await Promise.all(['members','projects','parts'].map(c=>load(c)));
    }catch(e){card(`<p>${isNetErr(e)?escH(PAUSED_HINT):'데이터를 불러오지 못했어요. 잠시 후 새로 고침해 주세요.'}</p><p class="err">${escH(e.message)}</p>`);return;}
    startRealtime();
    if(memberOf(me.id)){finish();return;}
    const mine=[...cache.members||[]].find(([,d])=>!d.userId&&d.email&&d.email===me.email);
    if(mine){try{await write('members',mine[0],'update',{userId:me.id,...(mine[1].notify?{}:{notify:NOTIFY_ON})});finish();return;}catch(e){}}
    profileStep();
  }

  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&me)location.reload();});
  sb.auth.getSession().then(({data})=>data.session?enter(data.session):loginStep());
})();
</script>

{const h=location.hash.slice(1);if(['tasks','staff','leave','report','hours','history','annual','menus','perms','accounts','eventops','manuals','regress'].includes(h)){state.mode=h==='perms'?'menus':h;modeFromUser=true;try{sessionStorage.setItem('wb-picked','1');}catch(e){}}}

.01M4 12h.01M4 18h.01\"/></svg>", "perms": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V7a4 4 0 0 1 8 0v4M12 15v2\"/></svg>", "grp:admin": "<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z\"/><path d=\"M9 12l2 2 4-4\"/></svg>"};

const defName=k=>k.startsWith('grp:')?MENU_GRPS.find(g=>'grp:'+g[0]===k)?.[1]:MENU_ITEMS.find(x=>x[0]===k)?.[2];

function menuOrder(g,cfg=menuCfg){const def=MENU_ITEMS.filter(x=>x[1]===g).map(x=>x[0]),o=(cfg.order?.[g]||[]).filter(k=>def.includes(k));return [...new Set([...o,...def])];}

function menuOpen(k){if(k==='hours')k='staff';const it=MENU_ITEMS.find(x=>x[0]===k);if(!it)return false;if(isAdminUser())return true;if(it[1]==='admin')return false;const a=accOf(menuCfg.access?.[k]);return !a.length||a.includes(myRole());}

      <div class="gnbBody" id="grp-${g}">${items.map(k=>`<button type="button" role="tab" class="navItem" title="${esc(menuName(k))}" data-mode="${k}">${NAV_ICO[k]||NAV_ICO.link}<span class="lbl">${esc(menuName(k))}</span></button>`).join('')}</div></section>`;}).join('');
  sideDraw();
}
const todayStr=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const partOf=k=>PARTS.find(p=>p.k===k)||{k,label:'미지정',c:'var(--muted)'};
const statusOf=k=>STATUSES.find(s=>s.k===k)||STATUSES[0];
const projOf=id=>projects.find(p=>p.id===id);
// 수정 저장은 연 시점의 값(base)과 달라진 필드만 update로 보냄. 다른 사람이 동시에 고친 다른 필드를 지우지 않게
const sameVal=(a,b)=>String(a??'')===String(b??'');
const changedKeys=(data,base)=>Object.keys(data).filter(k=>k!=='updatedAt'&&k!=='createdAt'&&!sameVal(data[k],base[k]));
function patchOf(data,base){const ks=changedKeys(data,base);return ks.length?{...Object.fromEntries(ks.map(k=>[k,data[k]])),updatedAt:data.updatedAt||new Date().toISOString()}:null;}
const isLate=t=>t.status!=='done'&&t.status!=='hold'&&t.dueDate&&t.dueDate<todayStr();
const fmtDate=d=>d?d.slice(2).replace(/-/g,'.'):'—';
const hrs=v=>(v===''||v==null||isNaN(v))?'—':(+v).toFixed(+v%1?1:0);
function dday(d){if(!d)return'';const ms=new Date(d+'T00:00:00')-new Date(todayStr()+'T00:00:00');const n=Math.round(ms/864e5);return n===0?'D-day':n>0?'D-'+n:'D+'+(-n);}

/* RMS: 업무별 링크가 있으면 그 주소로, 없으면 공용 주소 규칙({no} 자리에 번호)으로 연결 */
function rmsHref(t){
  let u=(t.rmsUrl||'').trim();
  if(!u&&t.rmsNo&&site?.rmsTemplate)u=site.rmsTemplate.replace(/\{no\}/g,encodeURIComponent(String(t.rmsNo).trim()));
  if(!u)return '';
  return /^https?:\/\//i.test(u)?u:'https://'+u;
}
function rmsBadge(t){
  if(!t.rmsNo&&!t.rmsUrl)return '';
  const h=rmsHref(t), lab=`RMS ${esc(t.rmsNo||'링크')}`;
  return h?`<a class="rms" href="${esc(h)}" target="_blank" rel="noopener" title="RMS 바로가기">${lab} ↗</a>`:`<span class="rms" title="RMS 주소 규칙을 설정하면 바로가기가 생깁니다">${lab}</span>`;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200);}

/* ---------- period (주간·월간 보기) ---------- */
// 기준: active=기간 중 요청~완료가 겹치는 업무, request=요청일, due=완료 일정, done=실제 완료일
/* ---------- 기간 선택 상자: 주(월요일 시작, 그 주 목요일이 속한 달의 n번째 주) · 월 ---------- */
const dowOf=d=>new Date(d+'T00:00:00').getDay();
function weekLabel(mon){
  const th=addDays(mon,3), m1=th.slice(0,8)+'01', firstThu=addDays(m1,(4-dowOf(m1)+7)%7);
  const n=Math.round((new Date(th+'T00:00:00')-new Date(firstThu+'T00:00:00'))/(7*864e5))+1;
  return `${th.slice(2,4)}년 ${+th.slice(5,7)}월 ${n}주`;
}
const mdot=d=>`${+d.slice(5,7)}/${+d.slice(8,10)}`;
// 그 기간에 등록된 내용이 있는지: 요청·마감·완료일, 업무 시간 기록, 저장된 보고서, 연차·프로젝트 일정(진행 중이라는 이유만으로는 넣지 않음)
function hasContent(a,b){const inR=d=>!!d&&d>=a&&d<=b;
  return tasks.some(t=>inR(t.requestDate)||inR(t.dueDate)||inR(t.doneDate))||wlogs.some(l=>inR(l.date))||reports.some(r=>inR(r.week))
    ||leaves.some(l=>l.date<=b&&(l.endDate||l.date)>=a)||events.some(e=>e.kind==='project'&&e.start<=b&&(e.end||e.start)>=a);}
// 기간 종류: week=월요일 시작 주(목요일의 연도), rweek=주간 보고 목~수 주(수요일의 연도), month=월
const PKIND={
  week:{start:s=>mondayOf(s),next:v=>addDays(v,7),end:v=>addDays(v,6),year:v=>addDays(v,3).slice(0,4),label:v=>weekLabel(v).slice(4),title:v=>`${mdot(v)}~${mdot(addDays(v,6))}`},
  rweek:{start:s=>thursdayOf(s),next:v=>addDays(v,7),end:v=>addDays(v,6),year:v=>addDays(v,6).slice(0,4),label:v=>`${rWeekLabel(v).slice(4)} (${rRange(v)})`},
  month:{start:s=>s.slice(0,7)+'-01',next:v=>ymd(new Date(+v.slice(0,4),+v.slice(5,7),1)),end:v=>ymd(new Date(+v.slice(0,4),+v.slice(5,7),0)),year:v=>v.slice(0,4),label:v=>`${+v.slice(5,7)}월`}
};
// 그 연도의 기간 중 등록된 내용이 있는 것(cur는 항상 포함)
function periodsOf(kind,y,cur){const K=PKIND[kind],out=[];for(let v=K.start(`${y}-01-01`);v<=`${y}-12-31`;v=K.next(v))if(K.year(v)===String(y)&&(v===cur||hasContent(v,K.end(v))))out.push(v);return out;}
// 헤더 기간 선택: 연도 select(id+'Y') + 주/월 select(id). 연도·기간 모두 내용이 있는 것만, 올해와 현재 값은 항상
function periodSelects(kind,cur,id){
  const K=PKIND[kind],T=todayStr(),cy=+T.slice(0,4);cur=cur||K.start(T);const sy=+K.year(cur);
  const ds=[...tasks.flatMap(t=>[t.requestDate,t.dueDate,t.doneDate]),...wlogs.map(l=>l.date),...reports.map(r=>r.week),...leaves.map(l=>l.date),...events.map(e=>e.start)].filter(d=>/^\d{4}-/.test(d||'')).map(d=>+d.slice(0,4)).filter(y=>y>=cy-10&&y<=cy+2);
  const years=[];for(let y=Math.max(cy,sy,...ds);y>=Math.min(cy,sy,...ds);y--)if(y===cy||y===sy||periodsOf(kind,y).length)years.push(y);
  let list=periodsOf(kind,sy,cur);
  return `<select class="sel" id="${id}Y" aria-label="연도">${years.map(y=>`<option value="${y}" ${y===sy?'selected':''}>${y}년</option>`).join('')}</select><select class="sel" id="${id}" aria-label="${kind==='month'?'월':'주'}">${list.map(v=>`<option value="${v}" ${v===cur?'selected':''}${K.title?` title="${K.title(v)}"`:''}>${esc(K.label(v))}</option>`).join('')}</select>`;
}
// 연도를 바꾸면 그 연도에서 오늘 이전의 가장 최근 기간(내용 있는 것) → 없으면 그 연도의 마지막 기간 → 그것도 없으면 이번 기간
function latestIn(kind,y){const K=PKIND[kind],T=K.start(todayStr()),l=periodsOf(kind,y);return l.filter(v=>v<=T).pop()||l.pop()||T;}
// 내보내기 메뉴: 화면마다 같은 모양, 헤더 도구 줄 맨 오른쪽. items=[[id,label,title]] 없으면 메뉴도 숨김
const exportMenu=items=>items.length?`<details class="menu"><summary class="btn">내보내기 <svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div class="menuList">${items.map(([id,l,t])=>`<button class="btn" type="button" id="${id}"${t?` title="${t}"`:''}>${l}</button>`).join('')}</div></details>`:'';
function periodRange(){
  if(state.period==='all')return null;
  const t=todayStr();
  if(!state.pAnchor)state.pAnchor=state.period==='week'?mondayOf(t):t.slice(0,7)+'-01';
  if(state.period==='week'){state.pAnchor=mondayOf(state.pAnchor);return [state.pAnchor,addDays(state.pAnchor,6)];}
  const a=state.pAnchor.slice(0,7)+'-01';state.pAnchor=a;const d=new Date(a+'T00:00:00');return [a,ymd(new Date(d.getFullYear(),d.getMonth()+1,0))];
}
function inPeriod(t,r){
  if(!r)return true;const [a,b]=r, inR=d=>!!d&&d>=a&&d<=b;
  if(state.pBasis==='request')return inR(t.requestDate);
  if(state.pBasis==='due')return inR(t.dueDate);
  if(state.pBasis==='done')return t.status==='done'&&inR(t.doneDate);
  const start=t.requestDate||(t.createdAt||'').slice(0,10)||t.dueDate||'';
  const end=t.status==='done'?(t.doneDate||t.dueDate||start):'9999-12-31';
  return (!start||start<=b)&&end>=a;
}
function periodTasks(){const r=periodRange(),w=workItems();return r?w.filter(t=>inPeriod(t,r)):w;}
function periodLabel(r){
  if(!r)return '전체 기간';
  if(state.period==='month')return `${r[0].slice(0,4)}년 ${+r[0].slice(5,7)}월`;
  return `${r[0].slice(2).replace(/-/g,'.')} ~ ${r[1].slice(5).replace('-','.')}`;
}

/* ---------- filtering ---------- */
function scoped(){return periodTasks().filter(t=>state.project==='all'||t.projectId===state.project);}
function passF(t){
  const q=state.q.trim().toLowerCase();
  return (state.part==='all'||t.part===state.part)&&
    (state.status==='all'||(state.status==='open'?t.status!=='done':t.status===state.status))&&
    (state.assignee==='all'||(state.assignee==='me'?isMine(t):asNames(t).includes(state.assignee)))&&
    (!q||[t.title,t.requester,...asNames(t),t.jiraKey,t.rmsNo,t.note,projOf(t.projectId)?.name].some(v=>(v||'').toLowerCase().includes(q)));
}
function filtered(){return scoped().filter(passF);}
function sorted(list){
  const {key,dir}=state.sort;
  const val=t=>{
    if(key==='project')return projOf(t.projectId)?.name||'';
    if(key==='part')return PARTS.findIndex(p=>p.k===t.part);
    if(key==='status')return STATUSES.findIndex(s=>s.k===t.status);
    if(key==='priority')return t.priority??2;
    if(key==='estHours'||key==='actHours')return t[key]===''||t[key]==null?-1:+t[key];
    return t[key]||'￿';
  };
  // 완료 일정 순일 때는 완료·보류를 뒤로 보내서 지연·임박 업무가 맨 위에 오게 함
  const g=t=>key==='dueDate'&&(t.status==='done'||t.status==='hold')?1:0;
  return [...list].sort((a,b)=>{const x=val(a),y=val(b);return g(a)-g(b)||(x>y?1:x<y?-1:0)*dir;});
}

function liftTools(){

  document.querySelectorAll('button[data-np]').forEach(b=>{if(canWrite||!b.disabled){b.removeAttribute('title');delete b.dataset.np;}});

/* ---------- 게시물(최상위 업무) · 요청(parentId로 게시물에 붙은 하위 업무) ---------- */
const isPost=t=>!t.parentId||!tasks.some(x=>x.id===t.parentId);
function rootOf(t){for(let i=0;i<20&&t.parentId;i++){const p=tasks.find(x=>x.id===t.parentId);if(!p)break;t=p;}return t;}
const kidsOf=p=>tasks.filter(x=>x.id!==p.id&&!isPost(x)&&rootOf(x).id===p.id);
// 집계 단위: 요청은 모두 세고, 게시물은 요청이 없거나 게시물 자체를 끝낸 경우(넘기기 등)만 셈 → 이중 집계 없음
function workItems(list=tasks){const ids=new Set(tasks.map(x=>x.id)),par=new Set(tasks.map(x=>x.parentId).filter(Boolean));
  return list.filter(t=>(t.parentId&&ids.has(t.parentId))||t.status==='done'||!par.has(t.id));}
// 요청이 있는 게시물의 표시 상태: 게시물을 직접 끝냈으면 완료, 아니면 요청들로 판단
function postStatus(p,k){if(!k.length||p.status==='done')return p.status;
  if(k.every(x=>x.status==='done'))return 'done';if(k.some(x=>x.status==='doing'||x.status==='review'))return 'doing';
  if(k.every(x=>x.status==='done'||x.status==='hold'))return 'hold';return 'wait';}
// 다시 그려도 입력 중인 값·포커스 유지
function keepVals(box,html){
  const v={};box.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>v[e.id]=e.type==='checkbox'?e.checked:e.value);
  const f=box.contains(document.activeElement)?document.activeElement.id:'';box.innerHTML=html;
  for(const [k,x] of Object.entries(v)){const e=box.querySelector('#'+k);if(!e)continue;if(e.type==='checkbox')e.checked=x;else if(e.tagName!=='SELECT'||[...e.options].some(o=>o.value===x))e.value=x;}
  if(f)box.querySelector('#'+f)?.focus();
}

// 목록: 기간·프로젝트·필터에 걸리는 업무(게시물 또는 요청)가 있는 게시물을 연도별로
function postList(){
  const r=periodRange(), byRoot=new Map();
  for(const t of tasks){if(state.project!=='all'&&t.projectId!==state.project)continue;if(r&&!inPeriod(t,r))continue;if(!passF(t))continue;const p=rootOf(t);byRoot.set(p.id,p);}
  const key=p=>(p.requestDate||(p.createdAt||'').slice(0,10))+'|'+(p.createdAt||'');
  const L=[...byRoot.values()].filter(p=>!state.late||postLate(p)).sort((a,b)=>key(b).localeCompare(key(a)));
  if(state.lsort!=='due')return L;
  // 마감 임박순: 남은 마감(요청이 있으면 끝나지 않은 요청 중 가장 이른 마감)이 이른 순, 마감 없음·끝난 건은 뒤로
  const dk=p=>postDue(p,kidsOf(p))||'9999';
  return L.sort((a,b)=>dk(a).localeCompare(dk(b)));
}
// 아직 안 끝난 마감일(요청이 있으면 열린 요청 중 가장 이른 것). 완료·보류는 ''
const postDue=(p,k)=>(k.length?k:[p]).filter(x=>x.status!=='done'&&x.status!=='hold'&&x.dueDate).map(x=>x.dueDate).sort()[0]||'';
const soonTag=d=>{if(!d||d<todayStr())return '';const n=Math.round((new Date(d+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);return n<=3?`<b class="soonTag" title="마감이 ${n?n+'일':'오늘'} 남았어요">${dday(d)}</b>`:'';};
const stSel=t=>`<select class="sel rqSt stSel s-${esc(t.status||'wait')}" data-rq="${esc(t.id)}" aria-label="진행 현황 바꾸기">${optH(STATUSES.map(x=>[x.k,x.label]),t.status||'wait')}</select>`;
// 2026/10/21(수) 형식. 시작과 같은 해면 연도를 뺌
const fmtSlash=(d,from)=>{if(!d)return '—';const w='일월화수목금토'[new Date(d+'T00:00:00').getDay()],md=`${+d.slice(5,7)}/${+d.slice(8,10)}(${w})`;return from&&from.slice(0,4)===d.slice(0,4)?md:`${d.slice(0,4)}/${md}`;};
// 게시물이 지연인지(요청이 있으면 요청 중 하나라도 지연)
const postLate=p=>{const k=kidsOf(p);return k.length?k.some(isLate):isLate(p);};
function postRow(p){
  const pj=projOf(p.projectId), k=kidsOf(p), doing=k.filter(x=>x.status==='doing'||x.status==='review').length, st=statusOf(postStatus(p,k));

    <td>${pj?`<span class="pjTag" style="--c:${esc(pj.color)}"><span class="dot" aria-hidden="true"></span>${esc(pj.name)}</span>`:''}</td>
    <td class="tkTitle"><span class="pTitle">${p.jiraKey?`<span class="jira">${esc(p.jiraKey)}</span>`:''}${rmsBadge(p)}${esc(p.title)}</span>${k.length?`<span class="legend">요청 ${k.length}건${doing?` · 진행 ${doing}`:''}</span>`:''}</td>
    <td class="num prDate">${fmtSlash(p.requestDate)}~${fmtSlash(p.dueDate,p.requestDate)}${late?`<b class="lateTag" title="마감이 지났는데 끝나지 않았어요">지연${!k.length?' '+dday(p.dueDate):''}</b>`:soonTag(postDue(p,k))}</td>
    <td><span class="tkWho"><span class="tkPart" style="--c:${partOf(p.part).c}">${esc(partOf(p.part).label)}</span>${whoMany(p,22,'담당 미지정')}</span></td>
    <td>${p.requester?esc(p.requester):'<span class="legend">—</span>'}</td>
    <td>${own?stSel(p):`<span class="pill s-${st.k}"${k.length?' title="요청 업무들의 상태로 정해져요"':''}>${st.label}</span>`}</td></tr>`;
}

// 칸 하나 저장(그 칸만 update — 다른 사람이 다른 칸을 고쳐도 둘 다 남음)
async function tfSave(p,f,raw){
  const patch={};
  if(f==='title'){const v=raw.trim();if(!v){toast('제목을 입력해 주세요.');render();return;}patch.title=v;}
  else if(f==='assignees')Object.assign(patch,asData(raw));
  else if(f==='assignee'){const m=raw.startsWith('name:')?null:memOf(raw);patch.assignee=m?m.name:raw.slice(5);patch.assigneeId=m?m.id:'';}
  else if(f==='priority')patch.priority=+raw;
  else if(f==='estHours'||f==='actHours')patch[f]=raw===''?'':Math.max(0,+raw);
  else if(f==='jiraKey')patch.jiraKey=raw.trim().toUpperCase();
  else if(f==='note')patch.note=raw.replace(/\s+$/,'');
  else if(f==='noteRich'){patch.note=raw.text;patch.noteHtml=raw.html;}
  else patch[f]=raw.trim();
  if(f==='requestDate'||f==='dueDate'){const r=f==='requestDate'?patch[f]:p.requestDate,d=f==='dueDate'?patch[f]:p.dueDate;
    if(r&&d&&d<r){toast('마감일이 요청일보다 빨라요. 날짜를 확인해 주세요.');render();return;}}
  if(f==='status'&&raw==='done'&&!p.doneDate)patch.doneDate=todayStr();
  if(Object.keys(patch).every(x=>sameVal(p[x],patch[x])))return;
  Object.assign(patch,{updatedAt:new Date().toISOString(),updatedByName:myMember()?.name||''});
  const sv=$('#tfSaved');if(sv)sv.textContent='저장 중…';
  try{await db.collection('tasks').doc(p.id).update(patch);logChange('task','update',p.id,patch.title||p.title,p,{...p,...patch});tfSavedMsg=`저장됨 ${new Date().toTimeString().slice(0,5)}`;const s2=$('#tfSaved');if(s2)s2.textContent=tfSavedMsg;}
  catch(err){if($('#tfSaved'))$('#tfSaved').textContent='';handleWriteError(err,'#tErr');render();}
}
async function tfSyncAct(p,list){const sum=list.length?tfWlSum(list):'';await db.collection('tasks').doc(p.id).update({actHours:sum,updatedAt:new Date().toISOString()});}
async function tfAddWl(p){
  const h=+$('#wlH').value,d=$('#wlDate').value,m=memOf($('#wlMem').value);
  if(!d||!m){$('#wlErr').textContent='날짜와 작업한 사람을 골라 주세요.';return;}
  if(!(h>0)||h>24){$('#wlErr').textContent='시간은 0보다 크고 24 이하로 입력해 주세요.';return;}
  $('#wlAddBtn').disabled=true;
  try{const w={taskId:p.id,memberId:m.id,member:m.name,date:d,hours:h,note:$('#wlNote').value.trim(),by:actorId||'',createdAt:new Date().toISOString()};
    await db.collection('worklogs').add(w);$('#wlH').value='';$('#wlNote').value='';
    await tfSyncAct(p,[...wlogs.filter(x=>x.taskId===p.id&&!(x.date===w.date&&x.createdAt===w.createdAt)),w]);
    logChange('task','update',p.id,p.title,null,null,`작업 시간 기록 ${md(d)} ${m.name} ${hrs(h)}h`);toast('작업 시간을 기록했어요');}
  catch(err){handleWriteError(err,'#wlErr');}finally{if($('#wlAddBtn'))$('#wlAddBtn').disabled=false;}
}
async function sendPost(p,btn){

  if(text.length>1000){$('#cpErr').textContent='1000자까지 쓸 수 있어요.';return;}

    if(isReq&&$('#cpDue').value&&$('#cpDue').value<todayStr()){$('#cpErr').textContent='마감일이 오늘보다 빨라요. 날짜를 확인해 주세요.';btn.disabled=false;return;}
    if(isReq){const now=new Date().toISOString();
      const data={projectId:p.projectId,part:$('#cpPart').value,title:text.split('\n')[0].slice(0,60),...asData(asVals('#cpAs')),parentId:p.id,requester:myMember()?.name||nameCache[actorId]||'',
        jiraKey:'',rmsNo:'',rmsUrl:'',status:'wait',priority:p.priority??2,requestDate:todayStr(),dueDate:$('#cpDue').value,doneDate:'',estHours:'',actHours:'',link:'',note:text,noteHtml:rr.html,updatedAt:now,createdAt:now};

    else await db.collection('comments').add({taskId:p.id,text,...(rr.html?{html:rr.html}:{}),by:actorId,at:new Date().toISOString()});
    $('#cpText').innerHTML='';$('#cpText').blur();render();if($('#cpReq')){$('#cpDue').value='';$('#cpAs').outerHTML=asPick('cpAs',[]);$('#cpReq').checked=false;$('#cpFields').hidden=true;}$('#cpErr').textContent='';
