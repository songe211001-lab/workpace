<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>알닷 이벤트 운영 관리대장</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    /* 알닷 디자인 시스템 토큰 (design.md 2026-08-26 기준, OKLCH) */
    --bg: oklch(0.978 0.003 247);       /* grey-50: 캔버스 */
    --panel: oklch(1 0 0);              /* white: 카드 표면 */
    --ink: oklch(0.234 0.030 254);      /* grey-900 */
    --ink-soft: oklch(0.452 0.028 253); /* grey-700 */
    --muted: oklch(0.155 0.060 261 / 0.58); /* text-tertiary (navy-900 @58%) */
    --line: oklch(0.913 0.008 247);     /* grey-200 */
    --grey-100: oklch(0.957 0.005 247);
    --grey-400: oklch(0.752 0.016 251);

    --primary: oklch(0.704 0.180 23);       /* coral-500 (fc6969) */
    --primary-dark: oklch(0.602 0.180 25.9);/* coral-600 pressed */
    --primary-soft: oklch(0.965 0.021 18.9);/* coral-50 */

    --pass: oklch(0.493 0.143 154);         /* green-500 success */
    --pass-text: oklch(0.400 0.120 154);
    --pass-soft: oklch(0.955 0.045 154);
    --minor: oklch(0.748 0.183 56);         /* orange-500 warning */
    --minor-text: oklch(0.480 0.150 56);
    --minor-soft: oklch(0.955 0.050 56);
    --na: oklch(0.652 0.020 252);           /* grey-500 neutral */
    --na-soft: oklch(0.957 0.005 247);
    --major: var(--primary);                /* 연장 = brand 약한 강조 */
    --major-soft: var(--primary-soft);
    --fatal: oklch(0.628 0.218 22);          /* red-500 danger */
    --fatal-text: oklch(0.480 0.190 22);
    --fatal-soft: oklch(0.940 0.040 22);
    --critical: var(--fatal);
    --critical-soft: var(--fatal-soft);
    --hidden-muted: var(--grey-400);        /* 비노출 상태 전용(회색, 위험색과 분리) */

    /* 이벤트 상태 -> 색상 매핑 */
    --done:var(--pass); --done-soft:var(--pass-soft);
    --progress:var(--minor); --progress-soft:var(--minor-soft);
    --waiting:var(--na); --waiting-soft:var(--na-soft);
    --extend:var(--major); --extend-soft:var(--major-soft);
    --overdue:var(--fatal); --overdue-soft:var(--fatal-soft);

    --pass-border: oklch(0.85 0.09 154);
    --minor-border: oklch(0.85 0.10 56);
    --fatal-border: oklch(0.85 0.08 22);

    --shadow-2: 0 4px 12px oklch(0.155 0.060 261 / 0.06), 0 1px 2px oklch(0.155 0.060 261 / 0.04);
    --shadow-3: 0 12px 32px oklch(0.155 0.060 261 / 0.10), 0 2px 6px oklch(0.155 0.060 261 / 0.06);
    --shadow-toast: 0 8px 24px oklch(0.155 0.060 261 / 0.16);
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --page-gutter: 100px; /* 와이드 레이아웃 좌우 바깥 여백 */
  }
  @media (max-width:1040px){ :root{ --page-gutter:16px; } } /* 좁은 화면: 디자인 시스템 모바일 바깥 여백 */
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif; padding:26px var(--page-gutter) 70px;}
  .wrap{margin:0;} /* 폭 제한 없이 화면 전체를 써요 */

  .topbar{display:flex; flex-direction:column; align-items:flex-start; gap:16px; margin-bottom:18px;} /* 제목·설명 아래에 버튼 줄 */

  .brand h1{font-weight:800; font-size:30px; letter-spacing:-0.02em; margin:2px 0 0; color:var(--ink); line-height:1.25;}
  .brand .subtitle{font-size:13.5px; color:var(--muted); margin:6px 0 0; line-height:1.6; font-weight:400;}
  .topbar-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

  button{font-family:'Pretendard',sans-serif; font-size:13px; font-weight:600; border-radius:7px; border:1px solid var(--line); transition:background .12s var(--ease), border-color .12s var(--ease);
    background:var(--panel); color:var(--ink-soft); padding:8px 14px; cursor:pointer; transition:all .12s ease;}
  button:hover{border-color:var(--primary); color:var(--primary-dark);}
  button.primary{background:var(--primary); color:#fff; border-color:var(--primary); transition:background .15s var(--ease), border-color .15s var(--ease);}

  button.primary:hover{background:var(--primary-dark); border-color:var(--primary-dark); color:#fff;}
  button.ghost{background:transparent; border-color:transparent; color:var(--muted); padding:6px 8px;}
  button.ghost:hover{color:var(--primary-dark); border-color:transparent;}
  .icon-btn{display:inline-flex; align-items:center; justify-content:center; vertical-align:middle;}
  .icon-btn.del-row-btn:hover{color:var(--fatal);}
  button.sm{padding:5px 10px; font-size:12px;}
  button:disabled{opacity:.35; cursor:not-allowed;}

  .sync-status{
    font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; font-weight:600;
    padding:0 10px; white-space:nowrap;
  }
  .sync-status .dot{width:7px;height:7px;border-radius:50%; background:var(--pass); flex-shrink:0;}
  .sync-status.warn .dot{background:var(--fatal);}
  .sync-status.warn{color:var(--primary-dark);}
  .sync-status.saving .dot{background:var(--minor); animation:save-pulse 0.9s ease-in-out infinite;}
  button.sync-status{border:1px solid transparent; background:transparent; padding:6px 10px; font-size:11.5px; font-weight:600;}
  button.sync-status:hover, button.sync-status[aria-expanded="true"]{border-color:var(--line); background:var(--panel);}
  .sync-time{font-weight:500; font-variant-numeric:tabular-nums;}
  .topbar-actions{position:relative;}
  .sync-log{position:absolute; right:0; top:calc(100% + 8px); z-index:40; width:400px; max-width:100%;}
  .sync-log .modal{width:auto; max-width:none; max-height:min(70vh, 520px); padding:20px 20px 12px; border:1px solid var(--line); overscroll-behavior:contain;}
  .sync-log-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .sync-log-head h4{margin:0;}
  .sync-log .sub{margin:4px 0 12px; font-size:12px; line-height:1.5; color:var(--ink-soft);}
  .sync-log-list{list-style:none; margin:0; padding:0;}
  .sync-log-row{display:grid; grid-template-columns:64px 96px 1fr; gap:10px; align-items:start; padding:9px 0; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink); line-height:1.5;}
  .sync-log-row time{font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .sync-log-row > span:last-child{min-width:0; overflow-wrap:anywhere;}
  .sync-kind{justify-self:start; font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; white-space:nowrap;}
  .sync-kind.mine{background:var(--pass-soft); color:var(--pass-text);}
  .sync-kind.remote{background:var(--primary-soft); color:var(--ink);}
  .sync-kind.fail{background:var(--fatal-soft); color:var(--fatal-text);}
  .sync-kind.retry{background:var(--minor-soft); color:var(--minor-text);}
  .sync-log-empty{padding:14px 0; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-soft);}
  .seg{display:flex; gap:4px; flex-wrap:wrap;}
  .seg-btn{padding:5px 10px; font-size:12.5px;}
  .seg-btn[aria-selected="true"]{background:var(--primary-soft); border-color:var(--primary); color:var(--primary-dark);}
  .act-row{display:grid; grid-template-columns:92px 1fr; gap:10px; align-items:start; padding:9px 0; border-top:1px solid var(--line); font-size:12.5px; line-height:1.5;}
  .act-row time{font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .act-go{border:none; background:transparent; padding:0; text-align:left; font-size:12.5px; font-weight:500; color:var(--ink); min-width:0; overflow-wrap:anywhere;}
  .act-go:hover{color:var(--primary-dark);}
  .act-go[disabled]{opacity:1; cursor:default; color:var(--ink);}
  .act-detail{display:block; font-size:11.5px; color:var(--ink-soft);}


  /* 접속자 · 다른 사람이 편집 중인 행 */
  button.presence-chip{font-size:11.5px; padding:6px 10px; border-radius:999px; color:var(--ink-soft);}
  tr.peer-editing > td:first-child{box-shadow:inset 3px 0 0 var(--minor);}

  /* 전체 검색 */
  .global-search{position:relative; margin-left:auto; padding-bottom:8px;}
  .global-search input{width:280px; max-width:100%; height:34px; border:1px solid var(--line); border-radius:7px; padding:0 10px; font-family:inherit; font-size:12.5px; background:var(--panel); color:var(--ink);}
  .global-search input:focus{outline:none; border-color:var(--primary);}
  .search-results{position:absolute; right:0; top:calc(100% - 4px); z-index:40; width:380px; max-width:calc(100vw - 32px); max-height:60vh; overflow:auto; overscroll-behavior:contain; background:var(--panel); border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow-3); padding:6px;}
  .search-hit{display:grid; grid-template-columns:auto 1fr; gap:2px 8px; width:100%; text-align:left; border:none; background:transparent; padding:8px; border-radius:6px; font-size:12.5px; color:var(--ink); font-weight:500;}
  .search-hit:hover, .search-hit:focus-visible{background:var(--primary-soft); color:var(--ink);}
  .search-hit .where{grid-column:2; font-size:11.5px; color:var(--ink-soft); font-weight:400;}
  .search-hit .txt{min-width:0; overflow-wrap:anywhere;}
  .search-kind{font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--grey-100); color:var(--ink-soft); align-self:start;}
  .search-empty{padding:10px; font-size:12.5px; color:var(--ink-soft);}

  /* 편집 모달 공통 */
  #panelModalOverlay .modal{width:520px; max-width:92vw;}
  .edit-list{display:flex; flex-direction:column; gap:6px; max-height:50vh; overflow:auto; overscroll-behavior:contain; margin:0 0 12px;}
  .edit-row{display:flex; gap:6px; align-items:center;}
  .edit-row input[type=text]{flex:1; min-width:0; width:auto; margin:0;}
  .edit-row .edit-label{flex:1; font-size:13px; color:var(--ink);}
  .modal input[type=checkbox]{width:auto; margin:0; accent-color:var(--primary);}
  .edit-add{display:flex; gap:6px; margin-bottom:6px;}
  .edit-add input{flex:1; margin:0;}
  .trash-row{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:12.5px;}
  .trash-row .meta{font-size:11.5px; color:var(--ink-soft);}

  /* 표 도구 · 상태판 버튼 · 중복 ID */
  .th-tools{text-align:right; white-space:nowrap;}
  .statusboard button.sb-item{background:transparent; border:none; border-right:1px solid var(--line); border-radius:0; text-align:left; font-family:inherit; color:inherit; cursor:pointer;}
  .statusboard button.sb-item:hover .sb-label{color:var(--primary-dark);}
  .statusboard button.sb-item[aria-pressed="true"]{background:var(--fatal-soft);}
  table.edittable input.dup-id{border:1.5px solid var(--fatal-border); background:var(--fatal-soft);}
  .pm-rank-actions{display:flex; gap:8px; margin-top:8px;}
  @media (prefers-reduced-motion: reduce){ .sync-status.saving .dot{animation:none;} }
  @keyframes save-pulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);} }

  .statusboard{background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:18px 24px; display:flex; flex-wrap:wrap; gap:0; margin-bottom:18px;}
  .sb-item{flex:1; min-width:90px; padding:4px 18px; border-right:1px solid var(--line);}
  .sb-item:last-child{border-right:none;}
  .sb-label{font-size:10.5px; letter-spacing:.1em; color:var(--ink-soft); text-transform:uppercase; margin-bottom:4px; font-weight:600;}
  .sb-value{font-weight:700; font-size:26px; color:var(--ink); line-height:1;}

  .maintabs-row{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:14px;}
  .maintabs{display:flex; gap:6px;}
  .maintab-btn{background:transparent; color:var(--muted); font-weight:600; padding:10px 16px; border:none; border-bottom:2.5px solid transparent; border-radius:7px 7px 0 0;}
  .maintab-btn.active{color:var(--primary-dark); border-bottom-color:var(--primary);}

  .panel{border-radius:9px; padding:24px; min-height:220px;}
  .panel h3{font-size:18px; margin:0 0 16px; font-weight:700; letter-spacing:-0.01em;}
  .panel-head-row{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
  .panel-head-actions{display:flex; gap:8px; flex-wrap:wrap; flex-shrink:0;}
  .panel .sub{color:var(--muted); font-size:12.5px; line-height:1.6; margin:0 0 18px;}

  .chip{
    font-size:12px; font-weight:600; padding:8px 14px; border-radius:6px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; gap:6px;
    transition:border-color .12s var(--ease), color .12s var(--ease);
  }
  .chip:hover{border-color:var(--primary); color:var(--primary-dark);}
  .chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .chip.active:hover{color:#fff;}
  .chip .del{opacity:.5; font-size:11px; padding:4px; margin:-4px; display:inline-block;}
  .chip .del:hover{opacity:1; color:var(--fatal);}

  table.edittable{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.edittable th{
    text-align:left; font-size:12px; font-weight:600;
    color:var(--muted); padding:10px 8px; border-bottom:2px solid var(--line); white-space:nowrap;
    position:sticky; top:0; background:var(--panel); z-index:1;
  }
  table.edittable td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.edittable tbody tr:nth-child(even){background:var(--bg);}
  table.edittable tbody tr:hover{background:var(--primary-soft);}
  table.edittable input[type=text], table.edittable input[type=date], table.edittable select{
    width:100%; border:1px solid transparent; background:transparent; font-family:inherit; font-size:12.5px;
    padding:7px 7px; border-radius:4px; color:var(--ink); min-width:70px;
  }
  table.edittable input:hover, table.edittable select:hover{border-color:var(--line); background:var(--panel);}
  table.edittable input:focus, table.edittable select:focus{outline:none; border-color:var(--primary); background:var(--panel);}
  .required-mark{color:var(--fatal); font-weight:700;}
  table.edittable input.empty-required{border:1.5px dashed var(--fatal-border); background:var(--fatal-soft);}
  table.edittable input.empty-required::placeholder{color:var(--fatal-text); opacity:.65;}
  table.edittable input.empty-required:focus{border-style:solid; border-color:var(--primary); background:var(--panel);}
  .tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:7px; background:var(--panel);}
  .tblwrap table.edittable{font-size:12.5px;}
  .status-select{
    border-radius:999px !important; padding:4px 12px !important; font-weight:700; font-size:12px !important;
    text-align:center; text-align-last:center; border:1px solid transparent !important; width:auto !important; min-width:76px;
    appearance:none; -webkit-appearance:none; -moz-appearance:none; background-image:none !important;
  }
  .status-select.완료{background:var(--pass-soft); color:var(--pass-text);}
  .status-select.진행{background:var(--minor-soft); color:var(--minor-text);}
  .status-select.대기{background:var(--na-soft); color:var(--ink-soft);}
  .status-select.연장{background:var(--major-soft); color:var(--primary-dark);}
  .status-select.비노출{background:var(--grey-100); color:var(--hidden-muted);}
  .status-select:focus{outline:none; border-color:var(--primary) !important;}

  .idcell{display:flex; gap:4px; align-items:center;}

  /* 상태 필터 칩 */
  .status-filter-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}

  /* 일괄 처리 바 */
  .bulk-bar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--primary-soft);
    border:1px solid var(--primary); border-radius:7px; padding:10px 14px; margin-bottom:12px;
  }
  .bulk-bar .bulk-count{font-size:12.5px; font-weight:700; color:var(--primary-dark);}
  .bulk-bar .bulk-actions{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto;}
  .row-checkbox, .header-checkbox{width:17px; height:17px; cursor:pointer; accent-color:var(--primary);}

  /* 프리마케팅 배너 수동 관리 */
  .pm-status-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin:14px 0 18px;}
  .pm-status-item label{display:block; font-size:10.5px; color:var(--muted); font-weight:700; margin-bottom:5px; letter-spacing:.02em;}
  .pm-status-item input{width:100%; height:36px; border:1px solid var(--line); border-radius:4px; padding:0 10px; font-size:12.5px; font-family:inherit;}
  .pm-status-item .pm-readonly{
    height:36px; display:flex; align-items:center; padding:0 10px; border-radius:4px; background:var(--bg);
    font-size:12.5px; font-weight:700; color:var(--ink);
  }
  .pm-status-item .pm-readonly.badge-ready{color:var(--minor-text); background:var(--minor-soft);}
  .pm-status-item .pm-readonly.badge-live{color:var(--pass-text); background:var(--pass-soft);}

  .idcell input{width:92px !important; flex:none;}

  .callout{background:var(--minor-soft); border:1px solid var(--minor-border); color:var(--minor-text); border-radius:7px; padding:12px 14px; font-size:12.5px; line-height:1.6; margin-bottom:14px;}

  .empty-state{text-align:center; padding:48px 16px; color:var(--muted); font-size:13px; line-height:1.6;}
  .empty-state .big{font-size:32px; margin-bottom:10px; opacity:.85;}

  .benefit-block{border:1px solid var(--line); border-radius:9px; margin-bottom:10px; overflow:hidden;}
  .benefit-block .bb-head{
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
    background:var(--panel); padding:8px 14px;
  }
  .benefit-block .bb-head:hover .bb-title{color:var(--primary-dark);}
  .benefit-block .bb-title{font-weight:700; font-size:13px;}
  .event-history-body{padding:12px 14px;}
  .accordion-chevron{display:inline-block; width:12px; color:var(--muted);}

  .modal-overlay{position:fixed; inset:0; background:rgba(43,37,35,.4); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; overflow-y:auto;}
  #confirmModalOverlay, #promptModalOverlay{z-index:60;}
  .modal{background:#fff; border-radius:11px; padding:24px; width:360px; max-width:90vw; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-3);}
  .modal h4{margin:0 0 12px; font-size:16px; font-weight:700;}
  .modal input{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; font-size:13px; margin-bottom:14px; font-family:inherit;}
  .modal .actions{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;}

  footer{text-align:center; color:var(--muted); font-size:11px; margin-top:30px;}
  .hidden{display:none !important;}

  /* 설정 안내 (연결 정보가 비어 있을 때 · 셀프테스트 결과) */
  .setup-screen{min-height:80vh; display:flex; align-items:center; justify-content:center;}
  .setup-card{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:28px; width:440px; max-width:100%; box-shadow:var(--shadow-2);}
  .setup-card h1{font-size:22px; font-weight:800; margin:0 0 8px; letter-spacing:-0.02em;}
  #setupMsg{white-space:pre-line; margin:0;}
  input[type=file]{display:none;}

  /* 인라인 에러 배너 (alert 대체) */
  .inline-error{
    background:var(--fatal-soft); border:1px solid var(--fatal-border); color:var(--fatal-text); border-radius:7px;
    padding:11px 14px; font-size:12.5px; margin-bottom:14px; display:flex; align-items:center; gap:8px;
  }
  .inline-error .close{margin-left:auto; cursor:pointer; opacity:.6;}
  .inline-error .close:hover{opacity:1;}

  /* 토스트 (완료 알림 - alert 대체) */
  #toastStack{position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:8px; z-index:100;}
  .toast{
    background:var(--ink); color:#fff; padding:12px 16px; border-radius:7px; font-size:13px; font-weight:600; box-shadow:var(--shadow-toast);
    box-shadow:0 8px 24px rgba(43,37,35,.18); max-width:320px; line-height:1.5;
    animation:toast-in .18s ease;

function showToast(msg, type='success'){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3600);
}
function showUndoToast(msg, undoFn){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast undo-toast';
  const msgSpan = document.createElement('span');
  msgSpan.textContent = msg;
  const undoBtn = document.createElement('button');
  undoBtn.className = 'toast-undo-btn';
  undoBtn.textContent = '되돌리기';
  el.appendChild(msgSpan);
  el.appendChild(undoBtn);
  stack.appendChild(el);
  const timer = setTimeout(()=>{ el.remove(); }, 6000);
  undoBtn.addEventListener('click', ()=>{
    clearTimeout(timer);
    el.remove();
    undoFn();
    showToast('되돌렸어요.');
  });
}
function showError(msg){

function showPromptModal(title, defaultValue, onSubmit){
  const overlay = document.getElementById('promptModalOverlay');
  const input = document.getElementById('promptModalInput');
  const okBtn = document.getElementById('promptModalOkBtn');
  const cancelBtn = document.getElementById('promptModalCancelBtn');
  document.getElementById('promptModalTitle').textContent = title;
  input.value = defaultValue || '';
  overlay.classList.remove('hidden');
  setTimeout(()=> input.focus(), 30);

  function cleanup(){
    overlay.classList.add('hidden');
    okBtn.removeEventListener('click', handleOk);
    cancelBtn.removeEventListener('click', handleCancel);
    input.removeEventListener('keydown', handleKeydown);
    overlay.removeEventListener('click', handleOverlayClick);
  }
  function handleOk(){ const v = input.value.trim(); cleanup(); if(v) onSubmit(v); }
  function handleCancel(){ cleanup(); }
  function handleKeydown(e){ if(e.key==='Enter') handleOk(); else if(e.key==='Escape') handleCancel(); }
  function handleOverlayClick(e){ if(e.target===overlay) handleCancel(); }
  okBtn.addEventListener('click', handleOk);
  cancelBtn.addEventListener('click', handleCancel);
  input.addEventListener('keydown', handleKeydown);
  overlay.addEventListener('click', handleOverlayClick);
}

// ESC·바깥 클릭은 항상 "아무것도 안 함"이에요. onCancel은 취소(또는 cancelLabel) 버튼을 눌렀을 때만 불려요.
// cancelLabel을 주면 그 버튼은 두 번째 선택지가 되고, 별도의 "취소" 버튼이 함께 보여요.
function showConfirmModal(message, onConfirm, onCancel, okLabel, cancelLabel){
  const overlay = document.getElementById('confirmModalOverlay');
  const okBtn = document.getElementById('confirmModalOkBtn');
  const cancelBtn = document.getElementById('confirmModalCancelBtn');
  const dismissBtn = document.getElementById('confirmModalDismissBtn');
  document.getElementById('confirmModalMessage').textContent = message;
  okBtn.textContent = okLabel || '삭제하기';
  cancelBtn.textContent = cancelLabel || '취소';
  dismissBtn.classList.toggle('hidden', !cancelLabel);
  overlay.classList.remove('hidden');
  setTimeout(()=> okBtn.focus(), 30);

  function cleanup(){
    overlay.classList.add('hidden');
    okBtn.removeEventListener('click', handleOk);
    cancelBtn.removeEventListener('click', handleCancel);
    dismissBtn.removeEventListener('click', cleanup);
    document.removeEventListener('keydown', handleKeydown);
    overlay.removeEventListener('click', handleOverlayClick);
  }
  function handleOk(){ cleanup(); onConfirm(); }
  function handleCancel(){ cleanup(); if(onCancel) onCancel(); }
  function handleKeydown(e){ if(e.key==='Escape') cleanup(); }
  function handleOverlayClick(e){ if(e.target===overlay) cleanup(); }
  okBtn.addEventListener('click', handleOk);
  cancelBtn.addEventListener('click', handleCancel);
  dismissBtn.addEventListener('click', cleanup);
  document.addEventListener('keydown', handleKeydown);
  overlay.addEventListener('click', handleOverlayClick);
}
function setBtnLoading(btn, text){

const EVENT_FIELDS = ["status","name","workType","category","dueDate","reflectStatus","source","reviewUrl","urlType","opUrl","note"];
// 화면·엑셀에 보이는 이름만 바꿨어요. 저장 필드 이름(dueDate, reflectStatus)은 그대로예요.

const EVENT_TABLE_COLUMNS = [

];

const REQUIRED_EVENT_FIELDS = ['name', 'dueDate', 'reflectStatus', 'id'];
function getAllEventColumns(){ return [...EVENT_TABLE_COLUMNS, ...(STATE.customEventColumns||[])]; }

function defaultState(){
  const today = new Date();
  const y = today.getFullYear(), m = today.getMonth()+1;
  const key = `${y}-${String(m).padStart(2,'0')}`;
  const label = `${String(y%100).padStart(2,'0')}년 ${m}월`;
  return {
    eventMonths: [ {key, label, events: []} ],
    bannerMonths: [ {key, label, columns: DEFAULT_BANNER_COLUMNS.slice(), ranks: [], partners: [], preMarketingPartners: [], cycleWeeks: 4, weekAnchor: defaultWeekAnchor(key), changeLog: []} ],
    benefitBlocks: [ {label, items: [], _blockUid: uid()} ],
    activityLog: [],
    uiPrefs: {},
    customEventColumns: [],
    partnerNameMap: {...DEFAULT_PARTNER_NAME_MAP},
  };
}
function ensureStateShape(){
  if(!Array.isArray(STATE.activityLog)) STATE.activityLog = [];
  if(!Array.isArray(STATE.trash)) STATE.trash = [];
  if(!STATE.uiPrefs) STATE.uiPrefs = {};
  if(!STATE.customEventColumns) STATE.customEventColumns = [];
  // 기본 매핑은 처음 한 번만 채워요. 이후에는 '파트너명 매핑'에서 지운 항목이 다시 생기지 않아요.
  if(!STATE.partnerNameMap || typeof STATE.partnerNameMap!=='object') STATE.partnerNameMap = {...DEFAULT_PARTNER_NAME_MAP};
  // 예전 '칸 설정' 값은 더 쓰지 않아요 (모두 기본 칸으로 보여요)
  delete STATE.uiPrefs.hiddenEventColumns; delete STATE.uiPrefs.eventColumnOrder;
  if(!Array.isArray(STATE.eventMonths) || !STATE.eventMonths.length) STATE.eventMonths = defaultState().eventMonths;
  if(!Array.isArray(STATE.bannerMonths) || !STATE.bannerMonths.length) STATE.bannerMonths = defaultState().bannerMonths;
  if(!Array.isArray(STATE.benefitBlocks)) STATE.benefitBlocks = defaultState().benefitBlocks;
  // _uid는 DB의 기본키라서 비어 있거나 겹치면 새로 발급해요 (예전 버전은 달 복사 때 프리마케팅 _uid가 겹쳤어요)
  const seen = new Set();
  const fixUid = o=>{ if(!o._uid || seen.has(o._uid)) o._uid = uid(); seen.add(o._uid); };
  STATE.eventMonths.forEach(mo=>{
    if(!mo.events) mo.events = [];
    mo.events.forEach(fixUid);
  });
  STATE.bannerMonths.forEach(mo=>{
    if(!mo.ranks) mo.ranks = [];
    if(!mo.columns) mo.columns = DEFAULT_BANNER_COLUMNS.slice();
    if(!mo.partners) mo.partners = [];
    if(!mo.preMarketingPartners) mo.preMarketingPartners = [];
    if(!mo.cycleWeeks) mo.cycleWeeks = 4;
    if(!mo.hiddenColumns) mo.hiddenColumns = [];
    mo.preMarketingPartners.forEach(p=>{
      fixUid(p);
      if(p.name && STATE.partnerNameMap[p.name.trim()]) p.name = STATE.partnerNameMap[p.name.trim()];
    });
    mo.ranks.forEach(r=>{
      fixUid(r);
      if(!r.values) r.values = {};
      Object.keys(r.values).forEach(col=>{
        const v = r.values[col];
        if(v && STATE.partnerNameMap[String(v).trim()]) r.values[col] = STATE.partnerNameMap[String(v).trim()];
      });
    });
    if(!mo.weekAnchor) mo.weekAnchor = defaultWeekAnchor(mo.key);
    if(!mo.changeLog) mo.changeLog = [];
  });
  STATE.benefitBlocks.forEach(b=>{
    if(!b._blockUid || seen.has(b._blockUid)) b._blockUid = uid();
    seen.add(b._blockUid);
    if(!b.items) b.items = [];
    b.items.forEach(fixUid);
  });
  STATE.activityLog.forEach(e=>{ if(!e._uid && e.id) e._uid = e.id; fixUid(e); });
  STATE.trash.forEach(fixUid);
}

/* ════════════════════════════════════════════════════════════
   STATE ⇄ DB 행 변환 (순수 함수)
   containers: 이벤트 월 'event:YYYY-MM' · 배너 월 'banner:YYYY-MM' · 혜택 블록 _blockUid · 'settings'
   records: 각 행의 _uid
   ════════════════════════════════════════════════════════════ */
const SETTINGS_ID = 'settings';
const SETTINGS_FIELDS = ['partnerNameMap','customEventColumns'];
const CHILD_KEYS = { event_month:['events'], banner_month:['ranks','preMarketingPartners'], benefit_block:['items'] };
const RECORD_ARRAY = { event:'events', banner_rank:'ranks', pm_partner:'preMarketingPartners', benefit_item:'items', activity:'activityLog', trash:'trash' };
// 활동 기록·휴지통은 '부가 데이터'라서 실제 편집과 다른 묶음으로 보내요 (DB 설정이 옛 버전이어도 편집은 막히지 않게)
const AUX_KINDS = new Set(['activity', 'trash']);
// 혜택 블록 순서는 text sort_key에 담아요. 음수도 문자열 정렬이 맞도록 1e12를 더해 14자리로 채워요.
const encodeBlockKey = v => String(v + 1e12).padStart(14,'0');
const decodeBlockKey = s => Number(s) - 1e12;

function containerIdOf(kind, obj){
  if(kind==='event_month') return 'event:' + obj.key;
  if(kind==='banner_month') return 'banner:' + obj.key;
  if(kind==='benefit_block') return obj._blockUid;
  return SETTINGS_ID;
}
function recordData(kind, obj){
  if(kind==='banner_rank') return {...(obj.values||{})}; // 칸(구좌)마다 따로 합쳐지도록 values를 펼쳐서 저장
  const {_uid, ...data} = obj;
  return data;
}
function recordObj(row){
  return row.kind==='banner_rank' ? {_uid:row.id, values:{...row.data}} : {...row.data, _uid:row.id};
}
function containerData(kind, obj){
  const data = {...obj};
  CHILD_KEYS[kind].forEach(k=> delete data[k]);
  return data;
}

function stateToRows(state, sortOf){
  const so = sortOf || ((id, i)=> i);
  const containers = [], records = [];
  const addRecs = (cid, kind, arr)=> (arr||[]).forEach((o,i)=> records.push({
    id:o._uid, container_id:cid, kind, sort_order:so(o._uid, i), data:recordData(kind, o),
  }));
  (state.eventMonths||[]).forEach(mo=>{
    const id = containerIdOf('event_month', mo);
    containers.push({id, kind:'event_month', sort_key:mo.key, data:containerData('event_month', mo)});
    addRecs(id, 'event', mo.events);
  });
  (state.bannerMonths||[]).forEach(mo=>{
    const id = containerIdOf('banner_month', mo);
    containers.push({id, kind:'banner_month', sort_key:mo.key, data:containerData('banner_month', mo)});
    addRecs(id, 'banner_rank', mo.ranks);
    addRecs(id, 'pm_partner', mo.preMarketingPartners);
  });
  (state.benefitBlocks||[]).forEach((b,i)=>{
    containers.push({id:b._blockUid, kind:'benefit_block', sort_key:encodeBlockKey(so(b._blockUid, i)), data:containerData('benefit_block', b)});
    addRecs(b._blockUid, 'benefit_item', b.items);
  });
  const settings = {};
  SETTINGS_FIELDS.forEach(k=>{ if(state[k]!==undefined) settings[k] = state[k]; });
  containers.push({id:SETTINGS_ID, kind:'settings', sort_key:'', data:settings});
  addRecs(SETTINGS_ID, 'activity', state.activityLog);
  addRecs(SETTINGS_ID, 'trash', state.trash);
  return {containers, records};
}

function rowsToState(containers, records){
  const byContainer = new Map();
  records.slice()
    .sort((a,b)=> (a.sort_order - b.sort_order) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0))
    .forEach(r=>{
      if(!byContainer.has(r.container_id)) byContainer.set(r.container_id, []);
      byContainer.get(r.container_id).push(r);
    });
  const kids = (cid, kind)=> (byContainer.get(cid)||[]).filter(r=>r.kind===kind).map(recordObj);
  const state = {eventMonths:[], bannerMonths:[], benefitBlocks:[]};
  containers.slice()
    .sort((a,b)=> (a.sort_key||'') < (b.sort_key||'') ? -1 : (a.sort_key||'') > (b.sort_key||'') ? 1 : 0)
    .forEach(c=>{
      if(c.kind==='event_month') state.eventMonths.push({...c.data, events:kids(c.id,'event')});
      else if(c.kind==='banner_month') state.bannerMonths.push({...c.data, ranks:kids(c.id,'banner_rank'), preMarketingPartners:kids(c.id,'pm_partner')});
      else if(c.kind==='benefit_block') state.benefitBlocks.push({...c.data, items:kids(c.id,'benefit_item')});
      else if(c.kind==='settings') Object.assign(state, c.data);
    });
  // 예전 버전은 활동 기록을 settings.data 안에 배열로 저장했어요. 레코드가 아직 없으면 그 배열을 그대로 써요.
  const legacyLog = state.activityLog;
  const acts = kids(SETTINGS_ID, 'activity');
  state.activityLog = (acts.length || !Array.isArray(legacyLog)) ? acts : legacyLog.map(e=>({...e, _uid: e._uid || e.id}));
  state.trash = kids(SETTINGS_ID, 'trash');
  return state;
}

function rowsToMaps(rows){
  return {
    containers: new Map(rows.containers.map(r=>[r.id, r])),
    records: new Map(rows.records.map(r=>[r.id, r])),
  };
}
function cloneMaps(m){ return {containers:new Map(structuredClone([...m.containers])), records:new Map(structuredClone([...m.records]))}; }

// 최상위 키 단위로 바뀐 것만 골라요. 키가 사라졌으면 null(→ 통째로 upsert).
function shallowPatch(a, b){
  for(const k in a) if(!(k in b)) return null;
  const p = {};
  for(const k in b) if(JSON.stringify(a[k]) !== JSON.stringify(b[k])) p[k] = b[k];
  return p;
}
// 마지막으로 DB와 맞춰둔 행(prev)과 지금 STATE의 행(next)을 비교해서 보낼 쓰기 한 묶음을 만들어요.
function diffRows(prev, next){
  const op = {c:[], cso:[], cp:[], r:[], p:[], so:[], dr:[], dc:[]};
  next.containers.forEach((row, id)=>{
    const old = prev.containers.get(id);
    if(!old || old.kind!==row.kind){ op.c.push(row); return; }
    const patch = shallowPatch(old.data, row.data);
    if(patch===null){ op.c.push(row); return; }
    if(Object.keys(patch).length) op.cp.push({id, patch});
    if(old.sort_key!==row.sort_key) op.cso.push({id, sort_key:row.sort_key});
  });
  prev.containers.forEach((row, id)=>{ if(!next.containers.has(id)) op.dc.push(id); });
  const goneContainers = new Set(op.dc);
  next.records.forEach((row, id)=>{
    const old = prev.records.get(id);
    if(!old || old.kind!==row.kind || old.container_id!==row.container_id){ op.r.push(row); return; }
    const patch = shallowPatch(old.data, row.data);
    if(patch===null){ op.r.push(row); return; }
    if(Object.keys(patch).length) op.p.push({id, patch});
    if(old.sort_order!==row.sort_order) op.so.push({id, sort_order:row.sort_order});
  });
  prev.records.forEach((row, id)=>{ if(!next.records.has(id) && !goneContainers.has(row.container_id)) op.dr.push(id); });
  Object.keys(op).forEach(k=>{ if(!op[k].length) delete op[k]; });
  return Object.keys(op).length ? op : null;
}

// 순서값 채우기: 값이 없는 항목(새 행·옮긴 행)만 이웃 두 값의 중간으로 정해요.
// 간격이 1e-9보다 작아지면(정수 모드는 1보다 작아지면) 그 목록 전체를 0,1,2…로 다시 매기고 true를 돌려줘요.
function fillSort(ids, S, integer){
  const renumber = ()=>{ ids.forEach((id,k)=> S.set(id, k)); return true; };
  let last = -Infinity;
  for(const id of ids){
    const v = S.get(id);
    if(v==null) continue;
    if(!(v > last)) return renumber();
    last = v;
  }
  for(let i=0; i<ids.length; i++){
    if(S.has(ids[i])) continue;
    let j = i; while(j<ids.length && !S.has(ids[j])) j++;
    const n = j-i;
    const lo = i>0 ? S.get(ids[i-1]) : null;
    const hi = j<ids.length ? S.get(ids[j]) : null;
    let start, step;
    if(lo==null && hi==null){ start = 0; step = 1; }
    else if(lo==null){ start = hi - n; step = 1; }
    else if(hi==null){ start = lo + 1; step = 1; }
    else{
      if(integer){ step = Math.floor((hi-lo)/(n+1)); if(step < 1) return renumber(); }
      else{ if(hi - lo < 1e-9) return renumber(); step = (hi-lo)/(n+1); }
      start = lo + step;
    }
    for(let k=0; k<n; k++) S.set(ids[i+k], start + k*step);
    i = j-1;
  }
  return false;
}

// 오프라인이던 동안 쌓인 쓰기를 불러온 행에 미리 적용해요 (화면이 내 변경을 잃지 않도록)
function applyOpToMaps(m, op){
  (op.c||[]).forEach(r=> m.containers.set(r.id, structuredClone(r)));
  (op.r||[]).forEach(r=> m.records.set(r.id, structuredClone(r)));
  (op.cso||[]).forEach(x=>{ const r = m.containers.get(x.id); if(r) r.sort_key = x.sort_key; });
  (op.cp||[]).forEach(x=>{ const r = m.containers.get(x.id); if(r) r.data = {...r.data, ...structuredClone(x.patch)}; });
  (op.p||[]).forEach(x=>{ const r = m.records.get(x.id); if(r) r.data = {...r.data, ...structuredClone(x.patch)}; });
  (op.so||[]).forEach(x=>{ const r = m.records.get(x.id); if(r) r.sort_order = x.sort_order; });
  (op.dr||[]).forEach(id=> m.records.delete(id));
  (op.dc||[]).forEach(id=>{
    m.containers.delete(id);
    m.records.forEach((r, rid)=>{ if(r.container_id===id) m.records.delete(rid); });
  });
}

/* ════════════════════════════════════════════════════════════
   동기화: 바뀐 행/필드만 보내고, 실패하면 localStorage 큐에 남겨 다시 보내요
   ════════════════════════════════════════════════════════════ */
let sb = null;            // supabase client
// 탭마다 하나씩 만드는 식별자. 쓰기 때 updated_by 열에 담아서, 되돌아온 내 변경을 알아봐요 (data에는 넣지 않아요)
const CLIENT_ID = (()=>{
  const make = ()=> ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c=> (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
  try{
    let v = sessionStorage.getItem('alddot_client_id');
    if(!v){ v = make(); sessionStorage.setItem('alddot_client_id', v); }
    return v;
  }catch(e){ return make(); }
})();
let CONNECTED = false;    // 첫 연결을 시작했는지
let SHADOW = {containers:new Map(), records:new Map()}; // DB에 반영됐거나 큐에 실린 것까지 포함한 "서버 기준" 행
const SORT = new Map();   // 레코드 id → sort_order, 혜택 블록 id → 정수 순서 (STATE 밖에 둬요)
const ACK = new Map();    // 't:id' → {ts, fields: Map(field → ts)} 내가 보낸 쓰기의 updated_at
const MY_DELETES = new Set(); // 내가 지운 id (되돌아온 DELETE 이벤트 무시용)
const PENDING_BASE = new Map(); // 'id\u0001field' → 내가 고치기 시작하기 전의 서버 값
let AUX_WARNED = false;
const DEBOUNCE = new Map();   // 'id\u0001field' → {timer, id, field, value}
let QUEUE = [];
let FLUSHING = false, SEND_FAILED = false, RT_DOWN = false;
let DB_EMPTY = false, MIGRATED = false;

// 대기열은 탭마다 'alddot_pending:<탭 id>'에 {at, q}로 저장해요 (같은 브라우저의 다른 탭이 덮어쓰지 않게).
// 열 때 내 것과, 2분 넘게 갱신이 없는(닫힌) 탭의 것, 예전 형식('alddot_pending')을 합쳐서 이어 보내요.
const MY_PENDING_KEY = PENDING_KEY + ':' + CLIENT_ID;
const PENDING_STALE_MS = 120000;
function loadPendingQueue(){
  QUEUE = [];
  try{
    Object.keys(localStorage).filter(k=> k===PENDING_KEY || k.startsWith(PENDING_KEY + ':')).forEach(k=>{
      const v = JSON.parse(localStorage.getItem(k));
      const mine = k===MY_PENDING_KEY;
      if(Array.isArray(v)){ QUEUE.push(...v); localStorage.removeItem(k); return; } // 예전 형식
      if(!v || !Array.isArray(v.q)) return;
      if(!mine && Date.now() - v.at < PENDING_STALE_MS) return; // 아직 열려 있는 다른 탭 것
      QUEUE.push(...v.q);
      if(!mine) localStorage.removeItem(k);
    });
  }catch(e){ /* 읽을 수 없으면 빈 대기열로 시작 */ }
  persistQueue();
}
function persistQueue(){
  try{
    if(QUEUE.length) localStorage.setItem(MY_PENDING_KEY, JSON.stringify({at: Date.now(), q: QUEUE}));
    else localStorage.removeItem(MY_PENDING_KEY);
  }catch(e){ /* 저장 공간 부족 — 메모리 큐로 계속 재시도 */ }
}
function loadUiPrefs(){
  try{ return JSON.parse(localStorage.getItem(UI_PREFS_KEY)) || {}; }catch(e){ return {}; }
}

function sortOf(id, i){ return SORT.has(id) ? SORT.get(id) : i; }
function fillAllSort(){
  const ids = arr => (arr||[]).map(o=>o._uid);
  STATE.eventMonths.forEach(mo=> fillSort(ids(mo.events), SORT));
  STATE.bannerMonths.forEach(mo=>{ fillSort(ids(mo.ranks), SORT); fillSort(ids(mo.preMarketingPartners), SORT); });
  STATE.benefitBlocks.forEach(b=> fillSort(ids(b.items), SORT));
  fillSort(STATE.benefitBlocks.map(b=>b._blockUid), SORT, true);
  fillSort(ids(STATE.activityLog), SORT);
  fillSort(ids(STATE.trash), SORT);
}
function snapshotRows(){ return cloneMaps(rowsToMaps(stateToRows(STATE, sortOf))); }

// 셀 입력 전용: 행+필드별 400ms 디바운스 후 patch_record(id, {field: value})
function saveField(id, field, value){
  const sh = SHADOW.records.get(id);
  if(!sh){ syncChanges(); return; } // 아직 DB에 없는 행이면 통째로 올려요
  const bk = id + '\u0001' + field;
  if(!PENDING_BASE.has(bk)) PENDING_BASE.set(bk, structuredClone(sh.data[field])); // 같은 칸 충돌 알림용
  const k = id + '\u0001' + field;
  recordCellUndo(k, sh, field, value);
  sh.data[field] = structuredClone(value);
  const prev = DEBOUNCE.get(k);
  if(prev) clearTimeout(prev.timer);
  const entry = {id, field, value};
  entry.timer = setTimeout(()=>{ DEBOUNCE.delete(k); enqueue({p:[{id, patch:{[field]: value}}]}); }, 400);
  DEBOUNCE.set(k, entry);
  renderSavebar();
}
function flushDebounces(){
  DEBOUNCE.forEach((e,k)=>{ clearTimeout(e.timer); QUEUE.push({p:[{id:e.id, patch:{[e.field]: e.value}}]}); });
  DEBOUNCE.clear();
  persistQueue();
}

/* Ctrl+Z 되돌리기: 내가 바꾼 행의 바뀌기 전 모습만 기억했다가 되돌려요.
   다른 사람이 바꾼 행·칸은 건드리지 않아요. 활동 기록은 되돌리지 않아요. */
const UNDO = [];          // {cell?, c: Map(id → 이전 컨테이너 행|null), r: Map(id → {row|null, fields: Set|null}), view?}
const UNDO_MAX = 50;
let UNDO_OFF = false;     // 첫 로딩·되돌리기 자체의 저장은 기록하지 않아요
let UNDO_VIEW = null;     // 다음 기록에 붙일 '바꾸기 전 화면(현재 달)'
let NATIVE_UNDO = false;  // 입력칸 안의 글자 되돌리기(브라우저 기본)로 생긴 입력
const viewState = ()=> ({ev:activeEventMonthKey, bn:activeBannerMonthKey});
function pushUndo(entry){ UNDO.push(entry); if(UNDO.length > UNDO_MAX) UNDO.shift(); }
function recordCellUndo(k, sh, field, value){
  if(UNDO_OFF) return;
  const top = UNDO[UNDO.length-1];
  if(top && top.cell===k){
    // 처음 값으로 돌아왔으면 기록을 지우고, 이어서 치는 중(400ms 안)이면 한 단계로 묶어요
    if(JSON.stringify(top.r.get(sh.id).row.data[field] ?? null)===JSON.stringify(value ?? null)){ UNDO.pop(); return; }
    if(DEBOUNCE.has(k) || NATIVE_UNDO) return;
  }
  pushUndo({cell:k, c:new Map(), r:new Map([[sh.id, {row:structuredClone(sh), fields:new Set([field])}]])});
}
function recordUndo(op, prev){
  const c = new Map(), r = new Map();
  const keepR = (id, field)=>{
    const old = prev.records.get(id);
    if(!old){ if(!r.has(id)) r.set(id, {row:null, fields:null}); return; }
    if(old.kind==='activity') return;
    const e = r.get(id) || {row:structuredClone(old), fields:new Set()};
    if(field===null) e.fields = null; else if(e.fields) e.fields.add(field);
    r.set(id, e);
  };
  (op.c||[]).concat(op.cp||[], op.cso||[]).forEach(x=>{ if(!c.has(x.id)) c.set(x.id, structuredClone(prev.containers.get(x.id) || null)); });
  (op.dc||[]).forEach(id=>{
    c.set(id, structuredClone(prev.containers.get(id)));
    prev.records.forEach((row, rid)=>{ if(row.container_id===id && row.kind!=='activity') r.set(rid, {row:structuredClone(row), fields:null}); });
  });
  (op.r||[]).forEach(x=>{ if(x.kind!=='activity') keepR(x.id, null); });
  (op.p||[]).forEach(x=> Object.keys(x.patch).forEach(f=> keepR(x.id, f)));
  (op.so||[]).forEach(x=> keepR(x.id, '__sort'));
  (op.dr||[]).forEach(id=> keepR(id, null));
  const view = UNDO_VIEW; UNDO_VIEW = null;
  if(c.size || r.size) pushUndo({c, r, view});
}
function undoLast(){
  const e = UNDO.pop();
  if(!e){ showToast('되돌릴 작업이 없어요.'); return; }
  flushDebounces(); // 아직 안 보낸 입력을 먼저 큐에 올려야 되돌린 값이 그 뒤에 저장돼요
  const cur = snapshotRows();
  e.c.forEach((row, id)=>{
    if(row) cur.containers.set(id, row);
    else{ cur.containers.delete(id); cur.records.forEach((x, rid)=>{ if(x.container_id===id) cur.records.delete(rid); }); }
  });
  e.r.forEach(({row, fields}, id)=>{
    if(!row){ cur.records.delete(id); return; }
    const now = cur.records.get(id);
    if(!fields || !now){ if(cur.containers.has(row.container_id)) cur.records.set(id, row); return; }
    fields.forEach(f=>{
      if(f==='__sort') now.sort_order = row.sort_order;
      else if(f in row.data) now.data[f] = row.data[f];
      else delete now.data[f];
    });
  });
  cur.records.forEach(x=> SORT.set(x.id, x.sort_order));
  cur.containers.forEach(x=>{ if(x.kind==='benefit_block') SORT.set(x.id, decodeBlockKey(x.sort_key)); });
  const prefs = STATE.uiPrefs;
  STATE = rowsToState([...cur.containers.values()], [...cur.records.values()]);
  STATE.uiPrefs = prefs;
  ensureStateShape();
  if(e.view){ activeEventMonthKey = e.view.ev; activeBannerMonthKey = e.view.bn; }
  if(!getEventMonth(activeEventMonthKey)) activeEventMonthKey = getDefaultActiveEventMonthKey();
  if(!getBannerMonth(activeBannerMonthKey)) activeBannerMonthKey = getDefaultActiveBannerMonthKey();
  UNDO_OFF = true;
  try{ syncChanges(); }finally{ UNDO_OFF = false; }
  renderActiveTab();
  showToast('되돌렸어요.');
}
document.addEventListener('keydown', e=>{
  const el = e.target;
  if(e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return; // 한글 조합 중에는 건드리지 않아요
  if(el.classList && el.classList.contains('accordion-toggle') && (e.key==='Enter' || e.key===' ')){
    e.preventDefault();
    const sel = el.dataset.key ? `.accordion-toggle[data-key="${el.dataset.key}"]` : `.accordion-toggle[data-blockuid="${el.dataset.blockuid}"]`;
    const holder = el.parentElement.parentElement;
    el.click();
    const again = holder.querySelector(sel); if(again) again.focus(); // 다시 그려진 헤더로 포커스를 돌려요
    return;
  }
  if(!el.matches || !el.matches('.edittable tbody input:not([type=checkbox]), .edittable tbody select')) return;
  const isText = el.tagName==='INPUT' && el.type!=='date' && el.type!=='checkbox';
  const dir = e.key==='Enter' ? (e.shiftKey ? -1 : 1) : (isText && e.key==='ArrowDown') ? 1 : (isText && e.key==='ArrowUp') ? -1 : 0;
  if(!dir || (el.tagName==='SELECT' && e.key!=='Enter')) return;
  const td = el.closest('td'), tr = td.parentElement;
  const next = dir>0 ? tr.nextElementSibling : tr.previousElementSibling;
  const target = next && next.children[td.cellIndex] && next.children[td.cellIndex].querySelector('input, select');
  if(!target) return;
  e.preventDefault();
  target.focus();
  if(target.select && target.type==='text') target.select();
});
document.addEventListener('input', e=>{ if(e.inputType==='historyUndo'){ NATIVE_UNDO = true; setTimeout(()=>{ NATIVE_UNDO = false; }); } }, true);
document.addEventListener('keydown', e=>{
  if(!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey || e.key.toLowerCase()!=='z' || !STATE) return;
  if(document.querySelector('.modal-overlay:not(.hidden)')) return;
  const el = document.activeElement;
  // 입력칸에 아직 확정 전인 글자가 있으면 브라우저 기본 글자 되돌리기에 맡겨요
  if(el && (el.tagName==='TEXTAREA' || (el.tagName==='INPUT' && !['checkbox','radio','date','button'].includes(el.type))) && el.value!==el.defaultValue) return;
  e.preventDefault();
  undoLast();
});

// 그 밖의 모든 변경(행 추가·삭제·이동, 새 달, 일괄 처리, 불러오기 등): STATE를 바꾼 뒤 부르면
// 마지막 서버 기준(SHADOW)과 비교해서 바뀐 것만 한 묶음(op)으로 보내요.
function syncChanges(){
  if(!STATE || !sb) return;
  fillAllSort();
  const next = snapshotRows();
  const op = diffRows(SHADOW, next);
  const prev = SHADOW;
  SHADOW = next;
  if(op && !UNDO_OFF) recordUndo(op, prev);
  if(op){
    (op.dr||[]).forEach(id=> MY_DELETES.add('r:'+id));
    (op.dc||[]).forEach(id=> MY_DELETES.add('c:'+id));
    splitAuxOp(op, prev, next).forEach(part=>{ if(part) enqueue(part); });
  }
  updateMigrateBtn();
}
function splitAuxOp(op, prev, next){
  const kindOf = id => (next.records.get(id) || prev.records.get(id) || {}).kind;
  const main = {}, aux = {};
  Object.entries(op).forEach(([k, arr])=>{
    arr.forEach(x=>{
      const id = typeof x==='string' ? x : x.id;
      const target = ['r','p','so','dr'].includes(k) && AUX_KINDS.has(kindOf(id)) ? aux : main;
      (target[k] = target[k] || []).push(x);
    });
  });
  if(Object.keys(aux).length) aux.aux = true;
  return [Object.keys(main).length ? main : null, Object.keys(aux).length ? aux : null];
}

function enqueue(op){
  QUEUE.push(op);
  persistQueue();
  renderSavebar();
  flushQueue();
}

class SendError extends Error{ constructor(msg, transient){ super(msg); this.transient = transient; } }
function check(res){
  if(!res.error) return res.data;
  const st = res.status || 0;
  const transient = st===0 || st===401 || st===408 || st===429 || st>=500 || !res.error.code;
  throw new SendError(res.error.message || '알 수 없는 오류', transient);
}
function chunks(arr, n){ const out = []; for(let i=0; i<(arr||[]).length; i+=n) out.push(arr.slice(i, i+n)); return out; }
function ackRow(t, id, updatedAt, fields){
  if(!updatedAt) return;
  const ts = Date.parse(updatedAt);
  const k = t + ':' + id;
  const a = ACK.get(k) || {ts:0, fields:new Map()};
  a.ts = Math.max(a.ts, ts);
  fields.forEach(f=> a.fields.set(f, Math.max(a.fields.get(f)||0, ts)));
  ACK.set(k, a);
  if(t==='r') fields.forEach(f=> PENDING_BASE.delete(id + '\u0001' + f));
}

async function sendOp(op){
  if(op.c) for(const part of chunks(op.c, 500)){
    const data = check(await sb.from('containers').upsert(part.map(r=>({...r, updated_by:CLIENT_ID}))).select('id,updated_at'));
    data.forEach(d=>{ const row = part.find(r=>r.id===d.id); ackRow('c', d.id, d.updated_at, [...Object.keys(row.data), '__sort']); });
  }
  if(op.r) for(const part of chunks(op.r, 500)){
    const data = check(await sb.from('records').upsert(part.map(r=>({...r, updated_by:CLIENT_ID}))).select('id,updated_at'));
    data.forEach(d=>{ const row = part.find(r=>r.id===d.id); ackRow('r', d.id, d.updated_at, [...Object.keys(row.data), '__sort', '__container']); });
  }
  for(const x of op.cso||[]){
    const data = check(await sb.from('containers').update({sort_key:x.sort_key, updated_by:CLIENT_ID}).eq('id', x.id).select('id,updated_at'));
    if(data[0]) ackRow('c', x.id, data[0].updated_at, ['__sort']);
  }
  for(const x of op.cp||[]){
    ackRow('c', x.id, check(await sb.rpc('patch_container', {p_id:x.id, p_patch:x.patch, p_client:CLIENT_ID})), Object.keys(x.patch));
  }
  for(const part of chunks(op.p, 20)){
    await Promise.all(part.map(async x=> ackRow('r', x.id, check(await sb.rpc('patch_record', {p_id:x.id, p_patch:x.patch, p_client:CLIENT_ID})), Object.keys(x.patch))));
  }
  for(const part of chunks(op.so, 20)){
    await Promise.all(part.map(async x=>{
      const data = check(await sb.from('records').update({sort_order:x.sort_order, updated_by:CLIENT_ID}).eq('id', x.id).select('id,updated_at'));
      if(data[0]) ackRow('r', x.id, data[0].updated_at, ['__sort']);
    }));
  }
  for(const part of chunks(op.dr, 200)) check(await sb.from('records').delete().in('id', part));
  if(op.dc && op.dc.length) check(await sb.from('containers').delete().in('id', op.dc));
}

async function flushQueue(){
  if(FLUSHING || !sb || !CONNECTED) return;
  FLUSHING = true; renderSavebar();
  const wasFailed = SEND_FAILED;
  try{
    while(QUEUE.length){
      try{
        await sendOp(QUEUE[0]);
        if(!QUEUE[0].aux) logSync(wasFailed ? 'retry' : 'mine', describeOp(QUEUE[0]));
      }catch(err){
        if(err instanceof SendError && !err.transient && QUEUE[0].aux){
          console.error('부가 데이터 저장 거부:', err.message);
          if(!AUX_WARNED){ AUX_WARNED = true; showError('활동 기록·휴지통을 저장하지 못했어요. Supabase SQL Editor에서 supabase_schema.sql을 다시 실행해주세요. (다른 편집은 정상 저장돼요)'); }
        }else if(err instanceof SendError && !err.transient){
          // 서버가 거부한 쓰기(권한·형식 오류)는 다시 보내도 같은 결과라 큐에서 빼고 알려요
          console.error('저장 거부:', err.message, QUEUE[0]);
          showError('저장이 거부된 변경이 있어요: ' + err.message + ' — 새로고침 후 다시 확인해주세요.');
        }else{
          throw err;
        }
      }
      QUEUE.shift(); persistQueue();
      SEND_FAILED = false;
    }
  }catch(err){
    if(!SEND_FAILED) logSync('fail', `연결 끊김, 미전송 ${pendingCount()}건`);
    SEND_FAILED = true;
    console.warn('전송 실패 — 나중에 다시 보내요:', err.message);
  }
  FLUSHING = false; renderSavebar();
}

function pendingCount(){ return QUEUE.length + DEBOUNCE.size; }
function renderSavebar(){
  const bar = document.getElementById('savebar');
  const textEl = document.getElementById('savebarText');
  if(!bar || !textEl) return;
  const n = pendingCount();
  let text, state;
  if(SEND_FAILED || RT_DOWN){ text = `연결 끊김 · 미전송 ${n}건`; state = 'warn'; }
  else if(n || FLUSHING){ text = '저장 중…'; state = 'saving'; }
  else{ text = '저장됨'; state = ''; }
  textEl.textContent = text;
  const timeEl = document.getElementById('syncTime');
  if(timeEl) timeEl.textContent = LAST_SYNC_AT ? `마지막 동기화 ${fmtClock(LAST_SYNC_AT)}` : '';
  bar.classList.toggle('warn', state==='warn');
  bar.classList.toggle('saving', state==='saving');
}

async function fetchAll(table){
  const out = [];
  for(let from=0; ; from+=1000){
    const data = check(await sb.from(table).select('*').order('id').range(from, from+999));
    out.push(...data);
    if(data.length < 1000) break;
  }
  return out;
}
async function fetchServerMaps(){
  const [containers, records] = await Promise.all([fetchAll('containers'), fetchAll('records')]);
  return rowsToMaps({containers, records});
}

function loadFromMaps(maps){
  QUEUE.forEach(op=> applyOpToMaps(maps, op));
  DB_EMPTY = maps.containers.size===0;
  SORT.clear();
  maps.records.forEach(r=> SORT.set(r.id, r.sort_order));
  maps.containers.forEach(c=>{ if(c.kind==='benefit_block') SORT.set(c.id, decodeBlockKey(c.sort_key)); });
  SHADOW = cloneMaps(maps);
  STATE = DB_EMPTY ? defaultState() : rowsToState([...maps.containers.values()], [...maps.records.values()]);
  STATE.uiPrefs = loadUiPrefs();
  ensureStateShape();
  purgeOldTrash(); // 30일 지난 휴지통 항목은 여기서 비워요 (DB가 비어 있지 않으면 바로 아래에서 반영)
  // DB가 비어 있으면 아무것도 올리지 않아요 (기존 데이터 올리기를 먼저 할 수 있게). 첫 수정 때 올라가요.
  UNDO_OFF = true;
  try{ if(!DB_EMPTY) syncChanges(); }finally{ UNDO_OFF = false; } // ensureStateShape가 채운 기본값·이름 매핑만 올라가요
  updateMigrateBtn();
}

/* ════════════════════════════════════════════════════════════
   Realtime: 다른 사람의 변경을 STATE에 합치고 해당 행만 다시 그려요
   ════════════════════════════════════════════════════════════ */
let RT_BUFFER = null;  // 첫 로딩 중에 온 이벤트는 모아뒀다가 로딩 뒤에 적용
let REMOTE_RENDER = false;
let TAB_RENDER_DEFERRED = false;
const ORPHANS = new Map(); // 컨테이너보다 먼저 도착한 레코드
const ALL_FIELDS = '*';

function pendingFields(t, id){
  const set = new Set();
  if(t==='r') DEBOUNCE.forEach(e=>{ if(e.id===id) set.add(e.field); });
  for(const op of QUEUE){
    if(t==='r'){
      if((op.r||[]).some(r=>r.id===id)) return ALL_FIELDS;
      (op.p||[]).forEach(x=>{ if(x.id===id) Object.keys(x.patch).forEach(f=>set.add(f)); });
      if((op.so||[]).some(x=>x.id===id)) set.add('__sort');
    }else{
      if((op.c||[]).some(r=>r.id===id)) return ALL_FIELDS;
      (op.cp||[]).forEach(x=>{ if(x.id===id) Object.keys(x.patch).forEach(f=>set.add(f)); });
      if((op.cso||[]).some(x=>x.id===id)) set.add('__sort');
    }
  }
  return set;
}
// true면 그 필드는 로컬 값을 유지 (아직 안 보냈거나, 내가 더 나중에 저장한 값)
function localWins(t, id, ts){
  const pend = pendingFields(t, id);
  const a = ACK.get(t + ':' + id);
  return f => pend===ALL_FIELDS || pend.has(f) || !!(a && (a.fields.get(f)||0) > ts);
}
function isEditing(el){
  const a = document.activeElement;
  return !!(el && a && el.contains(a) && a.matches('input:not([type=checkbox]):not([type=file]), select, textarea'));
}

function findRecord(id){
  for(const mo of STATE.eventMonths){ const i = mo.events.findIndex(o=>o._uid===id); if(i>=0) return {kind:'event', cid:'event:'+mo.key, arr:mo.events, obj:mo.events[i]}; }
  for(const mo of STATE.bannerMonths){
    let i = mo.ranks.findIndex(o=>o._uid===id); if(i>=0) return {kind:'banner_rank', cid:'banner:'+mo.key, arr:mo.ranks, obj:mo.ranks[i]};
    i = mo.preMarketingPartners.findIndex(o=>o._uid===id); if(i>=0) return {kind:'pm_partner', cid:'banner:'+mo.key, arr:mo.preMarketingPartners, obj:mo.preMarketingPartners[i]};
  }
  for(const b of STATE.benefitBlocks){ const i = b.items.findIndex(o=>o._uid===id); if(i>=0) return {kind:'benefit_item', cid:b._blockUid, arr:b.items, obj:b.items[i]}; }
  for(const kind of ['activity', 'trash']){
    const arr = STATE[RECORD_ARRAY[kind]] || [];
    const i = arr.findIndex(o=>o._uid===id); if(i>=0) return {kind, cid:SETTINGS_ID, arr, obj:arr[i]};
  }
  return null;
}
function containerListOf(kind){
  return kind==='event_month' ? STATE.eventMonths : kind==='banner_month' ? STATE.bannerMonths : kind==='benefit_block' ? STATE.benefitBlocks : null;
}
function findContainer(id){
  for(const kind of ['event_month','banner_month','benefit_block']){
    const list = containerListOf(kind);
    const obj = list.find(c=> containerIdOf(kind, c)===id);
    if(obj) return {kind, list, obj};
  }
  return null;
}
function recordArrayFor(cid, kind){
  if(cid===SETTINGS_ID) return STATE[RECORD_ARRAY[kind]] || null;
  const c = findContainer(cid);
  return c ? c.obj[RECORD_ARRAY[kind]] : null;
}
// SORT 값 기준으로 제자리에 끼워 넣어요 (값이 없으면 fallbackIdx)
function insertBySort(arr, obj, fallbackIdx){
  const s = SORT.get(obj._uid);
  let i = s==null ? Math.min(fallbackIdx ?? arr.length, arr.length) : arr.findIndex(o=> (SORT.get(o._uid) ?? Infinity) > s);
  if(i < 0) i = arr.length;
  arr.splice(i, 0, obj);
}
function setRecordFields(kind, obj, data){
  if(kind==='banner_rank'){ obj.values = data; return; }
  Object.keys(obj).forEach(k=>{ if(k!=='_uid') delete obj[k]; });
  Object.assign(obj, data);
}
function refreshShadowRecord(id){
  const loc = findRecord(id);
  if(!loc){ SHADOW.records.delete(id); return; }
  SHADOW.records.set(id, structuredClone({id, container_id:loc.cid, kind:loc.kind, sort_order:SORT.get(id) ?? 0, data:recordData(loc.kind, loc.obj)}));
}
function refreshShadowContainer(id){
  if(id===SETTINGS_ID){
    const data = {}; SETTINGS_FIELDS.forEach(k=>{ if(STATE[k]!==undefined) data[k] = STATE[k]; });
    SHADOW.containers.set(id, structuredClone({id, kind:'settings', sort_key:'', data}));
    return;
  }
  const c = findContainer(id);
  if(!c){ SHADOW.containers.delete(id); return; }
  const sort_key = c.kind==='benefit_block' ? encodeBlockKey(SORT.get(id) ?? 0) : c.obj.key;
  SHADOW.containers.set(id, structuredClone({id, kind:c.kind, sort_key, data:containerData(c.kind, c.obj)}));
}

function onRealtime(table, payload){
  if(RT_BUFFER){ RT_BUFFER.push([table, payload]); return; }
  if(!STATE) return;
  // 빈 DB에서 기본 화면만 보고 있는데 누가 데이터를 올리면, 내 임시 기본값을 버리고 서버 것으로 다시 불러와요
  if(DB_EMPTY && !MIGRATED && SHADOW.containers.size===0){ resyncFromServer(); return; }
  const t = table==='containers' ? 'c' : 'r';
  try{
    if(payload.eventType==='DELETE'){
      const id = payload.old && payload.old.id;
      if(!id) return;
      if(MY_DELETES.delete(t + ':' + id)) return; // 내가 지운 것이 되돌아온 이벤트
      const gone = t==='r' ? (findRecord(id)||{}).cid : (findContainer(id) ? id : null);
      noteRemoteDelete(t, id);
      t==='r' ? remoteDeleteRecord(id) : remoteDeleteContainer(id);
      if(gone && gone!==SETTINGS_ID) logRemote(gone, t==='r', '삭제');
      return;
    }
    const row = payload.new;
    const ts = Date.parse(row.updated_at);
    const a = ACK.get(t + ':' + row.id);
    if(a && row.updated_by===CLIENT_ID && ts <= a.ts) return; // 이 탭이 보낸 변경이 되돌아온 이벤트
    const verb = t==='r' ? (findRecord(row.id) ? '수정' : '추가') : (findContainer(row.id) ? '설정 변경' : '새로 만듦');
    t==='r' ? remoteRecord(row, ts) : remoteContainer(row, ts);
    const logCid = t==='r' ? row.container_id : row.id;
    if(logCid!==SETTINGS_ID) logRemote(logCid, t==='r', verb); // 공통 설정·활동 기록·휴지통은 동기화 기록에 남기지 않아요
  }catch(err){ console.error('실시간 반영 오류:', err); }
}

function remoteRecord(row, ts){
  const targetArr = recordArrayFor(row.container_id, row.kind);
  if(!targetArr){ ORPHANS.set(row.id, row); return; }
  const wins = localWins('r', row.id, ts);
  const loc = findRecord(row.id);
  let obj;
  if(loc){
    const local = recordData(loc.kind, loc.obj);
    detectConflicts(row, loc.kind, local, wins);
    const merged = structuredClone(row.data);
    Object.keys(local).forEach(f=>{ if(wins(f)) merged[f] = local[f]; });
    setRecordFields(row.kind, loc.obj, merged);
    obj = loc.obj;
  }else{
    obj = recordObj(row);
  }
  const oldSort = SORT.get(row.id);
  if(!wins('__sort')) SORT.set(row.id, row.sort_order);
  const moveContainer = !!loc && loc.arr!==targetArr && !wins('__container');
  const resort = !!loc && SORT.get(row.id)!==oldSort;
  if(!loc) insertBySort(targetArr, obj);
  else if(moveContainer || resort){
    loc.arr.splice(loc.arr.indexOf(obj), 1);
    insertBySort(moveContainer ? targetArr : loc.arr, obj);
  }
  // 새 행·이동은 표 단위로, 값만 바뀐 건 그 행만. 프리마케팅은 주차×순위 격자라 격자 단위로 그려요.
  const structural = !loc || moveContainer || resort || row.kind==='pm_partner';
  refreshShadowRecord(row.id);
  afterRemoteRecord(moveContainer ? loc.cid : row.container_id, row.id, structural);
  if(moveContainer) afterRemoteRecord(row.container_id, row.id, true);
}

// 같은 칸을 두 사람이 동시에 고쳤을 때 알려요.
//  - 내가 입력 중(아직 저장 전)인데 상대가 바꿨으면: 내 값이 저장된다고 알리고 [되돌리기]로 상대 값을 쓸 수 있게
//  - 칸에 커서만 있는데 상대가 바꿨으면: 칸에서 나가면 새 값이 보인다고 알림
const CONFLICT_SEEN = new Map();
const BENEFIT_FIELD_LABELS = { name:'혜택명', copy:'문구', status:'작업현황', expiryDate:'종료일' };
function fieldLabelOf(kind, f){
  if(kind==='event') return EVENT_FIELD_LABELS[f] || (f==='id' ? '이벤트ID' : f);
  if(kind==='benefit_item') return BENEFIT_FIELD_LABELS[f] || f;
  if(kind==='pm_partner') return '파트너사';
  return f; // 배너 순위는 구좌 이름이 곧 칸 이름
}
function focusedFieldOf(id){
  const a = document.activeElement;
  const tr = a && a.closest ? a.closest('tr[data-uid]') : null;
  if(!tr || tr.dataset.uid!==id) return null;
  return a.dataset.field || a.dataset.col || null;
}
function detectConflicts(row, kind, local, wins){
  if(AUX_KINDS.has(kind)) return;
  const focusField = focusedFieldOf(row.id);
  Object.keys(row.data).forEach(f=>{
    const mine = local[f], theirs = row.data[f];
    if(JSON.stringify(mine)===JSON.stringify(theirs)) return;
    const bk = row.id + '\u0001' + f;
    if(wins(f)){
      if(PENDING_BASE.has(bk) && JSON.stringify(PENDING_BASE.get(bk))!==JSON.stringify(theirs)) notifyConflict(row.id, kind, f, theirs, 'overwrite');
    }else if(focusField===f){
      notifyConflict(row.id, kind, f, theirs, 'incoming');
    }
  });
}
function notifyConflict(id, kind, f, theirs, mode){
  const key = id + '\u0001' + f + '\u0001' + JSON.stringify(theirs);
  if(CONFLICT_SEEN.has(key)) return;
  CONFLICT_SEEN.set(key, 1); setTimeout(()=> CONFLICT_SEEN.delete(key), 5000);
  const label = fieldLabelOf(kind, f);
  const shown = String(theirs ?? '').slice(0, 30) || '(빈 값)';
  if(mode==='incoming'){ showToast(`다른 사람이 '${label}'을(를) '${shown}'(으)로 바꿨어요. 칸에서 나가면 새 값이 보여요.`, ''); return; }
  showUndoToast(`다른 사람도 '${label}'을(를) '${shown}'(으)로 바꿨어요. 지금은 내 입력이 저장돼요.`, ()=> applyTheirs(id, kind, f, theirs));
}
function applyTheirs(id, kind, f, v){
  const loc = findRecord(id); if(!loc) return;
  if(kind==='banner_rank') loc.obj.values[f] = v; else loc.obj[f] = v;
  saveField(id, f, v);
  document.querySelectorAll(`tr[data-uid="${CSS.escape(id)}"]`).forEach(tr=>{
    const inp = tr.querySelector(`[data-field="${CSS.escape(f)}"], [data-col="${CSS.escape(f)}"]`);
    if(inp) inp.value = (f==='dueDate' || f==='reflectStatus') ? dotToIso(v) : (v ?? '');
  });
}

// 다른 사람이 달·블록·행을 지우면 알려요. 줄줄이 오는 삭제(달 삭제 때 그 안의 행들)는 0.5초 모아서 한 번만 알려요.
let REMOTE_DEL = null;
function noteRemoteDelete(t, id){
  const editingUid = (document.activeElement && document.activeElement.closest && document.activeElement.closest('tr[data-uid]') || {dataset:{}}).dataset.uid;
  const typing = u=> u===editingUid || [...DEBOUNCE.values()].some(e=> e.id===u);
  const d = REMOTE_DEL || (REMOTE_DEL = {labels:[], rows:0, editing:false});
  if(t==='c'){
    const loc = findContainer(id);
    if(!loc || loc.kind==='settings') return;
    d.labels.push(loc.kind==='benefit_block' ? formatBenefitLabel(loc.obj.label) : loc.obj.label);
    if(editingUid && (findRecord(editingUid)||{}).cid===id) d.editing = true;
  }else{
    const loc = findRecord(id);
    if(!loc || AUX_KINDS.has(loc.kind)) return;
    d.rows++;
    if(typing(id)) d.editing = true;
  }
  clearTimeout(d.timer);
  d.timer = setTimeout(()=>{
    REMOTE_DEL = null;
    const what = d.labels.length ? `'${d.labels.join("', '")}'` : `행 ${d.rows}개`;
    showToast(`${d.editing ? '입력 중이던 행이 삭제됐어요. ' : ''}다른 사람이 ${what}을(를) 삭제했어요. 휴지통에서 복구할 수 있어요.`, d.editing ? 'error' : 'success');
  }, 500);
}
function remoteDeleteRecord(id){
  const loc = findRecord(id);
  if(!loc) return;
  if(pendingFields('r', id)===ALL_FIELDS) return; // 내가 방금 다시 넣은(되돌리기) 행
  loc.arr.splice(loc.arr.indexOf(loc.obj), 1);
  selectedEventUids.delete(id);
  SHADOW.records.delete(id);
  afterRemoteRecord(loc.cid, id, true);
}

function remoteContainer(row, ts){
  const wins = localWins('c', row.id, ts);
  if(row.kind==='settings'){
    SETTINGS_FIELDS.forEach(f=>{ if(row.data[f]!==undefined && !wins(f)) STATE[f] = structuredClone(row.data[f]); });
    refreshShadowContainer(row.id);
    return;
  }
  const list = containerListOf(row.kind);
  const loc = findContainer(row.id);
  if(loc){
    const local = containerData(row.kind, loc.obj);
    const merged = structuredClone(row.data);
    Object.keys(local).forEach(f=>{ if(wins(f)) merged[f] = local[f]; });
    Object.keys(loc.obj).forEach(k=>{ if(!CHILD_KEYS[row.kind].includes(k)) delete loc.obj[k]; });
    Object.assign(loc.obj, merged);
  }else{
    const obj = structuredClone(row.data);
    CHILD_KEYS[row.kind].forEach(k=> obj[k] = []);
    if(row.kind==='benefit_block') SORT.set(row.id, decodeBlockKey(row.sort_key));
    list.push(obj);
  }
  if(row.kind==='benefit_block'){
    if(!wins('__sort')) SORT.set(row.id, decodeBlockKey(row.sort_key));
    list.sort((a,b)=> (SORT.get(a._blockUid) ?? 0) - (SORT.get(b._blockUid) ?? 0));
  }else{
    list.sort((a,b)=> a.key<b.key ? -1 : a.key>b.key ? 1 : 0);
  }
  refreshShadowContainer(row.id);
  updateMigrateBtn();
  ORPHANS.forEach((r, rid)=>{ if(r.container_id===row.id){ ORPHANS.delete(rid); remoteRecord(r, Date.parse(r.updated_at)); } });
  rerenderTabSoon(row.kind);
}

function remoteDeleteContainer(id){
  if(pendingFields('c', id)===ALL_FIELDS) return;
  const loc = findContainer(id);
  if(!loc) return;
  loc.list.splice(loc.list.indexOf(loc.obj), 1);
  SHADOW.containers.delete(id);
  SHADOW.records.forEach((r, rid)=>{ if(r.container_id===id) SHADOW.records.delete(rid); });
  ensureStateShape(); // 마지막 달까지 지워졌을 때 화면이 깨지지 않도록
  rerenderTabSoon(loc.kind);
}

const TAB_OF_KIND = { event_month:['events'], banner_month:['banner','pm'], benefit_block:['benefit'] };
function rerenderTabSoon(kind){
  if(!TAB_OF_KIND[kind].includes(activeMainTab)) return; // 다른 탭은 탭을 열 때 새로 그려요
  if(isEditing(document.getElementById('tab-'+activeMainTab))){ TAB_RENDER_DEFERRED = true; return; }
  renderActiveTab();
}

function afterRemoteRecord(cid, id, structural){
  REMOTE_RENDER = true;
  try{
    if(structural){
      document.querySelectorAll('[data-container]').forEach(el=>{
        if(el.dataset.container===cid && el.__rerender) el.__rerender();
      });
    }else{
      refreshRow(id);
    }
    if(activeMainTab==='events' && cid==='event:'+activeEventMonthKey){
      renderStatusboard(); renderEventStatusFilterRow(); renderBulkBar();
    }
    refreshCounts();
    if(cid===SETTINGS_ID){ renderActivityLogIfOpen(); renderTrashIfOpen(); }
  }finally{ REMOTE_RENDER = false; }
}

// tbody 채우기: 원격 변경으로 다시 그릴 때는 지금 입력 중인 행의 DOM은 그대로 두고, 나머지만 바꿔요.
function fillTbody(tbody, opts){
  tbody.dataset.container = opts.cid;
  tbody.__rerender = opts.rerender;
  tbody.__rowFor = opts.rowFor;
  tbody.__bind = opts.bind;
  const bindAll = root=> root.querySelectorAll('tr[data-uid]').forEach(tr=> opts.bind(tr));
  const keep = REMOTE_RENDER ? [...tbody.children].find(tr=> isEditing(tr)) : null;
  if(!keep){ tbody.innerHTML = opts.html; bindAll(tbody); applyPeerMarks(); return; }
  const tmp = document.createElement('tbody');
  tmp.innerHTML = opts.html;
  [...tbody.children].forEach(tr=>{ if(tr!==keep) tr.remove(); });
  let before = true;
  [...tmp.children].forEach(tr=>{
    if(tr.dataset.uid && tr.dataset.uid===keep.dataset.uid){ before = false; return; }
    tbody.insertBefore(tr, before ? keep : null);
    if(tr.dataset.uid) opts.bind(tr);
  });
  keep.dataset.stale = '1'; // 포커스가 빠지면 최신 값으로 다시 그려요
  applyPeerMarks();
}
function refreshRow(id){
  document.querySelectorAll(`tr[data-uid="${CSS.escape(id)}"]`).forEach(tr=>{
    const tbody = tr.parentElement;
    if(!tbody || !tbody.__rowFor) return;
    if(isEditing(tr)){ tr.dataset.stale = '1'; return; }
    redrawRow(tr);
  });
}
function redrawRow(tr){
  const tbody = tr.parentElement;
  delete tr.dataset.stale;
  const html = tbody.__rowFor(tr.dataset.uid);
  if(html==null){ tbody.__rerender(); return; }
  const tmp = document.createElement('tbody');
  tmp.innerHTML = html;
  const fresh = tmp.firstElementChild;
  tr.replaceWith(fresh);
  tbody.__bind(fresh);
  applyPeerMarks();
}
document.addEventListener('focusout', ()=>{
  setTimeout(()=>{
    document.querySelectorAll('tr[data-stale]').forEach(tr=>{ if(!isEditing(tr) && tr.parentElement) redrawRow(tr); });
    if(TAB_RENDER_DEFERRED && !isEditing(document.getElementById('tab-'+activeMainTab))){
      TAB_RENDER_DEFERRED = false;
      renderActiveTab();
    }
  }, 0);
});

function subscribeRealtime(){
  RT_CHANNEL = sb.channel('alddot-db', { config:{ presence:{ key: CLIENT_ID } } });
  RT_CHANNEL
    .on('presence', {event:'sync'}, renderPresence)
    .on('postgres_changes', {event:'*', schema:'public', table:'containers'}, p=> onRealtime('containers', p))
    .on('postgres_changes', {event:'*', schema:'public', table:'records'}, p=> onRealtime('records', p))
    .subscribe(status=>{
      if(status==='SUBSCRIBED'){
        const wasDown = RT_DOWN;
        RT_DOWN = false; renderSavebar();
        trackPresence();
        flushQueue().then(()=>{ if(wasDown) resyncFromServer(); });
      }else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){
        RT_DOWN = true; renderSavebar();
      }
    });
}
// 재연결 뒤: 끊겨 있던 동안 놓친 변경을 서버에서 다시 받아요
async function resyncFromServer(){
  if(RT_BUFFER) return; // 이미 불러오는 중
  RT_BUFFER = [];
  try{
    flushDebounces();
    await flushQueue();
    loadFromMaps(await fetchServerMaps());
  }catch(err){ console.warn('다시 불러오기 실패:', err.message); }
  const buffered = RT_BUFFER; RT_BUFFER = null;
  LAST_SYNC_AT = new Date(); renderSavebar();
  buffered.forEach(([table, p])=> onRealtime(table, p));
  if(isEditing(document.getElementById('tab-'+activeMainTab))) TAB_RENDER_DEFERRED = true;
  else renderActiveTab();
}

/* ════════════════════════════════════════════════════════════
   동기화 기록: 이 창을 연 뒤의 최근 50건 (메모리에만 보관)
   ════════════════════════════════════════════════════════════ */
const SYNC_LOG = [];
let LAST_SYNC_AT = null;
const SYNC_KIND_LABEL = { mine:'내 저장', remote:'다른 사람 변경', fail:'전송 실패', retry:'재전송 완료' };
const CLOCK_FORMAT = new Intl.DateTimeFormat('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
const fmtClock = d => CLOCK_FORMAT.format(d);

// 'event:2026-10' → '26년 10월 이벤트' (지워진 컨테이너도 id로 이름을 만들어요)
function describeTarget(cid){
  if(cid===SETTINGS_ID) return '공통 설정';
  const c = findContainer(cid);
  if(c) return c.kind==='benefit_block' ? `${formatBenefitLabel(c.obj.label)} 혜택` : `${c.obj.label} ${c.kind==='event_month' ? '이벤트' : '배너·프리마케팅'}`;
  const m = String(cid).match(/^(event|banner):(\d{4})-(\d{2})$/);
  return m ? `${m[2].slice(2)}년 ${+m[3]}월 ${m[1]==='event' ? '이벤트' : '배너·프리마케팅'}` : '혜택 블록';
}
function describeOp(op){
  const n = k => (op[k]||[]).length;
  const cidOfRecord = id => (SHADOW.records.get(id)||{}).container_id;
  const cids = new Set([
    ...(op.r||[]).map(r=>r.container_id), ...(op.p||[]).map(x=>cidOfRecord(x.id)), ...(op.so||[]).map(x=>cidOfRecord(x.id)),
    ...(op.c||[]).map(r=>r.id), ...(op.cp||[]).map(x=>x.id), ...(op.cso||[]).map(x=>x.id), ...(op.dc||[]),
  ].filter(c=> c && c!==SETTINGS_ID));
  const target = cids.size===1 ? describeTarget([...cids][0]) : cids.size ? `${cids.size}곳` : '공통 설정';
  const parts = [];
  if(n('c')) parts.push('새로 만듦');
  if(n('dc')) parts.push('삭제');
  if(n('r')) parts.push(`${n('r')}행 추가`);
  if(n('p')) parts.push(`${n('p')}행 수정`);
  if(n('so')) parts.push(`${n('so')}행 이동`);
  if(n('dr')) parts.push(`${n('dr')}행 삭제`);
  if(!parts.length) parts.push('설정 변경');
  return `${target} · ${parts.join(', ')}`;
}
function logSync(kind, text, extra){
  if(kind!=='fail') LAST_SYNC_AT = new Date();
  SYNC_LOG.unshift({at: Date.now(), kind, text, ...(extra||{})});
  if(SYNC_LOG.length > 50) SYNC_LOG.length = 50;
  renderSavebar();
  if(!document.getElementById('syncLog').classList.contains('hidden')) renderSyncLog();
}
// 다른 사람 변경은 같은 곳·같은 동작이 1.5초 안에 이어지면 한 줄로 묶어요 (일괄 처리 한 번이 수십 줄이 되지 않게)
function logRemote(cid, isRecord, verb){
  const last = SYNC_LOG[0];
  const text = count => isRecord ? `${describeTarget(cid)} · ${count}행 ${verb}` : `${describeTarget(cid)} · ${verb}`;
  if(last && last.kind==='remote' && last.cid===cid && last.verb===verb && isRecord && Date.now() - last.at < 1500){
    last.count++; last.at = Date.now(); last.text = text(last.count);
    LAST_SYNC_AT = new Date(); renderSavebar();
    if(!document.getElementById('syncLog').classList.contains('hidden')) renderSyncLog();
    return;
  }
  logSync('remote', text(1), {cid, verb, count:1});
}
function renderSyncLog(){
  if(LOG_TAB==='activity'){ renderActivityList(); return; }
  const list = document.getElementById('syncLogList');
  list.innerHTML = SYNC_LOG.length
    ? SYNC_LOG.map(e=>`<li class="sync-log-row"><time datetime="${new Date(e.at).toISOString()}">${fmtClock(new Date(e.at))}</time><span class="sync-kind ${e.kind}">${SYNC_KIND_LABEL[e.kind]}</span><span>${escapeHtml(e.text)}</span></li>`).join('')
    : `<li class="sync-log-empty">아직 기록이 없어요. 내용을 고치거나 다른 사람이 바꾸면 여기에 쌓여요.</li>`;
}
function setSyncLogOpen(open){
  const pop = document.getElementById('syncLog');
  const btn = document.getElementById('savebar');
  pop.classList.toggle('hidden', !open);
  btn.setAttribute('aria-expanded', String(open));
  if(open){ renderSyncLog(); document.getElementById('syncLogClose').focus(); }
}
document.getElementById('savebar').addEventListener('click', ()=> setSyncLogOpen(document.getElementById('syncLog').classList.contains('hidden')));
document.getElementById('syncLogClose').addEventListener('click', ()=>{ setSyncLogOpen(false); document.getElementById('savebar').focus(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !document.getElementById('syncLog').classList.contains('hidden')){ setSyncLogOpen(false); document.getElementById('savebar').focus(); }
});
document.addEventListener('click', e=>{
  if(document.getElementById('syncLog').classList.contains('hidden')) return;
  if(!e.target.closest('#syncLog') && !e.target.closest('#savebar')) setSyncLogOpen(false);
});

/* ════════════════════════════════════════════════════════════
   편집 모달 공통 (구좌 편집 · 파트너명 · 휴지통)
   ════════════════════════════════════════════════════════════ */
function openPanelModal({title, bodyHtml, onMount, actions}){
  const ov = document.getElementById('panelModalOverlay');
  const body = document.getElementById('panelModalBody');
  const act = document.getElementById('panelModalActions');
  document.getElementById('panelModalTitle').textContent = title;
  body.innerHTML = bodyHtml;
  act.innerHTML = '';
  const onKey = e=>{ if(e.key==='Escape' && document.getElementById('confirmModalOverlay').classList.contains('hidden')) close(); };
  const onOv = e=>{ if(e.target===ov) close(); };
  function close(){ ov.classList.add('hidden'); document.removeEventListener('keydown', onKey); ov.removeEventListener('click', onOv); }
  (actions || [{label:'닫기'}]).forEach(a=>{
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = a.label;
    if(a.primary) b.className = 'primary';
    b.addEventListener('click', ()=>{ if(a.onClick && a.onClick(body, close)===false) return; close(); });
    act.appendChild(b);
  });
  ov.classList.remove('hidden');
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', onOv);
  if(onMount) onMount(body, close);
  const first = body.querySelector('input, button') || act.querySelector('button');
  if(first) setTimeout(()=> first.focus(), 30);
  return close;
}
const DATETIME_FORMAT = new Intl.DateTimeFormat('ko-KR', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
const fmtDateTime = d => DATETIME_FORMAT.format(d instanceof Date ? d : new Date(d));
function monthLabelOfKey(key){ const [y, m] = String(key).split('-'); return `${y.slice(2)}년 ${+m}월`; }
function saveUiPrefs(){ try{ localStorage.setItem(UI_PREFS_KEY, JSON.stringify(STATE.uiPrefs || {})); }catch(e){ /* 저장 불가: 이번 창에서만 유지 */ } }

/* ════════════════════════════════════════════════════════════
   휴지통: 지운 달·블록·행을 30일 동안 보관해요
   ════════════════════════════════════════════════════════════ */
const TRASH_DAYS = 30;
const TRASH_TYPE_LABEL = { rows:'행', event_month:'이벤트 달', banner_month:'배너·프리마케팅 달', benefit_block:'혜택 블록' };
function moveToTrash(type, label, payload, extra){
  const entry = {_uid: uid(), at: new Date().toISOString(), type, label, payload: structuredClone(payload), ...(extra || {})};
  STATE.trash.unshift(entry);
  return entry._uid;
}
function dropTrash(tUid){ const i = STATE.trash.findIndex(t=>t._uid===tUid); if(i>=0) STATE.trash.splice(i, 1); }
function purgeOldTrash(){
  const cut = Date.now() - TRASH_DAYS*86400000;
  const before = STATE.trash.length;
  for(let i=STATE.trash.length-1; i>=0; i--) if(!(Date.parse(STATE.trash[i].at) >= cut)) STATE.trash.splice(i, 1);
  return before !== STATE.trash.length;
}
function restoreTrash(tUid){
  const t = STATE.trash.find(x=>x._uid===tUid);
  if(!t) return;
  if(t.type==='rows'){
    const arr = recordArrayFor(t.cid, t.recKind);
    if(!arr){ showError(`원래 있던 곳(${describeTarget(t.cid)})이 없어서 복구할 수 없어요. 그 달·블록을 먼저 복구해주세요.`); return; }
    let n = 0;
    t.payload.forEach(o=>{ if(!findRecord(o._uid)){ insertBySort(arr, structuredClone(o)); n++; } });
    if(!n){ dropTrash(tUid); syncChanges(); renderTrashList(); showToast('이미 복구된 행이라 휴지통에서만 지웠어요.'); return; }
  }else{
    const obj = structuredClone(t.payload);
    if(findContainer(containerIdOf(t.type, obj))){ showError(`'${t.label}'이(가) 이미 있어서 복구하지 않았어요.`); return; }
    const list = containerListOf(t.type);
    if(t.type==='benefit_block') list.splice(Math.min(t.index ?? 0, list.length), 0, obj);
    else{ list.push(obj); list.sort((a,b)=> a.key<b.key ? -1 : 1); }
  }
  dropTrash(tUid);
  logActivity('♻️', `휴지통에서 복구: ${t.label}`, TRASH_TYPE_LABEL[t.type], null);
  syncChanges();
  renderActiveTab();
  renderTrashList();
  showToast(`'${t.label}'을(를) 복구했어요.`);
}
function renderTrashList(){
  const el = document.getElementById('trashList');
  if(!el) return;
  el.innerHTML = STATE.trash.length ? STATE.trash.map(t=>`
    <div class="trash-row">
      <div><b>${escapeHtml(t.label)}</b><div class="meta">${TRASH_TYPE_LABEL[t.type] || ''}${t.type==='rows' ? ` ${t.payload.length}개` : ''} · ${escapeHtml(fmtDateTime(t.at))} 삭제</div></div>
      <button type="button" class="sm" data-restore="${escapeHtml(t._uid)}">복구</button>
    </div>`).join('') : '<p class="sync-log-empty">휴지통이 비어 있어요.</p>';
  el.querySelectorAll('[data-restore]').forEach(b=> b.addEventListener('click', ()=> restoreTrash(b.dataset.restore)));
}
function renderTrashIfOpen(){ renderTrashList(); }
function openTrash(){
  openPanelModal({
    title: '🗑 휴지통',
    bodyHtml: `<p class="sub" style="margin:0 0 10px;">지운 달·블록·행을 ${TRASH_DAYS}일 동안 보관해요. ${TRASH_DAYS}일이 지나면 자동으로 비워져요.</p><div id="trashList"></div>`,
    onMount: renderTrashList,
  });
}
document.getElementById('trashBtn').addEventListener('click', openTrash);

/* ════════════════════════════════════════════════════════════
   활동 기록 (동기화 기록 패널의 두 번째 탭)
   ════════════════════════════════════════════════════════════ */
let LOG_TAB = 'sync';
function setLogTab(tab){
  LOG_TAB = tab;
  document.getElementById('logTabSync').setAttribute('aria-selected', String(tab==='sync'));
  document.getElementById('logTabActivity').setAttribute('aria-selected', String(tab==='activity'));
