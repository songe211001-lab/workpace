      for(const mo of S.bannerMonths){if(!/^\d{4}-\d{2}$/.test(mo.key||''))continue;const mid=bnMid(mo.key),ex=evtMonths.find(m=>m.id===mid);
        const cols=(mo.columns||[]).map(nm=>({id:(ex?.cols||[]).find(x=>x.name===nm)?.id||bnColId(),name:nm}));
        await db.collection('evt_months').doc(mid).set({kind:'banner_month',sortKey:mo.key,key:mo.key,label:mo.label||evLabelOf(mo.key),cols,hidden:cols.filter(c=>(mo.hiddenColumns||[]).includes(c.name)).map(c=>c.id),
          cycleWeeks:mo.cycleWeeks||4,weekAnchor:mo.weekAnchor||bnAnchor(mo.key),partners:mo.partners||[],changeLog:mo.changeLog||[],...(mo.pmRankCount?{pmRankCount:mo.pmRankCount}:{})});
        for(const [i,r] of (mo.ranks||[]).entries()){let u=String(r._uid||'');if(!u||seen.has(u)||!/^[\w-]+$/.test(u))u=evUid();seen.add(u);
          const d={monthId:mid,kind:'banner_rank',sortOrder:i};cols.forEach(c=>{const v=r.values?.[c.name];if(v!=null&&v!=='')d['v_'+c.id]=mapN(v);});await db.collection('evt_rows').doc(u).set(d);nb++;}
        for(const x of (mo.preMarketingPartners||[])){let u=String(x._uid||'');if(!u||seen.has(u)||!/^[\w-]+$/.test(u))u=evUid();seen.add(u);
          await db.collection('evt_rows').doc(u).set({monthId:mid,kind:'pm_partner',sortOrder:0,name:mapN(x.name||''),week:x.week,rankInWeek:x.rankInWeek});nb++;}
        if(nb%20===0)$('#ecYes').textContent=`가져오는 중… 배너 ${nb}건`;}
      // 혜택 블록: 파일 순서([0]이 최신)를 sortKey로(클수록 최신). 블록 _uid를 문서 id에 써서 다시 가져와도 중복 없음
      let nf=0;for(const [bi2,b] of S.benefitBlocks.entries()){let bu=String(b._uid||'');if(!bu||!/^[\w-]+$/.test(bu))bu=evUid();const mid='benefit_'+bu;
        await db.collection('evt_months').doc(mid).set({kind:'benefit_block',sortKey:S.benefitBlocks.length-bi2,label:b.label||''});
        for(const [i,it] of (b.items||[]).entries()){let u=String(it._uid||'');if(!u||seen.has(u)||!/^[\w-]+$/.test(u))u=evUid();seen.add(u);
          await db.collection('evt_rows').doc(u).set({monthId:mid,kind:'benefit_item',sortOrder:i,name:it.name||'',copy:it.copy||'',status:it.status||'',expiryDate:it.expiryDate||''});nf++;}}
      logChange('evt','create','import','관리대장 데이터 가져오기',null,null,`이벤트 ${S.eventMonths.length}개 달 · ${n}건, 배너 ${S.bannerMonths.length}개 달 · ${nb}건, 혜택 ${S.benefitBlocks.length}개 블록 · ${nf}건`);
      est.month=null;bst.month=null;bfst.cur=null;toast(`이벤트 ${n}건, 배너·프리마케팅 ${nb}건, 혜택 ${nf}건을 가져왔어요.`);render();
    },'가져오기');
  };
  rd.readAsText(file);
}

/* ---------- 이벤트 운영 2단계: 배너 구좌 관리 · 프리마케팅 관리(같은 배너 달을 함께 씀) ----------
   evt_months 'banner_YYYY-MM' = {kind:'banner_month', sortKey, key, label, cols:[{id,name}], hidden:[칸 id], cycleWeeks, weekAnchor, partners, changeLog, pmRankCount}
   evt_rows kind 'banner_rank' = {monthId, sortOrder, 'v_<칸 id>': 파트너} — 칸 id로 저장해 이름을 바꿔도 값은 그대로, 칸마다 따로 update
   evt_rows kind 'pm_partner' = {monthId, sortOrder, name, week, rankInWeek} */
const BN_DEF_COLS=['메인 팝업','메인 상단','메인 하단','이벤트/썸네일'];
const bnMid=k=>'banner_'+k;
const bnColId=()=>'c'+Math.random().toString(36).slice(2,8);
const bnMonthList=()=>evtMonths.filter(m=>m.kind==='banner_month').sort((a,b)=>(a.sortKey||'')<(b.sortKey||'')?-1:1);
const bnRanks=mid=>evtRowsAll.filter(r=>r.monthId===mid&&r.kind==='banner_rank').sort((a,b)=>(a.sortOrder-b.sortOrder)||(a.id<b.id?-1:1));
const bnPms=mid=>evtRowsAll.filter(r=>r.monthId===mid&&r.kind==='pm_partner');
const bnVisCols=mo=>(mo.cols||[]).filter(c=>!(mo.hidden||[]).includes(c.id));
// 파트너명 매핑(원본 이름 → 표시 이름), 원본 applyPartnerNameMap과 같은 규칙
const bnMap=v=>{if(!v)return v;const m=evSettings().partnerNameMap||{};return m[String(v).trim()]||v;};
// 매달 1일 이후 첫 목요일 오전 10시(원본 defaultWeekAnchor)
function bnAnchor(key){const [y,m]=key.split('-').map(Number),dow=new Date(y,m-1,1).getDay();return `${key}-${String(1+(4-dow+7)%7).padStart(2,'0')}T10:00`;}
// 현재 관리 주차(원본 computeCurrentWeek)
function bnWeek(mo){const a=new Date(String(mo.weekAnchor||'').replace(' ','T'));if(isNaN(a))return 1;const c=mo.cycleWeeks||4;return Math.max(1,Math.min(c,1+Math.floor((Date.now()-a)/864e5/7)));}
const bnMaxRank=(mo,pms)=>Math.max(6,pms.length?Math.max(...pms.map(p=>p.rankInWeek||1)):0,mo.pmRankCount||0);
const bst={month:null};
function bnDefaultMonth(){const L=bnMonthList();if(!L.length)return null;const d=new Date(),n=`${d.getMonth()===11?d.getFullYear()+1:d.getFullYear()}-${String(d.getMonth()===11?1:d.getMonth()+2).padStart(2,'0')}`;return L.some(m=>m.key===n)?n:L[L.length-1].key;}

function bnRankRow(mo,r,i,cur){
  const cols=bnVisCols(mo),ro=canWrite?'':'disabled';
  return `<tr data-buid="${esc(r.id)}" ${cur&&canWrite?'draggable="true"':''}><td class="evOrd"><span class="num">${i+1}</span>${canWrite?`<span class="evArr"><button type="button" class="btn ghost sm" data-bmv="-1" aria-label="위로" title="위로"><svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button><button type="button" class="btn ghost sm" data-bmv="1" aria-label="아래로" title="아래로"><svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></span>`:''}</td>
    ${cols.map(c=>`<td><input class="bnf" data-col="${esc(c.id)}" value="${esc(r['v_'+c.id]||'')}" aria-label="${esc(c.name)}" ${ro}></td>`).join('')}<td>${canWrite?'<button type="button" class="btn ghost sm bnDel" aria-label="행 삭제">삭제</button>':''}</td></tr>`;
}
function bnRankTable(mo,cur){
  const rs=bnRanks(mo.id),cols=bnVisCols(mo);
  return `<div class="tablebox"><table class="stable evTable bnTable" data-mid="${esc(mo.id)}"><thead><tr><th>순서</th>${cols.map(c=>`<th>${esc(c.name)}</th>`).join('')}<th></th></tr></thead><tbody>
    ${rs.length?rs.map((r,i)=>bnRankRow(mo,r,i,cur)).join(''):`<tr class="mEmpty"><td colspan="${cols.length+2}">등록된 순위가 없어요.${cur&&canWrite?" '+ 행 추가'로 시작하세요.":''}</td></tr>`}</tbody></table></div>`;
}
function bnPmGrid(mo,cur){
  const pms=bnPms(mo.id),cyc=mo.cycleWeeks||4,max=bnMaxRank(mo,pms),wk=bnWeek(mo),ro=canWrite?'':'disabled';
  let h=`<div class="tablebox"><table class="stable evTable pmTable" data-mid="${esc(mo.id)}"><thead><tr><th>순위</th>`;
  for(let w=1;w<=cyc;w++)h+=`<th>${w}주차${w===wk?' · 진행중':''}</th>`;
  h+='</tr></thead><tbody>';
  for(let rk=1;rk<=max;rk++){h+=`<tr><td class="num">${rk}</td>`;for(let w=1;w<=cyc;w++){const e=pms.find(p=>p.week===w&&p.rankInWeek===rk);h+=`<td><input class="pmf" data-week="${w}" data-rank="${rk}" value="${esc(e?.name||'')}" placeholder="파트너사명" aria-label="${w}주차 ${rk}위" ${ro}></td>`;}h+='</tr>';}
  return h+`</tbody></table></div>${cur&&canWrite?`<div class="evHead"><button type="button" class="btn sm" id="pmAddRank">+ 순위 추가</button><button type="button" class="btn sm" id="pmDelRank" ${max<=6?'disabled':''}>마지막 순위 지우기</button></div>`:''}`;
}
function bnPmStatus(mo){
  const wk=bnWeek(mo),a=new Date(String(mo.weekAnchor||'').replace(' ','T')),dl=isNaN(a)?null:new Date(a.getTime()+wk*7*864e5),past=!!dl&&Date.now()>=dl;
  const f=d=>!d?'-':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const st=!dl?'-':past?'마감 지남':`마감 전 D-${Math.round((new Date(dl.getFullYear(),dl.getMonth(),dl.getDate())-new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))/864e5)}`;
  const ro=canWrite?'':'disabled';
  return `<div class="pmStat"><label class="pmItem"><span>기준일시</span><input type="datetime-local" class="sel pmSet" data-set="weekAnchor" value="${esc(String(mo.weekAnchor||'').slice(0,16))}" ${ro}></label>
    <label class="pmItem"><span>배치 주기</span><input type="number" class="sel pmSet" data-set="cycleWeeks" min="1" max="12" value="${mo.cycleWeeks||4}" ${ro}></label>
    <div class="pmItem"><span>현재 관리 주차</span><b>${wk}주차</b></div><div class="pmItem"><span>게재 마감</span><b class="num">${f(dl)}</b></div>
    <div class="pmItem"><span>게재 상태</span><b class="pill ${past?'s-done':'s-doing'}">${st}</b></div></div>`;
}
// 배너 구좌 · 프리마케팅 탭 그리기(renderEventOps에서 부름)
function bnRender(area,tabs){
  const L=bnMonthList(),pm=evtTab==='pm',adm=isAdminUser();
  if(!bst.month||!L.some(m=>m.key===bst.month))bst.month=bnDefaultMonth();
  const tools=`${L.length?`<select class="sel" id="bnMonth" aria-label="배너 달">${L.slice().reverse().map(m=>`<option value="${esc(m.key)}" ${m.key===bst.month?'selected':''}>${esc(m.label)}</option>`).join('')}</select>`:''}${evSearchHtml()}<span class="spacer"></span>${evCommonBtns()}
    ${exportMenu(downloads&&(L.length||evMonthList().length)?[['evJson','JSON 내보내기'],['evXlsx','엑셀 저장']]:[])}${adm?'<button class="btn" type="button" id="bnMapEdit">파트너명 매핑</button>':''}`;
  const conv=canWrite?`<button class="btn" type="button" id="bnConvert">사업팀 원본파일 변환</button><input type="file" id="bnRawFile" accept=".xlsx,.xlsm,.xls,.csv" hidden>`:'';
  if(!L.length){area.innerHTML=`<div class="rtool">${tools}</div>${tabs}<div class="empty"><h2>아직 배너 달이 없어요</h2><p>관리대장 데이터를 가져오거나, 이번 달 시트를 만들거나, 사업팀 원본파일을 변환해 시작하세요.</p><div class="evHead" style="justify-content:center">${conv}${canWrite?'<button class="btn primary" type="button" id="bnFirst">이번 달 시트 만들기</button>':''}</div></div>`;return;}
  const mo=L.find(m=>m.key===bst.month);
  const head=`<div class="cvHeadT"><h3>${esc(mo.label)}</h3><span class="legend">${pm?'프리마케팅':`배너 구좌 · ${bnRanks(mo.id).length}행`}</span><span class="spacer"></span>${canWrite?`<button class="btn ghost sm" type="button" ${pm?'data-pdelm':'data-bdelm'}="${esc(mo.key)}">이 달 삭제</button>${pm?'':'<button class="btn sm" type="button" id="bnAddRow">+ 행 추가</button><button class="btn sm" type="button" id="bnCols">구좌 편집</button>'}${conv}<button class="btn primary sm" type="button" id="bnAddMonth">새 달 만들기</button>`:''}</div>`;
  area.innerHTML=`<div class="rtool">${tools}</div>${tabs}
    <div class="panel cvHead">${head}</div>${pm?bnPmGrid(mo,true)+bnPmStatus(mo):bnRankTable(mo,true)}
      <p class="legend evLegend">${pm?'배너 구좌와 같은 달을 함께 써요. 새 달을 만들면 배너 구좌에도 같은 달이 생겨요.':'칸을 고친 뒤 다른 곳을 누르면 저장돼요. 파트너명 매핑에 있는 원본 이름은 표시 이름으로 바뀌어요.'}</p>`;
}
async function bnSetMonthDoc(id,patch){await db.collection('evt_months').doc(id).update(patch);const m=evtMonths.find(x=>x.id===id);if(m)Object.assign(m,patch);}
async function bnCreateMonth(key,base){ // base가 있으면 이전 달 구성을 복사(원본 addNewBannerMonth)
  const id=bnMid(key),doc={kind:'banner_month',sortKey:key,key,label:evLabelOf(key),cols:base?(base.cols||[]).map(c=>({...c})):BN_DEF_COLS.map(n=>({id:bnColId(),name:n})),hidden:base?[...(base.hidden||[])]:[],
    cycleWeeks:base?.cycleWeeks||4,weekAnchor:bnAnchor(key),partners:base?(base.partners||[]).map(p=>({...p})):[],changeLog:[]};
  await db.collection('evt_months').doc(id).set(doc);evKeep(evtMonths,{id,...doc});
  if(base){let so=0;for(const r of bnRanks(base.id)){const {id:_i,monthId,sortOrder,updatedAt,...v}=r;const nid=evUid(),d={...v,monthId:id,kind:'banner_rank',sortOrder:so++};await db.collection('evt_rows').doc(nid).set(d);evKeep(evtRowsAll,{id:nid,...d});}
    for(const p of bnPms(base.id)){const nid=evUid(),d={monthId:id,kind:'pm_partner',sortOrder:0,name:p.name||'',week:p.week,rankInWeek:p.rankInWeek};await db.collection('evt_rows').doc(nid).set(d);evKeep(evtRowsAll,{id:nid,...d});}}
  return id;
}
async function bnNewMonth(silent){
  const L=bnMonthList(),last=L[L.length-1],key=last?evNextKey(last.key):todayStr().slice(0,7);
  if(L.some(m=>m.key===key)){if(!silent)toast(`'${evLabelOf(key)}'은 이미 있어요.`);return null;}
  await bnCreateMonth(key,last);logChange('evt','create',bnMid(key),`${evLabelOf(key)} 배너·프리마케팅 시트`,null,null,last?'이전 달 구성 복사':'');
  bst.month=key;if(silent)return evLabelOf(key);render();toast(`'${evLabelOf(key)}' 달을 만들었어요.${last?' 이전 달의 배너·프리마케팅 구성을 복사했어요.':''}`);
}
// 구좌 편집: 이름 변경·순서·숨김·추가·삭제(지운 칸의 값은 함께 지움)
function bnOpenCols(mo){
  let rows=(mo.cols||[]).map(c=>({...c,hide:(mo.hidden||[]).includes(c.id)}));
  const draw=()=>{$('#bcList').innerHTML=rows.length?rows.map((r,i)=>`<div class="bcRow"><input class="sel" data-i="${i}" value="${esc(r.name)}" aria-label="구좌 이름" maxlength="30"><label class="cfItem"><input type="checkbox" data-hide="${i}" ${r.hide?'checked':''}>숨김</label><button type="button" class="btn ghost sm" data-up="${i}" ${i?'':'disabled'} aria-label="위로" title="위로"><svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button><button type="button" class="btn ghost sm" data-down="${i}" ${i<rows.length-1?'':'disabled'} aria-label="아래로" title="아래로"><svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><button type="button" class="btn ghost sm" data-del="${i}">삭제</button></div>`).join(''):'<p class="legend">구좌가 없어요. 아래에서 추가해 주세요.</p>';};
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><div class="modal" style="max-width:560px"><header><h2>구좌 편집 · ${esc(mo.label)}</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>
    <div class="body" style="grid-template-columns:1fr"><p class="legend" style="margin:0">이름을 바꾸면 순위표 값은 그대로 따라가요. 지운 구좌의 값은 휴지통에 30일 동안 보관돼요. 숨긴 구좌는 표에서만 안 보여요.</p><div id="bcList" class="bcList"></div>
      <div class="bcRow"><input class="sel" id="bcNew" placeholder="새 구좌 이름…" maxlength="30" aria-label="새 구좌 이름"><button type="button" class="btn" id="bcAdd">+ 추가</button></div></div>
    <footer><span class="err" id="bcErr"></span><div class="r"><button class="btn" type="button" id="bcNo">취소</button><button class="btn primary" type="button" id="bcSave">저장</button></div></footer></div></div>`;
  draw();$('#xClose').onclick=$('#bcNo').onclick=closeModal;$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal();});
  const add=()=>{const v=$('#bcNew').value.trim();if(!v)return;rows.push({id:bnColId(),name:v,hide:false,isNew:true});$('#bcNew').value='';draw();};
  $('#bcAdd').onclick=add;$('#bcNew').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add();}});
  $('#bcList').addEventListener('input',e=>{const i=e.target.dataset.i;if(i!=null)rows[+i].name=e.target.value;});
  $('#bcList').addEventListener('change',e=>{const i=e.target.dataset.hide;if(i!=null)rows[+i].hide=e.target.checked;});
  $('#bcList').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.up){const i=+d.up;[rows[i-1],rows[i]]=[rows[i],rows[i-1]];}if(d.down){const i=+d.down;[rows[i+1],rows[i]]=[rows[i],rows[i+1]];}if(d.del)rows.splice(+d.del,1);draw();});
  $('#bcSave').onclick=async()=>{
    const names=rows.map(r=>r.name.trim());if(names.some(n=>!n)){$('#bcErr').textContent='비어 있는 구좌 이름이 있어요.';return;}if(new Set(names).size!==names.length){$('#bcErr').textContent='같은 이름의 구좌가 있어요.';return;}
    const removed=(mo.cols||[]).filter(c=>!rows.some(r=>r.id===c.id));
    if(removed.length&&!$('#bcSave').dataset.ok){$('#bcErr').textContent=`'${removed.map(c=>c.name).join("', '")}' 구좌를 지우면 그 칸의 값은 휴지통으로 옮겨요. 한 번 더 누르면 저장해요.`;$('#bcSave').dataset.ok='1';return;}
    $('#bcSave').disabled=true;
    try{if(removed.length)await evTrashCols(mo,removed);for(const r of bnRanks(mo.id)){const p={};removed.forEach(c=>{if(r['v_'+c.id])p['v_'+c.id]='';});if(Object.keys(p).length){await db.collection('evt_rows').doc(r.id).update(p);Object.assign(r,p);}}
      await bnSetMonthDoc(mo.id,{cols:rows.map((r,i)=>({id:r.id,name:names[i]})),hidden:rows.filter(r=>r.hide).map(r=>r.id)});
      logChange('evt','update',mo.id,`${mo.label} 배너 구좌 편집`,null,null,names.join(', '));closeModal();toast('구좌를 바꿨어요.');render();}
    catch(err){$('#bcSave').disabled=false;handleWriteError(err,'#bcErr');}
  };
}
// 파트너명 매핑 편집(관리자): 저장하면 이미 입력된 배너·프리마케팅 칸에도 적용(원본 openPartnerMapEditor)
function bnOpenMap(){

/* 사업팀 원본파일(운영계획) 변환: 원본 parseRawBannerPlan 규칙 그대로. 원본은 SheetJS, 여기서는 ExcelJS로 .xlsx를 읽음 */
const BN_RAW_RE=/^(\d{4})\.(\d{1,2})월/;
const BN_SLOT_DEFS=[{key:'이벤트/썸네일',match:['이벤트페이지&썸네일','이벤트페이지']},{key:'메인 팝업',match:['메인팝업']},{key:'메인 상단',match:['메인상단배너','메인상단']},{key:'메인 하단',match:['메인하단배너','메인하단']},{key:'GNB검색배너',match:['GNB검색배너','GNB검색']},{key:'더 받을 수 있는 쿠폰',match:['더받을수있는쿠폰']},{key:'요금제 배너',match:['요금제배너']}];
const BN_FULL='메인팝업,메인상단,메인하단,이벤트페이지,썸네일';
const bnNorm=s=>s==null?'':String(s).replace(/\s/g,'');

const bnCellVal=v=>v==null?null:typeof v!=='object'?v:v instanceof Date?v:v.richText?v.richText.map(t=>t.text).join(''):'result' in v?v.result:v.text!=null?v.text:v.hyperlink||null;

const bnAt=(g,r,c)=>{const row=g[r-1];if(!row)return null;const v=row[c-1];return v===undefined?null:v;};
function bnColByText(g,row,texts){const a=g[row-1]||[];for(let c=0;c<a.length;c++){const v=bnNorm(a[c]);if(!v)continue;for(const m of texts)if(v.includes(m))return c+1;}return null;}
function bnRowByB(g,text){for(let r=1;r<=g.length;r++){const v=g[r-1]&&g[r-1][1];if(typeof v==='string'&&v.replace(/\s/g,'').includes(text))return r;}return null;}
function bnParseRaw(g,info){
  const target=bnMonthList().find(m=>m.key===`${info.y}-${String(info.mo).padStart(2,'0')}`),cycle=target?.cycleWeeks||4;
  const slotCols=[];BN_SLOT_DEFS.forEach(d=>{const col=bnColByText(g,4,d.match);if(col)slotCols.push({...d,col});});
  const changeRow=bnRowByB(g,'변경사항');
  const criteria=slotCols.map(sc=>({name:sc.key,maxExposure:bnAt(g,5,sc.col)||'-',preMarketing:bnAt(g,6,sc.col)||'-',operation:(changeRow?bnAt(g,changeRow,sc.col):null)||'고정/수시 운영',note:''}));
  const start=bnRowByB(g,'노출순위')||bnRowByB(g,'노출 순위'),ranks=[];
  if(start){let r=start,blank=0;while(r<=g.length){const vals={};let any=false;slotCols.forEach(sc=>{const v=bnAt(g,r,sc.col);if(v!==null&&v!==''&&v!=='-'){vals[sc.key]=v;any=true;}});if(!any){blank++;if(blank>=2)break;r++;continue;}blank=0;ranks.push(vals);r++;}}
  const anchorCol=bnColByText(g,4,['정리']),partners=[];
  if(anchorCol){const bizCol=bnColByText(g,7,['사업자명'])||anchorCol+1;let r=8,blank=0;while(r<=g.length){const order=bnAt(g,r,anchorCol),biz=bnAt(g,r,bizCol);if(!order&&!biz){blank++;if(blank>=2)break;r++;continue;}if(!biz){r++;continue;}blank=0;
    const idx=partners.length,week=idx%cycle+1,rankInWeek=Math.floor(idx/cycle)+1;partners.push({bannerOrder:idx+1,perfRank:order,name:biz,weekLabel:`${week}주차 ${rankInWeek}위`,week,rankInWeek,combo:BN_FULL});r++;}}
  const pms=[],preCol=bnColByText(g,6,['프리마케팅제공순위','프리마케팅제공']);
  if(preCol){let r=8,blank=0;while(r<=g.length){const order=bnAt(g,r,preCol),biz=bnAt(g,r,preCol+1),has=order!==null&&String(order).trim()!=='';if(!has&&(biz===null||String(biz).trim()==='')){blank++;if(blank>=2)break;r++;continue;}blank=0;
    const idx=pms.length;pms.push({name:(biz&&String(biz).trim())||'',week:idx%cycle+1,rankInWeek:Math.floor(idx/cycle)+1});r++;}}
  return {y:info.y,mo:info.mo,monthLabel:`${info.y}년 ${info.mo}월`,criteria,ranks,slotCols,partners,preMarketingPartners:pms};
}

/* ---------- 이벤트 운영 3단계: 혜택 관리 · 휴지통 · 다음 달 한 번에 만들기 · 전체 검색 ----------

function bfMonthKey(label){const m=String(label||'').match(/(?:(\d{2,4})년\s*)?(\d{1,2})월/);if(!m||+m[2]<1||+m[2]>12)return null;const y=m[1]?(m[1].length===2?2000+ +m[1]:+m[1]):new Date().getFullYear();return `${y}-${String(+m[2]).padStart(2,'0')}`;}

const bfDays=iso=>/^\d{4}-\d{2}-\d{2}$/.test(iso||'')?Math.round((new Date(iso+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5):null;

// 새 달 블록: 가장 최근 블록의 다음 달, 그 블록 혜택을 복사(원본 addNewBenefitMonth). silent면 만든 이름만 돌려줌
async function bfNewBlock(silent){

  for(const it of its){const nid=evUid(),d={monthId:id,kind:'benefit_item',sortOrder:so++,name:it.name||'',copy:it.copy||'',status:it.status||'',expiryDate:it.expiryDate||''};await db.collection('evt_rows').doc(nid).set(d);evKeep(evtRowsAll,{id:nid,...d});}
  logChange('evt','create',id,`${label} 혜택 블록`,null,null,from?`${bfLabel(from.label)} 혜택 ${its.length}건 복사`:'');

async function bfMove(mid,uid,to){const rows=bfItems(mid).filter(r=>r.id!==uid),a=rows[to-1],b=rows[to],so=a&&b?(+a.sortOrder+ +b.sortOrder)/2:a?+a.sortOrder+1:b?+b.sortOrder-1:0,r=evtRowsAll.find(x=>x.id===uid);r.sortOrder=so;await db.collection('evt_rows').doc(uid).update({sortOrder:so});render();}
onArea('#eventOpsArea','change',async e=>{

/* ----- 휴지통(원본 moveToTrash · restoreTrash · purgeOldTrash) ----- */
const EV_KIND_WORD={event_month:'이벤트',banner_month:'배너',benefit_block:'혜택'};
const evWhere=m=>m?`${m.kind==='benefit_block'?bfLabel(m.label):m.label} ${EV_KIND_WORD[m.kind]||''}`.trim():'';
// 휴지통에 먼저 담고(실패하면 아무것도 지우지 않음) 지움
async function evDrop(type,label,months,rows){
  await db.collection('evt_trash').doc(evUid()).set({at:new Date().toISOString(),type,label,payload:{months:months.map(m=>({...m})),rows:rows.map(r=>({...r})),where:evWhere(months[0]||evtMonths.find(m=>m.id===rows[0]?.monthId))},by:myMember()?.name||''});
  for(const r of rows)await db.collection('evt_rows').doc(r.id).delete();
  for(const m of months)await db.collection('evt_months').doc(m.id).delete();
  const rs=new Set(rows.map(r=>r.id)),ms=new Set(months.map(m=>m.id));
  evtRowsAll=evtRowsAll.filter(r=>!rs.has(r.id));evtMonths=evtMonths.filter(m=>!ms.has(m.id));
  logChange('evt','delete',months[0]?.id||rows[0]?.id||'',label,null,null,'휴지통으로 옮김');
}
// 배너 구좌 칸을 지울 때: 칸 이름·자리와 그 칸의 값만 담아 둠(복구하면 칸을 원래 자리에 다시 넣고 값을 되돌림)
async function evTrashCols(mo,removed){
  const cols=removed.map(c=>({...c,idx:(mo.cols||[]).findIndex(x=>x.id===c.id)})),vals=[];
  bnRanks(mo.id).forEach(r=>{const v={id:r.id};removed.forEach(c=>{if(r['v_'+c.id])v['v_'+c.id]=r['v_'+c.id];});if(Object.keys(v).length>1)vals.push(v);});
  await db.collection('evt_trash').doc(evUid()).set({at:new Date().toISOString(),type:'banner_cols',label:`${mo.label} 배너 구좌 칸 '${removed.map(c=>c.name).join("', '")}'`,payload:{monthId:mo.id,cols,vals,where:evWhere(mo)},by:myMember()?.name||''});
}
const evTrashCount=t=>t.type==='banner_cols'?(t.payload?.vals||[]).length:(t.payload?.rows||[]).length;
async function evRestore(t){
  const p=t.payload||{},fail=msg=>{throw {evMsg:msg};};let n=0;
  if(t.type==='banner_cols'){
    const mo=evtMonths.find(x=>x.id===p.monthId);if(!mo)fail(`원래 있던 곳(${p.where||'배너 달'})이 없어서 복구할 수 없어요. 그 달을 먼저 복구해 주세요.`);
    const cols=[...(mo.cols||[])];(p.cols||[]).slice().sort((a,b)=>a.idx-b.idx).forEach(c=>{if(cols.some(x=>x.id===c.id))return;const nm=cols.some(x=>x.name===c.name)?`${c.name} (복구)`:c.name;cols.splice(c.idx<0?cols.length:Math.min(c.idx,cols.length),0,{id:c.id,name:nm});});
    await bnSetMonthDoc(mo.id,{cols});
    for(const v of p.vals||[]){const r=evtRowsAll.find(x=>x.id===v.id);if(!r)continue;const {id,...d}=v;await db.collection('evt_rows').doc(id).update(d);Object.assign(r,d);n++;}
  }else{
    const months=p.months||[],rows=p.rows||[];
    for(const m of months)if(evtMonths.some(x=>x.id===m.id||(m.kind==='benefit_block'&&x.kind==='benefit_block'&&bfLabel(x.label)===bfLabel(m.label))))fail(`'${m.kind==='benefit_block'?bfLabel(m.label):m.label}'이(가) 이미 있어서 복구하지 않았어요.`);
    if(!months.length&&rows.length&&!evtMonths.some(x=>x.id===rows[0].monthId))fail(`원래 있던 곳(${p.where||'그 달'})이 없어서 복구할 수 없어요. 그 달·블록을 먼저 복구해 주세요.`);
    for(const m of months){const {id,...d}=m;await db.collection('evt_months').doc(id).set(d);evKeep(evtMonths,{...m});}
    for(const r of rows){if(evtRowsAll.some(x=>x.id===r.id))continue;const {id,...d}=r;await db.collection('evt_rows').doc(id).set(d);evKeep(evtRowsAll,{...r});n++;}
    if(!months.length&&rows.length&&!n){await db.collection('evt_trash').doc(t.id).delete();return '이미 복구된 행이라 휴지통에서만 지웠어요.';}
  }
  await db.collection('evt_trash').doc(t.id).delete();evtTrash=evtTrash.filter(x=>x.id!==t.id);
  logChange('evt','create',t.id,t.label,null,null,'휴지통에서 복구');
  return `'${t.label}'을(를) 복구했어요.`;
}
// 30일 지난 묶음은 비움(쓰기 권한이 있는 사람이 화면을 열 때)
let evPurged=false;
/* ----- 휴지통(업무 관리 · 주간 보고): trash 컬렉션 문서 하나 = 지운 묶음 하나 {at, area, type, label, payload, by}
   payload.docs = 지운 문서 그대로 [{coll, id, data}] → 복구하면 같은 id로 다시 씀. 보고서 카테고리는 payload {docId, cat, idx} ----- */
let wbTrash=[],wbPurged=false;
const WB_TRASH_TYPE={cvcase:'회귀 검증 케이스',cvrun:'회귀 검증 회차',manual:'매뉴얼',run:'진행 건',task:'업무',project:'프로젝트',comment:'댓글',report_cat:'보고서 카테고리'};

async function wbDrop(area,type,label,docs,extra={}){
  await db.collection('trash').doc(evUid()).set({at:new Date().toISOString(),area,type,label,payload:{docs,...extra},by:myMember()?.name||''});
  for(const d of docs)await db.collection(d.coll).doc(d.id).delete();
}
async function wbRestore(t){
  const p=t.payload||{},fail=m=>{throw {evMsg:m};};
  if(t.type==='report_cat'){
    const doc=reports.find(r=>r.id===p.docId);if(!doc)fail('그 주 보고서가 없어서 복구할 수 없어요.');
    const cats=Array.isArray(doc.cats)?[...doc.cats]:[];if(cats.some(c=>c.id===p.cat.id||c.name===p.cat.name))fail(`'${p.cat.name}' 카테고리가 이미 있어서 복구하지 않았어요.`);
    cats.splice(Math.min(p.idx??cats.length,cats.length),0,p.cat);await db.collection('reports').doc(doc.id).update({cats,updatedAt:new Date().toISOString()});
  }else{
    const docs=p.docs||[],has=(c,id)=>wbLocal(c).some(x=>x.id===id)||docs.some(d=>d.coll===c&&d.id===id);
    // 원래 있던 곳(프로젝트·업무)이 없으면 막음
    for(const d of docs){
      if(d.coll==='tasks'&&d.data.projectId&&!has('projects',d.data.projectId))fail(`원래 프로젝트가 없어서 '${d.data.title||'업무'}'을(를) 복구할 수 없어요. 프로젝트를 먼저 복구해 주세요.`);
      if(d.coll==='manual_runs'&&!has('manuals',d.data.manualId))fail('매뉴얼이 없어서 진행 건을 복구할 수 없어요. 매뉴얼을 먼저 복구해 주세요.');
      if(d.coll==='comments'&&!has('tasks',d.data.taskId))fail('댓글이 달려 있던 업무가 없어서 복구할 수 없어요. 업무를 먼저 복구해 주세요.');}
    let n=0;for(const d of docs){if(wbLocal(d.coll).some(x=>x.id===d.id))continue;await db.collection(d.coll).doc(d.id).set(d.data);n++;}
    if(!n){await db.collection('trash').doc(t.id).delete();wbTrash=wbTrash.filter(x=>x.id!==t.id);return '이미 복구된 항목이라 휴지통에서만 지웠어요.';}
  }
  await db.collection('trash').doc(t.id).delete();wbTrash=wbTrash.filter(x=>x.id!==t.id);
  logChange(t.area==='report'?'report':t.area==='manual'?'manual':t.area==='regress'?'regress':'task','create',t.id,t.label,null,null,'휴지통에서 복구');
  return `'${t.label}'을(를) 복구했어요.`;
}

  await run('배너·프리마케팅',bnNewMonth,evLabelOf(b.length?evNextKey(b[b.length-1].key):todayStr().slice(0,7)));

}

function evSearch(q){
  q=q.trim().toLowerCase();if(!q)return [];const H=[],has=v=>String(v??'').toLowerCase().includes(q);
  evMonthList().slice().reverse().forEach(m=>evRowsOf(m.id).forEach((r,i)=>{if(['name','eid','category','note','opUrl'].some(f=>has(r[f])))H.push({tab:'events',kind:'이벤트',title:r.name||'(이벤트명 없음)',where:`${m.label} ${i+1}행${r.eid?` · ID ${r.eid}`:''}`,month:m.key,uid:r.id});}));
  bnMonthList().slice().reverse().forEach(m=>{const cols=m.cols||[];bnRanks(m.id).forEach((r,i)=>cols.forEach(c=>{if(has(r['v_'+c.id]))H.push({tab:'banner',kind:'배너',title:r['v_'+c.id],where:`${m.label} ${i+1}위 · ${c.name}`,month:m.key,uid:r.id});}));
    bnPms(m.id).filter(p=>has(p.name)).sort((a,b)=>(a.week-b.week)||(a.rankInWeek-b.rankInWeek)).forEach(p=>H.push({tab:'pm',kind:'프리마케팅',title:p.name,where:`${m.label} ${p.week}주차 ${p.rankInWeek}위`,month:m.key,cell:[p.week,p.rankInWeek]}));});
  bfMonthList().forEach(b=>bfItems(b.id).forEach((it,i)=>{if(has(it.name)||has(it.copy))H.push({tab:'benefit',kind:'혜택',title:it.name||it.copy||'(이름없음)',where:`${bfLabel(b.label)} ${i+1}행`,block:b.id,uid:it.id});}));
  return H;
}
function evDrawDrop(){

// 표 칸에 여러 줄·여러 칸 붙여넣기(엑셀·피그마 표): 탭 = 칸, 줄바꿈 = 행. 엑셀이 따옴표로 감싼 칸 안 줄바꿈은 그대로
function mnParseTsv(t){const rows=[];let row=[],cell='',q=false;t=t.replace(/\r/g,'');
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'&&t[i+1]==='"'){cell+='"';i++;}else if(ch==='"')q=false;else cell+=ch;}
    else if(ch==='"'&&cell==='')q=true;else if(ch==='\t'){row.push(cell);cell='';}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}else cell+=ch;}
  if(cell||row.length){row.push(cell);rows.push(row);}return rows.filter(r=>r.some(c=>c.trim()));}

/* ----- 매뉴얼 편집 편하게: 단계만 바로 편집(mnst.step) · 끌어서 순서 · 단계 복제 · 다른 매뉴얼에서 단계 가져오기 ----- */
// 편집 사본이 있으면 거기에, 없으면 바로 저장(단계 순서·구성만 바뀜). 진행 중 체크는 단계 id 기준이라 그대로 남음
async function mnApply(fn){const m=mnCur();if(!m)return;
  if(mnDraft){fn(mnDraft);mnQueue(true);render();return;}
  const d=JSON.parse(JSON.stringify(m));fn(d);m.steps=d.steps;render();
  try{await db.collection('manuals').doc(m.id).update({steps:d.steps,updatedAt:new Date().toISOString(),updatedBy:myMember()?.name||''});logChange('manual','update',m.id,m.title,null,null,'단계 순서·구성 변경');}
  catch(err){handleWriteError(err);}}
async function mnStepOpen(sid){const m=mnCur();if(!m)return;
  if(mnst.step&&mnDraft)await mnSave();
  if(!mnDraft)mnDraft=JSON.parse(JSON.stringify(manuals.find(x=>x.id===mnst.id)));
  mnst.step=sid;render();

    const data=dep?{...base,weekdays:[...document.querySelectorAll('#evForm [data-wd]:checked')].map(x=>+x.dataset.wd),from:$('#evFrom').value,until:$('#evUntil').value,skip:ev.skip||[]}
                  :{...base,start:$('#evStart').value,end:$('#evEnd').value&&$('#evEnd').value>=$('#evStart').value?$('#evEnd').value:$('#evStart').value};

    <header><h2>${fmtDate(k)} 일정</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>

  $('#xClose').onclick=closeModal;$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal();});

function calItemOpen(it,k){
  if(it.dataset.lid){openLeave(leaves.find(l=>l.id===it.dataset.lid));return true;}
  if(it.dataset.eid){const ev=events.find(x=>x.id===it.dataset.eid);if(ev)ev.kind==='event'?openSched(ev):openEvent(ev.kind,ev,it.dataset.date||k);return true;}
  return false;
}

function openLeave(l,date,endDate,only){
  if(!members.length){openMembers();return;}
  const isNew=!l, ro=!canWrite;
  l=l||{memberId:lstate.member!=='all'?lstate.member:'',type:'annual',date:date||todayStr(),endDate:endDate||date||todayStr()};
  let daysTouched=!isNew&&l.days!==''&&l.days!=null&&+l.days!==autoDays(l.type,l.date,l.endDate);
  const opt=(arr,cur)=>arr.map(([k,v])=>`<option value="${esc(k)}" ${String(cur)===String(k)?'selected':''}>${esc(v)}</option>`).join('');
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="leaveForm" novalidate>
    <header><h2>${isNew?'연차 신청':ro?'연차 신청 상세':'연차 신청 수정'}</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>
    <fieldset ${ro?'disabled':''} style="border:0;margin:0;padding:0;min-width:0"><div class="body">
      <div class="f"><label for="lvMember">구성원 <b>*</b></label><select id="lvMember"><option value="">선택</option>${opt(members.filter(m=>isShown(m)||m.id===l.memberId).map(m=>[m.id,m.name]),l.memberId)}</select></div>
      <input type="hidden" id="lvType" value="${esc(l.type||'annual')}">${l.type&&l.type!=='annual'?`<div class="f"><label>종류</label><span>${esc(ltype(l.type).label)}</span></div>`:''}
      <div class="f"><label for="lvDate" id="lvDateLbl">날짜</label><input type="date" id="lvDate" value="${esc(l.date||'')}"></div>
      <div class="f" id="lvEndWrap"><label for="lvEnd">종료일</label><input type="date" id="lvEnd" value="${esc(l.endDate||l.date||'')}"></div>
      <div class="f full lvRange" id="lvRange" aria-live="polite"></div>
      <div class="f" id="lvTimeWrap"><label for="lvTime">사용 시간</label><input id="lvTime" value="${esc(l.time||'')}" placeholder="예: 09:00–11:00"></div>
      <div class="f"><label for="lvDays">일수</label><input type="number" id="lvDays" min="0" step="0.25" inputmode="decimal" value="${esc(isNew?'':leaveDays(l))}"><span class="hint" id="lvDaysHint"></span></div>
      <div class="f full"><label for="lvNote">메모</label><input id="lvNote" value="${esc(l.note||'')}" placeholder="사유, 대체 근무자, 비상 연락 등"></div>
    </div></fieldset>
    <footer>
      <div id="lvDelZone">${!isNew&&canWrite?'<button class="btn danger" type="button" id="lvDel">삭제</button>':''}</div>
      <span class="err" id="lvErr"></span>
      <div class="r"><button class="btn" type="button" id="lvCancel">${ro?'닫기':'취소'}</button>${ro?'':`<button class="btn primary" type="submit" id="lvSave">${isNew?'등록':'저장'}</button>`}</div>
    </footer></form></div>`;
  const sync=()=>{
    const t=ltype($('#lvType').value);
    $('#lvEndWrap').hidden=!t.multi;$('#lvTimeWrap').hidden=!t.quarter;
    $('#lvDateLbl').textContent=t.multi?'시작일':'날짜';
    if(t.multi&&(!$('#lvEnd').value||$('#lvEnd').value<$('#lvDate').value))$('#lvEnd').value=$('#lvDate').value;
    const auto=autoDays(t.k,$('#lvDate').value,t.multi?$('#lvEnd').value:'');
    if(!daysTouched)$('#lvDays').value=auto;
    $('#lvDaysHint').textContent=t.multi?`주말 제외 ${auto}일 · 공휴일이 끼면 직접 수정`:(t.deduct?'연차에서 차감':'연차에서 차감하지 않음');
    const dw=v=>v?`${+v.slice(5,7)}/${+v.slice(8,10)}(${'일월화수목금토'[new Date(v+'T00:00:00').getDay()]})`:'';
    const a=$('#lvDate').value,b=t.multi?$('#lvEnd').value:a;
    $('#lvRange').innerHTML=a?`<b>${dw(a)}${b&&b!==a?` ~ ${dw(b)}`:''}</b> · ${esc(t.label)} ${fmtDays(+$('#lvDays').value||0)}일${t.multi?' <span class="hint">· 여러 날이면 종료일을 바꾸거나, 달력에서 날짜를 끌어서 고르세요</span>':''}`:'';
    prevStart=a;
  };
  // 시작일을 바꾸면 종료일도 같은 간격만큼 따라 움직임 (5일짜리를 옮기면 그대로 5일)
  let prevStart=$('#lvDate').value;
  $('#lvDate').addEventListener('input',()=>{const a=$('#lvDate').value,b=$('#lvEnd').value;if(a&&b&&prevStart&&ltype($('#lvType').value).multi)$('#lvEnd').value=addDays(b,Math.round((new Date(a+'T00:00:00')-new Date(prevStart+'T00:00:00'))/864e5));});
  sync();
  ['lvType','lvDate','lvEnd'].forEach(id=>$('#'+id).addEventListener('change',()=>{if(id==='lvType')daysTouched=false;sync();}));
  $('#lvDays').addEventListener('input',()=>{daysTouched=true;sync();});
  $('#xClose').onclick=$('#lvCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  $('#lvDel')?.addEventListener('click',()=>{
    $('#lvDelZone').innerHTML=`<div class="confirm">이 연차 신청을 삭제할까요? <button class="btn danger" type="button" id="lvDelYes">삭제</button><button class="btn ghost" type="button" id="lvDelNo">취소</button></div>`;
    $('#lvDelNo').onclick=()=>openLeave(l);
    $('#lvDelYes').onclick=async()=>{try{await db.collection('leaves').doc(l.id).delete();logChange('leave','delete',l.id,`${memOf(l.memberId)?.name||''} ${leaveLabel(l)} ${fmtDate(l.date)}`);closeModal();toast('삭제했습니다');}catch(err){handleWriteError(err,'#lvErr');}};
  });
  $('#leaveForm').addEventListener('submit',async e=>{
    e.preventDefault();if(ro)return;
    const t=ltype($('#lvType').value);
    const data={memberId:$('#lvMember').value,type:t.k,date:$('#lvDate').value,endDate:t.multi?$('#lvEnd').value:'',
      time:t.quarter?$('#lvTime').value.trim():'',days:$('#lvDays').value===''?autoDays(t.k,$('#lvDate').value,$('#lvEnd').value):Math.max(0,+$('#lvDays').value),
      note:$('#lvNote').value.trim(),updatedAt:new Date().toISOString(),createdAt:l.createdAt||new Date().toISOString()};
    if(!data.memberId){$('#lvErr').textContent='구성원을 선택해 주세요.';return;}
    if(!data.date){$('#lvErr').textContent='날짜를 입력해 주세요.';return;}
    if(t.multi&&data.endDate<data.date){$('#lvErr').textContent='종료일이 시작일보다 빠릅니다.';return;}
    const clash=leaves.find(x=>x.id!==l.id&&x.memberId===data.memberId&&leaveDates(x).some(d=>leaveDates(data).includes(d)));
    if(clash&&!$('#leaveForm').dataset.ok){$('#lvErr').textContent=`${fmtDate(clash.date)}에 이미 ${leaveLabel(clash)}이(가) 있습니다. 그래도 저장하려면 한 번 더 누르세요.`;$('#leaveForm').dataset.ok='1';return;}
    $('#lvSave').disabled=true;
    try{const lab=`${memOf(data.memberId)?.name||''} ${leaveLabel(data)} ${fmtDate(data.date)}`;if(isNew){const ref=await db.collection('leaves').add(data);logChange('leave','create',ref.id,lab,null,data);}else{const pt=patchOf(data,l);if(pt)await db.collection('leaves').doc(l.id).update(pt);logChange('leave','update',l.id,lab,l,data);}
      closeModal();toast(isNew?'휴가를 등록했습니다':'저장했습니다');
      if(data.date.slice(0,7)!==lstate.month){lstate.month=data.date.slice(0,7);lstate.year=+data.date.slice(0,4);render();}}
    catch(err){$('#lvSave').disabled=false;handleWriteError(err,'#lvErr');}
  });
}

function openMembers(){if(!isAdminUser())return;closeModal();state.mode='accounts';persistUI();render();}
function acFilter(){const k=acstate.q.trim().toLowerCase(),rows=[...document.querySelectorAll('#acTable tbody tr[data-mid]')];rows.forEach(r=>r.hidden=!!k&&!r.dataset.text.includes(k));const e=$('#acTable .mEmpty');if(e)e.hidden=!rows.length||rows.some(r=>!r.hidden);}

      <td class="nowrap">${pt?`<span class="part"><span class="sw" style="background:${pt.c}"></span>${esc(pt.label)}</span>`:'—'}</td><td class="nowrap">${esc(pj?.name||'—')}</td>

  area.innerHTML=`<div class="rtool"><label class="searchBox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="search" id="acQ" type="search" placeholder="이름·메일·파트·프로젝트 검색" aria-label="계정 검색" value="${esc(acstate.q)}"></label><span class="spacer"></span><button class="btn primary" type="button" id="acAdd">+ 계정 추가</button></div>
    <div class="tablebox"><table class="stable" id="acTable"><thead><tr><th>이름</th><th>회사 메일</th><th>로그인</th><th>파트</th><th>주 프로젝트</th><th>관리자 권한</th></tr></thead><tbody>${rows}
      <tr class="mEmpty" ${members.length?'hidden':''}><td colspan="6">${members.length?'검색 결과가 없어요':'아직 계정이 없어요. 「+ 계정 추가」로 추가하세요.'}</td></tr></tbody></table></div>
    <p class="legend" style="margin:0">회사 메일을 적어 두면 그 메일로 처음 로그인한 사람이 이 계정에 자동으로 연결돼요.${adm?' 관리자는 로그인이 연결된 계정만 지정할 수 있어요.':''}</p>`;

      <div class="f"><label for="acJob">직무 <span class="legend">(메뉴 공개용)</span></label><select id="acJob"><option value="">없음</option>${opt(ROLES.slice(1),m.role)}</select></div>
      <div class="f"><label for="acRole">관리자 권한</label><select id="acRole">${hasAdminApi()?`<option value="admin" ${wasAdm?'selected':''} ${m.userId?'':'disabled'}>관리자${m.userId?'':' (로그인 연결 후)'}</option>`:''}<option value="staff" ${!wasAdm&&m.access!=='external'?'selected':''}>일반 관리자</option><option value="external" ${!wasAdm&&m.access==='external'?'selected':''}>외부</option></select><span class="hint">관리자: 모든 메뉴 · 일반 관리자: 관리자 메뉴 빼고 전부 · 외부: 보기만${hasAdminApi()?' · 마지막 관리자는 해제할 수 없어요':''}</span></div>
      <div class="f"><label>업무·일정 표시</label><label class="cfItem"><input type="checkbox" id="acShow" ${m.hideInWork?'':'checked'} ${canWrite?'':'disabled'}>업무·일정에 표시</label><span class="hint">끄면 담당자 고르기·연차 달력·타임라인 등에서 빠져요. 이미 배정된 업무의 이름은 그대로 보여요.</span></div>
      <div class="f"><label>로그인</label><span>${m.userId?'연결됨':'아직 로그인하지 않음'}</span></div>

    </div>
    <footer><div id="acDelZone">${isNew?'':'<button class="btn danger" type="button" id="acDel">삭제</button>'}</div><span class="err" id="acErr"></span>
      <div class="r"><button class="btn" type="button" id="acCancel">취소</button><button class="btn primary" type="submit" id="acSave">${isNew?'추가':'저장'}</button></div></footer>
  </form></div>`;
  $('#xClose').onclick=$('#acCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  // 프로필 사진은 관리자가 계정 관리에서만 바꿈

          if(old.name!==name)for(const t of tasks.filter(t=>t.assigneeId===m.id||(!t.assigneeId&&t.assignee===old.name)))await db.collection('tasks').doc(t.id).update({assignee:name,assigneeId:m.id});}

  });

/* ---------- weekly report (주간 보고) ---------- */
let reports=[];
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const mondayOf=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);};
const rstate={week:mondayOf(todayStr()),project:'all',week3:null,view:'sum',fold:new Set()};
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'';
const DOW=['일','월','화','수','목','금','토'];
const reportId=(w,p)=>`${w}__${p}`;
const NOTE_FIELDS=[['summary','주요 성과 · 요약'],['issues','이슈 및 리스크'],['plan','다음 주 계획 메모'],['asks','요청 · 건의사항']];

// 보고서 구조: 프로젝트 → 파트 → (금주 완료 / 진행 중 / 차주 예정 / 지연·보류 / 신규 요청) + 프로젝트별 휴가·부재
const RBLOCKS=[['done','금주 완료'],['doing','진행 중'],['next','차주 예정'],['late','지연 · 보류'],['new','신규 요청']];
function buildReport(ws,pid){
  const we=addDays(ws,6), nws=addDays(ws,7), nwe=addDays(ws,13), T0=todayStr();
  const inR=(d,a,b)=>!!d&&d>=a&&d<=b;
  const T=workItems().filter(t=>pid==='all'||t.projectId===pid);
  const key=t=>(t.jiraKey?`${t.jiraKey} `:'')+(t.rmsNo?`RMS ${t.rmsNo} `:'');
  const who=t=>asNames(t).join(', ')||'담당 미지정';
  const rules={
    done:[t=>t.status==='done'&&inR(t.doneDate,ws,we),t=>`${key(t)}${t.title} — ${who(t)} · 완료 ${md(t.doneDate)}${t.actHours!==''&&t.actHours!=null?` · ${hrs(t.actHours)}h`:''}`],
    doing:[t=>t.status==='doing'||t.status==='review',t=>`${key(t)}${t.title} — ${who(t)} · ${statusOf(t.status).label}${t.dueDate?` · 마감 ${md(t.dueDate)}`:''}`],
    next:[t=>t.status!=='done'&&inR(t.dueDate,nws,nwe),t=>`${key(t)}${t.title} — ${who(t)} · 마감 ${md(t.dueDate)}(${DOW[new Date(t.dueDate+'T00:00:00').getDay()]})`],
    late:[t=>t.status==='hold'||(t.status!=='done'&&t.dueDate&&t.dueDate<=we&&t.dueDate<T0),t=>`${key(t)}${t.title} — ${who(t)} · ${t.status==='hold'?'보류':`마감 ${md(t.dueDate)} 경과`}${t.note?` · ${t.note.slice(0,40)}`:''}`],
    new:[t=>inR(t.requestDate,ws,we),t=>`${key(t)}${t.title} — ${t.requester||'요청자 미기재'} → ${who(t)} · 요청 ${md(t.requestDate)}`]
  };
  const week=eachDay(ws,we);
  const projList=(pid==='all'?projects:projects.filter(p=>p.id===pid)).map(p=>({id:p.id,name:p.name,color:p.color}));
  if(pid==='all'&&(T.some(t=>!projOf(t.projectId))||members.some(m=>!memberProjectIds(m).size)))projList.push({id:'__none',name:'프로젝트 미지정',color:'var(--muted)'});
  const partList=[...PARTS,{k:'__none',label:'파트 미지정',c:'var(--muted)'}];
  const kpi={done:0,doing:0,next:0,late:0,newReq:0,hours:0,leave:0};
  const out=projList.map(P=>{
    const PT=T.filter(t=>P.id==='__none'?!projOf(t.projectId):t.projectId===P.id);
    const cnt={done:0,doing:0,late:0};
    const parts=partList.map(pt=>{
      const PP=PT.filter(t=>pt.k==='__none'?!PARTS.some(x=>x.k===t.part):t.part===pt.k);
      const blocks=RBLOCKS.map(([k,title])=>{
        const list=PP.filter(rules[k][0]).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
        if(k==='done'){kpi.done+=list.length;cnt.done+=list.length;kpi.hours+=list.reduce((a,t)=>a+(+t.actHours||0),0);}
        if(k==='doing'){kpi.doing+=list.length;cnt.doing+=list.length;}
        if(k==='next')kpi.next+=list.length;
        if(k==='late'){kpi.late+=list.length;cnt.late+=list.length;}
        if(k==='new')kpi.newReq+=list.length;
        return {k,title,items:list.map(rules[k][1])};
      }).filter(b=>b.items.length);
      return {label:pt.label,color:pt.c,blocks};
    }).filter(p=>p.blocks.length);
    const mem=members.filter(m=>P.id==='__none'?!memberProjectIds(m).size:memberIn(m,P.id));
    const lv=[];
    for(const l of leaves){const m=mem.find(x=>x.id===l.memberId);if(!m)continue;const ds=leaveDates(l).filter(d=>week.includes(d));if(!ds.length)continue;
      lv.push({sort:ds[0]+m.name,text:`${m.name} · ${ds.length>1?`${md(ds[0])}~${md(ds[ds.length-1])}`:`${md(ds[0])}(${DOW[new Date(ds[0]+'T00:00:00').getDay()]})`} ${leaveLabel(l)}${ds.length>1?` ${ds.length}일`:''}`});}
    lv.sort((a,b)=>a.sort.localeCompare(b.sort));kpi.leave+=lv.length;
    return {name:P.name,color:P.color,counts:cnt,parts,leaves:lv.map(x=>x.text)};
  }).filter(p=>p.parts.length||p.leaves.length);
  const P=pid==='all'?null:projOf(pid);
  return {v:2,ws,we,projectId:pid,projectName:P?P.name:'전체 프로젝트',generatedAt:new Date().toISOString(),kpi,projects:out};
}

function reportText(m,notes){
  const L=[`■ 주간 업무 보고 (${m.ws.replace(/-/g,'.')} ~ ${m.we.slice(5).replace('-','.')})`,`· 범위: ${m.projectName}`,
    `· 완료 ${m.kpi.done}건 / 진행 ${m.kpi.doing}건 / 신규 ${m.kpi.newReq}건 / 지연·보류 ${m.kpi.late}건 / 완료 소요 ${hrs(m.kpi.hours)}h`,''];
  const note=k=>(notes?.[k]||'').trim();
  if(note('summary'))L.push('[주요 성과 · 요약]',note('summary'),'');
  if(m.projects){
    if(!m.projects.length)L.push('이 주에 해당하는 업무가 없습니다.','');
    for(const p of m.projects){
      L.push(`━ ${p.name}  (완료 ${p.counts.done} · 진행 ${p.counts.doing} · 지연 ${p.counts.late})`);
      for(const pt of p.parts){L.push(`  ▸ ${pt.label}`);for(const b of pt.blocks){L.push(`    · ${b.title}`);b.items.forEach(i=>L.push(`      - ${i}`));}}
      if(p.leaves.length){L.push('  ▸ 휴가 · 부재');p.leaves.forEach(x=>L.push(`      - ${x}`));}
      L.push('');
    }
  }else{ // 이전 형식으로 확정된 보고서
    for(const s of m.sections||[]){L.push(`[${s.title}] ${s.count}건`);for(const g of s.groups){L.push(`  ◦ ${g.label}`);g.items.forEach(i=>L.push(`    - ${i}`));}L.push('');}
    L.push(`[휴가 · 부재] ${(m.leaves||[]).length}건`);(m.leaves||[]).forEach(x=>L.push(`  - ${x}`));L.push('');
  }
  if(m.people?.length){L.push('[담당자별 주간 집계]  (집계 = 완료 실제 소요 + 진행 중 입력 소요 / 가용 = 40h − 휴가)');m.people.forEach(p=>L.push(`  - ${p.name}: 집계 ${hrs(p.total)}h / 가용 ${hrs(p.avail)}h  (완료 ${p.doneN}건 ${hrs(p.doneH)}h · 진행 ${p.doingN}건 ${hrs(p.doingH)}h${p.leaveH?` · 휴가 ${hrs(p.leaveH)}h`:''})`));L.push('');}
  for(const [k,label] of NOTE_FIELDS.slice(1))if(note(k))L.push(`[${label}]`,note(k),'');
  return L.join('\n').trim()+'\n';
}
function reportMarkdown(m,notes){
  if(!m.projects)return reportText(m,notes);
  const note=k=>(notes?.[k]||'').trim();
  const L=[`# 주간 업무 보고 (${m.ws.replace(/-/g,'.')} ~ ${m.we.slice(5).replace('-','.')})`,'',`- 범위: ${m.projectName}`,`- 완료 ${m.kpi.done}건 / 진행 ${m.kpi.doing}건 / 신규 ${m.kpi.newReq}건 / 지연·보류 ${m.kpi.late}건 / 완료 소요 ${hrs(m.kpi.hours)}h`,''];
  if(note('summary'))L.push('## 주요 성과 · 요약','',note('summary'),'');
  for(const p of m.projects){
    L.push(`## ${p.name}`,'',`완료 ${p.counts.done} · 진행 ${p.counts.doing} · 지연 ${p.counts.late}`,'');
    for(const pt of p.parts){L.push(`### ${pt.label}`,'');for(const b of pt.blocks){L.push(`**${b.title}**`,'');b.items.forEach(i=>L.push(`- ${i}`));L.push('');}}
    if(p.leaves.length){L.push('### 휴가 · 부재','');p.leaves.forEach(x=>L.push(`- ${x}`));L.push('');}
  }
  if(m.people?.length){L.push('## 담당자별 주간 집계','','| 담당자 | 집계(h) | 가용(h) | 완료 | 완료 소요(h) | 진행 | 진행 소요(h) | 휴가(h) |','|---|---:|---:|---:|---:|---:|---:|---:|');m.people.forEach(p=>L.push(`| ${p.name} | ${hrs(p.total)} | ${hrs(p.avail)} | ${p.doneN} | ${hrs(p.doneH)} | ${p.doingN} | ${hrs(p.doingH)} | ${hrs(p.leaveH)} |`));L.push('');}
  for(const [k,label] of NOTE_FIELDS.slice(1))if(note(k))L.push(`## ${label}`,'',note(k),'');
  return L.join('\n').trim()+'\n';
}
function reportCsv(m,notes){
  // 한 줄 = 업무 1건. 내용은 '업무명'과 '상세(담당·날짜·소요)'로 나눔
  const cell=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const wk=`${m.ws.replace(/-/g,'.')}~${m.we.slice(5).replace('-','.')}`;
  const split=i=>{const k=i.indexOf(' — ');return k<0?[i,'']:[i.slice(0,k),i.slice(k+3)];};
  const rows=[['주간','프로젝트','파트','구분','업무','상세']];
  const note=k=>(notes?.[k]||'').trim();
  rows.push([wk,m.projectName,'','요약',`완료 ${m.kpi.done} / 진행 ${m.kpi.doing} / 신규 ${m.kpi.newReq} / 지연·보류 ${m.kpi.late} / 완료 소요 ${hrs(m.kpi.hours)}h`,'']);
  if(note('summary'))rows.push([wk,m.projectName,'','주요 성과 · 요약',note('summary'),'']);
  if(m.projects){
    for(const p of m.projects){
      for(const pt of p.parts)for(const b of pt.blocks)for(const i of b.items){const [a,d]=split(i);rows.push([wk,p.name,pt.label,b.title,a,d]);}
      for(const x of p.leaves){const k=x.indexOf(' · ');rows.push([wk,p.name,'휴가 · 부재','휴가',k<0?x:x.slice(0,k),k<0?'':x.slice(k+3)]);}
    }
  }else{
    for(const s of m.sections||[])for(const g of s.groups)for(const i of g.items){const [a,d]=split(i);rows.push([wk,m.projectName,g.label,s.title,a,d]);}
    for(const x of m.leaves||[]){const k=x.indexOf(' · ');rows.push([wk,m.projectName,'휴가 · 부재','휴가',k<0?x:x.slice(0,k),k<0?'':x.slice(k+3)]);}
  }
  for(const p of m.people||[])rows.push([wk,(m.projectId&&m.projectId!=='all')?m.projectName:((p.projects||[]).join(' / ')||'프로젝트 미지정'),'','담당자별 집계',p.name,`집계 ${hrs(p.total)}h / 가용 ${hrs(p.avail)}h · 완료 ${p.doneN}건 ${hrs(p.doneH)}h · 진행 ${p.doingN}건 ${hrs(p.doingH)}h · 휴가 ${hrs(p.leaveH)}h`]);
  for(const [k,label] of NOTE_FIELDS.slice(1))if(note(k))rows.push([wk,m.projectName,'',label,note(k),'']);
  return '\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n');
}
function reportBodyHtml(m){
  if(!m.projects){ // 이전 형식
    const sec=s=>`<section class="rsec"><h4>${esc(s.title)} <span class="num">${s.count}</span></h4>${s.groups.length?s.groups.map(g=>`<div class="rgrp"><div class="rpart"><span class="sw" style="background:${g.color}"></span>${esc(g.label)}</div><ul>${g.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join(''):'<p class="legend">해당 업무 없음</p>'}</section>`;
    return `<div class="rsecs">${(m.sections||[]).map(sec).join('')}<section class="rsec"><h4>휴가 · 부재 <span class="num">${(m.leaves||[]).length}</span></h4>${(m.leaves||[]).length?`<ul>${m.leaves.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="legend">해당 없음</p>'}</section></div>`;
  }
  if(!m.projects.length)return '<p class="legend" style="margin:0">이 주에 해당하는 업무와 휴가가 없습니다.</p>';
  return m.projects.map(p=>`<section class="rproj">
    <h3><span class="rdot" style="background:${esc(p.color||'var(--muted)')}"></span>${esc(p.name)}<span class="legend num">완료 ${p.counts.done} · 진행 ${p.counts.doing} · 지연 ${p.counts.late}</span></h3>
    <div class="rparts">${p.parts.map(pt=>`<div class="rpartcard"><div class="rpart"><span class="sw" style="background:${pt.color}"></span>${esc(pt.label)}</div>
      ${pt.blocks.map(b=>`<div class="rblk rb-${b.k}"><div class="rblkT">${esc(b.title)} <span class="num">${b.items.length}</span></div><ul>${b.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div>`).join('')}
      ${p.leaves.length?`<div class="rpartcard"><div class="rpart"><span class="sw" style="background:var(--muted)"></span>휴가 · 부재</div><ul>${p.leaves.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    </div></section>`).join('');
}

// 보고서가 이미 있으면 바뀐 필드만 update(메모는 칸별로 합쳐짐), 없을 때만 set으로 새로 만듦.
// 여러 사람이 같은 주 보고서의 다른 메모 칸을 써도 서로 지우지 않게 하려는 것
async function saveReport(patch){
  const id=reportId(rstate.week,rstate.project), cur=reports.find(r=>r.id===id), at=new Date().toISOString();
  if(cur){await db.collection('reports').doc(id).update({...patch,updatedAt:at});return;}
  await db.collection('reports').doc(id).set({week:rstate.week,projectId:rstate.project,notes:{},confirmed:false,model:null,confirmedAt:'',...patch,updatedAt:at});
}
// 화면에 불러온 뒤(data-base) 내가 고친 메모 칸만 모음
function changedNotes(){const n={};document.querySelectorAll('#reportArea [data-note]').forEach(t=>{if(t.value!==(t.dataset.base??''))n[t.dataset.note]=t.value;});return n;}
function markNotesSaved(n){document.querySelectorAll('#reportArea [data-note]').forEach(t=>{if(t.dataset.note in n)t.dataset.base=n[t.dataset.note];});}
function saveChangedNotes(){const notes=changedNotes();if(!Object.keys(notes).length)return Promise.resolve();return saveReport({notes}).then(()=>markNotesSaved(notes));}
let noteTimer=null, noteBusy=Promise.resolve();
function queueNoteSave(){
  clearTimeout(noteTimer);
  const st=$('#rSaveState');if(st)st.textContent='입력 중…';
  noteTimer=setTimeout(()=>{
    noteBusy=noteBusy.then(saveChangedNotes).then(()=>{const s=$('#rSaveState');if(s)s.textContent='메모 저장됨';}).catch(err=>handleWriteError(err,'#rSaveState'));
  },1200);
}
function flushNotes(){if(noteTimer){clearTimeout(noteTimer);noteTimer=null;noteBusy=noteBusy.then(saveChangedNotes).catch(()=>{});}}

/* ---------- 주간 보고(팀 양식): 목~수 한 주, 카테고리(프로젝트)별 운영 건수와 본문 ---------- */
// 주는 목요일 시작·수요일 끝. n주는 끝나는 수요일이 그 달 달력(일요일 시작, 1일이 든 줄 = 1주)의 몇째 줄인지로 셈
// — 팀 양식 표기(10/15~10/21 = 10월 4주, 10/29~11/4 = 11월 1주)와 같게
const thursdayOf=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+3)%7));return ymd(d);};
const sundayOf=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-d.getDay());return ymd(d);};
rstate.week3=thursdayOf(todayStr());
function rWeekLabel(thu){const wed=addDays(thu,6),firstSun=sundayOf(wed.slice(0,8)+'01');
  return `${wed.slice(2,4)}년 ${+wed.slice(5,7)}월 ${Math.round((new Date(sundayOf(wed)+'T00:00:00')-new Date(firstSun+'T00:00:00'))/(7*864e5))+1}주`;}
const rRange=thu=>`${mdot(thu)} 목 ~ ${mdot(addDays(thu,6))} 수`;
const rTabs=cur=>`<div class="vbar"><div class="vtabs" role="tablist">${[['sum','주간보고'],['detail','주간보고(상세)']].map(([v,l])=>`<button type="button" class="vtab" role="tab" data-goto="report" data-rview="${v}" aria-selected="${cur===v}">${l}</button>`).join('')}</div></div>`;
const R_KINDS=[['done','반영'],['doing','진행'],['recv','접수']];
const v3Id=thu=>`w_${thu}`;
const v3Doc=()=>reports.find(r=>r.id===v3Id(rstate.week3));
const fmtDT=s=>{const d=new Date(s);return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
// 카테고리 = 프로젝트 + 사용자가 추가한 것(그 주 문서에 없으면 가장 최근 주의 것을 이어받음)
function v3Custom(doc){if(doc?.cats)return doc.cats;const prev=reports.filter(r=>r.kind==='v3'&&r.week<rstate.week3&&r.cats).sort((a,b)=>b.week.localeCompare(a.week))[0];return prev?.cats||[];}
function v3Auto(c,thu){
  const wed=addDays(thu,6),inR=d=>!!d&&d>=thu&&d<=wed;
  if(!c.project)return {counts:{done:0,doing:0,recv:0},deploy:0,lists:{done:[],doing:[],recv:[]}};
  const T=workItems().filter(t=>t.projectId===c.id);
  const lists={done:T.filter(t=>t.status==='done'&&inR(t.doneDate)),doing:T.filter(t=>t.status==='doing'||t.status==='review'),recv:T.filter(t=>t.status==='wait')};
  const deploy=events.filter(e=>e.kind==='deploy'&&e.projectId===c.id).reduce((n,e)=>n+deployDates(e,thu,wed).length,0);
  return {counts:{done:lists.done.length,doing:lists.doing.length,recv:lists.recv.length},deploy,lists};
}
// 처음 열 때 그 주 업무로 만드는 본문 초안: ■ 소제목 아래 [파트] 내용(날짜)
function v3Draft(c,thu){const a=v3Auto(c,thu),pl=t=>`[${partOf(t.part).label}] `,L=[],ln=t=>L.push({t,hl:false});
  ln(`■ 반영 ${a.counts.done}건${a.deploy?`(배포 ${a.deploy}건)`:''}`);a.lists.done.forEach(t=>ln(`${pl(t)}${t.title}(${md(t.doneDate)})`));ln('');
  ln(`■ 진행 ${a.counts.doing}건`);a.lists.doing.forEach(t=>ln(`${pl(t)}${t.title}${t.dueDate?`(~${md(t.dueDate)})`:''}`));ln('');
  ln(`■ 접수(검토 중) ${a.counts.recv}건`);a.lists.recv.forEach(t=>ln(`${pl(t)}${t.title}${t.requestDate?`(${md(t.requestDate)})`:''}`));ln('');
  ln('----------');ln('');return L;}
// 본문 소제목(■ 반영 N건 · ■ 진행 N건 · ■ 접수… N건)의 숫자 = 운영 건수. 한쪽을 고치면 다른 쪽도 같이 바뀜
const V3_HEAD={done:/^(■\s*반영\s*)(\d+)(\s*건)/,doing:/^(■\s*진행\s*)(\d+)(\s*건)/,recv:/^(■\s*접수[^\d]*?)(\d+)(\s*건)/};
function v3HeadCounts(lines){const o={};lines.forEach(l=>{for(const k in V3_HEAD){const m=String(l.t||'').match(V3_HEAD[k]);if(m&&!(k in o))o[k]=+m[2];}});return o;}
const v3SetHeads=(lines,counts)=>lines.map(l=>{for(const k in V3_HEAD)if(V3_HEAD[k].test(l.t||''))return {...l,t:l.t.replace(V3_HEAD[k],(_,a,n,b)=>a+(+counts[k]||0)+b),h:undefined};return l;});
// 저장된 본문에 새로 생긴 업무를 끼워 넣음(이번 주부터, 확정 전). 업무마다 'id:구분'을 sec.auto에 적어 두어
// 사용자가 지운 줄은 다시 넣지 않음. 다른 구분에 자동으로 넣었던 줄(글자 그대로)은 옮겨 감. 소제목 숫자도 함께 ±1
const v3Line={done:t=>`${t.title}(${md(t.doneDate)})`,doing:t=>`${t.title}${t.dueDate?`(~${md(t.dueDate)})`:''}`,recv:t=>`${t.title}${t.requestDate?`(${md(t.requestDate)})`:''}`};
function v3Merge(c,sec,thu){
  const a=v3Auto(c,thu),seen=new Set(sec.auto||[]);let L=sec.lines.map(l=>({...l})),changed=false;
  const head=k=>L.findIndex(l=>V3_HEAD[k].test(l.t||'')),isHead=l=>/^■/.test(l.t||'')||/^-{5,}/.test(l.t||'');
  const bump=(k,n)=>{const i=head(k);if(i>=0)L[i]={...L[i],t:L[i].t.replace(V3_HEAD[k],(_,x,m,y)=>x+Math.max(0,+m+n)+y),h:undefined};};
  const block=k=>{const i=head(k);if(i<0)return null;let j=i+1;while(j<L.length&&!isHead(L[j]))j++;return [i,j];};
  for(const k of ['done','doing','recv'])for(const t of a.lists[k]){
    const key=t.id+':'+k;if(seen.has(key)||!t.title)continue;const b=block(k);if(!b)continue;
    seen.add(key);changed=true;
    if(L.slice(b[0]+1,b[1]).some(l=>(l.t||'').includes(t.title)))continue; // 이미 적혀 있음
    // 다른 구분에 자동으로 넣은 그대로 남아 있으면 빼 옴
    for(const k2 of ['done','doing','recv']){if(k2===k)continue;const b2=block(k2);if(!b2)continue;const pl=`[${partOf(t.part).label}] `;
      const at=L.findIndex((l,x)=>x>b2[0]&&x<b2[1]&&l.t===pl+v3Line[k2](t));if(at>=0){L.splice(at,1);bump(k2,-1);}}
    const nb=block(k);let at=nb[1];while(at>nb[0]+1&&!String(L[at-1].t||'').trim())at--;
    L.splice(at,0,{t:`[${partOf(t.part).label}] `+v3Line[k](t),hl:false});bump(k,1);
  }
  return {lines:L,auto:[...seen],changed};
}
const v3Merging=new Set();
function v3Data(){
  const thu=rstate.week3,doc=v3Doc();
  const cats=[...projects.map(p=>({id:p.id,name:p.name,color:p.color,inCount:true,project:true})),...v3Custom(doc).map(c=>({...c,project:false}))];
  const live=thu>=thursdayOf(todayStr())&&!doc?.confirmed;
  return {thu,doc,cats:cats.map(c=>{let sec=doc?.sections?.[c.id]||{};
    if(live&&c.project&&Array.isArray(sec.lines)){const m=v3Merge(c,sec,thu);
      if(m.changed){sec={...sec,lines:m.lines,auto:m.auto};
        // 그 구역을 고치는 중이 아니면 저장(작성자 표시는 그대로)
        const ed=document.activeElement?.closest?.('#reportArea [data-cid]');
        if(canWrite&&!v3Merging.has(c.id)&&ed?.dataset.cid!==c.id&&!v3Timer[c.id]){v3Merging.add(c.id);v3SaveDoc({sections:{[c.id]:{lines:m.lines,auto:m.auto}}}).catch(()=>{}).finally(()=>v3Merging.delete(c.id));}}}
    const base=sec.countsEdited&&sec.counts?sec.counts:v3Auto(c,thu).counts;
    return Array.isArray(sec.lines)?{...c,sec,counts:{...base,...v3HeadCounts(sec.lines)},lines:sec.lines}:{...c,sec,counts:base,lines:v3Draft(c,thu)};})};
}
// 편집칸은 줄 목록(lines: [{t, hl}])으로만 저장하고 다시 그림 — 서식·스크립트가 섞이지 않게
const linesHtml=L=>L.map(l=>`<div${l.hl?' class="hl"':''}>${l.h?rtClean(l.h):l.t?esc(l.t):'<br>'}</div>`).join('');
function readLines(ed){const out=[];ed.childNodes.forEach(n=>{if(n.nodeType===3){if(n.textContent.trim()||out.length)out.push({t:n.textContent,hl:false});return;}
  if(n.nodeType===1){const h=rtClean(n.innerHTML);out.push({t:n.textContent,hl:n.classList.contains('hl'),...(rtFmt(h)?{h}:{})});}});return out;}
function edLinesInSel(ed){const sel=getSelection();if(!sel.rangeCount)return [];const r=sel.getRangeAt(0);
  const kids=[...ed.children].filter(c=>r.intersectsNode(c));if(kids.length)return kids;
  let n=r.startContainer;while(n&&n.parentNode!==ed)n=n.parentNode;return n&&n.nodeType===1?[n]:[];}
function toggleHl(ed){const ls=edLinesInSel(ed);if(!ls.length)return;const on=!ls.every(l=>l.classList.contains('hl'));
  // ✔ 표시만 앞에 붙이고 빼서, 줄 안의 글자 서식은 그대로 둠
  ls.forEach(l=>{l.classList.toggle('hl',on);const t=l.textContent;if(on&&!t.startsWith('✔'))l.prepend('✔ ');
    if(!on&&t.startsWith('✔')){const w=document.createTreeWalker(l,NodeFilter.SHOW_TEXT);while(w.nextNode()){const x=w.currentNode;if(x.data.trim()){x.data=x.data.replace(/^\s*✔\s?/,'');break;}}}if(!l.textContent)l.innerHTML='<br>';});}
function insertHr(ed){const ls=edLinesInSel(ed),d=document.createElement('div');d.textContent='----------';(ls.length?ls[ls.length-1]:ed.lastChild)?.after?.(d)||ed.append(d);}
// 저장: 구역 단위 부분 저장(다른 사람이 다른 구역을 고쳐도 덮어쓰지 않음)
async function v3SaveDoc(patch){const id=v3Id(rstate.week3),doc=v3Doc(),at=new Date().toISOString();
  if(doc)return db.collection('reports').doc(id).update({...patch,updatedAt:at});
  return db.collection('reports').doc(id).set({kind:'v3',week:rstate.week3,sections:{},cats:v3Custom(null),confirmed:false,confirmedAt:'',...patch,updatedAt:at});}
const v3Save=(cid,patch)=>{const me=myMember();return v3SaveDoc({sections:{[cid]:{...patch,updatedAt:new Date().toISOString(),updatedBy:actorId||'',updatedByName:me?.name||''}}});};
const v3Timer={};
function v3SaveLines(cid){const ed=document.querySelector(`#reportArea [data-cid="${CSS.escape(cid)}"] .rEditor`);if(!ed)return;v3Save(cid,{lines:readLines(ed)}).catch(err=>handleWriteError(err));}
function v3Queue(cid){clearTimeout(v3Timer[cid]);v3Timer[cid]=setTimeout(()=>{delete v3Timer[cid];v3SaveLines(cid);},1000);}
function v3Flush(){for(const cid of Object.keys(v3Timer)){clearTimeout(v3Timer[cid]);delete v3Timer[cid];v3SaveLines(cid);}}

function renderReport(){
  const area=$('#reportArea');
  if(!storeReady){area.innerHTML=`<div class="empty"><h2>보고서를 준비하는 중입니다</h2></div>`;return;}
  const {thu,doc,cats}=v3Data(),locked=!!doc?.confirmed,ro=!canWrite||locked,inc=cats.filter(c=>c.inCount);
  const tot=k=>inc.reduce((n,c)=>n+(+c.counts[k]||0),0);
  const old=reports.filter(r=>r.kind!=='v3'&&r.week&&r.week>=mondayOf(thu)&&r.week<=mondayOf(addDays(thu,6)));
  const sum=`<h3 class="rsubt">${rWeekLabel(thu).slice(4)} 운영 건수</h3><div class="statWrap rsum-wrap"><table class="statTable rsum"><thead><tr><th>구분</th>${inc.map(c=>`<th title="${esc(c.name)}">${esc(c.name)}</th>`).join('')}<th>합계</th></tr></thead><tbody>
    ${R_KINDS.map(([k,l])=>`<tr><th scope="row">${l}</th>${inc.map(c=>`<td class="num" data-rc="${esc(c.id)}|${k}">${+c.counts[k]||0}</td>`).join('')}<td class="num"><b data-rt="${k}">${tot(k)}</b></td></tr>`).join('')}</tbody></table></div>`;
  const secs=cats.map(c=>{const fold=rstate.fold.has(c.id),s=c.sec;
    return `<section class="rsec ${fold?'fold':''}" data-cid="${esc(c.id)}">
      <header class="rsecHead"><h3>${c.color?`<span class="rdot" style="background:${esc(c.color)}"></span>`:''}${esc(c.name)}</h3><span class="legend rlive">실시간 연결됨</span>${s.updatedAt?`<span class="legend">마지막 수정: ${esc(s.updatedByName||'—')} · ${esc(fmtDT(s.updatedAt))}</span>`:''}<span class="spacer"></span>
        <button class="btn ghost sm" type="button" data-fold aria-label="${fold?'펼치기':'접기'}">${fold?'<svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>':'<svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>'}</button>${!c.project&&!ro?'<button class="btn danger sm" type="button" data-cdel>삭제</button>':''}</header>
      <div class="rsecBody rtWrap">
        <div class="rcounts">${R_KINDS.map(([k,l])=>`<label>${l}<input type="number" min="0" class="rcnt" data-k="${k}" data-note="cnt" value="${+c.counts[k]||0}" ${ro?'disabled':''}></label>`).join('')}${!ro&&c.project?'<button class="btn ghost sm" type="button" data-refill>자동 계산으로 다시 채우기</button>':''}${!c.inCount?'<span class="legend">운영 건수 미포함</span>':''}</div>
        ${ro?'':`<div class="rtools"><button class="btn sm" type="button" data-hl>강조</button><button class="btn sm" type="button" data-hr>구분선 넣기</button></div>`}
        <div class="rEditor" data-rt data-note="body" contenteditable="${!ro}" spellcheck="false" aria-label="${esc(c.name)} 본문">${linesHtml(c.lines)}</div>
      </div></section>`;}).join('');
  const simple=cats.map(c=>{const s=c.sec;
    return `<section class="rsec rsimple" data-cid="${esc(c.id)}">
      <header class="rsecHead"><h3>${esc(c.name)}</h3><span class="legend rlive">실시간 연결됨</span>${s.updatedAt?`<span class="legend">마지막 수정: ${esc(s.updatedByName||'—')} · ${esc(fmtDT(s.updatedAt))}</span>`:''}<span class="spacer"></span>${!c.project&&!ro?'<button class="btn sm" type="button" data-cdel>삭제</button>':''}</header>
      <div class="rsecBody rtWrap"><div class="rEditor" data-rt data-note="body" contenteditable="${!ro}" spellcheck="false" aria-label="${esc(c.name)} 본문">${linesHtml(c.lines)}</div></div></section>`;}).join('');
  const addCat=ro?'':`<div class="rAddCat"><input class="search" id="rCatName" data-note="cat" maxlength="30" placeholder="새 카테고리명" aria-label="새 카테고리명"><label class="cfItem"><input type="checkbox" id="rCatIn" checked>운영건수(반영/진행/접수) 포함</label><button class="btn" type="button" id="rCatAdd">카테고리 추가</button></div>`;
  area.innerHTML=`
    <div class="rtool">
      ${periodSelects('rweek',thu,'rWeek3')}
      <span class="spacer"></span>
      ${trashBtn('rpTrashBtn',TRASH_SRC.report.list().length)}${exportMenu([['rCopy','텍스트 복사'],...(downloads?[['rXlsx','엑셀 저장'],['rCsv','CSV','운영 건수 표만'],['rMd','Markdown']]:[])])}
    </div>
    <div class="rbar"><h2 class="rtitle">${rWeekLabel(thu).slice(4)}<small>${thu.replace(/-/g,'/')}(목)~${addDays(thu,6).slice(5).replace('-','/')}(수)</small></h2><span class="spacer"></span><span class="pill ${locked?'s-done':'s-wait'}">${locked?'확정됨':'작성 중'}</span>${canWrite?(locked?'<button class="btn primary" type="button" id="rUnconfirm">확정 해제</button>':'<button class="btn primary" type="button" id="rConfirm">이 주 보고서 확정</button>'):''}</div>
    ${rTabs(rstate.view)}
    ${rstate.view==='detail'?secs:sum+simple}${addCat}
    ${!doc&&old.length?`<div class="rold"><span class="legend">이전 형식 보고서 보기:</span>${old.map(r=>`<button class="btn ghost sm" type="button" data-oldrep="${esc(r.id)}">${esc(projOf(r.projectId)?.name||'전체 프로젝트')} · ${esc(md(r.week))} 주</button>`).join('')}</div>`:''}`;
}
// 본문을 고치는 중: 소제목 숫자를 운영 건수 표·건수 칸에 바로 반영(저장은 1초 뒤)
function v3Live(sec){const hc=v3HeadCounts(readLines(sec.querySelector('.rEditor'))),cid=sec.dataset.cid;
  for(const k in hc){const td=document.querySelector(`#reportArea [data-rc="${CSS.escape(cid)}|${k}"]`);if(td)td.textContent=hc[k];const inp=sec.querySelector(`.rcnt[data-k="${k}"]`);if(inp)inp.value=hc[k];}
  R_KINDS.forEach(([k])=>{const t=document.querySelector(`#reportArea [data-rt="${k}"]`);if(t)t.textContent=[...document.querySelectorAll(`#reportArea [data-rc$="|${k}"]`)].reduce((n,x)=>n+(+x.textContent||0),0);});}
onArea('#reportArea','input',e=>{const ed=e.target.closest?.('.rEditor');if(ed&&canWrite){const sec=ed.closest('[data-cid]');v3Live(sec);v3Queue(sec.dataset.cid);}});
onArea('#reportArea','paste',e=>{if(!e.target.closest?.('.rEditor'))return;e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));});
onArea('#reportArea','mousedown',e=>{if(e.target.closest('[data-hl],[data-hr]'))e.preventDefault();});
onArea('#reportArea','change',e=>{const t=e.target;
  if(t.id==='rWeek3'||t.id==='rWeek3Y'){v3Flush();rstate.week3=t.id==='rWeek3'?t.value:latestIn('rweek',+t.value);render();return;}
  if(t.classList.contains('rcnt')){const sec=t.closest('[data-cid]'),cid=sec.dataset.cid,counts={};sec.querySelectorAll('.rcnt').forEach(x=>counts[x.dataset.k]=Math.max(0,Math.round(+x.value||0)));
    const ed=sec.querySelector('.rEditor'),lines=v3SetHeads(readLines(ed),counts);ed.innerHTML=linesHtml(lines);clearTimeout(v3Timer[cid]);delete v3Timer[cid];
    v3Save(cid,{counts,countsEdited:true,lines}).catch(err=>handleWriteError(err));}
});
// 보고서 내보내기용 텍스트 줄(강조 줄은 ✔ 유지)
function v3Text(d){const L=[`■ ${rWeekLabel(d.thu)} 주간 업무 보고 (${rRange(d.thu)})`,'','[운영 건수]'],inc=d.cats.filter(c=>c.inCount);
  L.push(['구분',...inc.map(c=>c.name),'합계'].join(' | '));R_KINDS.forEach(([k,l])=>L.push([l,...inc.map(c=>+c.counts[k]||0),inc.reduce((n,c)=>n+(+c.counts[k]||0),0)].join(' | ')));
  d.cats.forEach(c=>{L.push('',`[${c.name}] 반영 ${+c.counts.done||0} · 진행 ${+c.counts.doing||0} · 접수 ${+c.counts.recv||0}`,...c.lines.map(l=>l.t));});return L.join('\n');}

  R_KINDS.forEach(([k,l])=>L.push(`| ${l} | ${inc.map(c=>+c.counts[k]||0).join(' | ')} | **${inc.reduce((n,c)=>n+(+c.counts[k]||0),0)}** |`));
  d.cats.forEach(c=>{L.push('',`## ${c.name}`,'',`반영 ${+c.counts.done||0} · 진행 ${+c.counts.doing||0} · 접수 ${+c.counts.recv||0}`,'');c.lines.forEach(l=>L.push(l.hl?`**✔ ${l.t.replace(/^✔\s?/,'')}**  `:l.t?`${l.t}  `:''));});return L.join('\n');}

  return '﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n');}

/* 주간 보고 엑셀(.xlsx) — 화면과 같은 '프로젝트 → 파트 → 구분' 양식으로 서식을 입혀 저장. ExcelJS는 버튼을 누를 때 한 번만 불러옴 */
let excelLoading=null;
function loadExcel(){
  if(window.ExcelJS)return Promise.resolve(window.ExcelJS);
  if(!excelLoading)excelLoading=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';sc.onload=()=>window.ExcelJS?res(window.ExcelJS):rej(new Error('load'));sc.onerror=()=>{excelLoading=null;rej(new Error('load'));};document.head.appendChild(sc);});
  return excelLoading;
}
function xHex(c,fb){return /^#[0-9a-f]{6}$/i.test(c||'')?c.slice(1).toUpperCase():fb;}
function xTint(hex,t){const n=parseInt(hex,16),r=n>>16&255,g=n>>8&255,b=n&255,f=v=>Math.round(v+(255-v)*t).toString(16).padStart(2,'0');return (f(r)+f(g)+f(b)).toUpperCase();}
// 같은 업무가 '금주 완료'와 '신규 요청'에 모두 있으면 완료 쪽 1건만 남기고 상세에 '금주 신규'를 붙임
function dedupDoneNew(blocks){
  const name=i=>{const k=i.indexOf(' — ');return k<0?i:i.slice(0,k);};
  const done=blocks.find(b=>b.k==='done');if(!done)return blocks;
  const nw=blocks.find(b=>b.k==='new');if(!nw)return blocks;
  const doneNames=new Set(done.items.map(name)), newNames=new Set(nw.items.map(name));
  const out=blocks.map(b=>b.k==='done'?{...b,items:b.items.map(i=>newNames.has(name(i))?i+' · 금주 신규':i)}:b.k==='new'?{...b,items:b.items.filter(i=>!doneNames.has(name(i)))}:b);
  return out.filter(b=>b.items.length);
}
// 화면·텍스트·Markdown·CSV·엑셀 모두 같은 규칙 적용 (확정된 보고서도 보여줄 때 적용)
function dedupModel(m){if(!m)return m;if(m.people){m={...m};delete m.people;}if(!m.projects)return m;return {...m,projects:m.projects.map(p=>({...p,parts:p.parts.map(pt=>({...pt,blocks:dedupDoneNew(pt.blocks)}))}))};}

  if(!projectsList.length){ws.mergeCells(r,1,r,4);put(r,1,'이 주에 해당하는 업무와 휴가가 없습니다.',{font:{color:{argb:'FF'+C.muted}}});r+=2;}

    ws.getRow(r).height=24;r++;

    for(const pt of parts){

/* ---------- hours (시간 집계) ---------- */
// 담당자별 기간 집계: 완료 업무의 실제 소요(비어 있으면 예상) + 진행 중 업무에 입력된 실제 소요. 가용 = 평일 수 × 8h − 휴가
// 소요시간은 업무 단위 누적값이라, 요청일~완료일(진행 중이면 오늘)의 평일에 고르게 나눠 이 기간 몫만 셈
// ponytail: 날짜별 실제 기록이 없어 균등 배분. 정확히 하려면 일자별 시간 기록(worklog)을 따로 받아야 함
function periodShare(t,end,a,b){
  const s=t.requestDate&&t.requestDate<=end?t.requestDate:end, wd=eachDay(s,end).filter(d=>!isWeekend(d));
  if(!wd.length)return end>=a&&end<=b?1:0;
  return wd.filter(d=>d>=a&&d<=b).length/wd.length;
}
function peopleStats(a,b,pid,withItems){
  const days=eachDay(a,b), work=days.filter(d=>!isWeekend(d)).length*8, today=todayStr();
  const T=workItems().filter(t=>pid==='all'||t.projectId===pid);
  const ppl={};
  const P0=n=>ppl[n]||(ppl[n]={name:n,doneN:0,doneH:0,doingN:0,doingH:0,leaveH:0,noAct:0,items:[],pj:new Set()});
  for(const t of T){
    const L=wlogs.filter(w=>w.taskId===t.id);
    if(L.length){ // 날짜별 기록이 있으면 기록한 날짜·사람 그대로
      const byP={};for(const w of L)if(w.date>=a&&w.date<=b){const nm=memOf(w.memberId)?.name||w.member||'';if(nm)byP[nm]=(byP[nm]||0)+(+w.hours||0);}
      for(const [nm,h] of Object.entries(byP)){const p=P0(nm);if(projOf(t.projectId))p.pj.add(t.projectId);const kind=t.status==='done'?'done':'doing';if(kind==='done'){p.doneN++;p.doneH+=h;}else{p.doingN++;p.doingH+=h;}if(withItems)p.items.push({t,h,est:false,kind,logged:true});}
      continue;
    }
    const n=(t.assignee||'').trim();if(!n)continue;
    if(t.status==='done'&&t.doneDate){const f=periodShare(t,t.doneDate,a,b);if(!f)continue;const p=P0(n);if(projOf(t.projectId))p.pj.add(t.projectId);p.doneN++;const est=t.actHours===''||t.actHours==null;const h=(est?(+t.estHours||0):(+t.actHours||0))*f;p.doneH+=h;if(est)p.noAct++;if(withItems)p.items.push({t,h,est,kind:'done'});}
    else if(t.status==='doing'||t.status==='review'){const f=periodShare(t,today,a,b);if(!f)continue;const p=P0(n);if(projOf(t.projectId))p.pj.add(t.projectId);p.doingN++;const h=(+t.actHours||0)*f;p.doingH+=h;if(withItems)p.items.push({t,h,est:false,kind:'doing'});}
  }
  for(const m of members.filter(m=>memberIn(m,pid))){
    const p=P0(m.name);for(const id of memberProjectIds(m))p.pj.add(id);

    case 'status':return statusOf(v).label;

function logChange(entity,action,id,label,before,after,extra){
  if(!db||!canWrite)return;
  const fields=HFIELDS[entity]||[];
  let changes=[];
  if(action==='update'){
    changes=fields.filter(([f])=>String(before?.[f]??'')!==String(after?.[f]??'')).map(([f,l])=>({f,l,from:hval(f,before?.[f]),to:hval(f,after?.[f])}));
    if(!changes.length&&!extra)return;
  }else if(action==='create'){
    changes=fields.filter(([f])=>f!=='color'&&f!=='order'&&f!=='title'&&f!=='name'&&after?.[f]!==''&&after?.[f]!=null).slice(0,6).map(([f,l])=>({f,l,from:'',to:hval(f,after[f])}));
  }
  db.collection('history').add({at:new Date().toISOString(),actor:actorId||'',entity,action,entityId:id||'',label:String(label||'').slice(0,120),changes,extra:extra||''}).catch(()=>{});
}

onArea('#historyArea','change',e=>{const m={hEnt:'entity',hAct:'action',hActor:'actor',hRange:'range'}[e.target.id];if(m){hstate[m]=e.target.value;render();}});
let hqT;onArea('#historyArea','input',e=>{if(e.target.id!=='hQ')return;clearTimeout(hqT);hqT=setTimeout(()=>{hstate.q=e.target.value;renderHistory();liftTools();const i=$('#hQ');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},200);});
onArea('#historyArea','click',e=>{const b=e.target.closest('[data-task]');if(b)openTask(tasks.find(t=>t.id===b.dataset.task));});

function handleWriteError(err,sel){
  const msg=err?.code==='invalid_argument'?'수정 권한이 없거나 입력값이 올바르지 않습니다.':err?.code==='quota_exceeded'?'저장 공간이 가득 찼습니다. 완료된 업무를 정리해 주세요.':'저장하지 못했습니다. 잠시 후 다시 시도해 주세요.';
  if(err?.code==='invalid_argument'&&!sel){canWrite=false;render();}
  if(sel&&$(sel))$(sel).textContent=msg;else toast(msg);
}

/* ---------- boot ---------- */
render();
(async()=>{
  if(!window.claude?.use){storeReady=true;$('#banner').textContent='저장소에 연결되지 않아 읽기 전용으로 표시됩니다.';$('#banner').hidden=false;render();return;}
  const [d,u,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
  db=d;downloads=dl;
  if(!db){storeReady=true;$('#banner').textContent='로그인한 팀원만 업무를 볼 수 있습니다. claude.ai에 로그인 후 다시 열어 주세요.';$('#banner').hidden=false;render();return;}
  let w=null;try{w=u?await u.can('data.write'):null;}catch(e){}
  canWrite=w!==false;userCap=u;try{actorId=u?await u.id():null;}catch(e){}
  if(w===false){$('#banner').textContent='보기 전용 권한입니다. 업무를 등록·수정하려면 공유한 사람에게 편집 권한을 요청하세요.';$('#banner').hidden=false;}
  let got=0;const ready=()=>{if(++got>=10&&!storeReady){storeReady=true;render();}}; // 마지막에 온 구독이 다시 그리지 않아도 로딩 화면에서 넘어가게
  const onErr=e=>{if(e?.code!=='revoked'){$('#banner').textContent='업무 목록을 불러오지 못했습니다. 페이지를 새로 고쳐 주세요.';$('#banner').hidden=false;}};
  let pr=false,tr=false,ar=false,mr=false,lr=false,rr=false,sr=false;
  db.collection('assignments').onSnapshot(s=>{assigns=s.docs.map(x=>({id:x.id,...x.data()}));if(!sr){sr=true;ready();}render();},onErr);
  startHistory();
  db.doc('settings/site').onSnapshot(s=>{site=s.exists?{...SITE_DEFAULT,...s.data()}:{...SITE_DEFAULT};renderBrand();},()=>{});
  db.doc('settings/menus').onSnapshot(s=>{menuCfg=s.exists?s.data()||{}:{};if(mDraft&&JSON.stringify(mDraft)===mBase)mDraft=null; /* 고치지 않은 초안은 새 설정으로 */if(!mDraft)syncItems();navKey='';if(storeReady)render();},()=>{});
  db.collection('reports').onSnapshot(s=>{reports=s.docs.map(x=>({id:x.id,...x.data()}));if(!rr){rr=true;ready();}render();},onErr);
  db.collection('members').onSnapshot(s=>{members=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));applyExternal();if(!mr){mr=true;ready();}render();},onErr);
  db.collection('leaves').onSnapshot(s=>{leaves=s.docs.map(x=>({id:x.id,...x.data()}));if(!lr){lr=true;ready();}render();},onErr);
  db.collection('events').onSnapshot(s=>{events=s.docs.map(x=>({id:x.id,...x.data()}));render();},onErr);
  db.collection('evt_months').onSnapshot(s=>{evtMonths=s.docs.map(x=>({id:x.id,...x.data()}));if(state.mode==='eventops')render();},onErr);
  db.collection('evt_rows').onSnapshot(s=>{evtRowsAll=s.docs.map(x=>({id:x.id,...x.data()}));if(state.mode==='eventops')render();},onErr);
  db.collection('trash').onSnapshot(s=>{wbTrash=s.docs.map(x=>({id:x.id,...x.data()}));if(!wbPurged){wbPurged=true;trashPurge('tasks');trashPurge('report');trashPurge('manual');trashPurge('regress');}trashDraw();wbTrashPaint();if(state.mode==='report'||state.mode==='manuals'||state.mode==='regress')render();},onErr);
  db.collection('manuals').onSnapshot(s=>{manuals=s.docs.map(x=>({id:x.id,...x.data()}));if(state.mode==='manuals')render();if($('#mnPanel'))mnPanel();},onErr);
  db.collection('manual_runs').onSnapshot(s=>{manualRuns=s.docs.map(x=>({id:x.id,...x.data()}));if(state.mode==='manuals'||(state.mode==='tasks'&&state.post))render();if($('#mnPanel'))mnPanel();},onErr);
  db.collection('manual_versions').onSnapshot(s=>{manualVers=s.docs.map(x=>({id:x.id,...x.data()}));if(state.mode==='manuals')render();},onErr);
  db.collection('cvt_cases').onSnapshot(s=>{cvtCases=s.docs.map(x=>({id:x.id,...x.data()}));if(state.mode==='regress')render();},onErr);
  db.collection('cvt_runs').onSnapshot(s=>{cvtRuns=s.docs.map(x=>({id:x.id,...x.data()}));if(state.mode==='regress')render();},onErr);
  db.collection('evt_trash').onSnapshot(s=>{evtTrash=s.docs.map(x=>({id:x.id,...x.data()}));if(!evPurged){evPurged=true;trashPurge('evt');}trashDraw();if(state.mode==='eventops')render();},onErr);
  db.collection('parts').onSnapshot(s=>{
    if(s.docs.length){PARTS=s.docs.map(x=>{const d=x.data();return {k:x.id,label:d.name||'이름 없음',c:d.color||PART_COLORS[4],order:d.order??0};}).sort((a,b)=>a.order-b.order);partsStored=true;}
    else{PARTS=DEFAULT_PARTS.slice();partsStored=false;}
    if(!ar){ar=true;ready();}render();},onErr);
  db.collection('projects').onSnapshot(s=>{projects=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.order??0)-(b.order??0));if(!pr){pr=true;ready();}render();},onErr);
  db.collection('tasks').onSnapshot(s=>{tasks=s.docs.map(x=>({id:x.id,...x.data()}));if(!tr){tr=true;ready();}render();},onErr);
  let wr=false;db.collection('worklogs').onSnapshot(s=>{wlogs=s.docs.map(x=>({id:x.id,...x.data()}));if(!wr){wr=true;ready();}wlRefresh?.();render();},onErr);
  // ponytail: 댓글·템플릿을 전부 구독. 수천 건이 넘으면 업무별 query로 나눌 것
  let cr=false;db.collection('comments').onSnapshot(s=>{comments=s.docs.map(x=>({id:x.id,...x.data()}));if(!cr){cr=true;ready();}wlRefresh?.();if(state.view==='list')render();},onErr);
  let pr2=false;db.collection('templates').onSnapshot(s=>{templates=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));if(!pr2){pr2=true;ready();}wlRefresh?.();},onErr);
})();
</script>
