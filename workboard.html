/* ---------- leave (휴가 관리) ---------- */
// 반반차(오전·오후) = 2시간 = 0.25일 (1일 8시간 기준). 여러 날 휴가는 주말을 빼고 계산하며, 공휴일은 '차감 일수'에서 직접 조정
const LEAVE_TYPES=[
  {k:'annual',label:'연차',days:1,deduct:true,multi:true,cls:'lt-a'},
  {k:'am',label:'오전 반차',days:.5,deduct:true,cls:'lt-h'},
  {k:'pm',label:'오후 반차',days:.5,deduct:true,cls:'lt-h'},
  {k:'qam',label:'오전 반반차',days:.25,deduct:true,quarter:true,cls:'lt-q'},
  {k:'qpm',label:'오후 반반차',days:.25,deduct:true,quarter:true,cls:'lt-q'},
  {k:'quarter',label:'반반차',days:.25,deduct:true,quarter:true,legacy:true,cls:'lt-q'},
  {k:'sick',label:'병가',days:1,deduct:false,multi:true,cls:'lt-o'},
  {k:'family',label:'경조사',days:1,deduct:false,multi:true,cls:'lt-o'},
  {k:'other',label:'공가·기타',days:1,deduct:false,multi:true,cls:'lt-o'}
];
let members=[], leaves=[];
const lstate={year:+todayStr().slice(0,4),month:todayStr().slice(0,7),member:'all',project:'all'};
const ltype=k=>LEAVE_TYPES.find(t=>t.k===k)||LEAVE_TYPES[0];
const memOf=id=>members.find(m=>m.id===id);
const nextPart=k=>PARTS[PARTS.findIndex(p=>p.k===k)+1]||null;
// 그 구성원이 그날 휴가인지 (휴가 기록 또는 undefined)
const leaveOn=(memberId,d)=>d?leaves.find(l=>l.memberId===memberId&&leaveDates(l).includes(d)):undefined;
const taskMember=t=>(t.assigneeId&&memOf(t.assigneeId))||members.find(m=>m.name===t.assignee);
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const isWeekend=s=>{const g=new Date(s+'T00:00:00').getDay();return g===0||g===6;};
function eachDay(a,b){const out=[];if(!a)return out;const d=new Date(a+'T00:00:00'),e=new Date((b&&b>=a?b:a)+'T00:00:00');while(d<=e&&out.length<370){out.push(ymd(d));d.setDate(d.getDate()+1);}return out;}
function autoDays(type,a,b){const t=ltype(type);return t.multi?eachDay(a,b).filter(d=>!isWeekend(d)).length:t.days;}
const leaveDays=l=>(l.days===''||l.days==null||isNaN(l.days))?autoDays(l.type,l.date,l.endDate):+l.days;
const leaveDates=l=>ltype(l.type).multi?eachDay(l.date,l.endDate).filter(d=>!isWeekend(d)):(l.date?[l.date]:[]);
const fmtDays=n=>(+n).toFixed(2).replace(/\.?0+$/,'');
const quotaOf=(m,y)=>{const q=m?.quotas?.[String(y)];return q===''||q==null||isNaN(q)?null:+q;};
const leaveLabel=l=>ltype(l.type).label+(ltype(l.type).quarter&&l.time?` ${l.time}`:'');

function memberStats(m,y){
  const t=todayStr(), mine=leaves.filter(l=>l.memberId===m.id&&(l.date||'').startsWith(String(y)));
  let used=0,planned=0,other=0;
  for(const l of mine){const d=leaveDays(l);if(!ltype(l.type).deduct){other+=d;continue;}if(l.date<=t)used+=d;else planned+=d;}
  const q=quotaOf(m,y);
  return {used,planned,other,quota:q,remain:q==null?null:q-used-planned};
}

function renderTodayOff(){
  const el=$('#todayOff');
  if(!storeReady||!members.length){el.textContent='';return;}
  const t=todayStr();
  const off=leaves.filter(l=>leaveDates(l).includes(t)&&memOf(l.memberId));
  el.innerHTML=off.length?`오늘 부재 <b>${off.length}명</b> · ${off.map(l=>`${esc(memOf(l.memberId).name)}(${esc(leaveLabel(l))})`).join(', ')}`:'오늘 부재자 없음';
}

function renderLeave(){
  const area=$('#leaveArea');
  if(!storeReady){area.innerHTML=`<div class="empty"><h2>일정을 불러오는 중입니다</h2></div>`;return;}
  if(!members.length){
    area.innerHTML=`<div class="empty"><h2>구성원을 먼저 등록해 주세요</h2><p>사람별로 연간 연차 일수를 정해 두면, 연차·반차·반반차를 등록할 때마다 사용·예정·잔여 일수가 자동으로 계산됩니다.</p>${canWrite?'<button class="btn primary" type="button" id="lEmptyAdd">구성원 추가</button>':''}</div>`;
    $('#lEmptyAdd')?.addEventListener('click',openMembers);return;
  }
  const Y=lstate.year, T=todayStr();
  // 달력: 연차 → 프로젝트 일정 → 정기 배포 → 업무 마감 (보기 필터는 state.cf, wb-ui에 기억)
  const [cy,cm]=lstate.month.split('-').map(Number);
  const first=new Date(cy,cm-1,1), start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const last=new Date(cy,cm,0), end=new Date(last);end.setDate(last.getDate()+(7-((last.getDay()+6)%7)-1));
  const cf=calFilter(), a0=ymd(start), b0=ymd(end);
  const byDay={};const push=(k,html)=>(byDay[k]=byDay[k]||[]).push(html);
  if(cf.leave)for(const l of [...leaves].filter(l=>memOf(l.memberId)).sort((a,b)=>memOf(a.memberId).name.localeCompare(memOf(b.memberId).name,'ko')))for(const d of leaveDates(l))
    push(d,`<div class="lv ${ltype(l.type).cls}" data-lid="${esc(l.id)}" tabindex="0" title="${esc(memOf(l.memberId).name+' · '+leaveLabel(l)+(l.note?' · '+l.note:''))}">${esc(memOf(l.memberId).name)} ${esc(ltype(l.type).label)}</div>`);
  if(cf.project)for(const ev of events.filter(e=>e.kind==='project')){const p=projOf(ev.projectId);for(let d=ev.start;d&&d<=(ev.end||ev.start);d=addDays(d,1))
    push(d,`<div class="ev evp" data-eid="${esc(ev.id)}" data-date="${d}" tabindex="0" style="border-left-color:${esc(p?.color||'var(--muted)')}" title="${esc((p?p.name+' · ':'')+ev.title+(ev.note?' · '+ev.note:''))}">${esc(ev.title)}</div>`);}
  if(cf.deploy)for(const ev of events.filter(e=>e.kind==='deploy')){const p=projOf(ev.projectId);for(const d of deployDates(ev,a0,b0))
    push(d,`<div class="ev evd" data-eid="${esc(ev.id)}" data-date="${d}" tabindex="0" title="${esc((p?p.name+' · ':'')+ev.title)}"><span class="evtag">배포</span>${esc(p?.name||ev.title)}</div>`);}
  if(cf.due)for(const t of workItems().filter(t=>t.status!=='done'&&t.dueDate&&t.dueDate>=a0&&t.dueDate<=b0))
    push(t.dueDate,`<div class="ev evdue" title="${esc('마감 · '+t.title+' · '+(t.assignee||'미지정'))}">마감 · ${esc(t.title)}</div>`);
  let cells='';
  for(const d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const k=ymd(d), items=byDay[k]||[];
    const cls=['day',d.getMonth()!==cm-1?'out':'',isWeekend(k)?'we':'',k===T?'today':'',canWrite?'can':''].join(' ');
    cells+=`<div class="${cls}" data-date="${k}"><span class="dn">${d.getDate()}</span>${items.slice(0,4).join('')}${items.length>4?`<button type="button" class="more" data-more="${k}">+${items.length-4}건</button>`:''}</div>`;
  }
  lvDayItems=byDay;
  area.innerHTML=`
    <div class="rtool"><select class="sel" id="lYear" aria-label="연도">${[Y-1,Y,Y+1].map(y=>`<option ${y===Y?'selected':''}>${y}</option>`).join('')}</select></div>
    <div class="panel">
        <h3><div class="calnav"><button class="btn ghost" type="button" id="lPrev" aria-label="이전 달">◀</button><span class="mlabel">${cy}.${String(cm).padStart(2,'0')}</span><button class="btn ghost" type="button" id="lNext" aria-label="다음 달">▶</button><button class="btn ghost" type="button" id="lThis">이번 달</button></div>
          <span class="calFilters">${[['leave','연차'],['project','프로젝트 일정'],['deploy','정기 배포'],['due','업무 마감']].map(([k,l])=>`<label class="cfItem"><input type="checkbox" data-cf="${k}" ${cf[k]?'checked':''}>${l}</label>`).join('')}</span></h3>
        <div class="cal">${['월','화','수','목','금','토','일'].map((d,i)=>`<div class="dow ${i>4?'we':''}">${d}</div>`).join('')}${cells}</div>
    </div>`;
}

onArea('#leaveArea','change',e=>{const c=e.target.dataset.cf;if(c){state.cf={...calFilter(),[c]:e.target.checked};persistUI();render();return;}if(e.target.id==='lYear'){lstate.year=+e.target.value;lstate.month=`${lstate.year}-${lstate.month.slice(5)}`;render();}});
// 달력에서 시작일을 누른 채 끌어 종료일에서 놓으면 그 기간으로 휴가 등록 창을 엶
let lvDrag=null, lvDragDone=false;
const lvMark=(a,b)=>document.querySelectorAll('#leaveArea .day[data-date]').forEach(d=>d.classList.toggle('pick',!!a&&d.dataset.date>=(a<b?a:b)&&d.dataset.date<=(a<b?b:a)));
onArea('#leaveArea','pointerdown',e=>{const day=e.target.closest('.day[data-date]');if(!day||!canWrite||e.target.closest('[data-lid],[data-eid],[data-more],.evdue')||e.button!==0)return;lvDrag={a:day.dataset.date,b:day.dataset.date};});
onArea('#leaveArea','pointerover',e=>{if(!lvDrag)return;const day=e.target.closest('.day[data-date]');if(!day)return;lvDrag.b=day.dataset.date;lvMark(lvDrag.a,lvDrag.b);});
document.addEventListener('pointerup',()=>{if(!lvDrag)return;const {a,b}=lvDrag;lvDrag=null;lvMark();if(a!==b){lvDragDone=true;openLeave(null,a<b?a:b,a<b?b:a);}});
onArea('#leaveArea','click',e=>{
  if(lvDragDone){lvDragDone=false;return;}
  const id=e.target.id;
  if(id==='lPrev'||id==='lNext'){const [y,m]=lstate.month.split('-').map(Number);const d=new Date(y,m-1+(id==='lNext'?1:-1),1);lstate.month=ymd(d).slice(0,7);lstate.year=d.getFullYear();render();return;}
  if(id==='lThis'){lstate.month=todayStr().slice(0,7);lstate.year=+todayStr().slice(0,4);render();return;}
  if(id==='lAll'){lstate.member='all';render();return;}
  const mo=e.target.closest('[data-more]');if(mo){openDayList(mo.dataset.more);return;}
  const it=e.target.closest('[data-lid],[data-eid]');if(it){calItemOpen(it,it.closest('.day')?.dataset.date);return;}
  if(e.target.closest('.evdue'))return; // 업무 마감은 표시만
  const day=e.target.closest('.day');if(day&&canWrite)openLeave(null,day.dataset.date);
});
onArea('#leaveArea','keydown',e=>{if(e.key!=='Enter')return;const it=e.target.closest('[data-lid],[data-eid]');if(it)calItemOpen(it,it.closest('.day')?.dataset.date);});

/* ---------- 일정 관리: 프로젝트 일정 · 정기 배포(events) ---------- */
let events=[], lvDayItems={};
const CF_DEF={leave:true,project:true,deploy:true,due:true};
const calFilter=()=>({...CF_DEF,...(state.cf||{})});
// 정기 배포: from~until 사이 지정 요일(0=일~6=토), skip 날짜 제외
function deployDates(ev,a,b){const out=[],from=ev.from||a,until=ev.until||b,wd=new Set((ev.weekdays||[]).map(Number));
  for(let d=from>a?from:a;d<=b&&d<=until;d=addDays(d,1))if(wd.has(new Date(d+'T00:00:00').getDay())&&!(ev.skip||[]).includes(d))out.push(d);return out;}
const SCHED_KINDS=[['leave','연차 신청'],['project','프로젝트 일정'],['deploy','정기 배포']];
const kindSelect=cur=>`<div class="f full"><label for="evKind">분류</label><select id="evKind">${SCHED_KINDS.map(([k,l])=>`<option value="${k}" ${k===cur?'selected':''}>${l}</option>`).join('')}</select></div>`;
// 새 일정 창에서 분류를 바꾸면 그 분류의 창으로 다시 엶(날짜 유지)
function bindKind(date,endDate){$('#evKind')?.addEventListener('change',e=>{const k=e.target.value;if(k==='leave')openLeave(null,date,endDate);else openEvent(k,null,date,endDate);});}
function openEvent(kind,ev,date,endDate){
  if(!projects.length){openProject(null);return;}
  const isNew=!ev, ro=!canWrite, dep=kind==='deploy';
  ev=ev||(dep?{kind,projectId:projects[0].id,title:'정기 배포',weekdays:[],from:date||todayStr(),until:'',skip:[],note:''}
              :{kind,projectId:projects[0].id,title:'',start:date||todayStr(),end:endDate||date||todayStr(),note:''});
  const opt=(arr,cur)=>arr.map(([k,v])=>`<option value="${esc(k)}" ${String(cur)===String(k)?'selected':''}>${esc(v)}</option>`).join('');
  const name=dep?'정기 배포':'프로젝트 일정';
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="evForm" novalidate style="max-width:560px">
    <header><h2>${isNew?'일정 등록':ro?name:name+' 수정'}</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>
    <fieldset ${ro?'disabled':''} style="border:0;margin:0;padding:0;min-width:0"><div class="body">
      ${isNew?kindSelect(kind):''}
      <div class="f"><label for="evProj">프로젝트 <b>*</b></label><select id="evProj">${opt(projects.map(p=>[p.id,p.name]),ev.projectId)}</select></div>
      <div class="f"><label for="evTitle">제목 <b>*</b></label><input id="evTitle" maxlength="60" value="${esc(ev.title||'')}" placeholder="${dep?'정기 배포':'예: 2차 오픈, QA 시작'}"></div>
      ${dep?`<div class="f full"><label>요일 <b>*</b></label><div class="wdays">${[1,2,3,4,5,6,0].map(d=>`<label class="cfItem"><input type="checkbox" data-wd="${d}" ${(ev.weekdays||[]).map(Number).includes(d)?'checked':''}>${'일월화수목금토'[d]}</label>`).join('')}</div></div>
      <div class="f"><label for="evFrom">시작일</label><input type="date" id="evFrom" value="${esc(ev.from||'')}"></div>
      <div class="f"><label for="evUntil">종료일</label><input type="date" id="evUntil" value="${esc(ev.until||'')}"><span class="hint">비우면 계속</span></div>`
      :`<div class="f"><label for="evStart">시작일 <b>*</b></label><input type="date" id="evStart" value="${esc(ev.start||'')}"></div>
      <div class="f"><label for="evEnd">종료일</label><input type="date" id="evEnd" value="${esc(ev.end||ev.start||'')}"></div>`}
      <div class="f full"><label for="evNote">메모</label><input id="evNote" value="${esc(ev.note||'')}"></div>
    </div></fieldset>
    <footer>
      <div id="evDelZone">${!isNew&&canWrite?`${dep&&date?`<button class="btn" type="button" id="evSkip">${fmtDate(date)}만 빼기</button>`:''}<button class="btn danger" type="button" id="evDel">${dep?'전체 삭제':'삭제'}</button>`:''}</div>
      <span class="err" id="evErr"></span>
      <div class="r"><button class="btn" type="button" id="evCancel">${ro?'닫기':'취소'}</button>${ro?'':`<button class="btn primary" type="submit" id="evSave">${isNew?'등록':'저장'}</button>`}</div>
    </footer></form></div>`;
  $('#xClose').onclick=$('#evCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  if(isNew)bindKind(date,endDate);
  $('#evSkip')?.addEventListener('click',async()=>{try{const skip=[...new Set([...(ev.skip||[]),date])].sort();await db.collection('events').doc(ev.id).update({skip});logChange('event','update',ev.id,ev.title,ev,{...ev,skip},`${date} 빼기`);closeModal();toast('그날만 뺐어요');}catch(err){handleWriteError(err,'#evErr');}});
  $('#evDel')?.addEventListener('click',()=>{
    $('#evDelZone').innerHTML=`<div class="confirm">이 일정을 삭제할까요? <button class="btn danger" type="button" id="evDelYes">삭제</button><button class="btn ghost" type="button" id="evDelNo">취소</button></div>`;
    $('#evDelNo').onclick=()=>openEvent(kind,ev,date);
    $('#evDelYes').onclick=async()=>{try{await db.collection('events').doc(ev.id).delete();logChange('event','delete',ev.id,ev.title);closeModal();toast('삭제했습니다');}catch(err){handleWriteError(err,'#evErr');}};
  });
  $('#evForm').addEventListener('submit',async e=>{
    e.preventDefault();if(ro)return;
    const base={kind,projectId:$('#evProj').value,title:$('#evTitle').value.trim(),note:$('#evNote').value.trim(),updatedAt:new Date().toISOString()};
    const data=dep?{...base,weekdays:[...document.querySelectorAll('#evForm [data-wd]:checked')].map(x=>+x.dataset.wd),from:$('#evFrom').value,until:$('#evUntil').value,skip:ev.skip||[]}
                  :{...base,start:$('#evStart').value,end:$('#evEnd').value&&$('#evEnd').value>=$('#evStart').value?$('#evEnd').value:$('#evStart').value};
    const err=!data.title?'제목을 입력해 주세요.':dep&&!data.weekdays.length?'요일을 하나 이상 골라 주세요.':!dep&&!data.start?'시작일을 입력해 주세요.':'';
    if(err){$('#evErr').textContent=err;return;}
    $('#evSave').disabled=true;
    try{
      if(isNew){data.createdAt=data.updatedAt;data.createdBy=actorId||'';const ref=await db.collection('events').add(data);logChange('event','create',ref.id,data.title,null,data);}
      else{await db.collection('events').doc(ev.id).update(data);logChange('event','update',ev.id,data.title,ev,{...ev,...data});}
      closeModal();toast(isNew?'등록했습니다':'저장했습니다');
    }catch(er){$('#evSave').disabled=false;handleWriteError(er,'#evErr');}
  });
}
// '+N건': 그날 일정 전체를 작은 창으로
function openDayList(k){
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><div class="modal dayList" style="max-width:420px">
    <header><h2>${fmtDate(k)} 일정</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>
    <div class="body" style="grid-template-columns:1fr">${(lvDayItems[k]||[]).join('')}</div></div></div>`;
  $('#xClose').onclick=closeModal;$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal();});
  $('#ov').addEventListener('click',e=>{const it=e.target.closest('[data-lid],[data-eid]');if(!it)return;closeModal();calItemOpen(it,k);});
}
function calItemOpen(it,k){
  if(it.dataset.lid){openLeave(leaves.find(l=>l.id===it.dataset.lid));return true;}
  if(it.dataset.eid){const ev=events.find(x=>x.id===it.dataset.eid);if(ev)openEvent(ev.kind,ev,it.dataset.date||k);return true;}
  return false;
}

function openLeave(l,date,endDate){
  if(!members.length){openMembers();return;}
  const isNew=!l, ro=!canWrite;
  l=l||{memberId:lstate.member!=='all'?lstate.member:'',type:'annual',date:date||todayStr(),endDate:endDate||date||todayStr()};
  let daysTouched=!isNew&&l.days!==''&&l.days!=null&&+l.days!==autoDays(l.type,l.date,l.endDate);
  const opt=(arr,cur)=>arr.map(([k,v])=>`<option value="${esc(k)}" ${String(cur)===String(k)?'selected':''}>${esc(v)}</option>`).join('');
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="leaveForm" novalidate>
    <header><h2>${isNew?'일정 등록':ro?'연차 신청 상세':'연차 신청 수정'}</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>
    <fieldset ${ro?'disabled':''} style="border:0;margin:0;padding:0;min-width:0"><div class="body">
      ${isNew?kindSelect('leave'):''}
      <div class="f"><label for="lvMember">구성원 <b>*</b></label><select id="lvMember"><option value="">선택</option>${opt(members.map(m=>[m.id,m.name]),l.memberId)}</select></div>
      <div class="f"><label for="lvType">종류 <b>*</b></label><select id="lvType">${opt(LEAVE_TYPES.filter(t=>!t.legacy||t.k===l.type).map(t=>[t.k,t.label+(t.deduct?` (${t.multi?'1일':fmtDays(t.days)+'일'} 차감)`:' (미차감)')]),l.type)}</select></div>
      <div class="f"><label for="lvDate" id="lvDateLbl">날짜</label><input type="date" id="lvDate" value="${esc(l.date||'')}"></div>
      <div class="f" id="lvEndWrap"><label for="lvEnd">종료일</label><input type="date" id="lvEnd" value="${esc(l.endDate||l.date||'')}"></div>
      <div class="f full lvRange" id="lvRange" aria-live="polite"></div>
      <div class="f" id="lvTimeWrap"><label for="lvTime">사용 시간</label><input id="lvTime" value="${esc(l.time||'')}" placeholder="예: 09:00–11:00"></div>
      <div class="f"><label for="lvDays">일수</label><input type="number" id="lvDays" min="0" step="0.25" inputmode="decimal" value="${esc(isNew?'':leaveDays(l))}"><span class="hint" id="lvDaysHint"></span></div>
      <div class="f full"><label for="lvNote">메모</label><input id="lvNote" value="${esc(l.note||'')}" placeholder="사유, 대체 근무자, 비상 연락 등"></div>
    </div></fieldset>
    <footer>
      <div id="lvDelZone">${!isNew&&canWrite?'<button class="btn danger" type="button" id="lvDel">삭제</button>':''}</div>
      <span class="err" id="lvErr"></span>
      <div class="r"><button class="btn" type="button" id="lvCancel">${ro?'닫기':'취소'}</button>${ro?'':`<button class="btn primary" type="submit" id="lvSave">${isNew?'등록':'저장'}</button>`}</div>
    </footer></form></div>`;
  const sync=()=>{
    const t=ltype($('#lvType').value);
    $('#lvEndWrap').hidden=!t.multi;$('#lvTimeWrap').hidden=!t.quarter;
    $('#lvDateLbl').textContent=t.multi?'시작일':'날짜';
    if(t.multi&&(!$('#lvEnd').value||$('#lvEnd').value<$('#lvDate').value))$('#lvEnd').value=$('#lvDate').value;
    const auto=autoDays(t.k,$('#lvDate').value,t.multi?$('#lvEnd').value:'');
    if(!daysTouched)$('#lvDays').value=auto;
    $('#lvDaysHint').textContent=t.multi?`주말 제외 ${auto}일 · 공휴일이 끼면 직접 수정`:(t.deduct?'연차에서 차감':'연차에서 차감하지 않음');
    const dw=v=>v?`${+v.slice(5,7)}/${+v.slice(8,10)}(${'일월화수목금토'[new Date(v+'T00:00:00').getDay()]})`:'';
    const a=$('#lvDate').value,b=t.multi?$('#lvEnd').value:a;
    $('#lvRange').innerHTML=a?`<b>${dw(a)}${b&&b!==a?` ~ ${dw(b)}`:''}</b> · ${esc(t.label)} ${fmtDays(+$('#lvDays').value||0)}일${t.multi?' <span class="hint">· 여러 날이면 종료일을 바꾸거나, 달력에서 날짜를 끌어서 고르세요</span>':''}`:'';
    prevStart=a;
  };
  // 시작일을 바꾸면 종료일도 같은 간격만큼 따라 움직임 (5일짜리를 옮기면 그대로 5일)
  let prevStart=$('#lvDate').value;
  $('#lvDate').addEventListener('input',()=>{const a=$('#lvDate').value,b=$('#lvEnd').value;if(a&&b&&prevStart&&ltype($('#lvType').value).multi)$('#lvEnd').value=addDays(b,Math.round((new Date(a+'T00:00:00')-new Date(prevStart+'T00:00:00'))/864e5));});
  sync();
  ['lvType','lvDate','lvEnd'].forEach(id=>$('#'+id).addEventListener('change',()=>{if(id==='lvType')daysTouched=false;sync();}));
  $('#lvDays').addEventListener('input',()=>{daysTouched=true;sync();});
  $('#xClose').onclick=$('#lvCancel').onclick=askClose;
  if(isNew)bindKind(date,endDate);
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  $('#lvDel')?.addEventListener('click',()=>{
    $('#lvDelZone').innerHTML=`<div class="confirm">이 연차 신청을 삭제할까요? <button class="btn danger" type="button" id="lvDelYes">삭제</button><button class="btn ghost" type="button" id="lvDelNo">취소</button></div>`;
    $('#lvDelNo').onclick=()=>openLeave(l);
    $('#lvDelYes').onclick=async()=>{try{await db.collection('leaves').doc(l.id).delete();logChange('leave','delete',l.id,`${memOf(l.memberId)?.name||''} ${leaveLabel(l)} ${fmtDate(l.date)}`);closeModal();toast('삭제했습니다');}catch(err){handleWriteError(err,'#lvErr');}};
  });
  $('#leaveForm').addEventListener('submit',async e=>{
    e.preventDefault();if(ro)return;
    const t=ltype($('#lvType').value);
    const data={memberId:$('#lvMember').value,type:t.k,date:$('#lvDate').value,endDate:t.multi?$('#lvEnd').value:'',
      time:t.quarter?$('#lvTime').value.trim():'',days:$('#lvDays').value===''?autoDays(t.k,$('#lvDate').value,$('#lvEnd').value):Math.max(0,+$('#lvDays').value),
      note:$('#lvNote').value.trim(),updatedAt:new Date().toISOString(),createdAt:l.createdAt||new Date().toISOString()};
    if(!data.memberId){$('#lvErr').textContent='구성원을 선택해 주세요.';return;}
    if(!data.date){$('#lvErr').textContent='날짜를 입력해 주세요.';return;}
    if(t.multi&&data.endDate<data.date){$('#lvErr').textContent='종료일이 시작일보다 빠릅니다.';return;}
    const clash=leaves.find(x=>x.id!==l.id&&x.memberId===data.memberId&&leaveDates(x).some(d=>leaveDates(data).includes(d)));
    if(clash&&!$('#leaveForm').dataset.ok){$('#lvErr').textContent=`${fmtDate(clash.date)}에 이미 ${leaveLabel(clash)}이(가) 있습니다. 그래도 저장하려면 한 번 더 누르세요.`;$('#leaveForm').dataset.ok='1';return;}
    $('#lvSave').disabled=true;
    try{const lab=`${memOf(data.memberId)?.name||''} ${leaveLabel(data)} ${fmtDate(data.date)}`;if(isNew){const ref=await db.collection('leaves').add(data);logChange('leave','create',ref.id,lab,null,data);}else{const pt=patchOf(data,l);if(pt)await db.collection('leaves').doc(l.id).update(pt);logChange('leave','update',l.id,lab,l,data);}
      closeModal();toast(isNew?'휴가를 등록했습니다':'저장했습니다');
      if(data.date.slice(0,7)!==lstate.month){lstate.month=data.date.slice(0,7);lstate.year=+data.date.slice(0,4);render();}}
    catch(err){$('#lvSave').disabled=false;handleWriteError(err,'#lvErr');}
  });
}

function openMembers(){
  if(!canWrite)return;
  const Y=lstate.year;
  const row=m=>`<div class="prow mrowEdit" data-id="${esc(m.id||'')}">
    <input class="mName" value="${esc(m.name||'')}" placeholder="이름" aria-label="이름" maxlength="20">
    <select class="mProj sel" aria-label="프로젝트"><option value="">주 프로젝트 없음</option>${projects.map(p=>`<option value="${esc(p.id)}" ${m.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <select class="mPart sel" aria-label="파트"><option value="">파트 없음</option>${PARTS.map(p=>`<option value="${esc(p.k)}" ${m.part===p.k?'selected':''}>${esc(p.label)}</option>`).join('')}</select>
    <input class="mQuota" type="number" min="0" step="0.5" inputmode="decimal" value="${esc(quotaOf(m,Y)??'')}" placeholder="연차(일)" aria-label="${Y}년 연차 일수">
    ${m.id?'<button type="button" class="btn ghost mDel">삭제</button>':'<span></span>'}

/* ---------- weekly report (주간 보고) ---------- */
let reports=[];
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const mondayOf=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);};
const rstate={week:mondayOf(todayStr()),project:'all',week3:null,view:'sum',fold:new Set()};
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'';
const DOW=['일','월','화','수','목','금','토'];
const reportId=(w,p)=>`${w}__${p}`;
const NOTE_FIELDS=[['summary','주요 성과 · 요약'],['issues','이슈 및 리스크'],['plan','다음 주 계획 메모'],['asks','요청 · 건의사항']];

// 보고서 구조: 프로젝트 → 파트 → (금주 완료 / 진행 중 / 차주 예정 / 지연·보류 / 신규 요청) + 프로젝트별 휴가·부재
const RBLOCKS=[['done','금주 완료'],['doing','진행 중'],['next','차주 예정'],['late','지연 · 보류'],['new','신규 요청']];
function buildReport(ws,pid){
  const we=addDays(ws,6), nws=addDays(ws,7), nwe=addDays(ws,13), T0=todayStr();
  const inR=(d,a,b)=>!!d&&d>=a&&d<=b;
  const T=workItems().filter(t=>pid==='all'||t.projectId===pid);
  const key=t=>(t.jiraKey?`${t.jiraKey} `:'')+(t.rmsNo?`RMS ${t.rmsNo} `:'');
  const who=t=>t.assignee||'담당 미지정';
  const rules={
    done:[t=>t.status==='done'&&inR(t.doneDate,ws,we),t=>`${key(t)}${t.title} — ${who(t)} · 완료 ${md(t.doneDate)}${t.actHours!==''&&t.actHours!=null?` · ${hrs(t.actHours)}h`:''}`],
    doing:[t=>t.status==='doing'||t.status==='review',t=>`${key(t)}${t.title} — ${who(t)} · ${statusOf(t.status).label}${t.dueDate?` · 마감 ${md(t.dueDate)}`:''}`],
    next:[t=>t.status!=='done'&&inR(t.dueDate,nws,nwe),t=>`${key(t)}${t.title} — ${who(t)} · 마감 ${md(t.dueDate)}(${DOW[new Date(t.dueDate+'T00:00:00').getDay()]})`],
    late:[t=>t.status==='hold'||(t.status!=='done'&&t.dueDate&&t.dueDate<=we&&t.dueDate<T0),t=>`${key(t)}${t.title} — ${who(t)} · ${t.status==='hold'?'보류':`마감 ${md(t.dueDate)} 경과`}${t.note?` · ${t.note.slice(0,40)}`:''}`],
    new:[t=>inR(t.requestDate,ws,we),t=>`${key(t)}${t.title} — ${t.requester||'요청자 미기재'} → ${who(t)} · 요청 ${md(t.requestDate)}`]
  };
  const week=eachDay(ws,we);
  const projList=(pid==='all'?projects:projects.filter(p=>p.id===pid)).map(p=>({id:p.id,name:p.name,color:p.color}));
  if(pid==='all'&&(T.some(t=>!projOf(t.projectId))||members.some(m=>!memberProjectIds(m).size)))projList.push({id:'__none',name:'프로젝트 미지정',color:'var(--muted)'});
  const partList=[...PARTS,{k:'__none',label:'파트 미지정',c:'var(--muted)'}];
  const kpi={done:0,doing:0,next:0,late:0,newReq:0,hours:0,leave:0};
  const out=projList.map(P=>{
    const PT=T.filter(t=>P.id==='__none'?!projOf(t.projectId):t.projectId===P.id);
    const cnt={done:0,doing:0,late:0};
    const parts=partList.map(pt=>{
      const PP=PT.filter(t=>pt.k==='__none'?!PARTS.some(x=>x.k===t.part):t.part===pt.k);
      const blocks=RBLOCKS.map(([k,title])=>{
        const list=PP.filter(rules[k][0]).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
        if(k==='done'){kpi.done+=list.length;cnt.done+=list.length;kpi.hours+=list.reduce((a,t)=>a+(+t.actHours||0),0);}
        if(k==='doing'){kpi.doing+=list.length;cnt.doing+=list.length;}
        if(k==='next')kpi.next+=list.length;
        if(k==='late'){kpi.late+=list.length;cnt.late+=list.length;}
        if(k==='new')kpi.newReq+=list.length;
        return {k,title,items:list.map(rules[k][1])};
      }).filter(b=>b.items.length);
      return {label:pt.label,color:pt.c,blocks};
    }).filter(p=>p.blocks.length);
    const mem=members.filter(m=>P.id==='__none'?!memberProjectIds(m).size:memberIn(m,P.id));
    const lv=[];
    for(const l of leaves){const m=mem.find(x=>x.id===l.memberId);if(!m)continue;const ds=leaveDates(l).filter(d=>week.includes(d));if(!ds.length)continue;
      lv.push({sort:ds[0]+m.name,text:`${m.name} · ${ds.length>1?`${md(ds[0])}~${md(ds[ds.length-1])}`:`${md(ds[0])}(${DOW[new Date(ds[0]+'T00:00:00').getDay()]})`} ${leaveLabel(l)}${ds.length>1?` ${ds.length}일`:''}`});}
    lv.sort((a,b)=>a.sort.localeCompare(b.sort));kpi.leave+=lv.length;
    return {name:P.name,color:P.color,counts:cnt,parts,leaves:lv.map(x=>x.text)};
  }).filter(p=>p.parts.length||p.leaves.length);
  const P=pid==='all'?null:projOf(pid);
  return {v:2,ws,we,projectId:pid,projectName:P?P.name:'전체 프로젝트',generatedAt:new Date().toISOString(),kpi,projects:out};
}

function reportText(m,notes){
  const L=[`■ 주간 업무 보고 (${m.ws.replace(/-/g,'.')} ~ ${m.we.slice(5).replace('-','.')})`,`· 범위: ${m.projectName}`,
    `· 완료 ${m.kpi.done}건 / 진행 ${m.kpi.doing}건 / 신규 ${m.kpi.newReq}건 / 지연·보류 ${m.kpi.late}건 / 완료 소요 ${hrs(m.kpi.hours)}h`,''];
  const note=k=>(notes?.[k]||'').trim();
  if(note('summary'))L.push('[주요 성과 · 요약]',note('summary'),'');
  if(m.projects){
    if(!m.projects.length)L.push('이 주에 해당하는 업무가 없습니다.','');
    for(const p of m.projects){
      L.push(`━ ${p.name}  (완료 ${p.counts.done} · 진행 ${p.counts.doing} · 지연 ${p.counts.late})`);
      for(const pt of p.parts){L.push(`  ▸ ${pt.label}`);for(const b of pt.blocks){L.push(`    · ${b.title}`);b.items.forEach(i=>L.push(`      - ${i}`));}}
      if(p.leaves.length){L.push('  ▸ 휴가 · 부재');p.leaves.forEach(x=>L.push(`      - ${x}`));}
      L.push('');
    }
  }else{ // 이전 형식으로 확정된 보고서
    for(const s of m.sections||[]){L.push(`[${s.title}] ${s.count}건`);for(const g of s.groups){L.push(`  ◦ ${g.label}`);g.items.forEach(i=>L.push(`    - ${i}`));}L.push('');}
    L.push(`[휴가 · 부재] ${(m.leaves||[]).length}건`);(m.leaves||[]).forEach(x=>L.push(`  - ${x}`));L.push('');
  }
  if(m.people?.length){L.push('[담당자별 주간 집계]  (집계 = 완료 실제 소요 + 진행 중 입력 소요 / 가용 = 40h − 휴가)');m.people.forEach(p=>L.push(`  - ${p.name}: 집계 ${hrs(p.total)}h / 가용 ${hrs(p.avail)}h  (완료 ${p.doneN}건 ${hrs(p.doneH)}h · 진행 ${p.doingN}건 ${hrs(p.doingH)}h${p.leaveH?` · 휴가 ${hrs(p.leaveH)}h`:''})`));L.push('');}
  for(const [k,label] of NOTE_FIELDS.slice(1))if(note(k))L.push(`[${label}]`,note(k),'');
  return L.join('\n').trim()+'\n';
}
function reportMarkdown(m,notes){
  if(!m.projects)return reportText(m,notes);
  const note=k=>(notes?.[k]||'').trim();
  const L=[`# 주간 업무 보고 (${m.ws.replace(/-/g,'.')} ~ ${m.we.slice(5).replace('-','.')})`,'',`- 범위: ${m.projectName}`,`- 완료 ${m.kpi.done}건 / 진행 ${m.kpi.doing}건 / 신규 ${m.kpi.newReq}건 / 지연·보류 ${m.kpi.late}건 / 완료 소요 ${hrs(m.kpi.hours)}h`,''];
  if(note('summary'))L.push('## 주요 성과 · 요약','',note('summary'),'');
  for(const p of m.projects){
    L.push(`## ${p.name}`,'',`완료 ${p.counts.done} · 진행 ${p.counts.doing} · 지연 ${p.counts.late}`,'');
    for(const pt of p.parts){L.push(`### ${pt.label}`,'');for(const b of pt.blocks){L.push(`**${b.title}**`,'');b.items.forEach(i=>L.push(`- ${i}`));L.push('');}}
    if(p.leaves.length){L.push('### 휴가 · 부재','');p.leaves.forEach(x=>L.push(`- ${x}`));L.push('');}
  }
  if(m.people?.length){L.push('## 담당자별 주간 집계','','| 담당자 | 집계(h) | 가용(h) | 완료 | 완료 소요(h) | 진행 | 진행 소요(h) | 휴가(h) |','|---|---:|---:|---:|---:|---:|---:|---:|');m.people.forEach(p=>L.push(`| ${p.name} | ${hrs(p.total)} | ${hrs(p.avail)} | ${p.doneN} | ${hrs(p.doneH)} | ${p.doingN} | ${hrs(p.doingH)} | ${hrs(p.leaveH)} |`));L.push('');}
  for(const [k,label] of NOTE_FIELDS.slice(1))if(note(k))L.push(`## ${label}`,'',note(k),'');
  return L.join('\n').trim()+'\n';
}
function reportCsv(m,notes){
  // 한 줄 = 업무 1건. 내용은 '업무명'과 '상세(담당·날짜·소요)'로 나눔
  const cell=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const wk=`${m.ws.replace(/-/g,'.')}~${m.we.slice(5).replace('-','.')}`;
  const split=i=>{const k=i.indexOf(' — ');return k<0?[i,'']:[i.slice(0,k),i.slice(k+3)];};
  const rows=[['주간','프로젝트','파트','구분','업무','상세']];
  const note=k=>(notes?.[k]||'').trim();
  rows.push([wk,m.projectName,'','요약',`완료 ${m.kpi.done} / 진행 ${m.kpi.doing} / 신규 ${m.kpi.newReq} / 지연·보류 ${m.kpi.late} / 완료 소요 ${hrs(m.kpi.hours)}h`,'']);
  if(note('summary'))rows.push([wk,m.projectName,'','주요 성과 · 요약',note('summary'),'']);
  if(m.projects){
    for(const p of m.projects){
      for(const pt of p.parts)for(const b of pt.blocks)for(const i of b.items){const [a,d]=split(i);rows.push([wk,p.name,pt.label,b.title,a,d]);}
      for(const x of p.leaves){const k=x.indexOf(' · ');rows.push([wk,p.name,'휴가 · 부재','휴가',k<0?x:x.slice(0,k),k<0?'':x.slice(k+3)]);}
    }
  }else{
    for(const s of m.sections||[])for(const g of s.groups)for(const i of g.items){const [a,d]=split(i);rows.push([wk,m.projectName,g.label,s.title,a,d]);}
    for(const x of m.leaves||[]){const k=x.indexOf(' · ');rows.push([wk,m.projectName,'휴가 · 부재','휴가',k<0?x:x.slice(0,k),k<0?'':x.slice(k+3)]);}
  }
  for(const p of m.people||[])rows.push([wk,(m.projectId&&m.projectId!=='all')?m.projectName:((p.projects||[]).join(' / ')||'프로젝트 미지정'),'','담당자별 집계',p.name,`집계 ${hrs(p.total)}h / 가용 ${hrs(p.avail)}h · 완료 ${p.doneN}건 ${hrs(p.doneH)}h · 진행 ${p.doingN}건 ${hrs(p.doingH)}h · 휴가 ${hrs(p.leaveH)}h`]);
  for(const [k,label] of NOTE_FIELDS.slice(1))if(note(k))rows.push([wk,m.projectName,'',label,note(k),'']);
  return '\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n');
}
function reportBodyHtml(m){

    const sec=s=>`<section class="rsec"><h4>${esc(s.title)} <span class="num">${s.count}</span></h4>${s.groups.length?s.groups.map(g=>`<div class="rgrp"><div class="rpart"><span class="sw" style="background:${g.color}"></span>${esc(g.label)}</div><ul>${g.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join(''):'<p class="legend">해당 업무 없음</p>'}</section>`;

  }
  if(!m.projects.length)return '<p class="legend" style="margin:0">이 주에 해당하는 업무와 휴가가 없습니다.</p>';

      ${pt.blocks.map(b=>`<div class="rblk rb-${b.k}"><div class="rblkT">${esc(b.title)} <span class="num">${b.items.length}</span></div><ul>${b.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div>`).join('')}
      ${p.leaves.length?`<div class="rpartcard"><div class="rpart"><span class="sw" style="background:var(--muted)"></span>휴가 · 부재</div><ul>${p.leaves.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    </div></section>`).join('');
}

// 보고서가 이미 있으면 바뀐 필드만 update(메모는 칸별로 합쳐짐), 없을 때만 set으로 새로 만듦.
// 여러 사람이 같은 주 보고서의 다른 메모 칸을 써도 서로 지우지 않게 하려는 것
async function saveReport(patch){
  const id=reportId(rstate.week,rstate.project), cur=reports.find(r=>r.id===id), at=new Date().toISOString();
  if(cur){await db.collection('reports').doc(id).update({...patch,updatedAt:at});return;}
  await db.collection('reports').doc(id).set({week:rstate.week,projectId:rstate.project,notes:{},confirmed:false,model:null,confirmedAt:'',...patch,updatedAt:at});
}
// 화면에 불러온 뒤(data-base) 내가 고친 메모 칸만 모음
function changedNotes(){const n={};document.querySelectorAll('#reportArea [data-note]').forEach(t=>{if(t.value!==(t.dataset.base??''))n[t.dataset.note]=t.value;});return n;}
function markNotesSaved(n){document.querySelectorAll('#reportArea [data-note]').forEach(t=>{if(t.dataset.note in n)t.dataset.base=n[t.dataset.note];});}
function saveChangedNotes(){const notes=changedNotes();if(!Object.keys(notes).length)return Promise.resolve();return saveReport({notes}).then(()=>markNotesSaved(notes));}
let noteTimer=null, noteBusy=Promise.resolve();
function queueNoteSave(){
  clearTimeout(noteTimer);
  const st=$('#rSaveState');if(st)st.textContent='입력 중…';
  noteTimer=setTimeout(()=>{
    noteBusy=noteBusy.then(saveChangedNotes).then(()=>{const s=$('#rSaveState');if(s)s.textContent='메모 저장됨';}).catch(err=>handleWriteError(err,'#rSaveState'));
  },1200);
}
function flushNotes(){if(noteTimer){clearTimeout(noteTimer);noteTimer=null;noteBusy=noteBusy.then(saveChangedNotes).catch(()=>{});}}

/* ---------- 주간 보고(팀 양식): 목~수 한 주, 카테고리(프로젝트)별 운영 건수와 본문 ---------- */
// 주는 목요일 시작·수요일 끝. n주는 끝나는 수요일이 그 달 몇째 주(월요일 시작, 1일이 든 주 = 1주)인지로 셈 — 팀 양식 표기(10/15~10/21 = 10월 4주)와 같게
const thursdayOf=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+3)%7));return ymd(d);};
rstate.week3=thursdayOf(todayStr());
function rWeekLabel(thu){const wed=addDays(thu,6),firstMon=mondayOf(wed.slice(0,8)+'01');
  return `${wed.slice(2,4)}년 ${+wed.slice(5,7)}월 ${Math.round((new Date(mondayOf(wed)+'T00:00:00')-new Date(firstMon+'T00:00:00'))/(7*864e5))+1}주`;}
const rRange=thu=>`${mdot(thu)} 목 ~ ${mdot(addDays(thu,6))} 수`;
const rTabs=cur=>`<div class="vbar"><div class="vtabs" role="tablist">${[['report','sum','주간보고'],['report','detail','주간보고(상세)'],['hours','','업무 시간']].map(([m,v,l])=>`<button type="button" class="vtab" role="tab" data-goto="${m}" ${v?`data-rview="${v}"`:''} aria-selected="${m==='hours'?cur==='hours':cur===v}">${l}</button>`).join('')}</div></div>`;
const R_KINDS=[['done','반영'],['doing','진행'],['recv','접수']];
const v3Id=thu=>`w_${thu}`;
const v3Doc=()=>reports.find(r=>r.id===v3Id(rstate.week3));
const fmtDT=s=>{const d=new Date(s);return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
// 카테고리 = 프로젝트 + 사용자가 추가한 것(그 주 문서에 없으면 가장 최근 주의 것을 이어받음)
function v3Custom(doc){if(doc?.cats)return doc.cats;const prev=reports.filter(r=>r.kind==='v3'&&r.week<rstate.week3&&r.cats).sort((a,b)=>b.week.localeCompare(a.week))[0];return prev?.cats||[];}
function v3Auto(c,thu){
  const wed=addDays(thu,6),inR=d=>!!d&&d>=thu&&d<=wed;
  if(!c.project)return {counts:{done:0,doing:0,recv:0},deploy:0,lists:{done:[],doing:[],recv:[]}};
  const T=workItems().filter(t=>t.projectId===c.id);
  const lists={done:T.filter(t=>t.status==='done'&&inR(t.doneDate)),doing:T.filter(t=>t.status==='doing'||t.status==='review'),recv:T.filter(t=>t.status==='wait')};
  const deploy=events.filter(e=>e.kind==='deploy'&&e.projectId===c.id).reduce((n,e)=>n+deployDates(e,thu,wed).length,0);
  return {counts:{done:lists.done.length,doing:lists.doing.length,recv:lists.recv.length},deploy,lists};
}
// 처음 열 때 그 주 업무로 만드는 본문 초안: ■ 소제목 아래 [파트] 내용(날짜)
function v3Draft(c,thu){const a=v3Auto(c,thu),pl=t=>`[${partOf(t.part).label}] `,L=[],ln=t=>L.push({t,hl:false});
  ln(`■ 반영 ${a.counts.done}건${a.deploy?`(배포 ${a.deploy}건)`:''}`);a.lists.done.forEach(t=>ln(`${pl(t)}${t.title}(${md(t.doneDate)})`));ln('');
  ln(`■ 진행 ${a.counts.doing}건`);a.lists.doing.forEach(t=>ln(`${pl(t)}${t.title}${t.dueDate?`(~${md(t.dueDate)})`:''}`));ln('');
  ln(`■ 접수(검토 중) ${a.counts.recv}건`);a.lists.recv.forEach(t=>ln(`${pl(t)}${t.title}${t.requestDate?`(${md(t.requestDate)})`:''}`));ln('');
  ln('----------');ln('');return L;}
function v3Data(){
  const thu=rstate.week3,doc=v3Doc();
  const cats=[...projects.map(p=>({id:p.id,name:p.name,color:p.color,inCount:true,project:true})),...v3Custom(doc).map(c=>({...c,project:false}))];
  return {thu,doc,cats:cats.map(c=>{const sec=doc?.sections?.[c.id]||{};
    return {...c,sec,counts:sec.countsEdited&&sec.counts?sec.counts:v3Auto(c,thu).counts,lines:Array.isArray(sec.lines)?sec.lines:v3Draft(c,thu)};})};
}
// 편집칸은 줄 목록(lines: [{t, hl}])으로만 저장하고 다시 그림 — 서식·스크립트가 섞이지 않게
const linesHtml=L=>L.map(l=>`<div${l.hl?' class="hl"':''}>${l.t?esc(l.t):'<br>'}</div>`).join('');
function readLines(ed){const out=[];ed.childNodes.forEach(n=>{if(n.nodeType===3){if(n.textContent.trim()||out.length)out.push({t:n.textContent,hl:false});return;}
  if(n.nodeType===1)out.push({t:n.textContent,hl:n.classList.contains('hl')});});return out;}
function edLinesInSel(ed){const sel=getSelection();if(!sel.rangeCount)return [];const r=sel.getRangeAt(0);
  const kids=[...ed.children].filter(c=>r.intersectsNode(c));if(kids.length)return kids;
  let n=r.startContainer;while(n&&n.parentNode!==ed)n=n.parentNode;return n&&n.nodeType===1?[n]:[];}
function toggleHl(ed){const ls=edLinesInSel(ed);if(!ls.length)return;const on=!ls.every(l=>l.classList.contains('hl'));
  ls.forEach(l=>{l.classList.toggle('hl',on);const t=l.textContent;if(on&&!t.startsWith('✔'))l.textContent='✔ '+t;if(!on&&t.startsWith('✔'))l.textContent=t.replace(/^✔\s?/,'');if(!l.textContent)l.innerHTML='<br>';});}
function insertHr(ed){const ls=edLinesInSel(ed),d=document.createElement('div');d.textContent='----------';(ls.length?ls[ls.length-1]:ed.lastChild)?.after?.(d)||ed.append(d);}
// 저장: 구역 단위 부분 저장(다른 사람이 다른 구역을 고쳐도 덮어쓰지 않음)
async function v3SaveDoc(patch){const id=v3Id(rstate.week3),doc=v3Doc(),at=new Date().toISOString();
  if(doc)return db.collection('reports').doc(id).update({...patch,updatedAt:at});
  return db.collection('reports').doc(id).set({kind:'v3',week:rstate.week3,sections:{},cats:v3Custom(null),confirmed:false,confirmedAt:'',...patch,updatedAt:at});}
const v3Save=(cid,patch)=>{const me=myMember();return v3SaveDoc({sections:{[cid]:{...patch,updatedAt:new Date().toISOString(),updatedBy:actorId||'',updatedByName:me?.name||''}}});};
const v3Timer={};
function v3SaveLines(cid){const ed=document.querySelector(`#reportArea [data-cid="${CSS.escape(cid)}"] .rEditor`);if(!ed)return;v3Save(cid,{lines:readLines(ed)}).catch(err=>handleWriteError(err));}
function v3Queue(cid){clearTimeout(v3Timer[cid]);v3Timer[cid]=setTimeout(()=>{delete v3Timer[cid];v3SaveLines(cid);},1000);}
function v3Flush(){for(const cid of Object.keys(v3Timer)){clearTimeout(v3Timer[cid]);delete v3Timer[cid];v3SaveLines(cid);}}

        <button class="btn ghost sm" type="button" data-fold aria-label="${fold?'펼치기':'접기'}">${fold?'▼':'▲'}</button>${!c.project&&!ro?'<button class="btn danger sm" type="button" data-cdel>삭제</button>':''}</header>

        ${ro?'':'<div class="rtools"><button class="btn sm" type="button" data-hl>강조</button><button class="btn sm" type="button" data-hr>구분선 넣기</button></div>'}

  area.innerHTML=`

// 보고서 내보내기용 텍스트 줄(강조 줄은 ✔ 유지)
function v3Text(d){const L=[`■ ${rWeekLabel(d.thu)} 주간 업무 보고 (${rRange(d.thu)})`,'','[운영 건수]'],inc=d.cats.filter(c=>c.inCount);
  L.push(['구분',...inc.map(c=>c.name),'합계'].join(' | '));R_KINDS.forEach(([k,l])=>L.push([l,...inc.map(c=>+c.counts[k]||0),inc.reduce((n,c)=>n+(+c.counts[k]||0),0)].join(' | ')));
  d.cats.forEach(c=>{L.push('',`[${c.name}] 반영 ${+c.counts.done||0} · 진행 ${+c.counts.doing||0} · 접수 ${+c.counts.recv||0}`,...c.lines.map(l=>l.t));});return L.join('\n');}
function v3Md(d){const inc=d.cats.filter(c=>c.inCount),L=[`# ${rWeekLabel(d.thu)} 주간 업무 보고`,'',`${rRange(d.thu)}`,'','## 운영 건수','',`| 구분 | ${inc.map(c=>c.name).join(' | ')} | 합계 |`,`|---|${inc.map(()=>'---:').join('|')}|---:|`];
  R_KINDS.forEach(([k,l])=>L.push(`| ${l} | ${inc.map(c=>+c.counts[k]||0).join(' | ')} | **${inc.reduce((n,c)=>n+(+c.counts[k]||0),0)}** |`));
  d.cats.forEach(c=>{L.push('',`## ${c.name}`,'',`반영 ${+c.counts.done||0} · 진행 ${+c.counts.doing||0} · 접수 ${+c.counts.recv||0}`,'');c.lines.forEach(l=>L.push(l.hl?`**✔ ${l.t.replace(/^✔\s?/,'')}**  `:l.t?`${l.t}  `:''));});return L.join('\n');}
function v3Csv(d){const cell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;},inc=d.cats.filter(c=>c.inCount);
  const rows=[['구분',...inc.map(c=>c.name),'합계'],...R_KINDS.map(([k,l])=>[l,...inc.map(c=>+c.counts[k]||0),inc.reduce((n,c)=>n+(+c.counts[k]||0),0)])];
  return '﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n');}
async function v3Xlsx(X,d){const wb=new X.Workbook(),ws=wb.addWorksheet('주간보고'),inc=d.cats.filter(c=>c.inCount),n=inc.length+2;
  ws.columns=[{width:14},...inc.map(()=>({width:16})),{width:10}];
  ws.addRow([`${rWeekLabel(d.thu)} 주간 업무 보고 (${rRange(d.thu)})`]).font={bold:true,size:14};ws.addRow([]);
  const h=ws.addRow(['구분',...inc.map(c=>c.name),'합계']);h.font={bold:true};h.eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEEF1F4'}};c.border={bottom:{style:'thin'}};});
  R_KINDS.forEach(([k,l])=>{const r=ws.addRow([l,...inc.map(c=>+c.counts[k]||0),inc.reduce((m,c)=>m+(+c.counts[k]||0),0)]);r.getCell(n).font={bold:true};});
  d.cats.forEach(c=>{ws.addRow([]);const t=ws.addRow([c.name]);t.font={bold:true,size:12};ws.mergeCells(t.number,1,t.number,n);
    const cr=ws.addRow([`반영 ${+c.counts.done||0} · 진행 ${+c.counts.doing||0} · 접수 ${+c.counts.recv||0}`]);ws.mergeCells(cr.number,1,cr.number,n);cr.font={color:{argb:'FF4B5765'}};
    c.lines.forEach(l=>{const r=ws.addRow([l.t]);ws.mergeCells(r.number,1,r.number,n);if(l.hl)r.font={color:{argb:'FFB00727'}};});});
  return wb.xlsx.writeBuffer();}
onArea('#reportArea','click',async e=>{

    catch(err){if(err?.code!=='declined')toast(err?.message==='load'?'엑셀 변환 도구를 불러오지 못했습니다. 잠시 후 다시 눌러 주세요':'엑셀 파일을 만들지 못했습니다');}

  if(id==='rMd'){try{await downloads.save({filename:`${fn}.md`,data:v3Md(d)});}catch(err){if(err?.code!=='declined')toast('파일을 저장하지 못했습니다');}return;}
});

/* 주간 보고 엑셀(.xlsx) — 화면과 같은 '프로젝트 → 파트 → 구분' 양식으로 서식을 입혀 저장. ExcelJS는 버튼을 누를 때 한 번만 불러옴 */
let excelLoading=null;
function loadExcel(){
  if(window.ExcelJS)return Promise.resolve(window.ExcelJS);
  if(!excelLoading)excelLoading=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';sc.onload=()=>window.ExcelJS?res(window.ExcelJS):rej(new Error('load'));sc.onerror=()=>{excelLoading=null;rej(new Error('load'));};document.head.appendChild(sc);});
  return excelLoading;
}
function xHex(c,fb){return /^#[0-9a-f]{6}$/i.test(c||'')?c.slice(1).toUpperCase():fb;}
function xTint(hex,t){const n=parseInt(hex,16),r=n>>16&255,g=n>>8&255,b=n&255,f=v=>Math.round(v+(255-v)*t).toString(16).padStart(2,'0');return (f(r)+f(g)+f(b)).toUpperCase();}
// 같은 업무가 '금주 완료'와 '신규 요청'에 모두 있으면 완료 쪽 1건만 남기고 상세에 '금주 신규'를 붙임
function dedupDoneNew(blocks){
  const name=i=>{const k=i.indexOf(' — ');return k<0?i:i.slice(0,k);};
  const done=blocks.find(b=>b.k==='done');if(!done)return blocks;
  const nw=blocks.find(b=>b.k==='new');if(!nw)return blocks;
  const doneNames=new Set(done.items.map(name)), newNames=new Set(nw.items.map(name));
  const out=blocks.map(b=>b.k==='done'?{...b,items:b.items.map(i=>newNames.has(name(i))?i+' · 금주 신규':i)}:b.k==='new'?{...b,items:b.items.filter(i=>!doneNames.has(name(i)))}:b);
  return out.filter(b=>b.items.length);
}
// 화면·텍스트·Markdown·CSV·엑셀 모두 같은 규칙 적용 (확정된 보고서도 보여줄 때 적용)
function dedupModel(m){if(!m)return m;if(m.people){m={...m};delete m.people;}if(!m.projects)return m;return {...m,projects:m.projects.map(p=>({...p,parts:p.parts.map(pt=>({...pt,blocks:dedupDoneNew(pt.blocks)}))}))};}

/* ---------- hours (시간 집계) ---------- */
// 담당자별 기간 집계: 완료 업무의 실제 소요(비어 있으면 예상) + 진행 중 업무에 입력된 실제 소요. 가용 = 평일 수 × 8h − 휴가
// 소요시간은 업무 단위 누적값이라, 요청일~완료일(진행 중이면 오늘)의 평일에 고르게 나눠 이 기간 몫만 셈
// ponytail: 날짜별 실제 기록이 없어 균등 배분. 정확히 하려면 일자별 시간 기록(worklog)을 따로 받아야 함
function periodShare(t,end,a,b){
  const s=t.requestDate&&t.requestDate<=end?t.requestDate:end, wd=eachDay(s,end).filter(d=>!isWeekend(d));
  if(!wd.length)return end>=a&&end<=b?1:0;
  return wd.filter(d=>d>=a&&d<=b).length/wd.length;
}
function peopleStats(a,b,pid,withItems){
  const days=eachDay(a,b), work=days.filter(d=>!isWeekend(d)).length*8, today=todayStr();
  const T=workItems().filter(t=>pid==='all'||t.projectId===pid);
  const ppl={};
  const P0=n=>ppl[n]||(ppl[n]={name:n,doneN:0,doneH:0,doingN:0,doingH:0,leaveH:0,noAct:0,items:[],pj:new Set()});
  for(const t of T){
    const L=wlogs.filter(w=>w.taskId===t.id);
    if(L.length){ // 날짜별 기록이 있으면 기록한 날짜·사람 그대로
      const byP={};for(const w of L)if(w.date>=a&&w.date<=b){const nm=memOf(w.memberId)?.name||w.member||'';if(nm)byP[nm]=(byP[nm]||0)+(+w.hours||0);}
      for(const [nm,h] of Object.entries(byP)){const p=P0(nm);if(projOf(t.projectId))p.pj.add(t.projectId);const kind=t.status==='done'?'done':'doing';if(kind==='done'){p.doneN++;p.doneH+=h;}else{p.doingN++;p.doingH+=h;}if(withItems)p.items.push({t,h,est:false,kind,logged:true});}
      continue;
    }
    const n=(t.assignee||'').trim();if(!n)continue;
    if(t.status==='done'&&t.doneDate){const f=periodShare(t,t.doneDate,a,b);if(!f)continue;const p=P0(n);if(projOf(t.projectId))p.pj.add(t.projectId);p.doneN++;const est=t.actHours===''||t.actHours==null;const h=(est?(+t.estHours||0):(+t.actHours||0))*f;p.doneH+=h;if(est)p.noAct++;if(withItems)p.items.push({t,h,est,kind:'done'});}
    else if(t.status==='doing'||t.status==='review'){const f=periodShare(t,today,a,b);if(!f)continue;const p=P0(n);if(projOf(t.projectId))p.pj.add(t.projectId);p.doingN++;const h=(+t.actHours||0)*f;p.doingH+=h;if(withItems)p.items.push({t,h,est:false,kind:'doing'});}
  }
  for(const m of members.filter(m=>memberIn(m,pid))){
    const p=P0(m.name);for(const id of memberProjectIds(m))p.pj.add(id);
    for(const l of leaves.filter(l=>l.memberId===m.id)){const ds=leaveDates(l).filter(d=>days.includes(d));if(!ds.length)continue;const lt=ltype(l.type);p.leaveH+=lt.multi?ds.length*8:lt.days*8;if(withItems)p.items.push({leave:l,h:lt.multi?ds.length*8:lt.days*8,ds,kind:'leave'});}
  }
  return {work,people:Object.values(ppl).map(p=>{const o={...p,projects:[...p.pj].map(id=>projOf(id).name),avail:Math.max(0,work-p.leaveH),total:p.doneH+p.doingH};delete o.pj;if(!withItems)delete o.items;return o;}).sort((x,y)=>y.total-x.total||x.name.localeCompare(y.name,'ko'))};
}
const hrState={period:'week',anchor:null,project:'all',open:new Set()};
function hrRange(){
  const t=todayStr();
  if(!hrState.anchor)hrState.anchor=hrState.period==='week'?mondayOf(t):t.slice(0,7)+'-01';
  if(hrState.period==='week'){hrState.anchor=mondayOf(hrState.anchor);return [hrState.anchor,addDays(hrState.anchor,6)];}
  const a=hrState.anchor.slice(0,7)+'-01',d=new Date(a+'T00:00:00');hrState.anchor=a;return [a,ymd(new Date(d.getFullYear(),d.getMonth()+1,0))];
}

    </div>

    const cell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
    const rows=[['기간','프로젝트','담당자','집계(h)','가용(h)','투입률(%)','완료(건)','완료 소요(h)','진행(건)','진행 소요(h)','휴가(h)']].concat(people.map(p=>[`${a}~${b}`,hrState.project!=='all'?projOf(hrState.project)?.name:(p.projects.join(' / ')||'프로젝트 미지정'),p.name,p.total,p.avail,p.avail?Math.round(p.total/p.avail*100):0,p.doneN,p.doneH,p.doingN,p.doingH,p.leaveH]));
    try{await downloads.save({filename:`업무시간_${a.replace(/-/g,'')}-${b.replace(/-/g,'')}.csv`,data:'﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n')});}catch(err){if(err?.code!=='declined')toast('파일을 저장하지 못했습니다');}
    return;
  }
  const row=e.target.closest('[data-person]');if(row){const n=row.dataset.person;hrState.open.has(n)?hrState.open.delete(n):hrState.open.add(n);render();}
});
onArea('#hoursArea','change',e=>{if(e.target.id==='hrProj'){hrState.project=e.target.value;render();}if(e.target.id==='hrPer'){hrState.period=e.target.value;hrState.anchor=null;render();}if(e.target.id==='hrPick'){hrState.anchor=e.target.value;render();}if(e.target.id==='hrPickY'){hrState.anchor=latestIn(hrState.period,+e.target.value);render();}});
onArea('#hoursArea','keydown',e=>{if(e.key!=='Enter')return;const row=e.target.closest('[data-person]');if(row&&!e.target.closest('[data-task]')){const n=row.dataset.person;hrState.open.has(n)?hrState.open.delete(n):hrState.open.add(n);render();}});

/* ---------- staffing (투입 인력) ---------- */
// 프로젝트별 투입 인력: assignments 컬렉션 {projectId, memberId, part, role, start, end, rate, note}. 한 사람이 여러 프로젝트에 동시에 투입될 수 있음
let assigns=[];
const sstate={project:'all',show:'active'};
if(state.sview!=='members')state.sview='asg'; // 인력 화면 탭(투입 현황/구성원), wb-ui에 기억
function asgStatus(a,t=todayStr()){if(a.start&&a.start>t)return 'plan';if(a.end&&a.end<t)return 'end';return 'on';}
const ASG_ST={on:['투입 중','s-done'],plan:['투입 예정','s-doing'],end:['종료','s-wait']};
// 구성원이 속한 프로젝트: 구성원 관리의 소속 + 투입 등록(종료되지 않은 것)
function memberProjectIds(m){const s=new Set();if(projOf(m.projectId))s.add(m.projectId);for(const a of assigns)if(a.memberId===m.id&&projOf(a.projectId)&&asgStatus(a)!=='end')s.add(a.projectId);return s;}
const memberIn=(m,pid)=>pid==='all'||memberProjectIds(m).has(pid);
function activeRate(memberId,t=todayStr()){return assigns.filter(a=>a.memberId===memberId&&asgStatus(a,t)==='on').reduce((s,a)=>s+(+a.rate||0),0);}

function renderStaff(){
  const area=$('#staffArea');
  if(!storeReady){area.innerHTML=`<div class="empty"><h2>투입 인력을 불러오는 중입니다</h2></div>`;return;}
  if(!projects.length){area.innerHTML=`<div class="empty"><h2>먼저 프로젝트를 등록해 주세요</h2><p>업무 관리 프로젝트 탭의 「+ 프로젝트」로 추가하면 프로젝트마다 투입 인력을 등록할 수 있습니다.</p></div>`;return;}
  if(sstate.project!=='all'&&!projOf(sstate.project))sstate.project='all';
  const T=todayStr();
  const projs=sstate.project==='all'?projects:projects.filter(p=>p.id===sstate.project);
  const vis=a=>sstate.show==='all'||(sstate.show==='active'?asgStatus(a)!=='end':asgStatus(a)===sstate.show);
  const live=assigns.filter(a=>memOf(a.memberId)&&projOf(a.projectId));
  const onNow=live.filter(a=>asgStatus(a)==='on');
  const people=new Set(onNow.map(a=>a.memberId));
  const over=[...people].filter(id=>activeRate(id)>100);
  const ord={on:0,plan:1,end:2};
  const sortA=(x,y)=>ord[asgStatus(x)]-ord[asgStatus(y)]||PARTS.findIndex(q=>q.k===x.part)-PARTS.findIndex(q=>q.k===y.part)||memOf(x.memberId).name.localeCompare(memOf(y.memberId).name,'ko');
  const row=a=>{const m=memOf(a.memberId),p=projOf(a.projectId),pt=PARTS.find(x=>x.k===a.part),st=asgStatus(a),tot=activeRate(a.memberId);
    return `<tr data-asg="${esc(a.id)}" tabindex="0"><td class="nowrap"><b>${esc(m.name)}</b>${st==='on'&&tot>100?`<div class="legend late" title="현재 모든 프로젝트 투입률 합계">전체 ${tot}% 투입</div>`:''}</td>
      <td class="nowrap">${esc(p.name)}</td>
      <td class="nowrap">${pt?`<span class="part"><span class="sw" style="background:${pt.c}"></span>${esc(pt.label)}</span>`:'—'}</td>
      <td class="nowrap">${esc(a.role||'—')}</td>
      <td class="nowrap num">${fmtDate(a.start)} ~ ${a.end?fmtDate(a.end):'계속'}${st==='on'&&a.end?`<span class="dday">${dday(a.end).replace('D-','종료 D-')}</span>`:''}</td>
      <td class="r num">${+a.rate||0}%</td>
      <td><span class="pill ${ASG_ST[st][1]}">${ASG_ST[st][0]}</span></td></tr>`;};
  // 전체 프로젝트면 프로젝트 구분 행으로 묶고, 한 프로젝트를 고르면 그 행만
  const rows=projs.map(p=>{const list=live.filter(a=>a.projectId===p.id&&vis(a)).sort(sortA);if(!list.length)return '';
    const now=live.filter(a=>a.projectId===p.id&&asgStatus(a)==='on'),mm=now.reduce((s,a)=>s+(+a.rate||0),0)/100;
    return (sstate.project==='all'?`<tr class="sgrp"><td colspan="7"><span class="rdot" style="background:${esc(p.color||'var(--muted)')}"></span><b>${esc(p.name)}</b><span class="num">투입 중 ${now.length}명 · ${mm.toFixed(mm%1?1:0)} M/M</span></td></tr>`:'')+list.map(row).join('');}).join('');
  const asgTable=rows?`<div class="tablebox"><table class="stable"><thead><tr><th>이름</th><th>프로젝트</th><th>파트</th><th>역할</th><th>투입 기간</th><th class="r">투입률</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>`
    :`<p class="legend" style="margin:0;padding:14px">${sstate.show==='active'?'투입 중이거나 예정된 인력이 없습니다.':'해당하는 투입 기록이 없습니다.'}${canWrite?' 「+ 투입 등록」으로 추가하세요.':''}</p>`;
  const Y=+todayStr().slice(0,4), isAdm=canWrite&&(typeof adminUI!=='function'||adminUI());
  const memTable=`<div class="tablebox"><table class="stable" id="mTable"><thead><tr><th>이름</th><th>메일</th><th>파트</th><th>소속 프로젝트</th><th class="r">현재 투입률</th><th class="r">${Y}년 연차</th></tr></thead><tbody>
    ${[...members].sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(m=>{const pt=PARTS.find(x=>x.k===m.part),pj=projOf(m.projectId),r=activeRate(m.id),q=quotaOf(m,Y);
      return `<tr><td class="nowrap"><b>${esc(m.name)}</b></td><td class="nowrap">${esc(m.email||'—')}</td><td class="nowrap">${pt?`<span class="part"><span class="sw" style="background:${pt.c}"></span>${esc(pt.label)}</span>`:'—'}</td><td class="nowrap">${esc(pj?.name||'—')}</td><td class="r num ${r>100?'late':''}">${r}%</td><td class="r num">${q==null?'—':fmtDays(q)+'일'}</td></tr>`;}).join('')}
    <tr class="mEmpty" hidden><td colspan="6">검색 결과가 없어요</td></tr></tbody></table></div>`;
  const vt='<div class="vtabs" role="tablist">'+[['asg','투입 현황'],['members','구성원']].map(([k,l])=>`<button type="button" class="vtab" role="tab" data-sview="${k}" aria-selected="${state.sview===k}">${l}</button>`).join('')+'</div>';
  area.innerHTML=`
    <div class="vbar">${vt}${state.sview==='members'?`<label class="searchBox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="search" id="mQ" type="search" placeholder="이름·메일·파트·프로젝트 검색" aria-label="구성원 검색" value="${esc(sstate.mq||'')}"></label>`:''}</div>
    <div class="rtool">
      ${state.sview==='members'?`<span class="spacer"></span>${isAdm?'<button class="btn" type="button" id="sMembers">구성원 관리</button>':''}</div>${memTable}`:`<select class="sel" id="sProj" aria-label="프로젝트"><option value="all">전체 프로젝트</option>${projects.map(p=>`<option value="${esc(p.id)}" ${sstate.project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
      <select class="sel" id="sShow" aria-label="투입 상태">${[['active','투입 중·예정'],['on','투입 중'],['plan','예정'],['end','종료'],['all','전체']].map(([k,l])=>`<option value="${k}" ${sstate.show===k?'selected':''}>${l}</option>`).join('')}</select>
      <span class="spacer"></span>
      ${canWrite?'<button class="btn primary" type="button" id="sAdd">+ 투입 등록</button>':''}
    </div>
    ${statTable([[`현재 투입 인원`,`${people.size}<small>명</small>`,``],[`현재 투입 M/M`,`${(onNow.reduce((s,a)=>s+(+a.rate||0),0)/100).toFixed(1).replace(/\.0$/,'')}<small>M/M</small>`,``],[`투입 예정`,`${live.filter(a=>asgStatus(a)==='plan').length}<small>건</small>`,``],[`100% 초과 투입`,`${over.length}<small>명</small>`,`${over.length?'alert':''}`]])}
    ${!members.length?`<div class="banner">아직 등록된 구성원이 없습니다. 「구성원 관리」에서 사람을 먼저 추가한 뒤 프로젝트에 투입하세요.</div>`:''}
    ${asgTable}
    <p class="legend" style="margin:0">투입률은 해당 프로젝트에 쓰는 비중(%)입니다. 100% = 1 M/M. 한 사람이 여러 프로젝트에 동시에 투입되면 합계가 100%를 넘을 때 빨간색으로 표시됩니다. 여기서 투입한 프로젝트는 휴가 관리·업무 시간의 프로젝트 필터에도 반영됩니다.</p>`}`;
}
// 구성원 검색: 다시 그리지 않고 행만 거름(입력값은 sstate.mq에 두어 다시 그려도 유지)
function applyMQ(){const k=(sstate.mq||'').trim().toLowerCase(),rows=[...document.querySelectorAll('#mTable tbody tr:not(.mEmpty)')];rows.forEach(r=>r.hidden=!!k&&!r.textContent.toLowerCase().includes(k));const e=$('#mTable .mEmpty');if(e)e.hidden=!rows.length||rows.some(r=>!r.hidden);}
onArea('#staffArea','input',e=>{if(e.target.id!=='mQ')return;sstate.mq=e.target.value;applyMQ();});
onArea('#staffArea','change',e=>{if(e.target.id==='sProj'){sstate.project=e.target.value;render();}if(e.target.id==='sShow'){sstate.show=e.target.value;render();}});
onArea('#staffArea','click',e=>{
  const sv=e.target.closest('[data-sview]');if(sv){if(sv.dataset.sview!==state.sview){state.sview=sv.dataset.sview;persistUI();render();}return;}
  const id=e.target.closest('button')?.id;
  if(id==='sAdd'){openAssign(null,sstate.project!=='all'?sstate.project:'');return;}
  if(id==='sMembers'){openMembers();return;}
  const row=e.target.closest('[data-asg]');if(row)openAssign(assigns.find(a=>a.id===row.dataset.asg));
});
onArea('#staffArea','keydown',e=>{if(e.key!=='Enter')return;const row=e.target.closest('[data-asg]');if(row)openAssign(assigns.find(a=>a.id===row.dataset.asg));});

function openAssign(a,pid){
  if(!members.length){openMembers();return;}
  const isNew=!a, ro=!canWrite;
  a=a||{projectId:pid||projects[0]?.id||'',memberId:'',part:'',role:'',start:todayStr(),end:'',rate:100,note:''};
  const opt=(arr,cur)=>arr.map(([k,v])=>`<option value="${esc(k)}" ${String(cur)===String(k)?'selected':''}>${esc(v)}</option>`).join('');
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="asgForm" novalidate>
    <header><h2>${isNew?'투입 등록':ro?'투입 상세':'투입 수정'}</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>
    <fieldset ${ro?'disabled':''} style="border:0;margin:0;padding:0;min-width:0"><div class="body">
      <div class="f"><label for="aProj">프로젝트 <b>*</b></label><select id="aProj">${opt(projects.map(p=>[p.id,p.name]),a.projectId)}</select></div>
      <div class="f"><label for="aMem">구성원 <b>*</b></label><select id="aMem"><option value="">선택</option>${opt(members.map(m=>[m.id,m.name]),a.memberId)}</select></div>
      <div class="f"><label for="aPart">파트</label><select id="aPart"><option value="">선택 안 함</option>${opt(PARTS.map(p=>[p.k,p.label]),a.part)}</select></div>
      <div class="f"><label for="aRole">역할</label><input id="aRole" value="${esc(a.role||'')}" placeholder="예: PM, 화면설계, 퍼블리싱, FE 개발" maxlength="30"></div>
      <div class="f"><label for="aStart">투입 시작일 <b>*</b></label><input type="date" id="aStart" value="${esc(a.start||'')}"></div>
      <div class="f"><label for="aEnd">투입 종료일</label><input type="date" id="aEnd" value="${esc(a.end||'')}"><span class="hint">비워 두면 종료일 미정(계속)</span></div>
      <div class="f"><label for="aRate">투입률 (%)</label><input type="number" id="aRate" min="0" max="200" step="10" inputmode="numeric" value="${esc(a.rate??100)}"><span class="hint" id="aRateHint"></span></div>
      <div class="f"><label for="aNote">메모</label><input id="aNote" value="${esc(a.note||'')}" placeholder="계약 형태, 상주 위치 등"></div>
    </div></fieldset>
    <footer>
      <div id="aDelZone">${!isNew&&canWrite?'<button class="btn danger" type="button" id="aDel">삭제</button>':''}</div>
      <span class="err" id="aErr"></span>
      <div class="r"><button class="btn" type="button" id="aCancel">${ro?'닫기':'취소'}</button>${ro?'':`<button class="btn primary" type="submit" id="aSave">${isNew?'등록':'저장'}</button>`}</div>
    </footer></form></div>`;
  const hint=()=>{const mid=$('#aMem').value;if(!mid){$('#aRateHint').textContent='';return;}const other=assigns.filter(x=>x.id!==a.id&&x.memberId===mid&&asgStatus(x)==='on').reduce((s,x)=>s+(+x.rate||0),0);
    const tot=other+(+$('#aRate').value||0);$('#aRateHint').textContent=`다른 프로젝트 투입 ${other}% · 합계 ${tot}%${tot>100?' (100% 초과)':''}`;$('#aRateHint').style.color=tot>100?'var(--bad)':'';};
  hint();
  $('#aMem').addEventListener('change',()=>{hint();const m=memOf($('#aMem').value);if(m&&!$('#aPart').value&&m.part)$('#aPart').value=m.part;});
  $('#aRate').addEventListener('input',hint);
  $('#xClose').onclick=$('#aCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  const label=x=>`${memOf(x.memberId)?.name||''} → ${projOf(x.projectId)?.name||''}`;
  $('#aDel')?.addEventListener('click',()=>{
    $('#aDelZone').innerHTML=`<div class="confirm">이 투입 기록을 삭제할까요? <button class="btn danger" type="button" id="aDelYes">삭제</button><button class="btn ghost" type="button" id="aDelNo">취소</button></div>`;
    $('#aDelNo').onclick=()=>openAssign(a);
    $('#aDelYes').onclick=async()=>{try{await db.collection('assignments').doc(a.id).delete();logChange('assign','delete',a.id,label(a));closeModal();toast('삭제했습니다');}catch(err){handleWriteError(err,'#aErr');}};
  });
  $('#asgForm').addEventListener('submit',async e=>{
    e.preventDefault();if(ro)return;
    const data={projectId:$('#aProj').value,memberId:$('#aMem').value,part:$('#aPart').value,role:$('#aRole').value.trim(),start:$('#aStart').value,end:$('#aEnd').value,
      rate:$('#aRate').value===''?100:Math.max(0,Math.min(200,+$('#aRate').value)),note:$('#aNote').value.trim(),updatedAt:new Date().toISOString(),createdAt:a.createdAt||new Date().toISOString()};
    if(!data.projectId||!data.memberId){$('#aErr').textContent='프로젝트와 구성원을 선택해 주세요.';return;}
    if(!data.start){$('#aErr').textContent='투입 시작일을 입력해 주세요.';return;}
    if(data.end&&data.end<data.start){$('#aErr').textContent='종료일이 시작일보다 빠릅니다.';return;}
    const dup=assigns.find(x=>x.id!==a.id&&x.memberId===data.memberId&&x.projectId===data.projectId&&!(x.end&&x.end<data.start)&&!(data.end&&data.end<x.start));
    if(dup&&!$('#asgForm').dataset.ok){$('#aErr').textContent=`같은 기간에 이미 이 프로젝트 투입 기록(${fmtDate(dup.start)}~)이 있습니다. 그래도 저장하려면 한 번 더 누르세요.`;$('#asgForm').dataset.ok='1';return;}
    $('#aSave').disabled=true;
    try{if(isNew){const ref=await db.collection('assignments').add(data);logChange('assign','create',ref.id,label(data),null,data);}
      else{const pt=patchOf(data,a);if(pt)await db.collection('assignments').doc(a.id).update(pt);logChange('assign','update',a.id,label(data),a,data);}
      closeModal();toast(isNew?'투입을 등록했습니다':'저장했습니다');}
    catch(err){$('#aSave').disabled=false;handleWriteError(err,'#aErr');}
  });
}

const HFIELDS={

  leave:[['memberId','구성원'],['type','종류'],['date','날짜'],['endDate','종료일'],['time','사용 시간'],['days','일수'],['note','메모']],
  assign:[['projectId','프로젝트'],['memberId','구성원'],['part','파트'],['role','역할'],['start','시작일'],['end','종료일'],['rate','투입률(%)'],['note','메모']],
  site:[['title','제목'],['subtitle','설명'],['rmsTemplate','RMS 주소 규칙']],
  report:[]
};
const HENT={backup:'백업',task:'업무',assign:'투입 인력',project:'프로젝트',part:'파트',member:'구성원',leave:'휴가',report:'주간 보고',site:'제목·설명'};
const HACT={create:['등록','s-done'],update:['수정','s-doing'],delete:['삭제','h-del'],confirm:['확정','s-review'],unconfirm:['확정 해제','s-wait'],restore:['복원','s-review']};
function hval(f,v){
  if(v===''||v==null)return '';
  switch(f){
    case 'projectId':return projOf(v)?.name||'(삭제된 프로젝트)';
    case 'part':return partOf(v).label;
    case 'status':return statusOf(v).label;
    case 'priority':return PRIS[v]??String(v);
    case 'memberId':return memOf(v)?.name||'(삭제된 구성원)';
    case 'type':return ltype(v).label;
    case 'color':return '■'+v;
    case 'order':return `${+v+1}번째`;
  }
  const s=String(v);return s.length>80?s.slice(0,80)+'…':s;
}
function logChange(entity,action,id,label,before,after,extra){
  if(!db||!canWrite)return;
  const fields=HFIELDS[entity]||[];
  let changes=[];
  if(action==='update'){
    changes=fields.filter(([f])=>String(before?.[f]??'')!==String(after?.[f]??'')).map(([f,l])=>({f,l,from:hval(f,before?.[f]),to:hval(f,after?.[f])}));
    if(!changes.length&&!extra)return;
  }else if(action==='create'){
    changes=fields.filter(([f])=>f!=='color'&&f!=='order'&&f!=='title'&&f!=='name'&&after?.[f]!==''&&after?.[f]!=null).slice(0,6).map(([f,l])=>({f,l,from:'',to:hval(f,after[f])}));
  }
  db.collection('history').add({at:new Date().toISOString(),actor:actorId||'',entity,action,entityId:id||'',label:String(label||'').slice(0,120),changes,extra:extra||''}).catch(()=>{});
}
function startHistory(){
  if(historySub||!db||!canWrite)return;
  historySub=db.collection('history').orderBy('at','desc').limit(1000).onSnapshot(s=>{historyItems=s.docs.map(x=>({id:x.id,...x.data()}));historyReady=true;if(state.mode==='history')render();},()=>{historyReady=true;});
  // 180일 지난 기록 정리 (한 번에 최대 200건). 열 때마다 하지 않고 이 브라우저에서 하루 한 번만
  try{if(localStorage.getItem('wb-hclean')===todayStr())return;localStorage.setItem('wb-hclean',todayStr());}catch(e){}
  const cut=new Date();cut.setDate(cut.getDate()-180);
  db.collection('history').where('at','<',cut.toISOString()).limit(200).get().then(async s=>{for(const d of s.docs)await db.collection('history').doc(d.id).delete();}).catch(()=>{});
}
async function resolveNames(ids){
  const need=ids.filter(id=>id&&!nameAsked.has(id));if(!need.length||!userCap?.profiles)return;
  need.forEach(id=>nameAsked.add(id));
  try{const ps=await userCap.profiles(need);for(const id of need)nameCache[id]=ps?.[id]?.name||'';if(state.mode==='history')render();}catch(e){}
}
const actorName=id=>id?((nameCache[id]||'')||(id===actorId?'나':'이름 확인 불가'))+(id===actorId&&nameCache[id]?' (나)':''):'알 수 없음';

function renderHistory(){
  const area=$('#historyArea');
  if(!canWrite){area.innerHTML=`<div class="empty"><h2>편집 권한이 있는 사람만 볼 수 있습니다</h2></div>`;return;}
  if(!historyReady){area.innerHTML=`<div class="empty"><h2>변경 이력을 불러오는 중입니다</h2></div>`;return;}
  resolveNames([...new Set(historyItems.map(h=>h.actor))]);
  const since=hstate.range==='all'?'':(()=>{const d=new Date();d.setDate(d.getDate()-(+hstate.range));return d.toISOString();})();
  const q=hstate.q.trim().toLowerCase();
  const list=historyItems.filter(h=>(hstate.entity==='all'||h.entity===hstate.entity)&&(hstate.action==='all'||h.action===hstate.action)&&(hstate.actor==='all'||h.actor===hstate.actor)&&(!since||h.at>=since)&&
    (!q||[h.label,h.extra,...(h.changes||[]).flatMap(c=>[c.l,c.from,c.to])].some(v=>(v||'').toLowerCase().includes(q))));
  const actors=[...new Set(historyItems.map(h=>h.actor).filter(Boolean))];
  const sel=(id,cur,opts)=>`<select class="sel" id="${id}">${opts.map(([k,v])=>`<option value="${esc(k)}" ${cur===k?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
  const val=v=>v.startsWith('■')?`<span class="hsw" style="background:${esc(v.slice(1))}"></span>`:(v?esc(v):'<span class="legend">(비어 있음)</span>');
  const byDay={};for(const h of list){const d=new Date(h.at);const k=ymd(d);(byDay[k]=byDay[k]||[]).push(h);}
  const days=Object.keys(byDay).sort().reverse();
  area.innerHTML=`
    <div class="rtool">
      ${sel('hEnt',hstate.entity,[['all','전체 대상'],...Object.entries(HENT)])}
      ${sel('hAct',hstate.action,[['all','전체 작업'],...Object.entries(HACT).map(([k,v])=>[k,v[0]])])}
      ${sel('hActor',hstate.actor,[['all','전체 사용자'],...actors.map(a=>[a,actorName(a)])])}
      ${sel('hRange',hstate.range,[['7','최근 7일'],['30','최근 30일'],['90','최근 90일'],['all','전체 (최대 180일)']])}
      <input class="search" id="hQ" type="search" placeholder="업무명·이름·변경 내용 검색" value="${esc(hstate.q)}">
      <span class="spacer"></span><span class="legend">${list.length}건</span>
    </div>
    ${list.length?days.map(k=>{const d=new Date(k+'T00:00:00');return `<section class="hday"><h3>${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})${k===todayStr()?' · 오늘':''}</h3><ol class="hlist">${byDay[k].map(h=>{
      const [an,ac]=HACT[h.action]||[h.action,'s-wait'];const t=new Date(h.at);
      const link=h.entity==='task'&&h.action!=='delete'&&tasks.some(x=>x.id===h.entityId);
      return `<li class="hitem"><span class="htime num">${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</span>
        <div class="hbody"><div class="hline"><b>${esc(actorName(h.actor))}</b><span class="pill ${ac}">${an}</span><span class="legend">${esc(HENT[h.entity]||h.entity)}</span>
        ${link?`<button type="button" class="hlink" data-task="${esc(h.entityId)}">${esc(h.label||'(제목 없음)')}</button>`:`<span class="hlabel">${esc(h.label||'')}</span>`}</div>
        ${(h.changes||[]).length?`<ul class="hchg">${h.changes.map(c=>`<li><span class="hf">${esc(c.l)}</span>${h.action==='update'?`${val(c.from||'')}<span class="harr">→</span>`:''}${val(c.to||'')}</li>`).join('')}</ul>`:''}
        ${h.extra?`<div class="legend">${esc(h.extra)}</div>`:''}</div></li>`;}).join('')}</ol></section>`;}).join(''):`<div class="empty"><h2>${historyItems.length?'조건에 맞는 이력이 없습니다':'아직 기록된 변경 이력이 없습니다'}</h2><p>${historyItems.length?'필터를 바꿔 보세요.':'이제부터 업무·프로젝트·파트·구성원·휴가·주간 보고·제목을 등록하거나 수정하면 여기에 자동으로 쌓입니다.'}</p></div>`}`;
}
onArea('#historyArea','change',e=>{const m={hEnt:'entity',hAct:'action',hActor:'actor',hRange:'range'}[e.target.id];if(m){hstate[m]=e.target.value;render();}});
let hqT;onArea('#historyArea','input',e=>{if(e.target.id!=='hQ')return;clearTimeout(hqT);hqT=setTimeout(()=>{hstate.q=e.target.value;renderHistory();liftTools();const i=$('#hQ');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},200);});
onArea('#historyArea','click',e=>{const b=e.target.closest('[data-task]');if(b)openTask(tasks.find(t=>t.id===b.dataset.task));});

function handleWriteError(err,sel){
  const msg=err?.code==='invalid_argument'?'수정 권한이 없거나 입력값이 올바르지 않습니다.':err?.code==='quota_exceeded'?'저장 공간이 가득 찼습니다. 완료된 업무를 정리해 주세요.':'저장하지 못했습니다. 잠시 후 다시 시도해 주세요.';
  if(err?.code==='invalid_argument'&&!sel){canWrite=false;render();}
  if(sel&&$(sel))$(sel).textContent=msg;else toast(msg);
}

/* ---------- 동기화 상태 · 접속자 (아티팩트 버전) ---------- */
// 저장소 호출을 한 겹 감싸서 저장 중인 쓰기 수와 마지막으로 서버와 맞춘 시각을 셈.
// 접속자는 room 기능의 presence로 각자 '언제부터 보고 있는지'를 올리고, 이름은 구성원 연결·계정 이름으로 찾음
const sync={pending:0,last:null,online:false}, openedAt=new Date().toISOString();
let room=null;
const syncTouch=()=>{sync.last=new Date();drawSync();};
function wrapDb(raw){
  const w=fn=>async(...a)=>{sync.pending++;drawSync();try{const r=await fn(...a);syncTouch();return r;}finally{sync.pending--;drawSync();}};
  const snapCb=cb=>(...a)=>{syncTouch();return cb(...a);};
  const ref=r=>({...r,id:r.id,path:r.path,get:(...a)=>r.get(...a),set:w(d=>r.set(d)),update:w(d=>r.update(d)),delete:w(()=>r.delete()),onSnapshot:(cb,err)=>r.onSnapshot(snapCb(cb),err)});
  const q=x=>({orderBy:(...a)=>q(x.orderBy(...a)),limit:(...a)=>q(x.limit(...a)),where:(...a)=>q(x.where(...a)),get:(...a)=>x.get(...a),
    onSnapshot:(cb,err)=>x.onSnapshot(snapCb(cb),err),add:w(d=>x.add(d)),doc:id=>ref(x.doc(id))});
  return {collection:c=>q(raw.collection(c)),doc:pth=>ref(raw.doc(pth))};
}
const hms=d=>d.toTimeString().slice(0,8);
function drawSync(){
  let box=$('#syncBox');
  if(!box){
    box=document.createElement('div');box.id='syncBox';box.className='syncBox';
    box.innerHTML=`<span class="syncDot"></span><span class="syncText" id="syncText"></span>
      <div class="onlineWrap" id="onlineWrap" hidden><button class="btn ghost" type="button" id="onlineBtn" aria-expanded="false" aria-controls="onlineList"></button><div class="onlineList" id="onlineList" hidden></div></div>`;
    document.querySelector('.modeRow').appendChild(box);
    const btn=box.querySelector('#onlineBtn'),list=box.querySelector('#onlineList');
    btn.onclick=()=>{list.hidden=!list.hidden;btn.setAttribute('aria-expanded',String(!list.hidden));};
    document.addEventListener('click',e=>{if(!box.querySelector('#onlineWrap').contains(e.target)){list.hidden=true;btn.setAttribute('aria-expanded','false');}});
  }
  if(!db){box.hidden=true;return;}box.hidden=false;
  const offline=room&&!sync.online, st=sync.pending?'saving':offline?'offline':'ok', t=sync.last?hms(sync.last):'—';
  box.dataset.state=st;
  box.querySelector('#syncText').innerHTML=st==='saving'?'저장 중…':st==='offline'?`실시간 연결 끊김<span class="sLong"> · 마지막 동기화</span> ${t}`:`<span class="sLong">저장됨 · 마지막 동기화 </span>${t}`;
  const wrap=box.querySelector('#onlineWrap');wrap.hidden=!room;if(!room)return;
  // 같은 사람이 탭을 여러 개 열어도 한 명으로
  const by=new Map();
  for(const p of room.peers()){if(p.kind!=='viewer')continue;const k=p.by||p.peer, since=typeof p.presence?.since==='string'?p.presence.since:'';
    const cur=by.get(k);if(!cur||(since&&since<cur.since))by.set(k,{id:p.by,isMe:p.isMe,guest:p.guest,since:since||cur?.since||''});else if(p.isMe)cur.isMe=true;}
  const people=[...by.values()];
  // 아직 모르는 이름은 한 번만 물어보고(resolveNames가 중복 요청을 막음), 답이 오면 다시 그림
  const missing=people.map(x=>x.id).filter(id=>id&&nameCache[id]===undefined);
  if(missing.length)resolveNames(missing).then(()=>{if(missing.some(id=>nameCache[id]!==undefined))drawSync();});
  const nameOf=x=>{const m=x.id&&members.find(m=>m.userId===x.id);return m?.name||(x.id&&nameCache[x.id])||(x.isMe?'나':'이름 확인 중');};
  people.sort((a,b)=>(b.isMe-a.isMe)||nameOf(a).localeCompare(nameOf(b),'ko'));
  box.querySelector('#onlineBtn').textContent=`접속 ${Math.max(1,people.length)}명`;
  box.querySelector('#onlineList').innerHTML=`<b>지금 보고 있는 사람</b>`+people.map(x=>`<div class="onlineItem"><span class="syncDot"></span><span>${esc(nameOf(x))}${x.isMe&&nameOf(x)!=='나'?' (나)':''}${x.guest?' <span class="legend">외부</span>':''}</span><span class="legend">${x.since?esc(hms(new Date(x.since)).slice(0,5))+'부터':''}</span></div>`).join('');
}
async function startRoom(){
  room=await claude.use('room');if(!room){drawSync();return;}
  room.presence({since:openedAt}).catch(()=>{});
  room.onPeers(()=>drawSync(),()=>{room=null;drawSync();});
  // 짧은 재연결은 무시하고 2초 넘게 끊겼을 때만 '끊김'으로 표시
  let offT=null;
  room.onConnection(c=>{clearTimeout(offT);if(c){sync.online=true;drawSync();}else offT=setTimeout(()=>{sync.online=false;drawSync();},2000);},()=>{room=null;drawSync();});
}

/* ---------- boot ---------- */
render();
(async()=>{
  if(!window.claude?.use){storeReady=true;$('#banner').textContent='저장소에 연결되지 않아 읽기 전용으로 표시됩니다.';$('#banner').hidden=false;render();return;}
  const [d,u,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
  db=d&&wrapDb(d);downloads=dl;
  if(db){drawSync();startRoom();}
  if(!db){storeReady=true;$('#banner').textContent='로그인한 팀원만 업무를 볼 수 있습니다. claude.ai에 로그인 후 다시 열어 주세요.';$('#banner').hidden=false;render();return;}
  let w=null;try{w=u?await u.can('data.write'):null;}catch(e){}
  canWrite=w!==false;userCap=u;try{actorId=u?await u.id():null;}catch(e){}
  if(w===false){$('#banner').textContent='보기 전용 권한입니다. 업무를 등록·수정하려면 공유한 사람에게 편집 권한을 요청하세요.';$('#banner').hidden=false;}
  let got=0;const ready=()=>{if(++got>=10)storeReady=true;};
  const onErr=e=>{if(e?.code!=='revoked'){$('#banner').textContent='업무 목록을 불러오지 못했습니다. 페이지를 새로 고쳐 주세요.';$('#banner').hidden=false;}};
  let pr=false,tr=false,ar=false,mr=false,lr=false,rr=false,sr=false;
  db.collection('assignments').onSnapshot(s=>{assigns=s.docs.map(x=>({id:x.id,...x.data()}));if(!sr){sr=true;ready();}render();},onErr);
  startHistory();
  db.doc('settings/site').onSnapshot(s=>{site=s.exists?{...SITE_DEFAULT,...s.data()}:{...SITE_DEFAULT};renderBrand();},()=>{});
  db.collection('reports').onSnapshot(s=>{reports=s.docs.map(x=>({id:x.id,...x.data()}));if(!rr){rr=true;ready();}render();},onErr);
  db.collection('members').onSnapshot(s=>{members=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));if(!mr){mr=true;ready();}render();},onErr);
  db.collection('leaves').onSnapshot(s=>{leaves=s.docs.map(x=>({id:x.id,...x.data()}));if(!lr){lr=true;ready();}render();},onErr);
  db.collection('events').onSnapshot(s=>{events=s.docs.map(x=>({id:x.id,...x.data()}));render();},onErr);
  db.collection('parts').onSnapshot(s=>{
    if(s.docs.length){PARTS=s.docs.map(x=>{const d=x.data();return {k:x.id,label:d.name||'이름 없음',c:d.color||PART_COLORS[4],order:d.order??0};}).sort((a,b)=>a.order-b.order);partsStored=true;}
    else{PARTS=DEFAULT_PARTS.slice();partsStored=false;}
    if(!ar){ar=true;ready();}render();},onErr);
  db.collection('projects').onSnapshot(s=>{projects=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.order??0)-(b.order??0));if(!pr){pr=true;ready();}render();},onErr);
  db.collection('tasks').onSnapshot(s=>{tasks=s.docs.map(x=>({id:x.id,...x.data()}));if(!tr){tr=true;ready();}render();},onErr);
  let wr=false;db.collection('worklogs').onSnapshot(s=>{wlogs=s.docs.map(x=>({id:x.id,...x.data()}));if(!wr){wr=true;ready();}wlRefresh?.();render();},onErr);
  // ponytail: 댓글·템플릿을 전부 구독. 수천 건이 넘으면 업무별 query로 나눌 것
  let cr=false;db.collection('comments').onSnapshot(s=>{comments=s.docs.map(x=>({id:x.id,...x.data()}));if(!cr){cr=true;ready();}wlRefresh?.();if(state.view==='list')render();},onErr);
  let pr2=false;db.collection('templates').onSnapshot(s=>{templates=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));if(!pr2){pr2=true;ready();}wlRefresh?.();},onErr);
})();
</script>
