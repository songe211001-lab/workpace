/* ════════════════════════════════════════════════════════════
   전체 검색: 모든 달의 이벤트·배너·프리마케팅·혜택
   ════════════════════════════════════════════════════════════ */
function searchAll(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const has = v => String(v ?? '').toLowerCase().includes(q);
  const hits = [];
  STATE.eventMonths.forEach(m=> m.events.forEach((ev,i)=>{
    if(['name','id','category','note','opUrl'].some(f=> has(ev[f])))
      hits.push({tab:'events', kind:'이벤트', text: ev.name || '(제목없음)', where:`${m.label} ${i+1}행${ev.id ? ` · ID ${ev.id}` : ''}`, key:m.key, uid:ev._uid});
  }));
  STATE.bannerMonths.forEach(m=>{
    m.ranks.forEach((r,i)=> Object.entries(r.values || {}).forEach(([col, v])=>{
      if(has(v)) hits.push({tab:'banner', kind:'배너', text:String(v), where:`${m.label} ${i+1}위 · ${col}`, key:m.key, uid:r._uid});
    }));
    m.preMarketingPartners.forEach(pp=>{
      if(has(pp.name)) hits.push({tab:'pm', kind:'프리마케팅', text:pp.name, where:`${m.label} ${pp.week}주차 ${pp.rankInWeek}위`, key:m.key, uid:`pm:${m.key}:${pp.rankInWeek}`});
    });
  });
  STATE.benefitBlocks.forEach((b, bi)=> b.items.forEach((it,i)=>{
    if(has(it.name) || has(it.copy)) hits.push({tab:'benefit', kind:'혜택', text: it.name || it.copy, where:`${formatBenefitLabel(b.label)} ${i+1}행`, block:b._blockUid, current: bi===0, uid:it._uid});
  }));
  return hits;
}
function goToHit(h){
  if(h.tab==='events'){ activeEventMonthKey = h.key; activeEventStatusFilter = '전체'; }
  if(h.tab==='banner' || h.tab==='pm') activeBannerMonthKey = h.key;
  if(h.tab==='benefit' && !h.current) expandedBenefitBlocks.add(h.block);
  switchMainTab(h.tab); renderActiveTab();
  setTimeout(()=> flashHighlight(document.querySelector(`#tab-${h.tab} tr[data-uid="${CSS.escape(h.uid)}"]`)), 30);
}
(function bindSearch(){
  const input = document.getElementById('globalSearch');
  const box = document.getElementById('searchResults');
  let timer = null, lastHits = [];
  const close = ()=> box.classList.add('hidden');
  const render = ()=>{
    if(!STATE || !input.value.trim()){ close(); return; }
    lastHits = searchAll(input.value);
    const shown = lastHits.slice(0, 40);
    box.innerHTML = shown.length ? shown.map((h,i)=>`<button type="button" class="search-hit" role="option" data-i="${i}"><span class="search-kind">${h.kind}</span><span class="txt">${escapeHtml(h.text)}</span><span class="where">${escapeHtml(h.where)}</span></button>`).join('')
      + (lastHits.length > shown.length ? `<div class="search-empty">${lastHits.length - shown.length}건 더 있어요. 검색어를 더 구체적으로 입력해보세요.</div>` : '')
      : '<div class="search-empty">찾는 내용이 없어요.</div>';
    box.classList.remove('hidden');
    box.querySelectorAll('.search-hit').forEach(b=> b.addEventListener('click', ()=>{ close(); goToHit(lastHits[+b.dataset.i]); }));
  };
  input.addEventListener('input', ()=>{ clearTimeout(timer); timer = setTimeout(render, 150); });
  input.addEventListener('focus', ()=>{ if(input.value.trim()) render(); });
  input.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ close(); input.blur(); }
    if(e.key==='ArrowDown'){ const f = box.querySelector('.search-hit'); if(f){ e.preventDefault(); f.focus(); } }
    if(e.key==='Enter'){ const f = box.querySelector('.search-hit'); if(f){ e.preventDefault(); f.click(); } }
  });
  box.addEventListener('keydown', e=>{
    const items = [...box.querySelectorAll('.search-hit')], i = items.indexOf(document.activeElement);
    if(e.key==='ArrowDown' && i>=0 && items[i+1]){ e.preventDefault(); items[i+1].focus(); }
    if(e.key==='ArrowUp'){ e.preventDefault(); (i>0 ? items[i-1] : input).focus(); }
    if(e.key==='Escape'){ close(); input.focus(); }
  });
  document.addEventListener('click', e=>{ if(!e.target.closest('.global-search')) close(); });
})();

/* ════════════════════════════════════════════════════════════
   배너 구좌(컬럼) 편집: 추가·이름 변경·순서·삭제
   ════════════════════════════════════════════════════════════ */
function openColumnsEditor(key){
  const mo = getBannerMonth(key);
  if(!mo) return;
  let rows = mo.columns.map(c=>({orig:c, name:c}));
  const draw = body=>{
    body.querySelector('#colEditList').innerHTML = rows.length ? rows.map((r,i)=>`
      <div class="edit-row">
        <input type="text" data-i="${i}" value="${escapeHtml(r.name)}" aria-label="구좌 이름"/>
        <button type="button" class="sm" data-up="${i}" ${i===0 ? 'disabled' : ''} aria-label="위로">▲</button>
        <button type="button" class="sm" data-down="${i}" ${i===rows.length-1 ? 'disabled' : ''} aria-label="아래로">▼</button>
        <button type="button" class="sm" data-del="${i}" aria-label="삭제">🗑</button>
      </div>`).join('') : '<p class="sync-log-empty">구좌가 없어요. 아래에서 추가해주세요.</p>';
    body.querySelectorAll('input[data-i]').forEach(inp=> inp.addEventListener('input', ()=>{ rows[+inp.dataset.i].name = inp.value; }));
    body.querySelectorAll('[data-up]').forEach(b=> b.addEventListener('click', ()=>{ const i = +b.dataset.up; [rows[i-1], rows[i]] = [rows[i], rows[i-1]]; draw(body); }));
    body.querySelectorAll('[data-down]').forEach(b=> b.addEventListener('click', ()=>{ const i = +b.dataset.down; [rows[i+1], rows[i]] = [rows[i], rows[i+1]]; draw(body); }));
    body.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=>{ rows.splice(+b.dataset.del, 1); draw(body); }));
  };
  const apply = close=>{
    const names = rows.map(r=> r.name.trim());
    mo.ranks.forEach(r=>{
      const nv = {};
      rows.forEach((x,i)=>{ if(x.orig!=null && r.values[x.orig]!==undefined) nv[names[i]] = r.values[x.orig]; });
      r.values = nv;
    });
    mo.hiddenColumns = (mo.hiddenColumns || []).map(h=>{ const i = rows.findIndex(x=>x.orig===h); return i>=0 ? names[i] : null; }).filter(Boolean);
    mo.columns = names;
    logActivity('🧩', `'${mo.label}' 배너 구좌 편집`, names.join(', '), 'banner', mo.key);
    syncChanges(); renderBannerTab(); close();
    showToast('구좌를 바꿨어요.');
  };
  openPanelModal({
    title: `구좌 편집 · ${mo.label}`,
    bodyHtml: `<p class="sub" style="margin:0 0 10px;">이름을 바꾸면 순위표의 값도 함께 옮겨가요. 지운 구좌의 값은 함께 사라져요.</p>
      <div class="edit-list" id="colEditList"></div>
      <div class="edit-add"><input type="text" id="colAddInput" placeholder="새 구좌 이름…" aria-label="새 구좌 이름"/><button type="button" id="colAddBtn">+ 추가</button></div>`,
    onMount: body=>{
      draw(body);
      const add = ()=>{ const inp = body.querySelector('#colAddInput'); const v = inp.value.trim(); if(!v) return; rows.push({orig:null, name:v}); inp.value = ''; draw(body); };
      body.querySelector('#colAddBtn').addEventListener('click', add);
      body.querySelector('#colAddInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });
    },
    actions: [
      {label:'취소'},
      {label:'저장', primary:true, onClick: (body, close)=>{
        const names = rows.map(r=> r.name.trim());
        if(names.some(n=>!n)){ showToast('비어 있는 구좌 이름이 있어요.', 'error'); return false; }
        if(new Set(names).size!==names.length){ showToast('같은 이름의 구좌가 있어요.', 'error'); return false; }
        const removed = mo.columns.filter(c=> !rows.some(r=>r.orig===c));
        if(removed.length){
          showConfirmModal(`'${removed.join("', '")}' 구좌를 지우면 해당 칸의 값도 함께 사라져요. 저장할까요?`, ()=> apply(close), null, '저장하기');
          return false;
        }
        apply(close);
        return false;
      }},
    ],
  });
}

        STATE.bannerMonths.forEach(mo=>{

          mo.preMarketingPartners.forEach(pp=>{ const v = String(pp.name ?? '').trim(); if(map[v] && map[v]!==pp.name){ pp.name = map[v]; changed++; } });
        });
        logActivity('🔤', '파트너명 매핑 변경', `${Object.keys(map).length}개 · 기존 칸 ${changed}개 적용`, 'banner');
        syncChanges(); renderActiveTab();
        showToast(changed ? `매핑을 저장하고 기존 칸 ${changed}개에 적용했어요.` : '매핑을 저장했어요.');
      }},

/* ════════════════════════════════════════════════════════════
   프리마케팅 순위 행 추가·삭제
   ════════════════════════════════════════════════════════════ */
function changePmRanks(key, delta){
  const mo = getBannerMonth(key);
  if(!mo) return;
  const existing = mo.preMarketingPartners.map(p=>p.rankInWeek||1);
  const maxRank = Math.max(6, existing.length ? Math.max(...existing) : 0, mo.pmRankCount || 0);
  if(delta > 0){
    mo.pmRankCount = maxRank + 1;
    syncChanges(); renderPmWeekPreview(key);
    return;
  }
  if(maxRank <= 6) return;
  const doRemove = ()=>{
    mo.preMarketingPartners = mo.preMarketingPartners.filter(p=> (p.rankInWeek||1) !== maxRank);
    mo.pmRankCount = maxRank - 1;
    syncChanges(); renderPmWeekPreview(key); refreshCounts();
  };
  const filled = mo.preMarketingPartners.filter(p=> (p.rankInWeek||1)===maxRank && p.name);
  if(filled.length) showConfirmModal(`${maxRank}위에 입력된 파트너 ${filled.length}곳이 함께 지워져요. 지울까요?`, doRemove);
  else doRemove();
}

/* ════════════════════════════════════════════════════════════
   월간 요약 내보내기 (한 장짜리 엑셀)
   ════════════════════════════════════════════════════════════ */
function buildMonthSummaryWorkbook(key){
  const mo = getEventMonth(key);
  const rows = [[`${mo.label} 운영 요약`], [`만든 시각: ${fmtDateTime(new Date())}`], []];
  rows.push(['■ 이벤트 상태별'], ['상태', '건수']);
  STATUS_OPTIONS.forEach(st=> rows.push([st, mo.events.filter(ev=>ev.status===st).length]));
  rows.push(['합계', mo.events.length], []);
  rows.push(['■ 마감 지연·임박 (오늘 기준)'], ['구분', '이벤트명', '이벤트ID', '기준일', 'D-day']);
  const {overdue, dueSoon} = scanDeadlines(mo.events);
  [...overdue, ...dueSoon].forEach(ev=> rows.push([ev.d<0 ? '지연' : '임박', ev.name, ev.id || '', ev.reflectStatus || ev.dueDate, ev.d<0 ? `D+${-ev.d}` : `D-${ev.d}`]));
  if(!overdue.length && !dueSoon.length) rows.push(['없음']);
  const bm = getBannerMonth(key);
  rows.push([], ['■ 배너 구좌 배정']);
  if(bm){
    rows.push(['노출순위', ...bm.columns]);
    bm.ranks.forEach((r,i)=> rows.push([i+1, ...bm.columns.map(c=> r.values[c] ?? '')]));
  }else rows.push(['이 달의 배너 시트가 없어요.']);
  rows.push([], ['■ 이번 달 종료 혜택'], ['혜택명', '문구', '작업현황', '종료일']);
  const seen = new Set();
  STATE.benefitBlocks.forEach(b=> b.items.forEach(it=>{
    if(String(it.expiryDate || '').startsWith(key) && !seen.has(it._uid)){ seen.add(it._uid); rows.push([it.name, it.copy, it.status, it.expiryDate]); }
  }));
  if(!seen.size) rows.push(['없음']);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '요약');
  return wb;
}
function exportMonthSummary(key){
  const mo = getEventMonth(key);
  if(!mo) return;
  try{
    XLSX.writeFile(buildMonthSummaryWorkbook(key), `알닷_${mo.label.replace(/\s/g,'')}_운영요약.xlsx`);
    showToast(`${mo.label} 요약을 내려받았어요.`);
  }catch(err){ showError('요약을 만드는 중 문제가 발생했어요: ' + err.message); }
}

/* ════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════ */
const isPlaceholder = v => /^\[.*\]$/.test(v);
function showSetup(msg){
  document.getElementById('appRoot').classList.add('hidden');
  document.getElementById('setupScreen').classList.remove('hidden');
  document.getElementById('setupMsg').textContent = msg || '';
}

async function startApp(){
  if(CONNECTED) return;
  CONNECTED = true;
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('appRoot').classList.remove('hidden');
  renderSavebar();
  RT_BUFFER = [];
  subscribeRealtime();
  try{
    await flushQueue(); // 지난번에 못 보낸 쓰기부터
    loadFromMaps(await fetchServerMaps());
  }catch(err){
    RT_BUFFER = null;
    showError('데이터를 불러오지 못했어요: ' + err.message + ' — 네트워크를 확인하고 새로고침해주세요.');
    return;
  }
  const buffered = RT_BUFFER; RT_BUFFER = null;
  LAST_SYNC_AT = new Date(); renderSavebar();

async function migrateState(data){

  const btn = document.getElementById('migrateBtn');

  clearError();
  try{
    if(data.uiPrefs){ try{ localStorage.setItem(UI_PREFS_KEY, JSON.stringify(data.uiPrefs)); }catch(e){ /* 무시 */ } }
    STATE = {...data, uiPrefs: data.uiPrefs || STATE.uiPrefs};
    ensureStateShape();
    SORT.clear();
    syncChanges();
    await flushQueue();
    const expected = stateToRows(STATE);
    const server = await fetchServerMaps();
    const okC = server.containers.size===expected.containers.length;
    const okR = server.records.size===expected.records.length;
    const report = `컨테이너 ${server.containers.size}/${expected.containers.length}개 · 레코드 ${server.records.size}/${expected.records.length}개`;
    if(okC && okR) showToast(`기존 데이터를 올렸어요. ${report}`);
    else showError(`올린 개수가 달라요 (DB/원본): ${report}${QUEUE.length ? ` · 아직 미전송 ${QUEUE.length}건 — 연결되면 자동으로 다시 보내요` : ''}`);
    logActivity('⬆', '기존 데이터 올리기', report, null);

    showError('기존 데이터를 올리는 중 문제가 발생했어요: ' + err.message);

}

function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const TRASH_ICON = '<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4.5A1.5 1.5 0 0 1 9.5 3h1A1.5 1.5 0 0 1 12 4.5V6M5.5 6l.6 9.4A1.5 1.5 0 0 0 7.6 17h4.8a1.5 1.5 0 0 0 1.5-1.6L14.5 6"/><path d="M8.3 9v4.5M11.7 9v4.5"/></svg>';
function nextMonthOf(key){
  const [y,m] = key.split('-').map(Number);
  let ny=y, nm=m+1; if(nm>12){nm=1; ny+=1;}
  return { key:`${ny}-${String(nm).padStart(2,'0')}`, label:`${String(ny%100).padStart(2,'0')}년 ${nm}월` };
}
function isoToDot(iso){ return iso ? iso.replaceAll('-','.') : ''; }
function dotToIso(s){
  if(!s) return '';
  const m = String(s).trim().match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})\.?$/);
  if(!m) return '';
  return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
}
function parseDueDate(s){
  const iso = dotToIso(s);
  if(!iso) return null;
  const [y,mo,d] = iso.split('-').map(Number);
  return new Date(y, mo-1, d);
}
function daysBetween(a,b){
  const A = new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const B = new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((A-B)/86400000);
}
function scanDeadlines(events, dueSoonDays=7){
  const today = new Date();
  const overdue=[], dueSoon=[];
  events.forEach(ev=>{
    if(!ev.name) return;
    if(DONE_STATUSES.has(ev.status)) return;
    const due = parseDueDate(ev.reflectStatus) || parseDueDate(ev.dueDate); // 종료일이 있으면 종료일, 없으면 시작일 기준
    if(!due) return;
    const d = daysBetween(due, today);
    if(d<0) overdue.push({...ev, d});
    else if(d<=dueSoonDays) dueSoon.push({...ev, d});
  });
  overdue.sort((a,b)=>a.d-b.d);
  dueSoon.sort((a,b)=>a.d-b.d);
  return {overdue, dueSoon};
}
function maxEventId(){
  let max = 0;
  STATE.eventMonths.forEach(mo => mo.events.forEach(ev=>{
    const s = String(ev.id||'').trim();
    if(/^\d+$/.test(s)) max = Math.max(max, parseInt(s));
  }));
  return max;
}
function defaultWeekAnchor(key){
  // 매주 목요일 오전 10시 마감 기준: 해당 월 1일 이후 첫 번째 목요일을 기본값으로 잡는다.
  // (실제 1주차 시작일은 운영 상황에 따라 달라질 수 있어, 아래 '기준일' 입력에서 직접 조정 가능)
  const [y, m] = key.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const dow = first.getDay(); // 0=일 ... 4=목
  const offset = (4 - dow + 7) % 7;
  const day = 1 + offset;
  const pad = n=>String(n).padStart(2,'0');
  return `${y}-${pad(m)}-${pad(day)}T10:00`;
}

function nextCalendarMonthKey(){
  const now = new Date();
  let ny = now.getFullYear(), nm = now.getMonth() + 2; // 다음달 (0-indexed 보정 +1, 다음달 +1)
  if(nm > 12){ nm -= 12; ny += 1; }
  return `${ny}-${String(nm).padStart(2,'0')}`;
}
function getDefaultActiveEventMonthKey(){
  const nextKey = nextCalendarMonthKey();

function getDefaultActiveBannerMonthKey(){

    if(blockedByFilter(mode)) return;
    const m = getMo(); const ev = getEv(); if(!m || !ev) return;
    const i = m.events.indexOf(ev), j = i + delta;
    if(j<0 || j>=m.events.length) return;
    [m.events[i], m.events[j]] = [m.events[j], m.events[i]];
    SORT.delete(uidVal); // 옮긴 행 하나만 이웃 사이의 중간값으로 다시 정해요
    syncChanges(); rerender();
  };

  tr.querySelectorAll('.ev-field').forEach(inp=>{
    if(inp.dataset.field==='id'){
      inp.addEventListener('focus', ()=>{ const ev = getEv(); inp.dataset.before = ev ? String(ev.id ?? '') : ''; });
      // 입력을 마칠 때 같은 달에 같은 ID가 있으면 알리고 입력 전 값으로 되돌려요
      inp.addEventListener('change', ()=>{
        const ev = getEv(); if(!ev) return;
        const dups = idOwners(inp.value, ev._uid);
        if(!dups.length) return;
        showToast(`이미 사용 중인 ID예요: ${dups.join(', ')}`, 'error');
        const before = inp.dataset.before ?? '';
        inp.value = before;
        if(String(ev.id ?? '')!==before){ ev.id = before; saveField(uidVal, 'id', before); }
        const linkBtn = tr.querySelector('.id-link-btn');
        if(linkBtn) linkBtn.disabled = !eventIdToUrl(before);
        markDupId(inp, ev);
      });
    }
    inp.addEventListener('input', ()=>{
      const ev = getEv(); if(!ev) return;
      const field = inp.dataset.field;
      const value = (field==='dueDate' || field==='reflectStatus') ? isoToDot(inp.value) : inp.value;
      if(field==='id' && idOwners(value, ev._uid).length){ markDupId(inp, ev); inp.classList.add('dup-id'); return; } // 중복 값은 저장하지 않아요
      ev[field] = value;
      if(field==='status'){
        inp.className = 'ev-field status-select ' + inp.value;
        if(mode==='current'){ renderStatusboard(); renderEventStatusFilterRow(); }
      }
      if(field==='name') inp.classList.toggle('empty-required', !inp.value.trim());
      if(field==='id'){
        const linkBtn = tr.querySelector('.id-link-btn');
        if(linkBtn) linkBtn.disabled = !eventIdToUrl(inp.value);
      }
      saveField(uidVal, field, value);
      if(field==='id') markDupId(inp, ev);
      if(MISSING_MODE && REQUIRED_EVENT_FIELDS.includes(field)) inp.classList.toggle('empty-required', isMissingField(ev, field));
      if(REQUIRED_EVENT_FIELDS.includes(field) && mode==='current') renderStatusboard();
    });
    inp.addEventListener('paste', (e)=> handleTablePaste(e, key, uidVal, inp.dataset.field, mode));
  });
  const linkBtn = tr.querySelector('.id-link-btn');
  if(linkBtn) linkBtn.addEventListener('click', ()=>{
    const ev = getEv();
    const url = ev && eventIdToUrl(ev.id);
    if(url) window.open(url, '_blank');
  });
  tr.querySelector('.del-row-btn').addEventListener('click', ()=>{
    showConfirmModal('이 행을 삭제할까요?', ()=>{
      const m = getMo(); const ev = getEv(); if(!m || !ev) return;
      const idx = m.events.indexOf(ev);
      m.events.splice(idx,1);
      selectedEventUids.delete(uidVal);
      const tUid = moveToTrash('rows', `${m.label} 이벤트 · ${ev.name||'(제목없음)'}`, [ev], {cid:'event:'+key, recKind:'event'});
      syncChanges(); rerender();
      showUndoToast(`'${ev.name||'이벤트'}' 행을 삭제했어요. 휴지통에서도 복구할 수 있어요.`, ()=>{
        const m2 = getMo(); if(!m2 || m2.events.includes(ev)) return;
        dropTrash(tUid);
        insertBySort(m2.events, ev, idx); // 같은 id·같은 순서값으로 다시 넣어요
        syncChanges(); rerender();
      });
    });
  });
  const cb = tr.querySelector('.row-checkbox');
  if(cb) cb.addEventListener('change', (e)=>{
    if(e.target.checked) selectedEventUids.add(uidVal); else selectedEventUids.delete(uidVal);
    renderBulkBar();
  });
  tr.querySelector('.move-up-btn').addEventListener('click', ()=> move(-1));
  tr.querySelector('.move-down-btn').addEventListener('click', ()=> move(1));

  if(mode==='current'){
    tr.addEventListener('dragstart', (e)=>{
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', uidVal);
      tr.classList.add('dragging');
    });
    tr.addEventListener('dragend', ()=> tr.classList.remove('dragging'));
    tr.addEventListener('dragover', (e)=>{ e.preventDefault(); tr.classList.add('drag-over'); });
    tr.addEventListener('dragleave', ()=> tr.classList.remove('drag-over'));
    tr.addEventListener('drop', (e)=>{
      e.preventDefault();
      tr.classList.remove('drag-over');
      if(blockedByFilter(mode)) return;
      const fromUid = e.dataTransfer.getData('text/plain');
      const m = getMo(); if(!m || fromUid===uidVal) return;
      const fromIdx = m.events.findIndex(x=>x._uid===fromUid);
      const toIdx = m.events.findIndex(x=>x._uid===uidVal);
      if(fromIdx<0 || toIdx<0) return;
      const [moved] = m.events.splice(fromIdx,1);
      m.events.splice(toIdx,0,moved);
      SORT.delete(fromUid);
      syncChanges(); rerender();
    });
  }
}

function handleTablePaste(e, key, startUid, startField, mode){
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if(!text || !/[\t\n]/.test(text)) return; // 단일 셀 값이면 기본 붙여넣기 동작에 맡긴다
  e.preventDefault();
  if(blockedByFilter(mode)) return;
  const mo = getEventMonth(key);
  if(!mo) return;
  const startIdx = mo.events.findIndex(ev=>ev._uid===startUid);
  if(startIdx<0) return;
  const rows = text.replace(/\r/g,'').split('\n').filter((r,i,arr)=> !(i===arr.length-1 && r==='')).map(r=>r.split('\t'));
  // 화면에 숨긴 컬럼은 붙여넣기 대상에서도 건너뛴다 (보이는 순서와 실제로 채워지는 순서를 맞추기 위해)
  const fieldOrder = visibleEventColumns().map(c=>c.key);
  const startFieldIdx = fieldOrder.indexOf(startField);
  if(startFieldIdx===-1) return;
  const rerender = mode==='current'
    ? ()=>{ renderEventsRows(); renderStatusboard(); renderEventStatusFilterRow(); }
    : ()=> renderHistoryMonthTable(key);

  const snapshot = []; // 덮어쓰기 전 원래 값 (실행취소용)
  const dupSkipped = [];
  rows.forEach((cols, rOffset)=>{
    let targetEv = mo.events[startIdx + rOffset];
    let isNew = false;
    if(!targetEv){
      targetEv = newEventRow();
      mo.events.push(targetEv);
      isNew = true;
    }
    snapshot.push({ uid: targetEv._uid, isNew, before: isNew ? null : {...targetEv} });
    cols.forEach((val, cOffset)=>{
      const field = fieldOrder[startFieldIdx + cOffset];
      if(!field) return;
      const v = val.trim();
      // 같은 달(이번에 붙여넣은 행 포함)에 이미 있는 이벤트ID는 넣지 않고 원래 값을 둬요
      if(field==='id' && idOwners(v, targetEv._uid).length){ dupSkipped.push(`${startIdx+rOffset+1}행 '${v}'`); return; }
      targetEv[field] = v;
    });
  });
  syncChanges();
  rerender();
  if(dupSkipped.length) showToast(`이미 사용 중인 ID라 넣지 않았어요: ${dupSkipped.join(', ')}`, 'error');
  showUndoToast(`${rows.length}행을 붙여넣었어요. (자동 반영된 내용이니 한 번 확인해주세요)`, ()=>{
    // 새로 만든 행은 제거하고, 기존 행은 붙여넣기 전 값으로 되돌린다
    const m = getEventMonth(key); if(!m) return;
    snapshot.forEach(s=>{
      const i = m.events.findIndex(ev=>ev._uid===s.uid);
      if(i<0) return;
      if(s.isNew) m.events.splice(i,1);
      else Object.assign(m.events[i], s.before);
    });
    syncChanges(); rerender();
  });
}

function renderBulkBar(){
  const holder = document.getElementById('bulkBarHolder');
  if(!holder) return;
  const mo = getEventMonth(activeEventMonthKey);
  if(mo){ const live = new Set(mo.events.map(ev=>ev._uid)); selectedEventUids.forEach(u=>{ if(!live.has(u)) selectedEventUids.delete(u); }); }
  if(!selectedEventUids.size){ holder.innerHTML=''; return; }
  const statusBtns = STATUS_OPTIONS.map(s=>`<button class="sm bulk-status-btn" data-status="${s}">${s}로 변경</button>`).join('');
  holder.innerHTML = `
    <div class="bulk-bar">
      <span class="bulk-count">${selectedEventUids.size}건 선택됨</span>
      <div class="bulk-actions">
        ${statusBtns}
        <button class="sm bulk-delete-btn" style="color:var(--fatal);">🗑️ 선택 삭제</button>
      </div>
    </div>
  `;
  holder.querySelectorAll('.bulk-status-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const mo = getEventMonth(activeEventMonthKey);
      const count = selectedEventUids.size;
      mo.events.forEach(ev=>{ if(selectedEventUids.has(ev._uid)) ev.status = btn.dataset.status; });
      logActivity('☑️', `이벤트 ${count}건 상태를 '${btn.dataset.status}'로 일괄 변경`, mo.label, 'events', mo.key);
      syncChanges(); renderEventsRows(); renderStatusboard(); renderEventStatusFilterRow();
      showToast(`${count}건을 '${btn.dataset.status}' 상태로 바꿨어요.`);
    });
  });
  holder.querySelector('.bulk-delete-btn').addEventListener('click', ()=>{
    const count = selectedEventUids.size;
    showConfirmModal(`선택한 ${count}건을 삭제할까요?`, ()=>{
      const mo = getEventMonth(activeEventMonthKey);
      const removedRows = mo.events.filter(ev=> selectedEventUids.has(ev._uid));
      mo.events = mo.events.filter(ev=> !selectedEventUids.has(ev._uid));
      moveToTrash('rows', `${mo.label} 이벤트 ${removedRows.length}건 (일괄 삭제)`, removedRows, {cid:'event:'+mo.key, recKind:'event'});
      selectedEventUids = new Set();
      logActivity('🗑️', `이벤트 ${count}건 일괄 삭제`, mo.label, 'events', mo.key);
      syncChanges(); renderEventsRows(); renderStatusboard(); renderEventStatusFilterRow();
    });
  });
}

// 이벤트·배너(프리마케팅)·혜택의 다음 달을 한 번에 만들어요. Ctrl+Z 한 번으로 모두 되돌려요.
function addAllNextMonths(){
  const prev = SHADOW, before = UNDO.length;
  const made = [];
  UNDO_OFF = true;
  try{
    if(addNewEventMonth(true)) made.push(`이벤트 ${getEventMonth(activeEventMonthKey).label}`);
    if(addNewBannerMonth(true)) made.push(`배너·프리마케팅 ${getBannerMonth(activeBannerMonthKey).label}`);
    if(addNewBenefitMonth(true)) made.push(`혜택 ${formatBenefitLabel(STATE.benefitBlocks[0].label)}`);
  }finally{ UNDO_OFF = false; }
  const op = diffRows(prev, SHADOW);
  if(op && UNDO.length===before) recordUndo(op, prev);
  renderActiveTab();
  if(made.length) showToast(`새 달을 만들었어요: ${made.join(', ')}`);
  else showToast('다음 달이 이미 모두 있어요.', 'error');
}
function addNewEventMonth(silent){
  const last = STATE.eventMonths[STATE.eventMonths.length-1];
  const {key, label} = nextMonthOf(last.key);
  if(STATE.eventMonths.some(m=>m.key===key)){ if(!silent) showError(`'${label}' 은 이미 있어요.`); return false; }
  const carried = last.events.filter(ev=>CARRY_STATUSES.has(ev.status)).map(ev=>({...ev, _uid:uid()}));
  STATE.eventMonths.push({key, label, events: carried});
  activeEventMonthKey = key;
  logActivity('📅', `'${label}' 이벤트 시트 생성`, `연장 항목 ${carried.length}건 자동 이월`, 'events', key);
  syncChanges();
  if(silent) return true;
  renderEventsTab();
  showToast(`'${label}' 시트를 만들었어요. "연장" 상태였던 ${carried.length}건이 자동으로 이월되었습니다.`);
}

// 이력 아코디언 헤더의 "이 달을 현재로 보기" 버튼 (이벤트·배너·프리마케팅·혜택)
// 고른 달을 현재로 두고, 그보다 최신인 달(혜택은 앞쪽 블록)은 휴지통으로 옮겨요
function setCurrentDroppingLater(kind, key){
  const isBenefit = kind==='benefit';
  const list = {event:STATE.eventMonths, banner:STATE.bannerMonths, benefit:STATE.benefitBlocks}[kind];
  const idx = list.findIndex(x=> isBenefit ? x._blockUid===key : x.key===key);
  if(idx<0) return;
  const labelOf = x=> isBenefit ? formatBenefitLabel(x.label) : x.label;
  const target = list[idx];
  const later = isBenefit ? list.slice(0, idx) : list.filter(m=> m.key > key);
  const setActive = ()=>{ if(kind==='event') activeEventMonthKey = key; else if(kind==='banner') activeBannerMonthKey = key; };
  if(!later.length){ setActive(); renderActiveTab(); return; }
  const shared = kind==='banner' ? ' 배너·프리마케팅 데이터가 함께 삭제돼요.' : '';
  showConfirmModal(`'${labelOf(target)}'을(를) 현재로 설정하면 이후 달(${later.map(labelOf).join(', ')}) 데이터가 삭제돼요.${shared} 계속할까요?`, ()=>{
    UNDO_VIEW = viewState();
    later.forEach((x, j)=>{
      list.splice(list.indexOf(x), 1);
      if(kind==='event') moveToTrash('event_month', `${x.label} 이벤트 달 (${x.events.length}건)`, x);
      else if(kind==='banner') moveToTrash('banner_month', `${x.label} 배너·프리마케팅 달`, x);
      else moveToTrash('benefit_block', `${labelOf(x)} 혜택 블록 (${x.items.length}건)`, x, {index: j});
    });
    logActivity('📌', `'${labelOf(target)}'을(를) 현재로 설정`, `이후 ${later.map(labelOf).join(', ')} 삭제`, {event:'events', banner:'banner', benefit:'benefit'}[kind], isBenefit ? null : key);
    setActive();
    syncChanges();
    UNDO_VIEW = null;
    renderActiveTab();
    showToast(`'${labelOf(target)}'을(를) 현재로 설정했어요. 지운 달은 휴지통에 있고, Ctrl+Z로 되돌릴 수 있어요.`);
  });
}
function setCurrentBtnHtml(key){ return `<button class="ghost sm set-current-btn" data-key="${key}">이 달을 현재로 보기</button>`; }

function renderBannerHistoryAccordion(otherMonths){
  const holder = document.getElementById('bannerHistoryAccordion');
  if(!holder) return;
  if(!otherMonths.length){
    holder.innerHTML = `<div class="empty-state" style="padding:24px;"><div class="big">🗂️</div>아직 다른 달 이력이 없어요.</div>`;
    return;
  }
  holder.innerHTML = otherMonths.map(mo=>{
    const isOpen = expandedBannerMonths.has(mo.key);
    return `
    <div class="benefit-block" data-key="${mo.key}">
      <div class="bb-head accordion-toggle" data-key="${mo.key}" role="button" tabindex="0" aria-expanded="${isOpen}">
        <span class="bb-title">
          <span class="accordion-chevron">${isOpen?'▾':'▸'}</span>
          ${escapeHtml(mo.label)}
          <span style="color:var(--muted); font-weight:400; font-size:11.5px;" data-count="banner" data-count-id="${mo.key}">· ${mo.ranks.length}건</span>
        </span>
        <span>
          ${setCurrentBtnHtml(mo.key)}
          <button class="ghost sm del-banner-month-btn icon-btn" data-key="${mo.key}" title="이 달 삭제">${TRASH_ICON}</button>
        </span>
      </div>
      <div class="event-history-body ${isOpen?'':'hidden'}">
        <div class="tblwrap">
          <table class="edittable" id="bHistTable_${mo.key}"></table>
        </div>
      </div>
    </div>`;
  }).join('');

  holder.querySelectorAll('.accordion-toggle').forEach(head=>{
    head.addEventListener('click', (e)=>{
      if(e.target.closest('button')) return;
      const key = head.dataset.key;
      if(expandedBannerMonths.has(key)) expandedBannerMonths.delete(key);
      else expandedBannerMonths.add(key);
      renderBannerHistoryAccordion(otherMonths);
    });
  });
  holder.querySelectorAll('.set-current-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); setCurrentDroppingLater('banner', btn.dataset.key); });
  });
  holder.querySelectorAll('.del-banner-month-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = btn.dataset.key;
      const mo = getBannerMonth(key);
      showConfirmModal(`'${mo.label}' 배너 구좌 데이터를 삭제할까요?`, ()=>{
        const idx = STATE.bannerMonths.findIndex(m=>m.key===key);
        if(idx<0) return;
        const removed = STATE.bannerMonths[idx];
        STATE.bannerMonths.splice(idx,1);
        expandedBannerMonths.delete(key);
        const tUid = moveToTrash('banner_month', `${removed.label} 배너·프리마케팅 달`, removed);
        syncChanges(); renderBannerTab();
        showUndoToast(`'${mo.label}' 배너 구좌 데이터를 삭제했어요. 휴지통에서도 복구할 수 있어요.`, ()=>{
          if(getBannerMonth(removed.key)) return;
          dropTrash(tUid);
          STATE.bannerMonths.push(removed);
          STATE.bannerMonths.sort((a,b)=> a.key<b.key?-1:1);
          syncChanges(); renderBannerTab();
        });
      });
    });
  });

  otherMonths.forEach(mo=>{ if(expandedBannerMonths.has(mo.key)) renderBannerHistoryTable(mo.key); });
}

function bannerRowHtml(r, idx, cols, mode){
  const current = mode==='current';
  return `
      <tr data-uid="${escapeHtml(r._uid)}" ${current?'draggable="true"':''}>
        <td ${current?'class="drag-handle" title="드래그해서 순위 변경"':''}>
          <div class="order-cell">
            <span class="order-badge">${idx+1}</span>
            <span class="order-arrows">
              <button class="move-up-btn" title="위로">▲</button>
              <button class="move-down-btn" title="아래로">▼</button>
            </span>
          </div>
        </td>
        ${cols.map(col=>`<td><input type="text" class="bn-field" data-col="${escapeHtml(col)}" value="${escapeHtml(r.values[col]||'')}"/></td>`).join('')}
        <td><button class="ghost del-row-btn icon-btn" title="행 삭제" aria-label="행 삭제">${TRASH_ICON}</button></td>
      </tr>`;
}
function bannerVisibleCols(mo){ const hidden = mo.hiddenColumns||[]; return mo.columns.filter(c=>!hidden.includes(c)); }

function bindBannerRow(tr, key, mode, rerender){
  const uidVal = tr.dataset.uid;
  const getMo = ()=> getBannerMonth(key);
  const getRank = ()=>{ const m = getMo(); return m ? m.ranks.find(r=>r._uid===uidVal) : null; };
  const move = (delta)=>{
    const m = getMo(); const r = getRank(); if(!m || !r) return;
    const i = m.ranks.indexOf(r), j = i + delta;
    if(j<0 || j>=m.ranks.length) return;
    [m.ranks[i], m.ranks[j]] = [m.ranks[j], m.ranks[i]];
    SORT.delete(uidVal);
    syncChanges(); rerender();
  };
  tr.querySelectorAll('.bn-field').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const r = getRank(); if(!r) return;
      r.values[inp.dataset.col] = inp.value;
      saveField(uidVal, inp.dataset.col, inp.value);
    });
    inp.addEventListener('blur', ()=>{
      const mapped = applyPartnerNameMap(inp.value);
      const r = getRank();
      if(r && mapped !== inp.value){
        inp.value = mapped;
        r.values[inp.dataset.col] = mapped;
        saveField(uidVal, inp.dataset.col, mapped);
      }
    });
  });
  tr.querySelector('.del-row-btn').addEventListener('click', ()=>{
    showConfirmModal('이 순위 행을 삭제할까요?', ()=>{
      const m = getMo(); const r = getRank(); if(!m || !r) return;
      const idx = m.ranks.indexOf(r);
      m.ranks.splice(idx,1);
      const tUid = moveToTrash('rows', `${m.label} 배너 ${idx+1}위 행`, [r], {cid:'banner:'+key, recKind:'banner_rank'});
      syncChanges(); rerender();
      showUndoToast('순위 행을 삭제했어요. 휴지통에서도 복구할 수 있어요.', ()=>{
        const m2 = getMo(); if(!m2 || m2.ranks.includes(r)) return;
        dropTrash(tUid);
        insertBySort(m2.ranks, r, idx); syncChanges(); rerender();
      });
    });
  });
  tr.querySelector('.move-up-btn').addEventListener('click', ()=> move(-1));
  tr.querySelector('.move-down-btn').addEventListener('click', ()=> move(1));
  if(mode==='current'){
    tr.addEventListener('dragstart', (e)=>{
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', uidVal);
      tr.classList.add('dragging');
    });
    tr.addEventListener('dragend', ()=> tr.classList.remove('dragging'));
    tr.addEventListener('dragover', (e)=>{ e.preventDefault(); tr.classList.add('drag-over'); });
    tr.addEventListener('dragleave', ()=> tr.classList.remove('drag-over'));
    tr.addEventListener('drop', (e)=>{
      e.preventDefault();
      tr.classList.remove('drag-over');
      const fromUid = e.dataTransfer.getData('text/plain');
      const m = getMo(); if(!m || fromUid===uidVal) return;
      const fromIdx = m.ranks.findIndex(x=>x._uid===fromUid);
      const toIdx = m.ranks.findIndex(x=>x._uid===uidVal);
      if(fromIdx<0 || toIdx<0) return;
      const [moved] = m.ranks.splice(fromIdx,1);
      m.ranks.splice(toIdx,0,moved);
      SORT.delete(fromUid);
      syncChanges(); rerender();
    });
  }
}

// 배너 순위표 (현재 달·이력 공용). thead는 매번 새로 그리고, tbody는 입력 중인 행을 지키며 채워요.
function renderBannerTable(table, key, mode){
  const mo = getBannerMonth(key);
  if(!mo || !table) return;
  const visibleCols = bannerVisibleCols(mo);
  if(!table.tHead) table.innerHTML = '<thead></thead><tbody></tbody>';
  const tools = mode==='current' ? `<th class="th-tools"><button type="button" class="ghost sm" data-tool="cols">구좌 편집</button><button type="button" class="ghost sm" data-tool="map">파트너명</button></th>` : '<th></th>';
  table.tHead.innerHTML = `<tr><th style="width:70px;">순서</th>${visibleCols.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}${tools}</tr>`;
  if(mode==='current'){
    table.tHead.querySelector('[data-tool="cols"]').addEventListener('click', ()=> openColumnsEditor(key));
    table.tHead.querySelector('[data-tool="map"]').addEventListener('click', openPartnerMapEditor);
  }
  const emptyMsg = mode==='current'
    ? `<div class="empty-state"><div class="big">🎏</div>등록된 순위가 없어요. “순위 행 추가하기”를 눌러 시작하세요.</div>`
    : `<div class="empty-state" style="padding:20px;">등록된 순위가 없어요.</div>`;
  const html = mo.ranks.length
    ? mo.ranks.map((r,idx)=> bannerRowHtml(r, idx, visibleCols, mode)).join('')
    : `<tr><td colspan="${visibleCols.length+2}">${emptyMsg}</td></tr>`;
  const rerender = ()=> renderBannerTable(table, key, mode);
  fillTbody(table.tBodies[0], {
    cid:'banner:'+key, html, rerender,
    rowFor: uidVal=>{ const m = getBannerMonth(key); const i = m ? m.ranks.findIndex(r=>r._uid===uidVal) : -1; return i<0 ? null : bannerRowHtml(m.ranks[i], i, bannerVisibleCols(m), mode); },
    bind: tr=> bindBannerRow(tr, key, mode, rerender),
  });
}
function renderBannerHistoryTable(key){ renderBannerTable(document.getElementById('bHistTable_'+key), key, 'history'); }
function renderBannerRows(){ renderBannerTable(document.getElementById('bannerTable'), activeBannerMonthKey, 'current'); }

function addNewBannerMonth(silent){
  const last = STATE.bannerMonths[STATE.bannerMonths.length-1];
  const {key, label} = nextMonthOf(last.key);
  if(STATE.bannerMonths.some(m=>m.key===key)){ if(!silent) showError(`'${label}' 은 이미 있어요.`); return false; }
  const ranks = last.ranks.map(r=>({_uid:uid(), values:{...r.values}}));
  const partners = (last.partners||[]).map(p=>({...p}));
  const preMarketingPartners = (last.preMarketingPartners||[]).map(p=>({...p, _uid:uid()}));
  STATE.bannerMonths.push({key, label, columns: last.columns.slice(), ranks, partners, preMarketingPartners, cycleWeeks: last.cycleWeeks||4, weekAnchor: defaultWeekAnchor(key), changeLog: []});
  activeBannerMonthKey = key;
  logActivity('🏷️', `'${label}' 배너 구좌 새 달 생성`, '이전 달 구성 복사', 'banner', key);
  syncChanges();
  if(silent) return true;
  renderBannerTab();
}

/* ════════════════════════════════════════════════════════════
   주차 계산 공통 함수
   ════════════════════════════════════════════════════════════ */
function computeCurrentWeek(mo){
  const anchor = new Date((mo.weekAnchor||'').replace(' ','T'));
  if(isNaN(anchor.getTime())) return 1;
  const now = new Date();
  const diffDays = (now - anchor) / 86400000;
  const cycle = mo.cycleWeeks || 4;
  return Math.max(1, Math.min(cycle, 1 + Math.floor(diffDays/7)));
}

/* ════════════════════════════════════════════════════════════
   프리마케팅 배너 수동 관리 (아코디언)
   ════════════════════════════════════════════════════════════ */
function applyPartnerNameMap(name){
  if(!name) return name;
  const trimmed = name.trim();
  const map = STATE.partnerNameMap || {};
  return map[trimmed] || name;
}

function renderPmStatusGrid(key){
  const mo = getBannerMonth(key);
  const holder = document.getElementById('pmStatusGridHolder_'+key);
  if(!mo || !holder) return;

  const cycleWeeks = mo.cycleWeeks || 4;
  const week = computeCurrentWeek(mo);
  const anchor = new Date((mo.weekAnchor||'').replace(' ','T'));
  // 게재 마감 = 기준일시 + 현재 주차 × 7일
  const deadline = !isNaN(anchor.getTime()) ? new Date(anchor.getTime() + week*7*86400000) : null;
  const now = new Date();
  const isPast = !!deadline && now >= deadline;
  const fmtDT = (d)=> !d || isNaN(d.getTime()) ? '-' : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const statusText = !deadline ? '-' : isPast ? '마감 지남' : `마감 전 D-${daysBetween(deadline, now)}`;
  const anchorInputVal = (mo.weekAnchor||'').slice(0,16);

  holder.innerHTML = `
    <div class="pm-status-grid">
      <div class="pm-status-item">
        <label>기준일시</label>
        <input type="datetime-local" id="pmAnchorInput_${key}" value="${anchorInputVal}"/>
      </div>
      <div class="pm-status-item">
        <label>배치 주기</label>
        <input type="number" id="pmCycleInput_${key}" min="1" max="12" value="${cycleWeeks}"/>
      </div>
      <div class="pm-status-item">
        <label>현재 관리 주차</label>
        <div class="pm-readonly">${week}주차</div>
      </div>
      <div class="pm-status-item">
        <label>게재 마감</label>
        <div class="pm-readonly">${fmtDT(deadline)}</div>
      </div>
      <div class="pm-status-item">
        <label>게재 상태</label>
        <div class="pm-readonly ${isPast?'badge-live':'badge-ready'}">${statusText}</div>
      </div>
    </div>
  `;

  const pmAnchorInp = document.getElementById('pmAnchorInput_'+key);
  if(pmAnchorInp) pmAnchorInp.addEventListener('change', (e)=>{
    mo.weekAnchor = e.target.value;
    syncChanges(); renderPmStatusGrid(key); renderPmWeekPreview(key);
  });
  const pmCycleInp = document.getElementById('pmCycleInput_'+key);
  if(pmCycleInp) pmCycleInp.addEventListener('change', (e)=>{
    const v = Math.max(1, Math.min(12, parseInt(e.target.value)||4));
    mo.cycleWeeks = v;
    syncChanges(); renderPmStatusGrid(key); renderPmWeekPreview(key);
  });
}

function renderPmWeekPreview(key){
  const mo = getBannerMonth(key);
  const holder = document.getElementById('pmWeekPreviewHolder_'+key);
  if(!mo || !holder) return;
  if(!mo.preMarketingPartners) mo.preMarketingPartners = [];

  const cycleWeeks = mo.cycleWeeks || 4;
  const existingRanks = mo.preMarketingPartners.map(p=>p.rankInWeek||1);
  const maxRank = Math.max(6, existingRanks.length ? Math.max(...existingRanks) : 0, mo.pmRankCount || 0);
  const currentWeek = computeCurrentWeek(mo);

  let headCols = '';
  for(let w=1; w<=cycleWeeks; w++) headCols += `<th>${w}주차${w===currentWeek?' · 진행중':''}</th>`;

  let rows = '';
  for(let rk=1; rk<=maxRank; rk++){
    rows += `<tr data-uid="pm:${key}:${rk}"><td><span class="order-badge">${rk}</span></td>`;
    for(let w=1; w<=cycleWeeks; w++){
      const entry = mo.preMarketingPartners.find(p=>p.week===w && p.rankInWeek===rk);
      const name = entry ? (entry.name||'') : '';
      rows += `<td><input type="text" class="pm-week-input" data-week="${w}" data-rank="${rk}" value="${escapeHtml(name)}" placeholder="파트너사명"/></td>`;
    }
    rows += `</tr>`;
  }

  if(!holder.querySelector('table')){
    const isCurrent = key===activeBannerMonthKey; // 이력(지난 달)에는 순위 버튼을 두지 않아요
    holder.innerHTML = `<div class="tblwrap"><table class="edittable"><thead></thead><tbody></tbody></table></div>`
      + (isCurrent ? `<div class="pm-rank-actions"><button type="button" class="sm pm-del-rank">마지막 순위 지우기</button></div>` : '');
    if(isCurrent) holder.querySelector('.pm-del-rank').addEventListener('click', ()=> changePmRanks(key, -1));
  }
  const delRank = holder.querySelector('.pm-del-rank');
  if(delRank) delRank.disabled = maxRank <= 6;
  const table = holder.querySelector('table');
  table.tHead.innerHTML = `<tr><th style="width:60px;">순위</th>${headCols}</tr>`;
  fillTbody(table.tBodies[0], {
    cid:'banner:'+key, html: rows,
    rerender: ()=> renderPmWeekPreview(key),
    rowFor: ()=> null, // 격자 행은 레코드와 1:1이 아니라서 격자 전체를 다시 그려요
    bind: tr=> bindPmRow(tr, key),
  });
}
function bindPmRow(tr, key){
  tr.querySelectorAll('.pm-week-input').forEach(inp=>{
    const w = +inp.dataset.week, rk = +inp.dataset.rank;
    const findEntry = ()=>{ const m = getBannerMonth(key); return m ? m.preMarketingPartners.find(p=>p.week===w && p.rankInWeek===rk) : null; };
    inp.addEventListener('input', ()=>{
      const mo = getBannerMonth(key); if(!mo) return;
      let entry = findEntry();
      if(!entry){
        entry = {_uid:uid(), name:inp.value, week:w, rankInWeek:rk};
        mo.preMarketingPartners.push(entry);
        syncChanges(); // 새 칸은 행 추가(insert)
      }else{
        entry.name = inp.value;
        saveField(entry._uid, 'name', entry.name);
      }
    });
    inp.addEventListener('blur', ()=>{
      const mapped = applyPartnerNameMap(inp.value);
      const entry = findEntry();
      if(entry && mapped !== inp.value){
        inp.value = mapped;
        entry.name = mapped;
        saveField(entry._uid, 'name', mapped);
      }
    });
  });
}

let expandedPmMonths = new Set();

function renderPmTab(){
  if(!activeBannerMonthKey || !getBannerMonth(activeBannerMonthKey)) activeBannerMonthKey = getDefaultActiveBannerMonthKey();
  const container = document.getElementById('tab-pm');

      <div id="pmWeekPreviewHolder_${currentMo.key}"></div>

  document.getElementById('addPmRowBtn').addEventListener('click', ()=> changePmRanks(currentMo.key, +1));
  // 프리마케팅은 배너 구좌와 같은 달 데이터를 써요. 새 달을 만들면 배너 구좌 탭에도 같은 달이 생겨요.

  });

  const convertBtn = document.getElementById('convertPmRawBtn');

  if(convertBtn && rawInput){

function renderPmHistoryAccordion(otherMonths){
  const holder = document.getElementById('pmHistoryAccordion');
  if(!holder) return;
  if(!otherMonths.length){
    holder.innerHTML = `<div class="empty-state" style="padding:24px;"><div class="big">🗂️</div>아직 다른 달 이력이 없어요.</div>`;
    return;
  }

/* ════════════════════════════════════════════════════════════
   렌더: 혜택 관리 탭 (블록은 배열 index 0 = 최신)
   ════════════════════════════════════════════════════════════ */
function benefitExpiryStyle(expiryDate){
  if(!expiryDate) return {style:'', title:'혜택 종료일 (선택)'};
  const [y,m,d] = expiryDate.split('-').map(Number);
  if(!y) return {style:'', title:'혜택 종료일'};
  const exp = new Date(y, m-1, d);
  const today = new Date();
  const days = Math.round((new Date(exp.getFullYear(),exp.getMonth(),exp.getDate()) - new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
  if(days < 0) return {style:`background:var(--fatal-soft); border-color:var(--fatal-border); color:var(--fatal-text);`, title:`${Math.abs(days)}일 지난 혜택이에요. 종료 처리해주세요.`};
  if(days <= 7) return {style:`background:var(--minor-soft); border-color:var(--minor-border); color:var(--minor-text);`, title:`${days===0?'오늘 만료':`D-${days}`} — 곧 종료돼요.`};
  return {style:'', title:'혜택 종료일'};
}

  const move = (delta)=>{
    const b = getBenefitBlock(blockUid); const it = getItem(); if(!b || !it) return;
    const i = b.items.indexOf(it), j = i + delta;
    if(j<0 || j>=b.items.length) return;
    [b.items[i], b.items[j]] = [b.items[j], b.items[i]];
    SORT.delete(uidVal);
    syncChanges(); rerender();
  };
  tr.querySelectorAll('.bf-field').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const it = getItem(); if(!it) return;
      it[inp.dataset.field] = inp.value;

  tr.querySelector('.del-benefit-item-btn').addEventListener('click', ()=>{

// 가장 최근 혜택 블록(benefitBlocks[0])의 이름에서 'YY년 M월' 또는 'M월'을 읽어요. 못 읽으면 null.
function benefitBlockMonthKey(label){
  const m = String(label||'').match(/(?:(\d{2,4})년\s*)?(\d{1,2})월/);
  if(!m) return null;
  const mm = +m[2];
  if(mm<1 || mm>12) return null;
  const y = m[1] ? (m[1].length===2 ? 2000 + +m[1] : +m[1]) : new Date().getFullYear();
  return `${y}-${String(mm).padStart(2,'0')}`;
}

function addNewBenefitMonth(silent){
  const copyFrom = STATE.benefitBlocks[0];
  const baseKey = (copyFrom && benefitBlockMonthKey(copyFrom.label)) || null;
  // 기준: 최근 블록의 월 +1. 월을 해석할 수 없으면 오늘 +1개월
  const { label: nextLabel } = baseKey ? nextMonthOf(baseKey) : nextMonthOf(`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`);

  if(STATE.benefitBlocks.some(b=>b.label===nextLabel)){
    if(!silent) showError(`'${nextLabel}' 블록은 이미 있어요.`);
    return false;
  }
  const items = copyFrom ? copyFrom.items.map(it=>({...it, _uid:uid()})) : [];
  const newBlockUid = uid();
  STATE.benefitBlocks.unshift({label: nextLabel, items, _blockUid: newBlockUid});
  logActivity('🎁', `'${nextLabel}' 혜택 블록 생성`, copyFrom ? '이전 블록 항목 복사' : '', 'benefit');
  syncChanges();
  if(silent) return true;
  renderBenefitTab();
  showToast(`'${nextLabel}' 혜택 블록을 만들었어요. ${copyFrom ? '이전 블록 항목을 그대로 복사했어요.' : ''}`);
}

function formatBenefitLabel(label){
  if(!label) return label;
  if(label.includes('년')) return label; // 이미 'OO년 O월' 형식
  const m = label.match(/^(\d{1,2})월$/);
  if(m){
    const evMonth = getEventMonth(activeEventMonthKey);
    const yy = evMonth ? evMonth.key.slice(2,4) : String(new Date().getFullYear()).slice(-2);
    return `${yy}년 ${m[1]}월`;
  }
  return label;
}

const LEGACY_FIELD_MAP = {
  name: ['이벤트명','이벤트및컨텐츠명'],
  priority: ['우선순위'],
  status: ['작업상태','상태','퍼블리싱','진행상태'],

};
function normHeaderText(s){ return s==null ? '' : String(s).replace(/\s/g,'').toLowerCase(); }

function detectEventSheetLayout(grid){
  let bestRow = null, bestCount = 0, bestFieldCols = null;
  for(let r=1; r<=Math.min(20, grid.length); r++){
    const row = grid[r-1] || [];
    const fieldCols = {};
    let count = 0;
    row.forEach((cellVal, idx)=>{
      const norm = normHeaderText(cellVal);
      if(!norm || norm.length>20) return;
      // 한 칸은 한 필드에만 연결해요 ('작업상태'가 '작업'(작업유형)에도 걸리지 않도록)
      for(const [field, variants] of Object.entries(LEGACY_FIELD_MAP)){
        if(fieldCols[field]) continue;
        if(variants.some(v=> norm===v || norm.startsWith(v))){ fieldCols[field] = idx+1; count++; break; }
      }
    });
    if(count > bestCount){ bestCount = count; bestRow = r; bestFieldCols = fieldCols; }
  }
  if(bestCount < 2 || !bestFieldCols || !bestFieldCols.name) return null;
  return { headerRow: bestRow, fieldCols: bestFieldCols };
}
function normalizeDateValue(v){
  if(v===null || v===undefined || v==='') return '';
  if(typeof v === 'number' && v > 20000 && v < 60000){
    try{
      const d = XLSX.SSF.parse_date_code(v);
      if(d && d.y) return `${d.y}.${String(d.m).padStart(2,'0')}.${String(d.d).padStart(2,'0')}`;
    }catch(e){ /* 변환 실패 시 원본 값 그대로 사용 */ }
  }
  return String(v);
}

  { key:'메인 팝업', match:['메인팝업'] },
  { key:'메인 상단', match:['메인상단배너','메인상단'] },
  { key:'메인 하단', match:['메인하단배너','메인하단'] },
  { key:'GNB검색배너', match:['GNB검색배너','GNB검색'] },
  { key:'더 받을 수 있는 쿠폰', match:['더받을수있는쿠폰'] },
  { key:'요금제 배너', match:['요금제배너'] },
];
const FULL_COMBO = '메인팝업,메인상단,메인하단,이벤트페이지,썸네일';
const REDUCED_COMBO = '메인상단, 메인하단,이벤트페이지,썸네일';

function normHeader(s){ return s==null ? '' : String(s).replace(/\s/g,''); }
function findColByText(grid, row, matchTexts){
  const arr = grid[row-1] || [];
  for(let c=0;c<arr.length;c++){
    const v = normHeader(arr[c]);
    if(!v) continue;
    for(const m of matchTexts){ if(v.includes(m)) return c+1; }
  }
  return null;
}
function findRowByColBText(grid, text, fromRow=1){
  for(let r=fromRow;r<=grid.length;r++){
    const v = grid[r-1] && grid[r-1][1]; // 컬럼 B
    if(typeof v==='string' && v.replace(/\s/g,'').includes(text)) return r;
  }
  return null;
}

function findLatestRawSheet(wb){
  const candidates = wb.SheetNames
    .map(n=>({name:n, m:n.match(RAW_SHEET_RE)}))
    .filter(x=>x.m)
    .map(x=>({name:x.name, y:+x.m[1], mo:+x.m[2]}));
  if(!candidates.length) return null;
  candidates.sort((a,b)=> (a.y-b.y) || (a.mo-b.mo));
  return candidates[candidates.length-1];
}

function parseRawBannerPlan(wb, sheetInfo){
  const ws = wb.Sheets[sheetInfo.name];
  const grid = sheetToGrid(ws);
  // 주차 배정은 대상 월의 배치 주기를 따라요 (없으면 4주)
  const targetMo = getBannerMonth(`${sheetInfo.y}-${String(sheetInfo.mo).padStart(2,'0')}`);
  const cycle = (targetMo && targetMo.cycleWeeks) || 4;

  // 1) 구좌별 컬럼 위치 찾기 (헤더 텍스트 기반, 매달 컬럼 순서가 달라도 안전)
  const slotCols = [];
  BANNER_SLOT_DEFS.forEach(def=>{
    const col = findColByText(grid, 4, def.match);
    if(col) slotCols.push({ ...def, col });
  });

  // 2) 변경사항(운영방식) 행 찾기
  const changeRow = findRowByColBText(grid, '변경사항');

  // 3) 01. 구좌 운영 기준
  const criteria = slotCols.map(sc=>({
    name: sc.key,
    maxExposure: cellAt(grid,5,sc.col) || '-',
    preMarketing: cellAt(grid,6,sc.col) || '-',
    operation: (changeRow ? cellAt(grid,changeRow,sc.col) : null) || '고정/수시 운영',
    note: '',
  }));

  // 4) 02. 노출 순위별 배정 현황 (컬럼별 값 그대로 전사 — 원본에 없는 신규 파트너는 사람이 채워야 함)
  const rankStartRow = findRowByColBText(grid, '노출순위') || findRowByColBText(grid, '노출 순위');
  const ranks = [];
  if(rankStartRow){
    let r = rankStartRow, blank = 0;
    while(r<=grid.length){
      const rowVals = {};
      let hasAny = false;
      slotCols.forEach(sc=>{
        const v = cellAt(grid,r,sc.col);
        if(v!==null && v!=='' && v!=='-'){ rowVals[sc.key]=v; hasAny=true; }
      });
      if(!hasAny){ blank++; if(blank>=2) break; r++; continue; }
      blank=0;
      ranks.push(rowVals);
      r++;
    }
  }

  // 5) 03. 파트너/주차 운영 리스트 ('정리' 블록 — 헤더 텍스트로 컬럼 위치 탐색)
  const anchorCol = findColByText(grid, 4, ['정리']);
  const partners = [];
  if(anchorCol){
    const orderCol = anchorCol;
    const bizCol = findColByText(grid, 7, ['사업자명']) || anchorCol+1;
    const joinCol = findColByText(grid, 6, ['참여여부']);
    const materialCol = findColByText(grid, 6, ['소재전달']);
    const headerRow = 7;
    let r = headerRow+1, blank=0;
    while(r<=grid.length){
      const order = cellAt(grid,r,orderCol);
      const biz = cellAt(grid,r,bizCol);
      if(!order && !biz){ blank++; if(blank>=2) break; r++; continue; }
      if(!biz){ r++; continue; }
      blank=0;
      const idx = partners.length; // 0-based 배너순서 산정용
      const week = (idx % cycle) + 1;
      const rankInWeek = Math.floor(idx / cycle) + 1;
      partners.push({
        bannerOrder: idx+1,
        perfRank: order,
        name: biz,
        weekLabel: `${week}주차 ${rankInWeek}위`,
        week, rankInWeek,
        combo: FULL_COMBO, // 기본값: 전체 구성. 상위/하위 구분은 원본만으로 확정할 수 없어 사람이 확인 필요
        estimated: true,
      });
      r++;
    }
  }

  // 6) 프리마케팅 제공 순위 ('03. 파트너/주차 운영 리스트'의 실적순위와는 별개의 표 —
  //    '프리 주차별 N위' 플레이스홀더는 반드시 이 표를 기준으로 채워야 함)
  //    이름이 비어있는 순위(다음 배정 대기 등)도 자리 자체는 그대로 유지해야
  //    이후 순번들의 '몇 주차 몇 위' 위치가 밀리지 않는다.
  const preMarketingPartners = [];
  const preRankCol = findColByText(grid, 6, ['프리마케팅제공순위','프리마케팅제공']);
  if(preRankCol){
    const preBizCol = preRankCol + 1; // 관찰된 원본 구조상 순위 바로 옆 열이 사업자명
    let r = 8, blank = 0; // '정리' 표와 같은 데이터 시작행(헤더 2행 다음)
    while(r<=grid.length){
      const order = cellAt(grid,r,preRankCol);
      const biz = cellAt(grid,r,preBizCol);
      const hasOrder = order!==null && String(order).trim()!=='';
      if(!hasOrder && (biz===null || String(biz).trim()==='')){
        blank++; if(blank>=2) break; r++; continue;
      }
      blank=0;
      const idx = preMarketingPartners.length;
      const week = (idx % cycle) + 1;
      const rankInWeek = Math.floor(idx / cycle) + 1;
      preMarketingPartners.push({ name: (biz && String(biz).trim()) || '', week, rankInWeek, preRank: hasOrder ? order : '-' });
      r++;
    }
  }

  return { monthLabel: `${sheetInfo.y}년 ${sheetInfo.mo}월`, sheetName: sheetInfo.name, criteria, ranks, slotCols, partners, preMarketingPartners };
}

function buildBannerManagementWorkbook(parsed){
  const yy = parsed.monthLabel.match(/(\d{4})년/)[1].slice(2);
  const mm = parsed.monthLabel.match(/(\d+)월/)[1];
  const newSheetName = `${yy}년 ${mm}월 이벤트 배너 구좌 관리`;
  const rows = [];
  rows.push([`${yy}년 ${mm}월 이벤트 배너 구좌 관리 (자동 변환 초안 — 검수 필요)`]);
  rows.push([`업데이트 일자: ${new Date().toISOString().slice(5,10).replace('-','/')}`]);
  rows.push(['🤖 AI가 자동 생성한 내용이니 검수가 필요합니다. 특히 신규 파트너명 추가 여부를 꼭 확인해주세요.']);
  rows.push([]);
  rows.push(['01. 구좌 운영 기준']);
  rows.push(['No.','구좌명','최대 노출','프리마케팅 배정','운영 방식','비고']);
  parsed.criteria.forEach((c,i)=> rows.push([i+1, c.name, c.maxExposure, c.preMarketing, c.operation, c.note]));
  rows.push([]);
  rows.push(['02. 노출 순위별 배정 현황']);
  const slotNames = parsed.slotCols.map(s=>s.key);
  rows.push(['순위', ...slotNames]);
  parsed.ranks.forEach((row,i)=> rows.push([i+1, ...slotNames.map(k=>row[k]||'')]));
  rows.push([]);
  rows.push(['03. 파트너/주차 운영 리스트', null, null, null, null, null, null, '자동 주차 설정']);
  rows.push(['배너 순서','실적 순위','파트너사','순서','제공 구좌(추정 — 확인 필요)', null, null, '기준일시', new Date()]);
  parsed.partners.forEach(p=> rows.push([p.bannerOrder, p.perfRank, p.name, p.weekLabel, p.combo]));

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, newSheetName.slice(0,31));
  return { wb, newSheetName };
}

let lastParsedRawPlan = null;

let convertMode = 'banner';
function openConvertModal(parsed, mode){
  convertMode = mode || 'banner';
  lastParsedRawPlan = parsed;
  const summary = convertMode==='banner'
    ? `구좌 ${parsed.criteria.length}개 · 순위 ${parsed.ranks.length}행 · 파트너 ${parsed.partners.length}명`
    : `프리마케팅 제공순위 ${(parsed.preMarketingPartners||[]).length}명`;
  document.getElementById('convertModalBody').innerHTML = `
    <p class="sub" style="margin:0 0 10px;">
      <b>${escapeHtml(parsed.monthLabel)}</b> 운영계획을 읽었어요. ${summary}을(를) 자동으로 정리했어요.
    </p>
    <div class="callout">🤖 자동 변환된 초안입니다. 검수가 필요해요.<br/>• 원본에 없던 신규 파트너명은 자동으로 채워지지 않으니 직접 추가해주세요.<br/>• '제공 구좌'는 일단 전체 구성(메인팝업 포함)으로 채워뒀어요 — 보통 하위권 파트너는 메인팝업이 빠지는 경우가 많으니, 하위권부터 확인하며 조정해주세요.</div>
  `;
  document.getElementById('convertModalOverlay').classList.remove('hidden');
  const applyBtn = document.getElementById('convertModalApplyBtn');
  if(applyBtn) applyBtn.textContent = convertMode==='banner' ? '📥 배너 구좌 관리에 반영하기' : '📥 프리마케팅 관리에 반영하기';
}
function closeConvertModal(){ document.getElementById('convertModalOverlay').classList.add('hidden'); }

document.getElementById('convertModalOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='convertModalOverlay') closeConvertModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && !document.getElementById('convertModalOverlay').classList.contains('hidden')) closeConvertModal();
});

document.getElementById('convertModalCancelBtn').addEventListener('click', closeConvertModal);
document.getElementById('convertModalDownloadBtn').addEventListener('click', ()=>{
  if(!lastParsedRawPlan) return;
  const { wb } = buildBannerManagementWorkbook(lastParsedRawPlan);
  XLSX.writeFile(wb, `${lastParsedRawPlan.monthLabel.replace(/\s/g,'')}_배너구좌_관리용.xlsx`);
  showToast('엑셀 파일로 내려받았어요.');
});
document.getElementById('convertModalApplyBtn').addEventListener('click', ()=>{
  if(!lastParsedRawPlan) return;
  const p = lastParsedRawPlan;
  const yy = p.monthLabel.match(/(\d{4})년/)[1];
  const mm = p.monthLabel.match(/(\d+)월/)[1];
  const key = `${yy}-${String(mm).padStart(2,'0')}`;
  const label = `${yy.slice(2)}년 ${mm}월`;

  const doApply = ()=>{
    let mo = STATE.bannerMonths.find(m=>m.key===key);
    if(!mo){
      mo = { key, label, columns: [], ranks: [], partners: [], preMarketingPartners: [], cycleWeeks: 4, weekAnchor: defaultWeekAnchor(key), changeLog: [], hiddenColumns: [] };
      STATE.bannerMonths.push(mo);
      STATE.bannerMonths.sort((a,b)=> a.key<b.key?-1:1);
    }
    activeBannerMonthKey = key;
    if(convertMode==='banner'){
      mo.columns = p.slotCols.map(s=>s.key);
      mo.ranks = p.ranks.map(r=>({ _uid:uid(), values: {...r} }));
      mo.partners = p.partners.map(pt=>({ name: pt.name, week: pt.week, rankInWeek: pt.rankInWeek }));
      logActivity('🔄', `'${label}' 배너 구좌 원본파일 자동 변환 반영`, `구좌 ${mo.ranks.length}개 · 파트너 ${mo.partners.length}명`, 'banner', key);
      syncChanges(); renderBannerTab(); closeConvertModal();
      showToast(`'${label}' 배너 구좌에 반영했어요. 자동 변환된 내용이니 신규 파트너명은 직접 확인해주세요.`);
    }else{
      mo.preMarketingPartners = (p.preMarketingPartners||[]).map(pt=>({ _uid: uid(), name: pt.name, week: pt.week, rankInWeek: pt.rankInWeek }));
      logActivity('🔄', `'${label}' 프리마케팅 원본파일 자동 변환 반영`, `프리마케팅 ${mo.preMarketingPartners.length}명`, 'banner', key);
      syncChanges(); renderPmTab(); closeConvertModal();
      showToast(`'${label}' 프리마케팅 관리에 반영했어요. 자동 변환된 내용이니 신규 파트너명은 직접 확인해주세요.`);
    }
  };

  const existing = STATE.bannerMonths.find(m=>m.key===key);
  const hasConflict = existing && (convertMode==='banner' ? existing.ranks.length>0 : (existing.preMarketingPartners||[]).length>0);
  if(hasConflict){
    const overwriteMsg = convertMode==='banner'
      ? `'${label}' 배너 구좌 데이터가 이미 있어요. 순위표를 덮어쓸까요?`
      : `'${label}' 프리마케팅 데이터가 이미 있어요. 덮어쓸까요?`;
    showConfirmModal(overwriteMsg, doApply, ()=> closeConvertModal());
  }else{
    doApply();
  }
});

function handleRawFileImport(file, btn, mode){
  clearError();
  setBtnLoading(btn, '변환하는 중...');
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array', cellDates:false});
      const sheetInfo = findLatestRawSheet(wb);
      if(!sheetInfo){
        showError("'YYYY.M월' 형식의 운영계획 시트를 찾지 못했어요. 사업팀에서 받은 원본 파일이 맞는지 확인해주세요.");
      }else{
        const parsed = parseRawBannerPlan(wb, sheetInfo);
        if(!parsed.criteria.length && !parsed.ranks.length){
          showError('구좌 정보를 찾지 못했어요. 시트 구조가 예상과 달라요.');
        }else{
          openConvertModal(parsed, mode);
        }
      }
    }catch(err){
      showError('원본 파일을 읽는 중 문제가 발생했어요: ' + err.message);
    }
    resetBtn(btn);
  };
  reader.onerror = ()=>{ showError('파일을 읽지 못했어요. 다시 시도해주세요.'); resetBtn(btn); };
  reader.readAsArrayBuffer(file);
}

const BANNER_SHEET = '알닷 배너 구좌';
const BANNER_BLOCK_RE = /■\s*알닷\s*배너\s*구좌\s*\(([^)]+)\)/;
const PM_SHEET = '프리마케팅';
const PM_BLOCK_RE = /■\s*프리마케팅\s*\(([^)]+)\)/;
// 'YY년 M월' → {key, label}. 연도가 없으면 null
function parseYyMonthLabel(s){
  const m = String(s||'').match(/(\d{2})년\s*(\d{1,2})월/);
  if(!m) return null;
  const y = 2000 + +m[1], mm = +m[2];
  return { key:`${y}-${String(mm).padStart(2,'0')}`, label:`${m[1]}년 ${mm}월` };
}

function importFromWorkbook(wb){
  const eventMonths = [];
  const skippedSheets = [];
  const importedBannerMonths = [];
  wb.SheetNames.forEach(name=>{
    const m = name.match(EVENT_SHEET_RE);
    if(!m) return;
    const yy=+m[1], mm=+m[2];
    const key = `${2000+yy}-${String(mm).padStart(2,'0')}`;
    const label = `${m[1]}년 ${mm}월`;
    const grid = sheetToGrid(wb.Sheets[name]);

    const layout = detectEventSheetLayout(grid);
    if(!layout){ skippedSheets.push(name); return; }

    const get = (r, field)=> layout.fieldCols[field] ? cellAt(grid, r, layout.fieldCols[field]) : null;
    const events = [];
    let r = layout.headerRow+1, blank=0;
    while(r<=grid.length){
      const isBlankRow = Object.keys(layout.fieldCols).every(f=>{ const v = get(r,f); return v===null || v===undefined || String(v).trim()===''; });
      if(isBlankRow){ blank++; if(blank>=3) break; r++; continue; }
      const nm = get(r,'name') || '';
      blank=0;
      const idVal = get(r,'id');
      // 종료일(reflectStatus)은 날짜로 정리하고, 날짜가 아닌 옛 '반영상태' 값은 주요특이사항 뒤에 붙여둬요
      const rsRaw = normalizeDateValue(get(r,'reflectStatus'));
      const rsIso = dotToIso(rsRaw);
      let note = get(r,'note') || '';
      if(rsRaw && !rsIso) note = note ? `${note} / 반영상태: ${rsRaw}` : `반영상태: ${rsRaw}`;
      events.push({
        _uid: uid(),
        priority: get(r,'priority')||'', status: get(r,'status')||'', name: nm,
        workType: get(r,'workType')||'', category: get(r,'category')||'',
        dueDate: normalizeDateValue(get(r,'dueDate')), reflectStatus: rsIso ? isoToDot(rsIso) : '',
        source: get(r,'source')||'', reviewUrl: get(r,'reviewUrl')||'',
        urlType: get(r,'urlType')||'', opUrl: get(r,'opUrl')||'',
        id: (idVal!==null && idVal!==undefined) ? String(idVal) : '', note
      });
      r++;
    }
    eventMonths.push({key, label, events});

    // 같은 달의 배너 구좌 관리 시트가 있으면 함께 가져오기
    const bannerSheetName = name.replace(' 이벤트 관리',' 이벤트 배너 구좌 관리');
    if(wb.SheetNames.includes(bannerSheetName)){
      try{
        const bgrid = sheetToGrid(wb.Sheets[bannerSheetName]);
        let headerRow=null;
        for(let r=1;r<=bgrid.length;r++){ const v=cellAt(bgrid,r,1); if(typeof v==='string' && v.includes(RANK_TABLE_HEADER)){headerRow=r;break;} }
        if(headerRow){
          const colHeaderRow = headerRow+1;
          const maxCol = (bgrid[colHeaderRow-1]||[]).length;
          const columns = [];
          const colIdx = {};
          for(let c=1;c<=maxCol;c++){ const nm2=cellAt(bgrid,colHeaderRow,c); if(typeof nm2==='string' && nm2.trim() && nm2.trim()!=='순위'){ columns.push(nm2.trim()); colIdx[nm2.trim()]=c; } }
          const ranks = [];
          let r=colHeaderRow+1, blank=0;
          while(r<=bgrid.length){
            const hasVal = columns.some(cn=>{const v=cellAt(bgrid,r,colIdx[cn]); return v!==null && v!=='';});
            if(!hasVal){ blank++; if(blank>=2) break; r++; continue; }
            blank=0;
            const values={};
            columns.forEach(cn=> values[cn]=cellAt(bgrid,r,colIdx[cn])||'');
            ranks.push({_uid:uid(), values});
            r++;
          }
          importedBannerMonths.push({key,label,columns,ranks});
        }
      }catch(err){ /* 배너 구좌 관리 시트 형식이 달라도 이벤트 가져오기는 계속 진행 */ }
    }
  });

  // '알닷 배너 구좌' 마스터 시트: '■ 알닷 배너 구좌 (YY년 M월)' 블록 + '노출순위' 헤더
  // (블록 이름에 연도가 없으면 새달→구달 순서로 보고 연도를 추정해요. 구좌명 헤더가 없는 옛 형식 블록은 건너뛰어요)
  const skippedBannerBlocks = [];
  if(wb.SheetNames.includes(BANNER_SHEET)){
    try{
      const grid = sheetToGrid(wb.Sheets[BANNER_SHEET]);
      let runningYear = eventMonths.length ? +eventMonths[eventMonths.length-1].key.slice(0,4) : new Date().getFullYear();
      let lastMonthNum = null; // 블록이 새달→구달 순으로 내려가다 월이 다시 커지면(예: 2월→12월) 연도가 하나 내려간 것으로 본다
      let r = 1;
      while(r<=grid.length){
        const v = cellAt(grid,r,1);
        if(typeof v==='string'){
          const bm = v.match(BANNER_BLOCK_RE);
          if(bm){
            const rawLabel = bm[1].trim();
            const monthMatch = rawLabel.match(/(\d{1,2})월/);
            const nextRowVal = cellAt(grid, r+1, 1);
            const hasProperHeader = typeof nextRowVal==='string' && nextRowVal.includes('노출');
            if(!monthMatch || !hasProperHeader){
              skippedBannerBlocks.push(rawLabel);
              r++; continue;
            }
            const mm2 = +monthMatch[1];
            const withYear = parseYyMonthLabel(rawLabel);
            if(withYear) runningYear = +withYear.key.slice(0,4);
            else if(lastMonthNum!==null && mm2>lastMonthNum) runningYear -= 1;
            lastMonthNum = mm2;
            const key = `${runningYear}-${String(mm2).padStart(2,'0')}`;
            const label = `${String(runningYear).slice(2)}년 ${mm2}월`;
            const colHeaderRow = r+1;
            const rowArr = grid[colHeaderRow-1] || [];
            const columns = [];
            const colIdx = {};
            rowArr.forEach((cellVal, idx)=>{
              const cname = (cellVal==null) ? '' : String(cellVal).trim();
              if(cname && cname!=='노출순위'){ columns.push(cname); colIdx[cname]=idx+1; }
            });
            let rr = colHeaderRow+1, blank=0;
            const ranks = [];
            while(rr<=grid.length){
              const nextHeader = cellAt(grid,rr,1);
              if(typeof nextHeader==='string' && BANNER_BLOCK_RE.test(nextHeader)) break;
              const hasVal = columns.some(cn=>{ const vv=cellAt(grid,rr,colIdx[cn]); return vv!==null && vv!==''; });
              if(!hasVal){ blank++; if(blank>=2) break; rr++; continue; }
              blank=0;
              const values={};
              columns.forEach(cn=> values[cn]=cellAt(grid,rr,colIdx[cn])||'');
              ranks.push({_uid:uid(), values});
              rr++;
            }
            const already = importedBannerMonths.some(x=>x.key===key);
            if(!already && columns.length){
              importedBannerMonths.push({key, label, columns, ranks});
            }
            r = rr; continue;
          }
        }
        r++;
      }
    }catch(err){ /* 마스터 시트 형식이 달라도 나머지 가져오기는 계속 진행 */ }
  }

  // '프리마케팅' 시트: '■ 프리마케팅 (YY년 M월)' | 배치 주기 | N | 기준일시 | 값 → 주차·순위·파트너사 행
  if(wb.SheetNames.includes(PM_SHEET)){
    const grid = sheetToGrid(wb.Sheets[PM_SHEET]);
    let r = 1;
    while(r<=grid.length){
      const v = cellAt(grid,r,1);
      const bm = typeof v==='string' ? v.match(PM_BLOCK_RE) : null;
      const parsed = bm && parseYyMonthLabel(bm[1]);
      if(!parsed){ r++; continue; }
      const entries = [];
      let rr = r+2;
      while(rr<=grid.length && typeof cellAt(grid,rr,1)==='number'){
        entries.push({_uid:uid(), name: String(cellAt(grid,rr,3) ?? ''), week: cellAt(grid,rr,1), rankInWeek: +cellAt(grid,rr,2)});
        rr++;
      }
      let mo = importedBannerMonths.find(x=>x.key===parsed.key);
      if(!mo){ mo = {key:parsed.key, label:parsed.label, columns:DEFAULT_BANNER_COLUMNS.slice(), ranks:[]}; importedBannerMonths.push(mo); }
      mo.preMarketingPartners = entries;
      const cycle = +cellAt(grid,r,3); if(cycle) mo.cycleWeeks = cycle;
      const anchor = cellAt(grid,r,5); if(anchor) mo.weekAnchor = String(anchor);
      r = rr;
    }
  }

  const benefitBlocks = [];
  if(wb.SheetNames.includes(BENEFIT_SHEET)){
    const grid = sheetToGrid(wb.Sheets[BENEFIT_SHEET]);
    let r = 1;
    while(r<=grid.length){
      const v = cellAt(grid,r,1);
      if(typeof v==='string'){
        const m = v.match(BENEFIT_BLOCK_RE);
        if(m){
          const label = m[1];
          const items = [];
          let rr = r+2, blank=0;
          while(rr<=grid.length){
            const name = cellAt(grid,rr,2), copy = cellAt(grid,rr,3);
            if(!name && !copy){ blank++; if(blank>=2) break; rr++; continue; }
            blank=0;
            const exp = normalizeDateValue(cellAt(grid,rr,5));
            items.push({_uid:uid(), name:name||'', copy:copy||'', status: cellAt(grid,rr,4)||'', expiryDate: dotToIso(exp) || exp});
            rr++;
          }
          benefitBlocks.push({label, items});
          r = rr; continue;
        }
      }
      r++;
    }
  }

  eventMonths.sort((a,b)=> a.key<b.key?-1:1);
  importedBannerMonths.sort((a,b)=> a.key<b.key?-1:1);
  return { eventMonths, benefitBlocks, bannerMonths: importedBannerMonths, skippedSheets, skippedBannerBlocks };
}

function bindXlsxButtons(importBtnId, exportBtnId, fileInputId){
  const importBtn = document.getElementById(importBtnId);
  const fileInput = document.getElementById(fileInputId);
  if(importBtn && fileInput){
    importBtn.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(file) handleXlsxImportFile(file, importBtn);
      e.target.value = '';
    });
  }
  const exportBtn = document.getElementById(exportBtnId);
  if(exportBtn) exportBtn.addEventListener('click', ()=> handleXlsxExport(exportBtn));
}

/* ════════════════════════════════════════════════════════════
   불러오기 공통: 이어붙이기 / 전체 교체 / 취소
   ════════════════════════════════════════════════════════════ */
function hasAnyData(){ return STATE.eventMonths.some(m=>m.events.length) || STATE.benefitBlocks.some(b=>b.items.length) || STATE.bannerMonths.some(m=>m.ranks.length); }

function offerImport(imported, sourceLabel, afterDone){
  if(!isValidStateShape(imported)){
    showError('가져온 데이터 형식이 올바르지 않아요. (eventMonths·bannerMonths·benefitBlocks가 배열이어야 해요)');
    afterDone && afterDone(); return;
  }
  const summary = `이벤트 ${imported.eventMonths.length}개월 · 배너 ${imported.bannerMonths.length}개월 · 혜택 블록 ${imported.benefitBlocks.length}개`;
  if(!hasAnyData()){ importAppend(imported, sourceLabel, summary); afterDone && afterDone(); return; }
  showConfirmModal(
    `${sourceLabel}에서 ${summary}를 찾았어요.\n\n· 이어붙이기: 지금 없는 달·블록만 추가해요.\n· 전체 교체: 모든 사용자의 데이터를 이 파일 내용으로 바꿔요.`,
    ()=> importAppend(imported, sourceLabel, summary),
    ()=> confirmReplace(imported, sourceLabel, summary),
    '이어붙이기', '전체 교체'
  );
  // ESC·바깥 클릭·취소는 아무것도 바꾸지 않아요
  afterDone && afterDone();
}

// 이어붙이기: 다른 데이터와 id가 겹치지 않도록 새 id를 발급해요
function reissueIds(imp){
  imp.eventMonths.forEach(m=> (m.events||[]).forEach(o=> o._uid = uid()));
  imp.bannerMonths.forEach(m=>{ (m.ranks||[]).forEach(o=> o._uid = uid()); (m.preMarketingPartners||[]).forEach(o=> o._uid = uid()); });
  imp.benefitBlocks.forEach(b=>{ b._blockUid = uid(); (b.items||[]).forEach(o=> o._uid = uid()); });
}
function importAppend(imp, sourceLabel, summary){
  reissueIds(imp);
  imp.eventMonths.forEach(m=>{ if(!STATE.eventMonths.some(x=>x.key===m.key)) STATE.eventMonths.push(m); });
  imp.bannerMonths.forEach(m=>{ if(!STATE.bannerMonths.some(x=>x.key===m.key)) STATE.bannerMonths.push(m); });
  STATE.benefitBlocks = [...imp.benefitBlocks, ...STATE.benefitBlocks];
  finishImport(`${sourceLabel} 이어붙이기`, summary);
}
function confirmReplace(imp, sourceLabel, summary){
  showPromptModal("모든 사용자의 데이터가 바뀌어요. 계속하려면 '교체'를 입력해주세요.", '', async (v)=>{
    if(v!=='교체'){ showToast("'교체'를 정확히 입력해야 진행돼요. 아무것도 바꾸지 않았어요.", 'error'); return; }
    let server;
    try{
      server = await fetchServerMaps(); // 실행 직전 DB 전체를 자동 백업
      downloadJson(rowsToState([...server.containers.values()], [...server.records.values()]), '알닷_교체전_자동백업_');
    }catch(err){
      showError('교체 전 자동 백업을 받지 못해서 교체를 멈췄어요: ' + err.message);
      return;
    }
    const keep = {};
    [...SETTINGS_FIELDS, 'activityLog', 'trash'].forEach(k=>{ if(imp[k]===undefined) keep[k] = STATE[k]; });
    SHADOW = cloneMaps(server); // 방금 받은 DB 기준으로 비교해서, 파일에 없는 것은 지우고 있는 것만 올려요
    SORT.clear();
    STATE = {...keep, ...imp, uiPrefs: STATE.uiPrefs};
    finishImport(`${sourceLabel} 전체 교체`, summary);
  });
}
function finishImport(action, summary){
  STATE.eventMonths.sort((a,b)=> a.key<b.key?-1:1);
  STATE.bannerMonths.sort((a,b)=> a.key<b.key?-1:1);
  ensureStateShape();
  activeEventMonthKey = getDefaultActiveEventMonthKey();
  activeBannerMonthKey = getDefaultActiveBannerMonthKey();
  logActivity('📄', action, summary, null);
  syncChanges();
  renderActiveTab();
  showToast(`${action} 완료! ${summary} · 자동으로 옮겨온 내용이니 한 번 검수해주세요.`);
}

function handleXlsxImportFile(file, btn){
  clearError();
  setBtnLoading(btn, '불러오는 중...');
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array', cellDates:false});
      const imported = importFromWorkbook(wb);
      if(!imported.eventMonths.length && !imported.bannerMonths.length && !imported.benefitBlocks.length){
        showError(`불러올 시트를 찾지 못했어요 ('NN년 N월 이벤트 관리', '알닷 배너 구좌', '프리마케팅', '알닷 혜택'). 이 파일의 시트 이름: ${wb.SheetNames.join(', ')}`);
        resetBtn(btn); return;
      }
      const skipNote = imported.skippedSheets.length ? ` (인식 못한 시트 ${imported.skippedSheets.length}개는 건너뜀: ${imported.skippedSheets.join(', ')})` : '';
      const bannerSkipNote = imported.skippedBannerBlocks.length ? ` (구좌명 헤더가 없는 배너 이력 ${imported.skippedBannerBlocks.length}개는 건너뜀)` : '';
      if(skipNote || bannerSkipNote) showToast(`참고: ${skipNote}${bannerSkipNote}`.trim());
      offerImport(imported, '엑셀', ()=> resetBtn(btn));
    }catch(err){
      showError('엑셀을 읽는 중 문제가 발생했어요: ' + err.message);
      resetBtn(btn);
    }
  };
  reader.onerror = ()=>{ showError('파일을 읽지 못했어요. 다시 시도해주세요.'); resetBtn(btn); };
  reader.readAsArrayBuffer(file);
}

/* ════════════════════════════════════════════════════════════
   엑셀로 내보내기 (importFromWorkbook이 그대로 다시 읽을 수 있는 형식)
   ════════════════════════════════════════════════════════════ */
function buildExportWorkbook(state){
  const wb = XLSX.utils.book_new();
  const customCols = state.customEventColumns||[];
  const evHeader = [...EVENT_FIELDS.map(f=>EVENT_FIELD_LABELS[f]), '이벤트ID', ...customCols.map(c=>c.label)];
  state.eventMonths.forEach(mo=>{
    const rows = [evHeader];
    mo.events.forEach(ev=> rows.push([...EVENT_FIELDS.map(f=>ev[f] ?? ''), ev.id ?? '', ...customCols.map(c=>ev[c.key] ?? '')]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), (mo.label + " 이벤트 관리").slice(0,31));
  });
  const newestFirst = state.bannerMonths.slice().sort((a,b)=> a.key<b.key?1:-1);
  if(newestFirst.length){
    const rows = [];
    newestFirst.forEach(mo=>{
      rows.push([`■ 알닷 배너 구좌 (${mo.label})`]);
      rows.push(['노출순위', ...mo.columns]);
      mo.ranks.forEach((r,i)=> rows.push([i+1, ...mo.columns.map(c=>r.values[c] ?? '')]));
      rows.push([]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), BANNER_SHEET);
  }
  const pmMonths = newestFirst.filter(mo=> (mo.preMarketingPartners||[]).length);
  if(pmMonths.length){
    const rows = [];
    pmMonths.forEach(mo=>{
      rows.push([`■ 프리마케팅 (${mo.label})`, '배치 주기', mo.cycleWeeks||4, '기준일시', mo.weekAnchor||'']);
      rows.push(['주차','순위','파트너사']);
      mo.preMarketingPartners.forEach(p=> rows.push([p.week, p.rankInWeek, p.name ?? '']));
      rows.push([]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), PM_SHEET);
  }
  if(state.benefitBlocks.length){
    const rows = [];
    state.benefitBlocks.forEach(b=>{
      rows.push([`■ 알닷 혜택 (${b.label})`]);
      rows.push(['No.','혜택명','문구','작업현황','종료일']);
      b.items.forEach((it,i)=> rows.push([i+1, it.name ?? '', it.copy ?? '', it.status ?? '', it.expiryDate ?? '']));
      rows.push([]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), BENEFIT_SHEET);
  }
  return wb;
}
function handleXlsxExport(btn){
  clearError();
  setBtnLoading(btn, '내보내는 중...');
  setTimeout(()=>{
    try{
      XLSX.writeFile(buildExportWorkbook(STATE), "알닷_이벤트_운영_" + new Date().toISOString().slice(0,10) + ".xlsx");
      showToast('엑셀 파일로 내보냈어요.');
    }catch(err){
      showError('엑셀로 내보내는 중 문제가 발생했어요: ' + err.message);
    }
    resetBtn(btn);
  }, 50);
}

/* ════════════════════════════════════════════════════════════
   JSON 백업 내보내기 / 불러오기
   ════════════════════════════════════════════════════════════ */
function downloadJson(data, prefix){
  const filename = prefix + new Date().toISOString().slice(0,10) + ".json";
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click(); URL.revokeObjectURL(url);
}
function handleJsonExport(){
  downloadJson(STATE, "알닷_운영데이터_백업_");
  showToast('백업 파일로 저장했어요.');
}
function handleJsonImportFile(file, btn){
  clearError();
  setBtnLoading(btn, '불러오는 중...');
  const reader = new FileReader();
  reader.onload = (ev)=>{
    let data = null;
    try{ data = JSON.parse(ev.target.result); }
    catch(err){ showError('백업 파일을 읽는 중 문제가 발생했어요: ' + err.message); resetBtn(btn); return; }
    offerImport(data, 'JSON 백업', ()=> resetBtn(btn));
  };
  reader.onerror = ()=>{ showError('파일을 읽지 못했어요. 다시 시도해주세요.'); resetBtn(btn); };
  reader.readAsText(file);
}
