async function setReqStatus(id,st){
  const t=tasks.find(x=>x.id===id);if(!t||t.status===st)return;
  const patch={status:st,doneDate:st==='done'?(t.doneDate||todayStr()):'',updatedAt:new Date().toISOString()};
  try{await db.collection('tasks').doc(id).update(patch);logChange('task','update',id,t.title,t,{...t,...patch});toast(`'${statusOf(st).label}'(으)로 바꿨어요`);}
  catch(err){handleWriteError(err);render();}
}

/* ---------- 글자 서식(굵게·기울임·밑줄·취소선·글자색·배경 강조색) — 업무 내용 · 댓글/요청 · 매뉴얼 단계 설명 · 주간 보고 본문 ----------
   저장: 일반 텍스트 칸(note·text·body·t)은 그대로 채우고(검색·내보내기·알림용), 서식은 정화한 HTML을 따로(noteHtml·html·bodyHtml·h).
   정화: b·i·u·s·span·br·div·p만, span은 아래 팔레트의 color·background-color만 남김 */
const RT_FG=[['#d6336c','빨강'],['#e8590c','주황'],['#2b8a3e','초록'],['#1971c2','파랑'],['#7048e8','보라'],['#868e96','회색']];
const RT_BG=[['#fff3bf','노랑'],['#d3f9d8','연두'],['#d0ebff','하늘'],['#ffe3e3','분홍']];
const rtHex=v=>{v=String(v||'').trim().toLowerCase();const m=v.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);return m?'#'+[m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,'0')).join(''):v;};
function rtClean(html){
  if(!html)return '';
  const src=new DOMParser().parseFromString(`<body>${html}</body>`,'text/html').body,out=document.createElement('div'); // DOMParser 문서는 스크립트·이미지를 실행·불러오지 않음
  const MAP={strong:'b',em:'i',strike:'s',del:'s'},KEEP=['b','i','u','s','br','div','p'];
  const walk=(from,to)=>{for(const n of [...from.childNodes]){
    if(n.nodeType===3){to.append(n.data);continue;}if(n.nodeType!==1)continue;
    const tag=n.tagName.toLowerCase();if(/^(script|style|iframe|object|embed|template|noscript|svg|math|img|video|audio|link|meta|textarea|select|button|input)$/.test(tag))continue;
    const t=MAP[tag]||tag;let el=null;
    if(KEEP.includes(t))el=document.createElement(t);
    else if(t==='span'||t==='font'){const fg=rtHex(n.style?.color||n.getAttribute('color')),bg=rtHex(n.style?.backgroundColor);
      const st=[RT_FG.some(c=>c[0]===fg)?`color:${fg}`:'',RT_BG.some(c=>c[0]===bg)?`background-color:${bg}`:''].filter(Boolean).join(';');
      if(st){el=document.createElement('span');el.setAttribute('style',st);}}
    if(el){to.append(el);if(t!=='br')walk(n,el);}else walk(n,to);}};
  walk(src,out);return out.innerHTML;
}
// 정화한 HTML → 줄바꿈을 살린 일반 텍스트
function rtText(clean){const d=document.createElement('div');d.innerHTML=clean;let out='';
  const walk=n=>{for(const c of n.childNodes){if(c.nodeType===3){out+=c.data;continue;}if(c.nodeType!==1)continue;
    if(c.tagName==='BR'){out+='\n';continue;}const blk=c.tagName==='DIV'||c.tagName==='P';if(blk&&out&&!out.endsWith('\n'))out+='\n';walk(c);if(blk&&!out.endsWith('\n'))out+='\n';}};
  walk(d);return out.replace(/\n$/,'');}
const rtFmt=h=>/<(b|i|u|s|span)[\s>]/.test(h||'');
const rtFromText=t=>esc(t||'').replace(/\n/g,'<br>');
const rtShow=(html,text)=>html?rtClean(html):esc(text||'');
// 편집칸 내용 → {text, html}. 서식이 없으면 html은 ''
const rtRead=ed=>{const h=rtClean(ed.innerHTML);return {text:rtText(h).replace(/\s+$/,''),html:rtFmt(h)?h:''};};
// 주소는 보여 줄 때만 링크로(저장하지 않음)
function rtLinkify(clean){const d=document.createElement('div');d.innerHTML=clean;const tw=document.createTreeWalker(d,NodeFilter.SHOW_TEXT),L=[];while(tw.nextNode())L.push(tw.currentNode);
  L.forEach(t=>{const parts=t.data.split(/(https?:\/\/[^\s<]+)/);if(parts.length<2)return;const f=document.createDocumentFragment();
    parts.forEach((p,i)=>{if(i%2){const a=document.createElement('a');a.href=p;a.target='_blank';a.rel='noopener';a.textContent=p;f.append(a);}else if(p)f.append(p);});t.replaceWith(f);});
  return d.innerHTML;}
const rtPal=(cmd,lab,C)=>`<details class="rtPal"><summary class="rtB" aria-label="${lab}" title="${lab}"><span class="${cmd==='foreColor'?'rtFgI':'rtBgI'}">가</span></summary><span class="rtSw">${C.map(([c,n])=>`<button type="button" data-rtc="${cmd}" data-v="${c}" aria-label="${lab} ${n}" title="${n}" style="--c:${c}"></button>`).join('')}</span></details>`;
const rtBtns=()=>`<span class="rtBar" role="toolbar" aria-label="글자 서식">${[['bold','굵게 (Ctrl+B)','<b>B</b>'],['italic','기울임 (Ctrl+I)','<i>I</i>'],['underline','밑줄 (Ctrl+U)','<u>U</u>'],['strikeThrough','취소선','<s>S</s>']].map(([c,l,g])=>`<button type="button" class="rtB" data-rtc="${c}" aria-label="${l}" aria-pressed="false" title="${l}">${g}</button>`).join('')}${rtPal('foreColor','글자색',RT_FG)}${rtPal('hiliteColor','배경 강조색',RT_BG)}<button type="button" class="rtB rtClr" data-rtc="removeFormat" aria-label="서식 지우기" title="서식 지우기">서식 지우기</button></span>`;
// 편집칸: 도구 줄 + contenteditable. 읽기 전용이면 도구 줄 없이 보기만
const rtEditor=(cls,attrs,html,ph)=>`<div class="rtWrap"><div class="${cls}" contenteditable="${canWrite}" data-rt role="textbox" aria-multiline="true" ${attrs} data-ph="${esc(ph||'')}">${html}</div></div>`;
// 서식 도구는 글자를 고르면 그 위에 뜨는 상자 하나(모든 편집칸이 같이 씀)
let rtPop=null,rtEdCur=null,rtRange=null,rtRaf=0;
const rtPopEl=()=>{if(!rtPop){rtPop=document.createElement('div');rtPop.className='rtPop';rtPop.hidden=true;rtPop.innerHTML=rtBtns();document.body.append(rtPop);}return rtPop;};
// 지금 선택이 쓰기 가능한 편집칸 안의 글자면 그 편집칸
function rtSelEd(){const s=getSelection();if(!canWrite||!s.rangeCount||s.isCollapsed||!String(s).trim())return null;
  const n=s.anchorNode,ed=(n.nodeType===1?n:n.parentElement)?.closest?.('[data-rt]');return ed&&ed.getAttribute('contenteditable')==='true'&&ed.contains(s.focusNode)?ed:null;}
function rtPlace(){
  const pop=rtPopEl(),ed=rtSelEd();
  if(!ed){if(!pop.querySelector('details[open]')&&!pop.contains(document.activeElement))pop.hidden=true;return;}
  rtEdCur=ed;rtRange=getSelection().getRangeAt(0).cloneRange();pop.hidden=false;
  const r=rtRange.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight,touch=matchMedia('(pointer:coarse)').matches;
  const top=touch||r.top-ph-8<4?Math.min(r.bottom+8,innerHeight-ph-4):r.top-ph-8; // 터치는 기본 복사 메뉴와 겹치지 않게 아래
  pop.style.top=Math.max(4,top)+'px';pop.style.left=Math.max(8,Math.min(innerWidth-pw-8,r.left+r.width/2-pw/2))+'px';rtState();}
const rtLater=()=>{cancelAnimationFrame(rtRaf);rtRaf=requestAnimationFrame(rtPlace);};
document.addEventListener('selectionchange',rtLater);document.addEventListener('mouseup',rtLater);document.addEventListener('keyup',rtLater);
addEventListener('scroll',()=>{if(rtPop&&!rtPop.hidden)rtLater();},true);addEventListener('resize',()=>{if(rtPop&&!rtPop.hidden)rtLater();});
document.addEventListener('mousedown',e=>{if(e.target.closest?.('.rtBar'))e.preventDefault();}); // 눌러도 편집칸 선택이 풀리지 않게
const rtBack=()=>{if(!rtEdCur)return;rtEdCur.focus();if(rtRange){const s=getSelection();s.removeAllRanges();s.addRange(rtRange);}};
document.addEventListener('click',e=>{
  document.querySelectorAll('details.rtPal[open]').forEach(d=>{if(!d.contains(e.target))d.open=false;});
  const b=e.target.closest?.('.rtBar [data-rtc]');if(!b||!rtEdCur||rtEdCur.getAttribute('contenteditable')!=='true')return;
  rtBack();
  const c=b.dataset.rtc;document.execCommand('styleWithCSS',false,c==='foreColor'||c==='hiliteColor');document.execCommand(c,false,b.dataset.v||null);document.execCommand('styleWithCSS',false,false); // Ctrl+B 등 단축키가 <b>로 들어가게 되돌림
  // 굵게 등 태그에 바로 붙은 색은 안쪽 span으로 옮김(저장할 때 span의 색만 남기 때문)
  const fix=rtEdCur.querySelectorAll('b[style],i[style],u[style],s[style],strike[style]');
  if(fix.length){const g=getSelection(),k=g.rangeCount?g.getRangeAt(0):null,pos=k&&[k.startContainer,k.startOffset,k.endContainer,k.endOffset]; // 옮기는 동안 선택이 풀리지 않게 기억했다 되살림
    fix.forEach(el=>{const sp=document.createElement('span');sp.style.color=el.style.color;sp.style.backgroundColor=el.style.backgroundColor;while(el.firstChild)sp.append(el.firstChild);el.append(sp);el.removeAttribute('style');});
    if(pos){const r=document.createRange();try{r.setStart(pos[0],pos[1]);r.setEnd(pos[2],pos[3]);g.removeAllRanges();g.addRange(r);}catch(err){}}}
  b.closest('details')?.removeAttribute('open');rtLater();
});
function rtState(){const bar=rtPop?.querySelector('.rtBar');if(!bar||rtPop.hidden)return;
  bar.querySelectorAll('[aria-pressed]').forEach(b=>{let on=false;try{on=document.queryCommandState(b.dataset.rtc);}catch(err){}b.setAttribute('aria-pressed',String(on));});}
document.addEventListener('paste',e=>{const ed=e.target.closest?.('[data-rt]');if(!ed||e.defaultPrevented)return;e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));}); // 붙여넣기는 글자만
document.addEventListener('keydown',e=>{
  const open=rtPop&&!rtPop.hidden;
  if(open&&e.altKey&&e.key==='F10'){e.preventDefault();rtPop.querySelector('button,summary')?.focus();return;} // 도구 상자로 이동
  if(e.key!=='Escape')return;
  const pal=[...document.querySelectorAll('details.rtPal[open]')];if(pal.length){pal.forEach(d=>d.open=false);return;}
  if(!open)return;
  if(rtPop.contains(document.activeElement)){rtBack();return;} // 편집칸으로 돌아감
  getSelection().collapseToEnd();rtPop.hidden=true;
});

/* ---------- 회귀 검증(CVT): 케이스(cvt_cases) × 회차(cvt_runs). 회차 문서에 r_<케이스id>=결과, m_<케이스id>=메모 ---------- */
let cvtCases=[],cvtRuns=[];
const CV_RES=[['PASS','PASS'],['MINOR','MINOR'],['MAJOR','MAJOR'],['N/A','N/A']]; // 비어 있으면 미점검(NOT TESTED)
const cvst={run:null,svc:'all',res:'all',core:false,q:'',open:new Set()};
const cvCases=()=>cvtCases.slice().sort((a,b)=>(a.order??0)-(b.order??0));
const cvRuns=()=>cvtRuns.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||''));
const cvR=(run,c)=>run?.['r_'+c.id]||'';
const cvKey=s=>String(s??'').replace(/\s+/g,' ').trim();
const cvRunName=r=>`${(r.date||'').replace(/-/g,'.')}${r.label?' '+r.label:''}`;
const cvCls=v=>'cv-'+(v?v.replace('/',''):'NT');
const cvPill=v=>`<span class="cvPill ${cvCls(v)}">${v||'미점검'}</span>`;
function renderRegress(){
  const area=$('#regressArea');
  if(!storeReady){area.innerHTML='<div class="empty"><h2>불러오는 중입니다</h2></div>';return;}
  const runs=cvRuns();if(!runs.some(r=>r.id===cvst.run))cvst.run=runs[0]?.id||null;
  const run=runs.find(r=>r.id===cvst.run),prev=run&&runs[runs.indexOf(run)+1],C=cvCases(),w=canWrite;
  const tools=`<div class="rtool">${runs.length?`<select class="sel" id="cvRun" aria-label="회차">${runs.map(r=>`<option value="${esc(r.id)}" ${r.id===cvst.run?'selected':''}>${esc(cvRunName(r))}${r.testers?` · ${esc(r.testers)}`:''}</option>`).join('')}</select>`:''}<span class="spacer"></span>${trashBtn('cvTrashBtn',TRASH_SRC.regress.list().length)}${downloads&&C.length?exportMenu([['cvXAll','엑셀 저장 (전체 회차)'],...(runs.length?[['cvXRun','엑셀 저장 (이 회차만)']]:[])]):''}${w?`<button class="btn" type="button" id="cvImport">엑셀 가져오기</button><input type="file" id="cvFile" accept=".xlsx" hidden>${C.length?'<button class="btn" type="button" id="cvAddCase">+ 케이스</button><button class="btn primary" type="button" id="cvNewRun">+ 새 회차</button>':''}`:''}</div>`;
  if(!C.length){area.innerHTML=`${tools}<div class="empty"><h2>아직 회귀 검증 케이스가 없어요</h2><p>CVT 구글 시트를 <b>파일 → 다운로드 → Microsoft Excel(.xlsx)</b>로 받은 뒤 '엑셀 가져오기'로 올리면, '전수 테스트' 탭의 케이스와 회차별 결과를 가져와요.</p>${w?'<button class="btn primary" type="button" id="cvAddCase">+ 케이스 직접 추가</button>':''}</div>`;return;}
  const cnt={};C.forEach(c=>{const v=cvR(run,c);cnt[v]=(cnt[v]||0)+1;});
  const tot=C.length,doneN=tot-(cnt['']||0),core=C.filter(c=>c.core),coreLeft=core.filter(c=>!cvR(run,c)).length;
  const head=run?`<div class="panel cvHead"><div class="cvHeadT"><h3>${esc(cvRunName(run))}</h3><span class="legend">${run.testers?`담당 ${esc(run.testers)}`:'담당 미입력'}</span><span class="spacer"></span>${w?'<button class="btn ghost sm" type="button" id="cvRunEdit">회차 정보</button><button class="btn ghost sm" type="button" id="cvRunDel">회차 삭제</button>':''}</div>
    <div class="cvStats">${[...CV_RES.map(x=>x[0]),''].map(k=>`<button type="button" class="cvStat" data-cvres="${k||'NT'}" aria-pressed="${cvst.res===(k||'NT')}" title="이 결과만 보기">${cvPill(k)}<b class="num">${cnt[k]||0}</b></button>`).join('')}
      <span class="cvProg"><span class="legend">진행률</span><b class="num">${Math.round(doneN/tot*100)}%</b><span class="legend">${doneN}/${tot}${core.length?` · 핵심 미점검 ${coreLeft}건`:''}</span></span></div></div>`
    :`<div class="empty"><h2>회차가 없어요</h2><p>'+ 새 회차'로 이번 검증을 시작하세요.</p></div>`;
  const q=cvst.q.trim().toLowerCase();
  const L=C.filter(c=>(cvst.svc==='all'||c.svc===cvst.svc)&&(!cvst.core||c.core)
    &&(cvst.res==='all'||(cvst.res==='NT'?!cvR(run,c):cvst.res==='DIFF'?!!prev&&cvR(run,c)!==cvR(prev,c):cvR(run,c)===cvst.res))
    &&(!q||[c.group,c.item,c.method,c.expect,run?.['m_'+c.id]].some(v=>String(v||'').toLowerCase().includes(q))));
  const filt=`<div class="cvFilt"><div class="seg" role="group" aria-label="서비스">${[['all','전체'],['FO','FO'],['BO','BO']].map(([k,l])=>`<button type="button" data-cvsvc="${k}" aria-pressed="${cvst.svc===k}">${l}</button>`).join('')}</div>
    <select class="sel" id="cvRes" aria-label="결과">${optH([['all','결과 전체'],['NT','미점검'],...CV_RES,['DIFF','이전 회차와 다름']],cvst.res)}</select>
    <label class="cfItem"><input type="checkbox" id="cvCore" ${cvst.core?'checked':''}>핵심만</label>
    <label class="searchBox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="search" id="cvQ" type="search" placeholder="케이스 · 점검 항목 · 메모 검색" value="${esc(cvst.q)}" aria-label="검색"></label><span class="legend">${L.length}건</span></div>`;
  const rows=L.map(c=>{const v=cvR(run,c),op=cvst.open.has(c.id),memo=run?.['m_'+c.id]||'';
    return `<tr class="cvRow${v==='MAJOR'?' is-major':''}" data-cv="${esc(c.id)}"><td><span class="cvSvc">${esc(c.svc||'')}</span></td><td class="cvGrp">${esc(c.group||'')}</td>
      <td><button type="button" class="cvItem" data-cvopen aria-expanded="${op}" title="점검 방법 · 예상 결과 보기">${esc(c.item||'(점검 항목 없음)')}</button>${c.core?'<span class="cvCore">핵심</span>':''}</td>
      <td>${run&&w?`<select class="sel cvSel ${cvCls(v)}" data-cvr aria-label="결과">${optH([['','미점검'],...CV_RES],v)}</select>`:cvPill(v)}</td>
      <td>${run&&w?`<input class="sel cvMemo" data-cvm value="${esc(memo)}" placeholder="메모" aria-label="메모">`:esc(memo)}</td>
      <td>${prev?cvPill(cvR(prev,c)):'<span class="legend">—</span>'}</td></tr>
      ${op?`<tr class="cvDet" data-cv="${esc(c.id)}"><td></td><td colspan="5"><div class="cvDetGrid"><div><b>점검 방법</b><p>${esc(c.method||'—')}</p></div><div><b>예상 결과</b><p>${esc(c.expect||'—')}</p></div></div>${w?'<div class="cvDetAct"><button type="button" class="btn ghost sm" data-cvedit>케이스 수정</button><button type="button" class="btn ghost sm" data-cvdel>케이스 삭제</button></div>':''}</td></tr>`:''}`;}).join('');
  area.innerHTML=`${tools}${head}${filt}<div class="statWrap"><table class="stable cvTable"><thead><tr><th>서비스</th><th>케이스</th><th>점검 항목</th><th>결과</th><th>메모</th><th>이전 회차${prev?`<br><span class="legend">${esc(cvRunName(prev))}</span>`:''}</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="legend">조건에 맞는 케이스가 없어요.</td></tr>'}</tbody></table></div>`;
}
onArea('#regressArea','change',async e=>{const el=e.target;
  if(el.id==='cvRun'){cvst.run=el.value;render();return;}
  if(el.id==='cvRes'){cvst.res=el.value;render();return;}
  if(el.id==='cvCore'){cvst.core=el.checked;render();return;}
  if(el.id==='cvFile'){const f=el.files[0];el.value='';if(f)cvImport(f);return;}
  const tr=el.closest('[data-cv]'),run=cvtRuns.find(r=>r.id===cvst.run),isR=el.dataset.cvr!=null;if(!tr||!run||!canWrite||(!isR&&el.dataset.cvm==null))return;
  const k=(isR?'r_':'m_')+tr.dataset.cv,v=isR?el.value:el.value.trim();if((run[k]||'')===v)return;run[k]=v;
  try{await db.collection('cvt_runs').doc(run.id).update({[k]:v,updatedAt:new Date().toISOString()});}catch(err){handleWriteError(err);}
  if(isR){el.blur();render();}
});
let cvqT;onArea('#regressArea','input',e=>{if(e.target.id!=='cvQ')return;clearTimeout(cvqT);cvqT=setTimeout(()=>{cvst.q=e.target.value;renderRegress();liftTools();const i=$('#cvQ');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},200);});
onArea('#regressArea','click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cvsvc){cvst.svc=b.dataset.cvsvc;render();return;}
  if(b.dataset.cvres){cvst.res=cvst.res===b.dataset.cvres?'all':b.dataset.cvres;render();return;}
  const id=b.closest('[data-cv]')?.dataset.cv,c=id&&cvtCases.find(x=>x.id===id);
  if(b.dataset.cvopen!=null&&c){cvst.open.has(id)?cvst.open.delete(id):cvst.open.add(id);render();return;}
  if(b.dataset.cvedit!=null&&c){cvCaseModal(c);return;}
  if(b.dataset.cvdel!=null&&c){evConfirm(`'${c.item}' 케이스를 삭제할까요?\n휴지통에서 30일 동안 복구할 수 있어요.`,async()=>{await wbDrop('regress','cvcase',`케이스 · ${c.item||''}`,[wbDocOf('cvt_cases',c)]);cvtCases=cvtCases.filter(x=>x.id!==id);logChange('regress','delete',id,c.item,null,null,'휴지통으로 옮김');render();});return;}
  if(b.id==='cvXAll'||b.id==='cvXRun'){const R=cvRuns(),one=b.id==='cvXRun'&&R.find(r=>r.id===cvst.run),label=b.textContent;b.disabled=true;b.textContent='만드는 중…';
    (async()=>{try{const X=await loadExcel(),buf=await cvXlsx(X,one?[one]:R);await downloads.save({filename:`회귀검증_${one?(one.date||'').replace(/-/g,'')+(one.label?'_'+one.label.replace(/[\\/:*?"<>|\s]+/g,''):''):todayStr().replace(/-/g,'')+'_전체'}.xlsx`,data:new Blob([buf])});}
      catch(err){if(err?.code!=='declined')toast(err?.message==='load'?'엑셀 변환 도구를 불러오지 못했어요. 잠시 후 다시 눌러 주세요':'엑셀 파일을 만들지 못했어요');}
      finally{b.disabled=false;b.textContent=label;}})();return;}
  if(b.id==='cvImport'){$('#cvFile').click();return;}
  if(b.id==='cvAddCase'){cvCaseModal(null);return;}
  if(b.id==='cvNewRun'){cvRunModal(null);return;}
  const run=cvtRuns.find(r=>r.id===cvst.run);
  if(b.id==='cvRunEdit'&&run){cvRunModal(run);return;}
  if(b.id==='cvRunDel'&&run)evConfirm(`'${cvRunName(run)}' 회차를 삭제할까요?\n휴지통에서 30일 동안 복구할 수 있어요.`,async()=>{await wbDrop('regress','cvrun',`회차 · ${cvRunName(run)}`,[wbDocOf('cvt_runs',run)]);cvtRuns=cvtRuns.filter(x=>x.id!==run.id);logChange('regress','delete',run.id,cvRunName(run),null,null,'휴지통으로 옮김');render();});
});
document.addEventListener('click',e=>{if(e.target.closest?.('#cvTrashBtn'))openTrash('regress');});
function cvRunModal(run){const isNew=!run,last=cvRuns().find(r=>Object.keys(r).some(k=>k.startsWith('r_')&&r[k]==='N/A')); // N/A가 있는 가장 최근 회차
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="cvRunForm" novalidate style="max-width:480px"><header><h2>${isNew?'새 회차':'회차 정보'}</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>
    <div class="body"><div class="f"><label for="cvRDate">점검일 <b>*</b></label><input type="date" id="cvRDate" value="${esc(run?.date||todayStr())}"></div>
      <div class="f"><label for="cvRLabel">구분</label><input id="cvRLabel" value="${esc(run?.label||'')}" placeholder="예: STG, 2차" maxlength="40"></div>
      <div class="f full"><label for="cvRTesters">담당자</label><input id="cvRTesters" value="${esc(run?run.testers||'':myMember()?.name||'')}" placeholder="여러 명은 쉼표로" maxlength="80"></div>
      ${isNew&&last?`<label class="cfItem full"><input type="checkbox" id="cvRCarry" checked>최근 회차(${esc(cvRunName(last))})의 N/A 결과와 메모 이어받기</label>`:''}</div>
    <footer><span class="err" id="cvRErr"></span><div class="r"><button class="btn" type="button" id="cvRCancel">취소</button><button class="btn primary" type="submit" id="cvRSave">${isNew?'만들기':'저장'}</button></div></footer></form></div>`;
  $('#xClose').onclick=$('#cvRCancel').onclick=closeModal;$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal();});
  $('#cvRunForm').addEventListener('submit',async e=>{e.preventDefault();const date=$('#cvRDate').value;if(!date){$('#cvRErr').textContent='점검일을 골라 주세요.';return;}
    const data={date,label:$('#cvRLabel').value.trim(),testers:$('#cvRTesters').value.trim(),updatedAt:new Date().toISOString()};$('#cvRSave').disabled=true;
    try{if(isNew){const id=evUid();Object.assign(data,{createdAt:data.updatedAt,by:myMember()?.name||''});
        // 미사용 기능처럼 매번 N/A인 케이스는 이어받음

// 엑셀 내보내기: 시트 '전수 테스트'와 같은 모양(케이스 6칸 + 회차마다 메모·점검결과 2칸, 최신 회차가 왼쪽). 그대로 다시 가져올 수 있음
async function cvXlsx(X,runs){const wb=new X.Workbook(),ws=wb.addWorksheet('전수 테스트'),C=cvCases(),n=6+runs.length*2;
  const FILL={PASS:'FFDAFAE3',MINOR:'FFFFE8D1',MAJOR:'FFFFDCDC','N/A':'FFEEEEEE','NOT TESTED':'FFF5F5F5'};
  ws.addRow(['서비스','회귀테스트 케이스','점검 항목','점검 방법','예상결과','핵심여부',...runs.flatMap(r=>[cvRunName(r),''])]);
  ws.addRow(['','','','','','',...runs.flatMap(r=>[r.testers||'','점검결과'])]);
  for(let c=1;c<=6;c++)ws.mergeCells(1,c,2,c);runs.forEach((r,i)=>ws.mergeCells(1,7+i*2,1,8+i*2));
  C.forEach(c=>{const row=ws.addRow([c.svc,c.group,c.item,c.method,c.expect,c.core?'핵심':'',...runs.flatMap(r=>{const v=cvR(r,c);return [r['m_'+c.id]||(v==='PASS'?'정상':''),v||'NOT TESTED'];})]);
    runs.forEach((r,i)=>{row.getCell(8+i*2).fill={type:'pattern',pattern:'solid',fgColor:{argb:FILL[cvR(r,c)||'NOT TESTED']}};});});
  [8,18,28,48,32,8,...runs.flatMap(()=>[22,12])].forEach((w,i)=>ws.getColumn(i+1).width=w);
  ws.eachRow((row,rn)=>row.eachCell({includeEmpty:true},cell=>{cell.alignment={vertical:'top',wrapText:true};cell.border={top:{style:'thin',color:{argb:'FFDDDDDD'}},bottom:{style:'thin',color:{argb:'FFDDDDDD'}},left:{style:'thin',color:{argb:'FFDDDDDD'}},right:{style:'thin',color:{argb:'FFDDDDDD'}}};
    if(rn<=2){cell.font={bold:true};cell.alignment={vertical:'middle',horizontal:'center',wrapText:true};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF0F2F5'}};}}));
  ws.views=[{state:'frozen',xSplit:3,ySplit:2}];
  return wb.xlsx.writeBuffer();}
// 엑셀 가져오기: '전수 테스트' 탭. 머리글 줄(서비스 | 회귀테스트 케이스 | 점검 항목 | 점검 방법 | 예상결과 | 핵심여부) 오른쪽으로 회차가 2칸씩(메모 | 점검결과)
// 이미 있는 케이스(서비스·케이스·점검 항목·예상결과가 같음)와 회차(점검일·구분·담당자가 같음)는 건너뜀
async function cvImport(file){
  try{const X=await loadExcel(),wb=new X.Workbook();await wb.xlsx.load(await file.arrayBuffer());
    const ws=wb.worksheets.find(x=>x.name.includes('전수'))||wb.worksheets.find(x=>x.name.includes('회귀'));if(!ws)throw {cv:"'전수 테스트' 탭을 찾지 못했어요."};
    const g=bnGrid(ws),raw=(r,c)=>bnAt(g,r,c),at=(r,c)=>{const v=raw(r,c);return v instanceof Date?ymd(v):cvKey(v);};
    const h=g.findIndex(row=>cvKey(row[0])==='서비스'&&/케이스/.test(cvKey(row[1])))+1;if(!h)throw {cv:"'서비스 · 회귀테스트 케이스' 머리글 줄을 찾지 못했어요."};
    const rounds=[];
    for(let c=7;c<=(g[h-1]||[]).length;c+=2){const t=at(h,c);if(!t||!/점검결과/.test(at(h+1,c+1)))continue;const m=t.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);if(!m)continue;
      rounds.push({c,date:`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`,label:cvKey(t.replace(m[0],'').replace(/ver\.?/ig,'').replace(/[()]/g,' ')),testers:String(raw(h+1,c)??'').split(/\n+/).map(s=>s.trim()).filter(Boolean).join(', ')});}
    const cases=[];
    for(let r=h+2;r<=g.length;r++){const grp=at(r,2),item=at(r,3);if(!grp&&!item)continue;
      cases.push({r,svc:/^BO/i.test(at(r,1))?'BO':'FO',group:grp,item,method:String(raw(r,4)??'').trim(),expect:String(raw(r,5)??'').trim(),core:/핵심/.test(at(r,6))});}
    if(!cases.length)throw {cv:'가져올 케이스가 없어요.'};
    const keyOf=(c,seen)=>{const k=[c.svc,c.group,c.item,c.expect].map(cvKey).join('|');seen[k]=(seen[k]||0)+1;return k+'#'+seen[k];};
    const s1={},have=new Map(cvCases().map(c=>[keyOf(c,s1),c])),s2={},now=new Date().toISOString(),ids=[],newCases=[];let order=Math.max(0,...cvtCases.map(c=>c.order||0));
    for(const c of cases){const ex=have.get(keyOf(c,s2));if(ex){ids.push(ex.id);continue;}const id=evUid();ids.push(id);newCases.push([id,{svc:c.svc,group:c.group,item:c.item,method:c.method,expect:c.expect,core:c.core,order:++order,createdAt:now,updatedAt:now}]);}
    const runKey=r=>[r.date,cvKey(r.label),cvKey(r.testers)].join('|'),haveR=new Set(cvtRuns.map(runKey)),newRuns=[];
    for(const R of rounds){if(haveR.has(runKey(R)))continue;haveR.add(runKey(R));const doc={date:R.date,label:R.label,testers:R.testers,createdAt:now,updatedAt:now,by:myMember()?.name||'',imported:true};
      cases.forEach((c,i)=>{const v=at(c.r,R.c+1).toUpperCase(),rv=['PASS','MINOR','MAJOR'].includes(v)?v:/^N\/?A$/.test(v)?'N/A':'',m=String(raw(c.r,R.c)??'').trim();
        if(rv)doc['r_'+ids[i]]=rv;if(m&&m!=='정상')doc['m_'+ids[i]]=m;});
      newRuns.push([evUid(),doc]);}
    if(!newCases.length&&!newRuns.length){toast('새로 가져올 케이스·회차가 없어요.');return;}
    const skip=cases.length-newCases.length;
    evConfirm(`'${ws.name}' 탭에서 케이스 ${newCases.length}건, 회차 ${newRuns.length}개를 가져올까요?${skip?`\n이미 있는 케이스 ${skip}건은 건너뛰어요.`:''}`,async()=>{
      let n=0;const all=newCases.length+newRuns.length,step=()=>{if(++n%20===0)toast(`가져오는 중… ${n}/${all}`);};
      for(const [id,d] of newCases){await db.collection('cvt_cases').doc(id).set(d);evKeep(cvtCases,{id,...d});step();}
      for(const [id,d] of newRuns){await db.collection('cvt_runs').doc(id).set(d);evKeep(cvtRuns,{id,...d});step();}
      logChange('regress','create','import',`엑셀 가져오기 · ${file.name}`,null,null,`케이스 ${newCases.length}건 · 회차 ${newRuns.length}개`);cvst.run=null;render();toast(`케이스 ${newCases.length}건, 회차 ${newRuns.length}개를 가져왔어요.`);},'가져오기');
  }catch(err){if(err?.cv)toast(err.cv);else if(err?.code)handleWriteError(err);else toast('엑셀 파일을 읽지 못했어요. .xlsx로 받은 파일인지 확인해 주세요.');}
}

function myMember(){return actorId?members.find(m=>m.userId===actorId):null;}
function isMine(t){const m=myMember();return !!m&&(t.assigneeId===m.id||(t.coIds||[]).includes(m.id)||(!t.assigneeId&&t.assignee===m.name));}
function openWhoAmI(){
  if(!actorId){toast('로그인 정보를 확인할 수 없어 내 업무를 쓸 수 없어요.');return;}
  if(!members.length){toast('휴가 관리 › 구성원 관리에서 구성원을 먼저 추가해 주세요.');return;}
  const cur=myMember();
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="whoForm" style="max-width:420px" novalidate>
    <header><h2>내 이름 선택</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>
    <div class="body" style="grid-template-columns:1fr"><div class="f"><label for="whoSel">구성원 목록에서 나를 골라 주세요</label>
      <select id="whoSel">${members.map(m=>`<option value="${esc(m.id)}" ${cur?.id===m.id?'selected':''}>${esc(m.name)}${projOf(m.projectId)?` · ${esc(projOf(m.projectId).name)}`:''}</option>`).join('')}</select>
      <span class="hint">한 번 고르면 이 계정으로 열 때마다 '내 업무'에서 내 담당 업무만 볼 수 있어요.</span></div></div>
    <footer><span class="err" id="whoErr"></span><div class="r"><button class="btn" type="button" id="whoCancel">취소</button><button class="btn primary" type="submit" id="whoSave">저장</button></div></footer>
  </form></div>`;
  $('#xClose').onclick=$('#whoCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  $('#whoForm').addEventListener('submit',async e=>{
    e.preventDefault();const id=$('#whoSel').value;$('#whoSave').disabled=true;
    try{
      for(const m of members.filter(m=>m.userId===actorId&&m.id!==id))await db.collection('members').doc(m.id).update({userId:''});
      await db.collection('members').doc(id).update({userId:actorId});
      state.assignee='me';persistUI();closeModal();toast('내 업무로 설정했어요');render();
    }catch(err){$('#whoSave').disabled=false;handleWriteError(err,'#whoErr');}
  });
}

const avIllusHtml=cur=>`<div class="f full"><label>일러스트에서 고르기</label><div class="avIllus" id="acIllus" role="group" aria-label="프로필 일러스트">${['남자','여자'].map(g=>`<span class="avGrp">${g}</span>${AV_ILLUS.map((a,i)=>a.g!==g?'':`<button type="button" class="avOpt" data-av="${i}" aria-label="${a.label}" aria-pressed="${cur===a.uri}"><img src="${a.uri}" alt=""></button>`).join('')}`).join('')}</div></div>`;
const avIllusBind=(set)=>$('#acIllus')?.addEventListener('click',e=>{const b=e.target.closest('[data-av]');if(!b)return;set(AV_ILLUS[+b.dataset.av].uri);document.querySelectorAll('#acIllus [data-av]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});
// 권한: 관리자(wb_admins) / 일반 관리자(기본) / 외부(access 'external', 보기만)
const accessOf=m=>hasAdminApi()&&m?.userId&&acctAdmins?.has(m.userId)?'admin':m?.access==='external'?'external':'staff';
const accessBadge=m=>{const a=accessOf(m);return `<span class="roleBadge${a==='admin'?' adm':a==='external'?' ext':''}">${a==='admin'?'관리자':a==='external'?'외부':'일반 관리자'}</span>`;};
// 로그인한 사람이 외부 계정이면 화면 전체를 보기 전용으로(서버 권한은 그대로 — 화면에서만 막음)
let baseWrite=null;
function applyExternal(){if(baseWrite===null)baseWrite=canWrite;const ext=myMember()?.access==='external'&&!(typeof adminUI==='function'&&adminUI());canWrite=baseWrite&&!ext;
  const b=$('#banner');if(!b)return;if(ext){b.textContent='외부 계정은 보기만 할 수 있어요.';b.hidden=false;b.dataset.ext='1';}else if(b.dataset.ext){b.hidden=true;delete b.dataset.ext;}}
function avatarHtml(m,size=28){
  const st=`width:${size}px;height:${size}px`;
  return m?.avatar&&AVATAR_RE.test(m.avatar)?`<img class="avatar" src="${m.avatar}" alt="" style="${st}">`
    :`<span class="avatar avatarInit" style="${st};font-size:${Math.round(size*.42)}px" aria-hidden="true">${esc((m?.name||'?').trim().slice(0,1)||'?')}</span>`;
}
// 이름 앞에 프로필 원: 구성원(id·이름)으로 찾고, 없으면 첫 글자 원
const personOf=(name,id)=>(id&&memOf(id))||members.find(m=>m.name===name)||(name?{name}:null);
const who=(name,id,size=20,fallback='미지정')=>name?`<span class="who">${avatarHtml(personOf(name,id),size)}<span>${esc(name)}</span></span>`:esc(fallback);
// 담당자 여러 명: 주 담당 assignee/assigneeId(알림·집계 기준, 처음 고른 사람) + 함께 담당 coIds(구성원 id)
const asNames=t=>[t.assignee,...(t.coIds||[]).map(id=>memOf(id)?.name)].filter(Boolean);
const whoMany=(t,size=20,fb='미지정')=>{const L=[[t.assignee,t.assigneeId],...(t.coIds||[]).map(id=>[memOf(id)?.name,id])].filter(x=>x[0]);return L.length?L.map(([n,i])=>who(n,i,size)).join(''):esc(fb);};
// 고른 값 목록(구성원 id 또는 'name:이름') → 저장할 칸
const asData=vals=>{const v=vals[0]||'',m=v.startsWith('name:')?null:memOf(v);return {assignee:m?m.name:v.slice(5),assigneeId:m?m.id:'',coIds:vals.slice(1).filter(x=>!x.startsWith('name:')&&memOf(x))};};
const asValsOf=t=>{const m=taskMember(t),o=t.assignee&&!m?'name:'+t.assignee:'';return [m?.id||o,...(t.coIds||[])].filter(Boolean);};
const asLabel=vals=>vals.map(v=>v.startsWith('name:')?v.slice(5):memOf(v)?.name).filter(Boolean).join(', ');
// 담당자 고르기: 체크 목록(여러 명). 고른 순서대로 저장, 맨 처음이 주 담당
function asPick(id,vals,orphan){const L=[...(orphan?[['name:'+orphan,orphan+' (구성원 아님)']]:[]),...members.filter(m=>isShown(m)||vals.includes(m.id)).map(m=>[m.id,m.name])]; // 숨긴 구성원은 이미 지정된 경우만
  return `<details class="asPick" id="${id}" data-vals="${esc(vals.join(','))}"><summary class="sel" aria-label="담당자 (여러 명 선택)">${esc(asLabel(vals)||'담당자 미지정')}</summary><div class="asList" role="group" aria-label="담당자">${L.length?L.map(([v,n])=>`<label class="cfItem"><input type="checkbox" value="${esc(v)}" ${vals.includes(v)?'checked':''}>${esc(n)}</label>`).join(''):'<span class="legend">구성원을 먼저 추가해 주세요.</span>'}<span class="legend asHint">처음 고른 사람이 주 담당이에요</span></div></details>`;}
const asVals=sel=>(document.querySelector(sel)?.dataset.vals||'').split(',').filter(Boolean);
document.addEventListener('change',e=>{const p=e.target.closest?.('.asPick');if(!p||e.target.type!=='checkbox')return;e.stopPropagation();
  const x=e.target.value;let v=asVals('#'+p.id).filter(y=>y!==x);if(e.target.checked)v.push(x);p.dataset.vals=v.join(',');p.querySelector('summary').textContent=asLabel(v)||'담당자 미지정';
  p.dispatchEvent(new Event('aspick',{bubbles:true}));},true);
document.addEventListener('click',e=>{document.querySelectorAll('details.asPick[open]').forEach(d=>{if(!d.contains(e.target))d.open=false;});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('details.asPick[open]').forEach(d=>{d.open=false;d.querySelector('summary').focus();});});
const whoBy=(uid,size=20)=>avatarHtml(members.find(m=>m.userId===uid)||{name:actorName(uid)},size);
async function toAvatar(file){
  const img=await createImageBitmap(file);
  const n=Math.min(img.width,img.height), c=document.createElement('canvas');c.width=c.height=160;
  c.getContext('2d').drawImage(img,(img.width-n)/2,(img.height-n)/2,n,n,0,0,160,160);img.close?.();
  return c.toDataURL('image/jpeg',.85);
}
function openNotify(){

  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="nfForm" style="max-width:480px" novalidate>
    <header><h2>이메일 알림 설정</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>

      <div class="f full"><div class="nfList">${NF.map(([k,l,d])=>`<label class="nfItem"><input type="checkbox" data-nf="${k}" ${nf[k]!==false?'checked':''}><span><span class="nfName">${l}</span><span class="hint">${d}</span></span></label>`).join('')}</div>
        <span class="hint">내가 한 변경은 나에게 보내지 않아요. 몇 분 안에 생긴 변경은 한 통으로 묶어 보내요.</span></div>
    </div>
    <footer><span class="err" id="nfErr"></span><div class="r"><button class="btn" type="button" id="nfCancel">취소</button><button class="btn primary" type="submit" id="nfSave">저장</button></div></footer>
  </form></div>`;
  $('#xClose').onclick=$('#nfCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  $('#nfForm').addEventListener('submit',async e=>{
    e.preventDefault();const notify={};document.querySelectorAll('#nfForm [data-nf]').forEach(c=>notify[c.dataset.nf]=c.checked);
    $('#nfSave').disabled=true;
    try{await db.collection('members').doc(m.id).update({notify});closeModal();toast('알림 설정을 저장했어요');}catch(err){$('#nfSave').disabled=false;handleWriteError(err,'#nfErr');}
  });

/* ---------- task modal ---------- */
function closeModal(){$('#modalRoot').innerHTML='';modalDirty=false;closeWarned=false;wlRefresh=null;}
// 입력한 내용이 있으면 바깥 클릭·Esc·취소로 바로 닫지 않고 한 번 알려 줌. 한 번 더 하면 닫힘
let modalDirty=false, closeWarned=false;
$('#modalRoot').addEventListener('input',()=>{modalDirty=true;closeWarned=false;});
function askClose(){if(modalDirty&&!closeWarned){closeWarned=true;toast('저장하지 않은 내용이 있어요. 한 번 더 누르면 닫혀요.');return;}closeModal();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML)askClose();});

  if(t&&t.id){closeModal();state.mode='tasks';openPost(t.id);return;} // 기존 업무는 게시판형 상세에서 수정
  if(!projects.length){openProject(null);return;}

  const ro=!canWrite;
  const base={...t}; // 연 시점의 값. 저장할 때 다른 사람의 변경과 비교
  const people=[...new Set([...members.map(m=>m.name),...tasks.flatMap(x=>[x.assignee,x.requester])].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
  // 담당자는 구성원에서 고름. 예전 업무는 이름이 같은 구성원과 연결, 구성원에 없는 이름은 그대로 보여 줌

  const orphan=t.assignee&&!curMem?t.assignee:'';

  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="taskForm" novalidate>
    <header><h2>${isNew?(t.parentId?'업무 요청 등록':'업무 등록'):ro?'업무 상세':'업무 수정'}</h2><button class="btn ghost" type="button" id="xClose" aria-label="닫기">닫기</button></header>
    <fieldset ${ro?'disabled':''} style="border:0;margin:0;padding:0;min-width:0"><div class="body">
      <div class="f"><label for="tProject">프로젝트 <b>*</b></label><select id="tProject">${opt(projects.map(p=>[p.id,p.name]),t.projectId)}</select></div>
      <div class="f"><label for="tPart">파트 <b>*</b></label><select id="tPart">${opt(PARTS.map(p=>[p.k,p.label]),t.part)}</select></div>
      ${t.parentId&&tasks.some(x=>x.id===t.parentId)?`<div class="f full"><button type="button" class="hlink" id="tParent">게시물 열기: ${esc(rootOf(t).title)}</button></div>`:''}
      <div class="f full"><label for="tTitle">요청내용 <b>*</b></label><input id="tTitle" value="${esc(t.title||'')}" placeholder="예: 메인 배너 영역 반응형 수정" maxlength="200"></div>
      <div class="f"><label>담당자</label>${asPick('tAs',asValsOf(t),orphan)}${members.length?'':'<span class="hint">휴가 관리 › 구성원 관리에서 구성원을 먼저 추가해 주세요.</span>'}${orphan?'<span class="hint">구성원 목록에 없는 이름이에요. 구성원을 골라 연결해 주세요.</span>':''}</div>
      <div class="f"><label for="tRequester">요청자</label><input id="tRequester" list="peopleList" value="${esc(t.requester||'')}" placeholder="이름 또는 부서"><span class="hint" id="reqHint"></span></div>
      <div class="f"><label for="tStatus">진행 현황</label><select id="tStatus">${opt(STATUSES.map(s=>[s.k,s.label]),t.status)}</select></div>
      <div class="f"><label for="tPri">우선순위</label><select id="tPri">${opt(PRIS.map((l,i)=>[i,l]),t.priority??2)}</select></div>
      <div class="f full"><div class="grid3">
        <div class="f"><label for="tReq">요청일자</label><input type="date" id="tReq" value="${esc(t.requestDate||'')}"></div>

      <div class="f"><label for="tAct">실제 소요시간 (h)</label><input type="number" id="tAct" min="0" step="0.5" inputmode="decimal" value="${esc(t.actHours??'')}"></div>
      ${isNew?'':'<div class="f full wlBox" id="wlBox"></div><div class="f full cmBox" id="cmBox"></div>'}
      <!-- 자주 안 쓰는 칸은 접어 둠. 값이 있으면 펼친 채로 열림 -->
      <details class="f full moreF" ${t.jiraKey||t.rmsNo||t.rmsUrl||t.link||t.note?'open':''}><summary>상세 입력 <span class="hint">Jira · RMS · 관련 링크 · 메모</span></summary><div class="body sub">
      <div class="f"><label for="tJira">Jira 키</label><input id="tJira" value="${esc(t.jiraKey||'')}" placeholder="예: PROJ-123" autocapitalize="characters" spellcheck="false"></div>
      <div class="f"><label for="tRms">RMS 번호</label><input id="tRms" value="${esc(t.rmsNo||'')}" placeholder="예: 2026-00123" spellcheck="false"></div>
      <div class="f full"><label for="tRmsUrl">RMS 바로가기 링크</label><input id="tRmsUrl" value="${esc(t.rmsUrl||'')}" placeholder="${site?.rmsTemplate?'비워 두면 주소 규칙으로 자동 연결':'RMS 화면 주소 붙여넣기'}" spellcheck="false"></div>
      <div class="f full rmsRow"><span class="hint" id="rmsInfo"></span>${canWrite?'<button type="button" class="btn ghost" id="rmsRuleBtn">주소 규칙 설정</button>':''}<a class="rms" id="rmsGo" target="_blank" rel="noopener" hidden>RMS 바로가기 ↗</a>
        <div class="rmsRule" id="rmsRule" hidden><input id="rmsTpl" value="${esc(site?.rmsTemplate||'')}" placeholder="예: https://rms.회사.com/request/{no}" spellcheck="false"><button type="button" class="btn" id="rmsTplSave">저장</button><span class="hint">{no} 자리에 RMS 번호가 들어갑니다. 모든 업무에 공통 적용</span></div></div>
      <div class="f full"><label for="tLink">관련 링크</label><input id="tLink" value="${esc(t.link||'')}" placeholder="Figma, 설계서, Jira 등 URL"></div>
      <div class="f full"><label for="tNote">메모</label><textarea id="tNote" placeholder="요청 배경, 변경 이력, 이슈">${esc(t.note||'')}</textarea></div>
      ${t.link?`<div class="f full"><a href="${esc(/^https?:\/\//.test(t.link)?t.link:'https://'+t.link)}" target="_blank" rel="noopener" style="color:var(--accent-dark)">관련 링크 열기 ↗</a></div>`:''}
      </div></details>
    </div></fieldset>
    <datalist id="peopleList">${people.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <footer>
      <div id="delZone">${!isNew&&canWrite?'<button class="btn danger" type="button" id="tDel">삭제</button>':''}${!isNew&&canWrite&&nextPart(t.part)?`<button class="btn" type="button" id="tNext" title="같은 요청으로 다음 파트 업무를 만들어요">${esc(nextPart(t.part).label)}(으)로 넘기기</button>`:''}</div>
      <span class="err" id="tErr"></span>
      <div class="r"><button class="btn" type="button" id="tCancel">${ro?'닫기':'취소'}</button>${ro?'':`<button class="btn primary" type="submit" id="tSave">${isNew?'등록':'저장'}</button>`}</div>
    </footer>
  </form></div>`;
  $('#xClose').onclick=$('#tCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  $('#tStatus').addEventListener('change',e=>{if(e.target.value==='done'&&!$('#tDone').value)$('#tDone').value=todayStr();});
  const rmsSync=()=>{const h=rmsHref({rmsNo:$('#tRms').value,rmsUrl:$('#tRmsUrl').value});$('#rmsGo').hidden=!h;if(h)$('#rmsGo').href=h;
    $('#rmsInfo').textContent=site?.rmsTemplate?`주소 규칙: ${site.rmsTemplate}`:'RMS 주소 규칙이 없으면 링크를 직접 붙여넣어 주세요.';};
  rmsSync();['tRms','tRmsUrl'].forEach(id=>$('#'+id).addEventListener('input',rmsSync));
  $('#rmsRuleBtn')?.addEventListener('click',()=>{$('#rmsRule').hidden=!$('#rmsRule').hidden;if(!$('#rmsRule').hidden)$('#rmsTpl').focus();});
  $('#rmsTplSave')?.addEventListener('click',async()=>{
    const tpl=$('#rmsTpl').value.trim();
    if(tpl&&!tpl.includes('{no}')){$('#tErr').textContent='주소 규칙에 {no}를 넣어 주세요. 예: https://rms.회사.com/request/{no}';return;}
    try{const before={...site};await db.doc('settings/site').set({title:site.title,subtitle:site.subtitle||'',rmsTemplate:tpl,updatedAt:new Date().toISOString()});site={...site,rmsTemplate:tpl};logChange('site','update','site','RMS 주소 규칙',before,site);
      $('#tErr').textContent='';$('#rmsRule').hidden=true;rmsSync();toast('RMS 주소 규칙을 저장했습니다');}catch(err){handleWriteError(err,'#tErr');}
  });
  // 요청자는 부서명도 받아서 직접 입력으로 두되, 처음 보는 이름이면 오타 확인을 안내
  $('#tRequester').addEventListener('input',e=>{const v=e.target.value.trim();$('#reqHint').textContent=v&&!people.includes(v)?'처음 입력하는 이름이에요. 오타가 없는지 확인해 주세요.':'';});
  // 날짜별 작업 시간 기록(worklogs). 기록이 있으면 실제 소요시간 = 기록 합계
  if(!isNew){
    const wlSum=list=>Math.round(list.reduce((a,w)=>a+(+w.hours||0),0)*100)/100;
    const syncAct=async list=>{const sum=list.length?wlSum(list):'';$('#tAct').value=sum;base.actHours=sum;await db.collection('tasks').doc(t.id).update({actHours:sum,updatedAt:new Date().toISOString()});};
    wlRefresh=()=>{
      const box=$('#wlBox');if(!box)return;
      const list=wlogs.filter(w=>w.taskId===t.id).sort((x,y)=>x.date.localeCompare(y.date));
      $('#tAct').disabled=list.length>0;
      const keep={d:$('#wlDate')?.value||todayStr(),m:$('#wlMem')?.value||taskMember(t)?.id||'',h:$('#wlH')?.value||'',n:$('#wlNote')?.value||''};
      box.innerHTML=`<label>작업 시간 기록 <span class="legend">${list.length?`합계 ${hrs(wlSum(list))}h`:'아직 없음'}</span></label>
        ${list.length?`<ul class="hitems">${list.map(w=>`<li><span class="num">${md(w.date)}</span><b>${who(memOf(w.memberId)?.name||w.member||'',w.memberId,18,'')}</b><span class="legend">${esc(w.note||'')}</span><span class="num hh">${hrs(w.hours)}h</span>${canWrite?`<button type="button" class="btn ghost wlDel" data-wl="${esc(w.id)}">삭제</button>`:''}</li>`).join('')}</ul>`:''}
        ${canWrite?`<div class="wlAdd"><input type="date" id="wlDate" value="${esc(keep.d)}" aria-label="작업한 날짜"><select id="wlMem" aria-label="작업한 사람">${members.map(m=>`<option value="${esc(m.id)}" ${keep.m===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><input type="number" id="wlH" min="0.25" step="0.25" inputmode="decimal" placeholder="시간(h)" value="${esc(keep.h)}" aria-label="작업 시간"><input id="wlNote" placeholder="메모 (선택)" value="${esc(keep.n)}" maxlength="80" aria-label="메모"><button type="button" class="btn" id="wlAddBtn">기록 추가</button></div>`:''}
        <span class="hint">기록이 있으면 실제 소요시간은 합계로 자동 계산되고, 업무 시간 화면은 기록한 날짜 기준으로 집계돼요.</span><span class="err" id="wlErr"></span>`;
    };
    wlRefresh();
    const addWl=async()=>{
      const h=+$('#wlH').value, d=$('#wlDate').value, m=memOf($('#wlMem').value);
      if(!d||!m){$('#wlErr').textContent='날짜와 작업한 사람을 골라 주세요.';return;}
      if(!(h>0)||h>24){$('#wlErr').textContent='시간은 0보다 크고 24 이하로 입력해 주세요.';return;}
      $('#wlAddBtn').disabled=true;
      try{const w={taskId:t.id,memberId:m.id,member:m.name,date:d,hours:h,note:$('#wlNote').value.trim(),by:actorId||'',createdAt:new Date().toISOString()};
        await db.collection('worklogs').add(w);$('#wlH').value='';$('#wlNote').value='';
        await syncAct([...wlogs.filter(x=>x.taskId===t.id&&!(x.date===w.date&&x.createdAt===w.createdAt)),w]);
        logChange('task','update',t.id,t.title,null,null,`작업 시간 기록 ${md(d)} ${m.name} ${hrs(h)}h`);toast('작업 시간을 기록했어요');
      }catch(err){handleWriteError(err,'#wlErr');}finally{if($('#wlAddBtn'))$('#wlAddBtn').disabled=false;}
    };
    $('#wlBox').addEventListener('click',async e=>{
      if(e.target.id==='wlAddBtn'){addWl();return;}
      const del=e.target.closest('.wlDel');if(!del)return;
      if(!del.dataset.sure){del.dataset.sure='1';del.textContent='정말 삭제';return;}
      try{const id=del.dataset.wl;await db.collection('worklogs').doc(id).delete();await syncAct(wlogs.filter(x=>x.taskId===t.id&&x.id!==id));toast('기록을 삭제했어요');}catch(err){handleWriteError(err,'#wlErr');}
    });
    $('#wlBox').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();addWl();}});
  }
  // A7: 댓글(comments 컬렉션, taskId로 연결). 내가 쓴 댓글만 지울 수 있음
  const cmDraw=()=>{
    const box=$('#cmBox');if(!box)return;
    const list=comments.filter(c=>c.taskId===t.id).sort((x,y)=>x.at.localeCompare(y.at));
    resolveNames(list.map(c=>c.by)).then(()=>{if($('#cmList'))$('#cmList').querySelectorAll('[data-by]').forEach(el=>el.textContent=actorName(el.dataset.by));});
    const draft=$('#cmText')?.value||'';
    box.innerHTML=`<label>댓글 <span class="legend">${list.length?list.length+'개':''}</span></label>
      <ul class="cmList" id="cmList">${list.map(c=>`<li><div class="cmHead">${whoBy(c.by,22)}<b data-by="${esc(c.by)}">${esc(actorName(c.by))}</b><span class="legend">${esc(c.at.slice(0,16).replace('T',' '))}</span>${c.by&&c.by===actorId?`<button type="button" class="btn ghost cmDel" data-cm="${esc(c.id)}">삭제</button>`:''}</div><div class="cmBody">${rtShow(c.html,c.text)}</div></li>`).join('')}</ul>
      ${canWrite&&actorId?`<div class="cmAdd"><textarea id="cmText" rows="2" placeholder="진행 상황, 확인 요청 등을 남겨 주세요" maxlength="1000">${esc(draft)}</textarea><button type="button" class="btn" id="cmAddBtn">댓글 등록</button></div>`:''}<span class="err" id="cmErr"></span>`;
  };
  if(!isNew){
    const wlDraw=wlRefresh;wlRefresh=()=>{wlDraw?.();cmDraw();};cmDraw();
    $('#cmBox').addEventListener('click',async e=>{
      if(e.target.id==='cmAddBtn'){
        const text=$('#cmText').value.trim();if(!text){$('#cmErr').textContent='댓글 내용을 입력해 주세요.';return;}
        e.target.disabled=true;
        try{await db.collection('comments').add({taskId:t.id,text,by:actorId,at:new Date().toISOString()});$('#cmText').value='';$('#cmErr').textContent='';cmDraw();}
        catch(err){handleWriteError(err,'#cmErr');}finally{if($('#cmAddBtn'))$('#cmAddBtn').disabled=false;}
        return;}
      const del=e.target.closest('.cmDel');if(!del)return;
      if(!del.dataset.sure){del.dataset.sure='1';del.textContent='정말 삭제';return;}
      try{await wbDropComment(del.dataset.cm);}catch(err){handleWriteError(err,'#cmErr');}
    });
    // 댓글 입력은 업무 저장과 상관없으니 닫기 경고 대상에서 뺌
    $('#cmBox').addEventListener('input',e=>e.stopPropagation());
  }
  // 담당자 휴가일에 마감이 걸리면 알려 줌
  const dueSync=()=>{const av=asVals('#tAs')[0]||'',m=av.startsWith('name:')?null:memOf(av),l=m&&leaveOn(m.id,$('#tDue').value);$('#dueLeave').textContent=l?`담당자가 이날 휴가예요 (${leaveLabel(l)})`:'';};
  dueSync();$('#tAs').addEventListener('aspick',dueSync);$('#tDue').addEventListener('change',dueSync);
  // 다음 파트로 넘기기: 같은 요청을 다음 파트 업무로 새로 만듦(parentId로 연결)
  $('#tParent')?.addEventListener('click',()=>{const r=rootOf(t);closeModal();openPost(r.id);});
  $('#tNext')?.addEventListener('click',()=>{const np=nextPart(t.part),pt=partOf(t.part);
    openTask(null,{projectId:t.projectId,part:np.k,title:t.title,jiraKey:t.jiraKey||'',rmsNo:t.rmsNo||'',rmsUrl:t.rmsUrl||'',link:t.link||'',requester:t.assignee||t.requester||'',priority:t.priority??2,parentId:rootOf(t).id,prevId:t.id,note:`이전 단계: ${pt.label} · ${t.title}`});});
  setTimeout(()=>{if(!ro)$('#tTitle').focus();},0);
  $('#tDel')?.addEventListener('click',()=>{
    $('#delZone').innerHTML=`<div class="confirm">이 업무를 삭제할까요? 휴지통에서 30일 동안 복구할 수 있어요. <button class="btn danger" type="button" id="tDelYes">삭제</button><button class="btn ghost" type="button" id="tDelNo">취소</button></div>`;
    $('#tDelNo').onclick=()=>openTask(t);
    $('#tDelYes').onclick=async()=>{try{await wbDrop('tasks','task',`업무 · ${t.title||'(제목 없음)'}`,[wbDocOf('tasks',tasks.find(x=>x.id===t.id)||t)]);logChange('task','delete',t.id,t.title,null,null,'휴지통으로 옮김');closeModal();toast('휴지통으로 옮겼어요');}catch(err){handleWriteError(err,'#tErr');}};
  });
  $('#taskForm').addEventListener('submit',async e=>{
    e.preventDefault();if(ro)return;
    const num=v=>v===''?'':Math.max(0,+v);
    const data={
      projectId:$('#tProject').value,part:$('#tPart').value,title:$('#tTitle').value.trim(),
      ...asData(asVals('#tAs')),parentId:t.parentId||'',requester:$('#tRequester').value.trim(),
      jiraKey:$('#tJira').value.trim().toUpperCase(),rmsNo:$('#tRms').value.trim(),rmsUrl:$('#tRmsUrl').value.trim(),
      status:$('#tStatus').value,priority:+$('#tPri').value,
      requestDate:$('#tReq').value,dueDate:$('#tDue').value,doneDate:$('#tDone').value,
      estHours:num($('#tEst').value),actHours:num($('#tAct').value),
      link:$('#tLink').value.trim(),note:$('#tNote').value.trim(),
      updatedAt:new Date().toISOString(),createdAt:t.createdAt||new Date().toISOString()
    };
    if(!data.title){$('#tErr').textContent='요청내용을 입력해 주세요.';$('#tTitle').focus();return;}
    if(data.dueDate&&data.requestDate&&data.dueDate<data.requestDate){$('#tErr').textContent='완료 일정이 요청일자보다 빨라요. 날짜를 확인해 주세요.';$('#tDue').focus();return;}
    if(data.status!=='done'&&data.doneDate&&!t.doneDate)data.doneDate=data.doneDate; // 사용자가 직접 입력한 값 유지
    // 수정은 내가 바꾼 칸만 update로 저장해서, 같은 업무를 다른 사람이 동시에 고쳐도 서로 다른 칸은 둘 다 남게 함.
    // 같은 칸을 다른 사람이 먼저 바꿨으면 한 번 경고하고, 다시 누르면 내 값으로 저장
    // ponytail: 저장소에 트랜잭션이 없어 확인과 저장 사이 아주 짧은 순간의 충돌은 못 막음. 필요하면 doc.acquire() 잠금으로
    let patch=null, live=null;
    if(!isNew){
      live=tasks.find(x=>x.id===t.id);
      if(!live){$('#tErr').textContent='다른 사람이 이 업무를 삭제했어요. 창을 닫고 목록을 확인해 주세요.';return;}
      const same=sameVal, changed=changedKeys(data,base);
      if(!changed.length){closeModal();return;}
      const theirs=changed.filter(k=>!same(live[k],base[k])&&!same(live[k],data[k]));
      if(theirs.length&&!$('#taskForm').dataset.ok){
        const lab=k=>(HFIELDS.task.find(f=>f[0]===k)||[k,k==='assigneeId'?'담당자':k])[1];
        $('#tErr').textContent=`다른 사람이 먼저 ${[...new Set(theirs.map(lab))].join(', ')} 값을 바꿨어요. 그래도 내 값으로 저장하려면 한 번 더 누르세요.`;
        $('#taskForm').dataset.ok='1';return;
      }
      patch=Object.fromEntries(changed.map(k=>[k,data[k]]));patch.updatedAt=data.updatedAt;
    }
    $('#tSave').disabled=true;
    try{
      if(isNew){const ref=await db.collection('tasks').add(data);logChange('task','create',ref.id,data.title,null,data);
        // 다음 파트로 넘긴 업무면 이전 단계 업무를 완료로 바꿔 그 파트의 미완료 목록·현황에서 빠지게 함
        const prev=t.prevId&&tasks.find(x=>x.id===t.prevId);
        if(prev&&prev.status!=='done'){const pp={status:'done',doneDate:todayStr(),updatedAt:data.updatedAt};await db.collection('tasks').doc(prev.id).update(pp);logChange('task','update',prev.id,prev.title,prev,{...prev,...pp},`${partOf(data.part).label}(으)로 넘김`);}}
      else{await db.collection('tasks').doc(t.id).update(patch);logChange('task','update',t.id,data.title,live,{...live,...patch});}
      closeModal();toast(isNew?'등록했습니다':'저장했습니다');
    }catch(err){$('#tSave').disabled=false;handleWriteError(err,'#tErr');}
  });
}

/* ---------- projects modal ---------- */
/* ---------- 프로젝트 하나 추가·수정·순서·삭제 (업무 관리 프로젝트 탭의 + / ⋯) ---------- */
function openProject(p){
  if(!canWrite)return;
  const isNew=!p, idx=p?projects.indexOf(p):-1, color0=p?.color||PCOLORS[projects.length%4];
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="projForm" novalidate style="max-width:480px">
    <header><h2>${isNew?'프로젝트 추가':'프로젝트 수정'}</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>
    <div class="body" style="grid-template-columns:1fr">
      <div class="f"><label for="pName">프로젝트명 <b>*</b></label><input id="pName" value="${esc(p?.name||'')}" maxlength="40" placeholder="프로젝트명"></div>
      <div class="f"><label for="pClient">고객사 · 기간</label><input id="pClient" value="${esc(p?.client||'')}" maxlength="60" placeholder="고객사 · 기간"></div>
      <div class="f"><label>색</label><div class="swatches">${PCOLORS.slice(0,4).map(c=>`<button type="button" class="swatch" style="background:${c}" data-c="${c}" aria-label="색상" aria-pressed="${color0===c}"></button>`).join('')}</div></div>
      ${isNew?'':`<div class="f"><label>탭 순서</label><div style="display:flex;gap:6px"><button class="btn" type="button" id="pUp" ${idx<=0?'disabled':''}><svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg> 앞으로</button><button class="btn" type="button" id="pDown" ${idx>=projects.length-1?'disabled':''}>뒤로 <svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></div></div>`}
      <div id="pConfirm"></div>
    </div>
    <footer>${isNew?'<span></span>':'<button class="btn danger" type="button" id="pDel">삭제</button>'}<span class="err" id="pErr"></span><div class="r"><button class="btn" type="button" id="pCancel">취소</button><button class="btn primary" type="submit">저장</button></div></footer>
  </form></div>`;
  $('#xClose').onclick=$('#pCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  $('#projForm').querySelector('.swatches').addEventListener('click',e=>{const sw=e.target.closest('.swatch');if(sw)sw.parentElement.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed',s===sw));});
  $('#pName').focus();
  const move=async dir=>{
    const list=projects.slice(), j=idx+dir;[list[idx],list[j]]=[list[j],list[idx]];
    try{for(const [i,q] of list.entries())if(q.order!==i)await db.collection('projects').doc(q.id).update({order:i});
      logChange('project','update',p.id,p.name,{order:idx},{order:j},'탭 순서 변경');closeModal();toast('순서를 바꿨습니다');}
    catch(err){handleWriteError(err,'#pErr');}
  };
  $('#pUp')?.addEventListener('click',()=>move(-1));
  $('#pDown')?.addEventListener('click',()=>move(1));
  $('#pDel')?.addEventListener('click',()=>{
    const pid=p.id,n=tasks.filter(t=>t.projectId===pid).length;
    $('#pConfirm').innerHTML=`<div class="confirm">'${esc(p.name)}' 프로젝트${n?`와 업무 ${n}건`:''}을 삭제할까요? 휴지통에서 30일 동안 복구할 수 있어요. <button class="btn danger" type="button" id="pDelYes">삭제</button><button class="btn ghost" type="button" id="pDelNo">취소</button></div>`;
    $('#pDelNo').onclick=()=>$('#pConfirm').innerHTML='';
    $('#pDelYes').onclick=async()=>{
      try{await wbDrop('tasks','project',`프로젝트 · ${p.name}${n?` (업무 ${n}건)`:''}`,[wbDocOf('projects',projects.find(x=>x.id===pid)||p),...tasks.filter(t=>t.projectId===pid).map(t=>wbDocOf('tasks',t)),...assigns.filter(a=>a.projectId===pid).map(a=>wbDocOf('assignments',a))]);
        logChange('project','delete',pid,p.name,null,null,`${n?`업무 ${n}건과 함께 `:''}휴지통으로 옮김`);
        if(state.project===pid)state.project='all';closeModal();toast('휴지통으로 옮겼어요');}
      catch(err){handleWriteError(err,'#pErr');}
    };
  });
  $('#projForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const name=$('#pName').value.trim(), client=$('#pClient').value.trim(), color=$('#projForm .swatch[aria-pressed="true"]')?.dataset.c||color0;
    if(!name){$('#pErr').textContent='프로젝트명을 입력해 주세요.';$('#pName').focus();return;}
    try{
      if(isNew){const ref=await db.collection('projects').add({name,color,client,order:Date.now()});logChange('project','create',ref.id,name,null,{name,client});}
      else if(p.name!==name||p.color!==color||(p.client||'')!==client){await db.collection('projects').doc(p.id).update({name,color,client});logChange('project','update',p.id,name,p,{name,color,client});}
      closeModal();toast('프로젝트를 저장했습니다');
    }catch(err){handleWriteError(err,'#pErr');}
  });
}

/* ---------- leave (휴가 관리) ---------- */
// 반반차(오전·오후) = 2시간 = 0.25일 (1일 8시간 기준). 여러 날 휴가는 주말을 빼고 계산하며, 공휴일은 '차감 일수'에서 직접 조정
const LEAVE_TYPES=[
  {k:'annual',label:'연차',days:1,deduct:true,multi:true,cls:'lt-a'},
  {k:'am',label:'오전 반차',days:.5,deduct:true,cls:'lt-h'},
  {k:'pm',label:'오후 반차',days:.5,deduct:true,cls:'lt-h'},
  {k:'qam',label:'오전 반반차',days:.25,deduct:true,quarter:true,cls:'lt-q'},
  {k:'qpm',label:'오후 반반차',days:.25,deduct:true,quarter:true,cls:'lt-q'},
  {k:'quarter',label:'반반차',days:.25,deduct:true,quarter:true,legacy:true,cls:'lt-q'},
  {k:'sick',label:'병가',days:1,deduct:false,multi:true,cls:'lt-o'},
  {k:'family',label:'경조사',days:1,deduct:false,multi:true,cls:'lt-o'},
  {k:'other',label:'공가·기타',days:1,deduct:false,multi:true,cls:'lt-o'}
];
let members=[], leaves=[];
const lstate={year:+todayStr().slice(0,4),month:todayStr().slice(0,7),member:'all',project:'all'};
const ltype=k=>LEAVE_TYPES.find(t=>t.k===k)||LEAVE_TYPES[0];
const memOf=id=>members.find(m=>m.id===id);
const shownMembers=()=>members.filter(m=>!m.hideInWork);
const isShown=m=>!!m&&!m.hideInWork;
const memberParts=()=>[...PARTS,{k:'planPM',label:'기획 PM',c:'#6c4bd8'},{k:'planPL',label:'기획 PL',c:'#8b6be8'}]; // 파트 설정이 바뀌어도 따라감
const memberPartOf=k=>memberParts().find(x=>x.k===k);
const nextPart=k=>PARTS[PARTS.findIndex(p=>p.k===k)+1]||null;
// 그 구성원이 그날 휴가인지 (휴가 기록 또는 undefined)
const leaveOn=(memberId,d)=>d?leaves.find(l=>l.memberId===memberId&&leaveDates(l).includes(d)):undefined;
const taskMember=t=>(t.assigneeId&&memOf(t.assigneeId))||members.find(m=>m.name===t.assignee);
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const isWeekend=s=>{const g=new Date(s+'T00:00:00').getDay();return g===0||g===6;};
function eachDay(a,b){const out=[];if(!a)return out;const d=new Date(a+'T00:00:00'),e=new Date((b&&b>=a?b:a)+'T00:00:00');while(d<=e&&out.length<370){out.push(ymd(d));d.setDate(d.getDate()+1);}return out;}
function autoDays(type,a,b){const t=ltype(type);return t.multi?eachDay(a,b).filter(d=>!isWeekend(d)).length:t.days;}
const leaveDays=l=>(l.days===''||l.days==null||isNaN(l.days))?autoDays(l.type,l.date,l.endDate):+l.days;
const leaveDates=l=>ltype(l.type).multi?eachDay(l.date,l.endDate).filter(d=>!isWeekend(d)):(l.date?[l.date]:[]);
const fmtDays=n=>(+n).toFixed(2).replace(/\.?0+$/,'');
const quotaOf=(m,y)=>{const q=m?.quotas?.[String(y)];return q===''||q==null||isNaN(q)?null:+q;};
const leaveLabel=l=>ltype(l.type).label+(ltype(l.type).quarter&&l.time?` ${l.time}`:'');

function memberStats(m,y){
  const t=todayStr(), mine=leaves.filter(l=>l.memberId===m.id&&(l.date||'').startsWith(String(y)));
  let used=0,planned=0,other=0;
  for(const l of mine){const d=leaveDays(l);if(!ltype(l.type).deduct){other+=d;continue;}if(l.date<=t)used+=d;else planned+=d;}
  const q=quotaOf(m,y);
  return {used,planned,other,quota:q,remain:q==null?null:q-used-planned};
}

function renderTodayOff(){
  const el=$('#todayOff');
  if(!storeReady||!members.length){el.textContent='';return;}
  const t=todayStr();
  const off=leaves.filter(l=>leaveDates(l).includes(t)&&isShown(memOf(l.memberId)));
  el.innerHTML=off.length?`오늘 부재 <b>${off.length}명</b> · ${off.map(l=>`${who(memOf(l.memberId).name,l.memberId,20)}(${esc(leaveLabel(l))})`).join(', ')}`:'오늘 부재자 없음';
}

// 일정·연차 관리(예전 '일정 관리' + '연차 관리'): 탭 = 달력(일정·연차 함께 등록·수정 + 연차 현황) / 연차 현황 / 구성원 타임라인
let lsub=(()=>{try{return localStorage.getItem('wb-lsub')||'cal';}catch(e){return 'cal';}})(),lvSumOpen=true;
function annualTable(Y){
  const rows=shownMembers().sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(m=>{const s=memberStats(m,Y);
    return `<tr><td class="nowrap"><b>${who(m.name,m.id,24)}</b></td><td class="r num">${fmtDays(s.used)}일</td><td class="r num">${fmtDays(s.planned)}일</td><td class="r num">${s.other?fmtDays(s.other)+'일':'—'}</td></tr>`;}).join('');
  return `<div class="tablebox"><table class="stable"><thead><tr><th>이름</th><th class="r">사용</th><th class="r">예정</th><th class="r">기타 휴가</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
// 구성원 타임라인: 줄 = 구성원, 칸 = 그 달 날짜. 맨 위 줄은 일정 수
function leaveTimeline(month){
  const [y,m]=month.split('-').map(Number),n=new Date(y,m,0).getDate(),T=todayStr(),days=[...Array(n)].map((_,i)=>`${month}-${String(i+1).padStart(2,'0')}`);
  const cls=d=>[isWeekend(d)?'we':'',d===T?'today':''].join(' ');
  const short=l=>{const t=ltype(l.type);return t.k==='annual'?'연차':t.days===.5?'반차':t.days===.25?'반반':t.label.slice(0,2);};
  const evRow=`<tr class="tlEv"><td class="tlName"><b>일정</b></td>${days.map(d=>{const L=events.filter(e=>(e.kind==='event'||e.kind==='project')&&e.start<=d&&(e.end||e.start)>=d);
    return `<td class="${cls(d)}">${L.length?`<span class="tlDot" title="${esc(L.map(e=>e.title).join(', '))}">${L.length}</span>`:''}</td>`;}).join('')}<td></td></tr>`;
  const rows=shownMembers().sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(mb=>{const s=memberStats(mb,y);
    return `<tr><td class="tlName">${who(mb.name,mb.id,20)}</td>${days.map(d=>{const l=leaveOn(mb.id,d);return `<td class="${cls(d)}">${l?`<span class="tlLv ${ltype(l.type).cls}" data-lid="${esc(l.id)}" tabindex="0" title="${esc(mb.name+' · '+leaveLabel(l)+(l.note?' · '+l.note:''))}">${short(l)}</span>`:''}</td>`;}).join('')}</tr>`;}).join('');
  return `<div class="panel"><h3><div class="calnav"><button class="btn ghost" type="button" id="lPrev" aria-label="이전 달"><svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><span class="mlabel">${y}.${String(m).padStart(2,'0')}</span><button class="btn ghost" type="button" id="lNext" aria-label="다음 달"><svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button><button class="btn ghost sm" type="button" id="lThis">이번 달</button></div><span class="legend">칸을 누르면 그 연차를 열어요</span></h3>
    <div class="statWrap"><table class="tlTable"><thead><tr><th class="tlName">이름</th>${days.map(d=>`<th class="${cls(d)}">${+d.slice(8)}<br><small>${'일월화수목금토'[new Date(d+'T00:00:00').getDay()]}</small></th>`).join('')}</tr></thead><tbody>${evRow}${rows}</tbody></table></div></div>`;
}
// 달력에서 날짜(또는 기간)를 고르면: 일정 등록 / 연차 신청 중 선택
function calAsk(a,b){const f=d=>`${+d.slice(5,7)}/${+d.slice(8,10)}`,rng=b&&b!==a?`${f(a)} ~ ${f(b)}`:f(a||todayStr());
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><div class="modal" style="max-width:400px"><header><h2>무엇을 등록할까요? <span class="legend">${esc(rng)}</span></h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>
    <div class="body" style="grid-template-columns:1fr 1fr"><button class="btn" type="button" id="askEv">일정 등록</button><button class="btn primary" type="button" id="askLv">연차 신청</button></div></div></div>`;
  $('#xClose').onclick=closeModal;$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal();});
  $('#askEv').onclick=()=>{closeModal();openSched(null,a,b);};$('#askLv').onclick=()=>{closeModal();openLeave(null,a,b,true);};setTimeout(()=>$('#askLv').focus(),0);}
function renderLeave(){
  const area=$('#leaveArea');
  if(!storeReady){area.innerHTML=`<div class="empty"><h2>일정을 불러오는 중입니다</h2></div>`;return;}
  if(!members.length){
    area.innerHTML=`<div class="empty"><h2>구성원을 먼저 등록해 주세요</h2><p>사람별로 연간 연차 일수를 정해 두면, 연차·반차·반반차를 등록할 때마다 사용·예정·잔여 일수가 자동으로 계산됩니다.</p>${isAdminUser()?'<button class="btn primary" type="button" id="lEmptyAdd">구성원 추가</button>':''}</div>`;
    $('#lEmptyAdd')?.addEventListener('click',openMembers);return;
  }
  const Y=+lstate.month.slice(0,4);
  const tabs=`<div class="vbar"><div class="vtabs" role="tablist">${[['cal','달력'],['status','연차 현황'],['line','구성원 타임라인']].map(([k,l])=>`<button type="button" class="vtab" role="tab" data-lsub="${k}" aria-selected="${lsub===k}">${l}</button>`).join('')}</div></div>`;
  const tools=`<div class="rtool"><span class="spacer"></span>${canWrite?'<button class="btn" type="button" id="lAddLeave">+ 연차 신청</button>':''}</div>`;
  area.innerHTML=tools+tabs+(lsub==='status'?`<div class="panel lvStat"><h3><span>${Y}년 연차 현황</span></h3>${annualTable(Y)}</div>`
    :lsub==='line'?leaveTimeline(lstate.month)
    :`${calPanel(lstate,calFilter(),true,false)}<details class="panel lvSum"${lvSumOpen?' open':''}><summary><b>${Y}년 연차 현황</b><span class="legend">사용 · 예정 · 잔여</span></summary>${annualTable(Y)}</details>`);
  // 타임라인은 오늘 날짜가 보이게 가로로 맞춤
  const td=lsub==='line'&&area.querySelector('.tlTable th.today'),wrap=td&&td.closest('.statWrap');if(wrap)wrap.scrollLeft=Math.max(0,td.offsetLeft-wrap.clientWidth/2);
}
onArea('#leaveArea','click',e=>{const t=e.target.closest('[data-lsub]');if(t){lsub=t.dataset.lsub;try{localStorage.setItem('wb-lsub',lsub);}catch(er){}render();return;}if(e.target.closest('#lAddLeave'))openLeave(null,undefined,undefined,true);});
$('#leaveArea').addEventListener('toggle',e=>{if(e.target.classList?.contains('lvSum'))lvSumOpen=e.target.open;},true);
// 월 달력 하나: 일정 관리(lstate, 보기 필터 state.cf)와 연차 관리(astate, 연차만)가 같이 씀
function calPanel(st,cf,withFilters,leaveRo){
  const T=todayStr(), [cy,cm]=st.month.split('-').map(Number);
  const first=new Date(cy,cm-1,1), start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const last=new Date(cy,cm,0), end=new Date(last);end.setDate(last.getDate()+(7-((last.getDay()+6)%7)-1));
  const a0=ymd(start), b0=ymd(end);
  const byDay={};const push=(k,html)=>(byDay[k]=byDay[k]||[]).push(html);
  if(cf.leave)for(const l of [...leaves].filter(l=>isShown(memOf(l.memberId))).sort((a,b)=>memOf(a.memberId).name.localeCompare(memOf(b.memberId).name,'ko')))for(const d of leaveDates(l))
    push(d,`<div class="lv ${ltype(l.type).cls}${leaveRo?' lvRo':''}" ${leaveRo?'':`data-lid="${esc(l.id)}" tabindex="0"`} title="${esc(memOf(l.memberId).name+' · '+leaveLabel(l)+(l.note?' · '+l.note:''))}">${avatarHtml(memOf(l.memberId),14)}${esc(memOf(l.memberId).name)} ${esc(ltype(l.type).label)}</div>`);
  if(cf.event)for(const ev of events.filter(e=>e.kind==='project'||e.kind==='event')){const p=ev.kind==='project'?projOf(ev.projectId):null;for(let d=ev.start;d&&d<=(ev.end||ev.start);d=addDays(d,1))
    push(d,`<div class="ev evp" data-eid="${esc(ev.id)}" data-date="${d}" tabindex="0" style="border-left-color:${esc((ev.kind==='event'?ev.color:p?.color)||'var(--muted)')}" title="${esc((p?p.name+' · ':'')+ev.title+(ev.note?' · '+ev.note:''))}">${esc(ev.title)}</div>`);}
  if(cf.event)for(const ev of events.filter(e=>e.kind==='deploy')){const p=projOf(ev.projectId);for(const d of deployDates(ev,a0,b0))
    push(d,`<div class="ev evd" data-eid="${esc(ev.id)}" data-date="${d}" tabindex="0" title="${esc((p?p.name+' · ':'')+ev.title)}"><span class="evtag">배포</span>${esc(p?.name||ev.title)}</div>`);}
  if(cf.due)for(const t of workItems().filter(t=>t.status!=='done'&&t.dueDate&&t.dueDate>=a0&&t.dueDate<=b0))
    push(t.dueDate,`<div class="ev evdue" title="${esc('마감 · '+t.title+' · '+(asNames(t).join(', ')||'미지정'))}">마감 · ${esc(t.title)}</div>`);
  let cells='';
  for(const d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const k=ymd(d), items=byDay[k]||[];
    const cls=['day',d.getMonth()!==cm-1?'out':'',isWeekend(k)?'we':'',k===T?'today':'',canWrite?'can':''].join(' ');
    cells+=`<div class="${cls}" data-date="${k}"><span class="dn">${d.getDate()}</span>${items.slice(0,4).join('')}${items.length>4?`<button type="button" class="more" data-more="${k}">+${items.length-4}건</button>`:''}</div>`;
  }
  lvDayItems=byDay;
  return `<div class="panel">
        <h3><div class="calnav"><button class="btn ghost" type="button" id="lPrev" aria-label="이전 달"><svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><span class="mlabel">${cy}.${String(cm).padStart(2,'0')}</span><button class="btn ghost" type="button" id="lNext" aria-label="다음 달"><svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button><button class="btn ghost" type="button" id="lThis">이번 달</button></div>
          ${withFilters?`<span class="calFilters">${[['event','일정'],['leave','연차'],['due','업무 마감']].map(([k,l])=>`<label class="cfItem"><input type="checkbox" data-cf="${k}" ${cf[k]?'checked':''}>${l}</label>`).join('')}</span>`:''}</h3>
        <div class="cal">${['월','화','수','목','금','토','일'].map((d,i)=>`<div class="dow ${i>4?'we':''}">${d}</div>`).join('')}${cells}</div>
    </div>`;
}

onArea('#leaveArea','change',e=>{const c=e.target.dataset.cf;if(c){state.cf={...calFilter(),[c]:e.target.checked};persistUI();render();return;}});
// 달력에서 시작일을 누른 채 끌어 종료일에서 놓으면 그 기간으로 휴가 등록 창을 엶
let lvDrag=null, lvDragDone=false;
const lvMark=(sel,a,b)=>document.querySelectorAll(sel+' .day[data-date]').forEach(d=>d.classList.toggle('pick',!!a&&d.dataset.date>=(a<b?a:b)&&d.dataset.date<=(a<b?b:a)));
document.addEventListener('pointerup',()=>{if(!lvDrag)return;const {a,b,sel,only}=lvDrag;lvDrag=null;lvMark(sel);if(a!==b){lvDragDone=true;calNew(only,a<b?a:b,a<b?b:a);}});
const calNew=(only,a,b)=>only==='ask'?calAsk(a,b):only?openLeave(null,a,b,true):openSched(null,a,b);
function bindCal(sel,st,only){
  onArea(sel,'pointerdown',e=>{const day=e.target.closest('.day[data-date]');if(!day||!canWrite||e.target.closest('[data-lid],[data-eid],[data-more],.evdue,.lvRo')||e.button!==0)return;lvDrag={a:day.dataset.date,b:day.dataset.date,sel,only};});
  onArea(sel,'pointerover',e=>{if(!lvDrag)return;const day=e.target.closest('.day[data-date]');if(!day)return;lvDrag.b=day.dataset.date;lvMark(sel,lvDrag.a,lvDrag.b);});
  onArea(sel,'click',e=>{
    if(lvDragDone){lvDragDone=false;return;}
    const id=e.target.id;
    if(id==='lPrev'||id==='lNext'){const [y,m]=st.month.split('-').map(Number);const d=new Date(y,m-1+(id==='lNext'?1:-1),1);st.month=ymd(d).slice(0,7);st.year=d.getFullYear();render();return;}
    if(id==='lThis'){st.month=todayStr().slice(0,7);st.year=+todayStr().slice(0,4);render();return;}
    const mo=e.target.closest('[data-more]');if(mo){openDayList(mo.dataset.more);return;}
    const it=e.target.closest('[data-lid],[data-eid]');if(it){calItemOpen(it,it.closest('.day')?.dataset.date);return;}
    if(e.target.closest('.evdue,.lvRo'))return; // 업무 마감·(일정 관리의) 연차는 표시만
    const day=e.target.closest('.day');if(day&&canWrite)calNew(only,day.dataset.date);
  });
  onArea(sel,'keydown',e=>{if(e.key!=='Enter')return;const it=e.target.closest('[data-lid],[data-eid]');if(it)calItemOpen(it,it.closest('.day')?.dataset.date);});
}

const EVT_TABS=[['events','이벤트 관리'],['banner','배너 구좌 관리'],['pm','프리마케팅 관리'],['benefit','혜택 관리']];

function evIdUrl(id){const v=String(id||'').trim();if(EV_LINKS[v])return EV_LINKS[v];const c=v.match(/^CC(\d{1,10})$/i);if(c)return `https://www.uplusmvno.com/benefit/affiliate-card?mvnopPpCprtCardId=CC${c[1].padStart(10,'0')}`;
  return /^\d{1,10}$/.test(v)?`https://www.uplusmvno.com/benefit/event/detail?mvnopEvetId=EV${v.padStart(10,'0')}`:'';}

const evDevId=v=>{v=String(v||'').trim();const q=v.match(/mvnopEvetId=([A-Za-z0-9]+)/);if(q)v=q[1];return /^\d{1,10}$/.test(v)?'EV'+v.padStart(10,'0'):/^EV\d+$/i.test(v)?v.toUpperCase():v;};

// 연도를 빼면 그 시트의 연도. 못 읽으면 null
function evParseDate(v,mkey){v=String(v||'').trim();if(!v)return '';const Y=+(mkey||todayStr()).slice(0,4);let y,m,d,n;
  const dg=v.replace(/\D/g,''),parts=v.split(/[^\d]+/).filter(Boolean);
  if(parts.length===1){if(dg.length===8)[y,m,d]=[dg.slice(0,4),dg.slice(4,6),dg.slice(6)];else if(dg.length===6)[y,m,d]=['20'+dg.slice(0,2),dg.slice(2,4),dg.slice(4)];else if(dg.length===4||dg.length===3)[y,m,d]=[Y,dg.slice(0,-2),dg.slice(-2)];else return null;}

  return `${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}`;}
const evIsoToDot=s=>s?s.replaceAll('-','.'):'';

const evNextKey=k=>{const [y,m]=k.split('-').map(Number);return m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`;};

function evDeadlines(rows,soon=7){const T=new Date(todayStr()+'T00:00:00'),over=[],near=[];
