const hstate={entity:'all',action:'all',actor:'all',range:'30',q:''};
const HFIELDS={
  task:[['projectId','프로젝트'],['part','파트'],['title','요청내용'],['jiraKey','Jira 키'],['rmsNo','RMS 번호'],['rmsUrl','RMS 링크'],['assignee','담당자'],['requester','요청자'],['status','진행 현황'],['priority','우선순위'],['requestDate','요청일자'],['dueDate','완료 일정'],['doneDate','실제 완료일'],['estHours','예상 소요(h)'],['actHours','실제 소요(h)'],['link','관련 링크'],['note','메모']],
  project:[['name','이름'],['client','고객사·기간'],['color','색상']],
  part:[['name','이름'],['color','색상'],['order','순서']],
  member:[['name','이름'],['projectId','프로젝트'],['part','파트'],['quota','연차(일)']],
  leave:[['memberId','구성원'],['type','종류'],['date','날짜'],['endDate','종료일'],['time','사용 시간'],['days','일수'],['note','메모']],
  assign:[['projectId','프로젝트'],['memberId','구성원'],['part','파트'],['role','역할'],['start','시작일'],['end','종료일'],['rate','투입률(%)'],['note','메모']],
  site:[['title','제목'],['subtitle','설명'],['rmsTemplate','RMS 주소 규칙']],
  report:[]
};
const HENT={backup:'백업',task:'업무',assign:'투입 인력',project:'프로젝트',part:'파트',member:'구성원',leave:'휴가',report:'주간 보고',site:'제목·설명'};
const HACT={create:['등록','s-done'],update:['수정','s-doing'],delete:['삭제','h-del'],confirm:['확정','s-review'],unconfirm:['확정 해제','s-wait'],restore:['복원','s-review']};
function hval(f,v){
  if(v===''||v==null)return '';
  switch(f){
    case 'projectId':return projOf(v)?.name||'(삭제된 프로젝트)';
    case 'part':return partOf(v).label;
    case 'status':return statusOf(v).label;
    case 'priority':return PRIS[v]??String(v);
    case 'memberId':return memOf(v)?.name||'(삭제된 구성원)';
    case 'type':return ltype(v).label;
    case 'color':return '■'+v;
    case 'order':return `${+v+1}번째`;
  }
  const s=String(v);return s.length>80?s.slice(0,80)+'…':s;
}
function logChange(entity,action,id,label,before,after,extra){
  if(!db||!canWrite)return;
  const fields=HFIELDS[entity]||[];
  let changes=[];
  if(action==='update'){
    changes=fields.filter(([f])=>String(before?.[f]??'')!==String(after?.[f]??'')).map(([f,l])=>({f,l,from:hval(f,before?.[f]),to:hval(f,after?.[f])}));
    if(!changes.length&&!extra)return;
  }else if(action==='create'){
    changes=fields.filter(([f])=>f!=='color'&&f!=='order'&&f!=='title'&&f!=='name'&&after?.[f]!==''&&after?.[f]!=null).slice(0,6).map(([f,l])=>({f,l,from:'',to:hval(f,after[f])}));
  }
  db.collection('history').add({at:new Date().toISOString(),actor:actorId||'',entity,action,entityId:id||'',label:String(label||'').slice(0,120),changes,extra:extra||''}).catch(()=>{});
}
function startHistory(){
  if(historySub||!db||!canWrite)return;
  historySub=db.collection('history').orderBy('at','desc').limit(1000).onSnapshot(s=>{historyItems=s.docs.map(x=>({id:x.id,...x.data()}));historyReady=true;if(state.mode==='history')render();},()=>{historyReady=true;});
  // 180일 지난 기록은 서버 예약 작업(wb-cleanup)이 매일 정리
}
async function resolveNames(ids){
  const need=ids.filter(id=>id&&!nameAsked.has(id));if(!need.length||!userCap?.profiles)return;
  need.forEach(id=>nameAsked.add(id));
  try{const ps=await userCap.profiles(need);for(const id of need)nameCache[id]=ps?.[id]?.name||'';if(state.mode==='history')render();}catch(e){}
}
const actorName=id=>id?((nameCache[id]||'')||(id===actorId?'나':'이름 확인 불가'))+(id===actorId&&nameCache[id]?' (나)':''):'알 수 없음';

function renderHistory(){
  const area=$('#historyArea');
  if(!canWrite){area.innerHTML=`<div class="empty"><h2>편집 권한이 있는 사람만 볼 수 있습니다</h2></div>`;return;}
  if(!historyReady){area.innerHTML=`<div class="empty"><h2>변경 이력을 불러오는 중입니다</h2></div>`;return;}
  resolveNames([...new Set(historyItems.map(h=>h.actor))]);
  const since=hstate.range==='all'?'':(()=>{const d=new Date();d.setDate(d.getDate()-(+hstate.range));return d.toISOString();})();
  const q=hstate.q.trim().toLowerCase();
  const list=historyItems.filter(h=>(hstate.entity==='all'||h.entity===hstate.entity)&&(hstate.action==='all'||h.action===hstate.action)&&(hstate.actor==='all'||h.actor===hstate.actor)&&(!since||h.at>=since)&&
    (!q||[h.label,h.extra,...(h.changes||[]).flatMap(c=>[c.l,c.from,c.to])].some(v=>(v||'').toLowerCase().includes(q))));
  const actors=[...new Set(historyItems.map(h=>h.actor).filter(Boolean))];
  const sel=(id,cur,opts)=>`<select class="sel" id="${id}">${opts.map(([k,v])=>`<option value="${esc(k)}" ${cur===k?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
  const val=v=>v.startsWith('■')?`<span class="hsw" style="background:${esc(v.slice(1))}"></span>`:(v?esc(v):'<span class="legend">(비어 있음)</span>');
  const byDay={};for(const h of list){const d=new Date(h.at);const k=ymd(d);(byDay[k]=byDay[k]||[]).push(h);}
  const days=Object.keys(byDay).sort().reverse();
  area.innerHTML=`
    <div class="rtool">
      ${sel('hEnt',hstate.entity,[['all','전체 대상'],...Object.entries(HENT)])}
      ${sel('hAct',hstate.action,[['all','전체 작업'],...Object.entries(HACT).map(([k,v])=>[k,v[0]])])}
      ${sel('hActor',hstate.actor,[['all','전체 사용자'],...actors.map(a=>[a,actorName(a)])])}
      ${sel('hRange',hstate.range,[['7','최근 7일'],['30','최근 30일'],['90','최근 90일'],['all','전체 (최대 180일)']])}
      <input class="search" id="hQ" type="search" placeholder="업무명·이름·변경 내용 검색" value="${esc(hstate.q)}">
      <span class="spacer"></span><span class="legend">${list.length}건</span>
    </div>
    ${list.length?days.map(k=>{const d=new Date(k+'T00:00:00');return `<section class="hday"><h3>${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})${k===todayStr()?' · 오늘':''}</h3><ol class="hlist">${byDay[k].map(h=>{
      const [an,ac]=HACT[h.action]||[h.action,'s-wait'];const t=new Date(h.at);
      const link=h.entity==='task'&&h.action!=='delete'&&tasks.some(x=>x.id===h.entityId);
      return `<li class="hitem"><span class="htime num">${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</span>
        <div class="hbody"><div class="hline"><b>${esc(actorName(h.actor))}</b><span class="pill ${ac}">${an}</span><span class="legend">${esc(HENT[h.entity]||h.entity)}</span>
        ${link?`<button type="button" class="hlink" data-task="${esc(h.entityId)}">${esc(h.label||'(제목 없음)')}</button>`:`<span class="hlabel">${esc(h.label||'')}</span>`}</div>
        ${(h.changes||[]).length?`<ul class="hchg">${h.changes.map(c=>`<li><span class="hf">${esc(c.l)}</span>${h.action==='update'?`${val(c.from||'')}<span class="harr">→</span>`:''}${val(c.to||'')}</li>`).join('')}</ul>`:''}
        ${h.extra?`<div class="legend">${esc(h.extra)}</div>`:''}</div></li>`;}).join('')}</ol></section>`;}).join(''):`<div class="empty"><h2>${historyItems.length?'조건에 맞는 이력이 없습니다':'아직 기록된 변경 이력이 없습니다'}</h2><p>${historyItems.length?'필터를 바꿔 보세요.':'이제부터 업무·프로젝트·파트·구성원·휴가·주간 보고·제목을 등록하거나 수정하면 여기에 자동으로 쌓입니다.'}</p></div>`}`;
}
onArea('#historyArea','change',e=>{const m={hEnt:'entity',hAct:'action',hActor:'actor',hRange:'range'}[e.target.id];if(m){hstate[m]=e.target.value;render();}});
let hqT;onArea('#historyArea','input',e=>{if(e.target.id!=='hQ')return;clearTimeout(hqT);hqT=setTimeout(()=>{hstate.q=e.target.value;renderHistory();liftTools();const i=$('#hQ');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},200);});
onArea('#historyArea','click',e=>{const b=e.target.closest('[data-task]');if(b)openTask(tasks.find(t=>t.id===b.dataset.task));});

function handleWriteError(err,sel){
  const msg=err?.code==='invalid_argument'?'수정 권한이 없거나 입력값이 올바르지 않습니다.':err?.code==='quota_exceeded'?'저장 공간이 가득 찼습니다. 완료된 업무를 정리해 주세요.':'저장하지 못했습니다. 잠시 후 다시 시도해 주세요.';
  if(err?.code==='invalid_argument'&&!sel){canWrite=false;render();}
  if(sel&&$(sel))$(sel).textContent=msg;else toast(msg);
}

/* ---------- boot ---------- */
render();
(async()=>{
  if(!window.claude?.use){storeReady=true;$('#banner').textContent='저장소에 연결되지 않아 읽기 전용으로 표시됩니다.';$('#banner').hidden=false;render();return;}
  const [d,u,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
  db=d;downloads=dl;
  if(!db){storeReady=true;$('#banner').textContent='로그인한 팀원만 업무를 볼 수 있습니다. claude.ai에 로그인 후 다시 열어 주세요.';$('#banner').hidden=false;render();return;}
  let w=null;try{w=u?await u.can('data.write'):null;}catch(e){}
  canWrite=w!==false;userCap=u;try{actorId=u?await u.id():null;}catch(e){}
  if(w===false){$('#banner').textContent='보기 전용 권한입니다. 업무를 등록·수정하려면 공유한 사람에게 편집 권한을 요청하세요.';$('#banner').hidden=false;}
  let got=0;const ready=()=>{if(++got>=10)storeReady=true;};
  const onErr=e=>{if(e?.code!=='revoked'){$('#banner').textContent='업무 목록을 불러오지 못했습니다. 페이지를 새로 고쳐 주세요.';$('#banner').hidden=false;}};
  let pr=false,tr=false,ar=false,mr=false,lr=false,rr=false,sr=false;
  db.collection('assignments').onSnapshot(s=>{assigns=s.docs.map(x=>({id:x.id,...x.data()}));if(!sr){sr=true;ready();}render();},onErr);
  startHistory();
  db.doc('settings/site').onSnapshot(s=>{site=s.exists?{...SITE_DEFAULT,...s.data()}:{...SITE_DEFAULT};renderBrand();},()=>{});
  db.doc('settings/menus').onSnapshot(s=>{menuCfg=s.exists?s.data()||{}:{};navKey='';if(storeReady)render();},()=>{});
  db.collection('reports').onSnapshot(s=>{reports=s.docs.map(x=>({id:x.id,...x.data()}));if(!rr){rr=true;ready();}render();},onErr);
  db.collection('members').onSnapshot(s=>{members=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));if(!mr){mr=true;ready();}render();},onErr);
  db.collection('leaves').onSnapshot(s=>{leaves=s.docs.map(x=>({id:x.id,...x.data()}));if(!lr){lr=true;ready();}render();},onErr);
  db.collection('events').onSnapshot(s=>{events=s.docs.map(x=>({id:x.id,...x.data()}));render();},onErr);
  db.collection('parts').onSnapshot(s=>{
    if(s.docs.length){PARTS=s.docs.map(x=>{const d=x.data();return {k:x.id,label:d.name||'이름 없음',c:d.color||PART_COLORS[4],order:d.order??0};}).sort((a,b)=>a.order-b.order);partsStored=true;}
    else{PARTS=DEFAULT_PARTS.slice();partsStored=false;}
    if(!ar){ar=true;ready();}render();},onErr);
  db.collection('projects').onSnapshot(s=>{projects=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.order??0)-(b.order??0));if(!pr){pr=true;ready();}render();},onErr);
  db.collection('tasks').onSnapshot(s=>{tasks=s.docs.map(x=>({id:x.id,...x.data()}));if(!tr){tr=true;ready();}render();},onErr);
  let wr=false;db.collection('worklogs').onSnapshot(s=>{wlogs=s.docs.map(x=>({id:x.id,...x.data()}));if(!wr){wr=true;ready();}wlRefresh?.();render();},onErr);
  // ponytail: 댓글·템플릿을 전부 구독. 수천 건이 넘으면 업무별 query로 나눌 것
  let cr=false;db.collection('comments').onSnapshot(s=>{comments=s.docs.map(x=>({id:x.id,...x.data()}));if(!cr){cr=true;ready();}wlRefresh?.();if(state.view==='list')render();},onErr);
  let pr2=false;db.collection('templates').onSnapshot(s=>{templates=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));if(!pr2){pr2=true;ready();}wlRefresh?.();},onErr);
})();
</script>
