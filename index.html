// 목록: 기간·프로젝트·필터에 걸리는 업무(게시물 또는 요청)가 있는 게시물을 연도별로
function postList(){
  const r=periodRange(), byRoot=new Map();
  for(const t of tasks){if(state.project!=='all'&&t.projectId!==state.project)continue;if(r&&!inPeriod(t,r))continue;if(!passF(t))continue;const p=rootOf(t);byRoot.set(p.id,p);}
  const key=p=>(p.requestDate||(p.createdAt||'').slice(0,10))+'|'+(p.createdAt||'');
  return [...byRoot.values()].sort((a,b)=>key(b).localeCompare(key(a)));
}
function postRow(p){
  const pj=projOf(p.projectId), k=kidsOf(p), doing=k.filter(x=>x.status==='doing'||x.status==='review').length, st=statusOf(postStatus(p,k));
  return `<li class="postRow${isLate(p)&&!k.length?' is-late':''}" data-post="${esc(p.id)}" tabindex="0">
    ${pj?`<span class="svcTag" style="--c:${esc(pj.color)}">${esc(pj.name)}</span>`:''}
    <span class="pTitle">${p.jiraKey?`<span class="jira">${esc(p.jiraKey)}</span>`:''}${rmsBadge(p)}${esc(p.title)}</span>
    <span class="pMeta num">${fmtDate(p.requestDate)} ~ ${fmtDate(p.dueDate)}</span>
    <span class="pMeta">${esc(p.assignee||'담당 미지정')}</span>
    <span class="pMeta">${k.length?`요청 ${k.length}건${doing?` · 진행 ${doing}`:''}`:'요청 없음'}</span>
    <span class="pill s-${st.k}">${st.label}</span></li>`;
}
function renderList(){
  const posts=postList();
  if(!posts.length){$('#main').innerHTML=`<div class="empty"><h2>조건에 맞는 업무가 없습니다</h2><p>${state.period!=='all'?`${esc(periodLabel(periodRange()))}에 해당하는 업무가 없습니다. 기간을 바꿔 보세요.`:'필터를 바꾸거나 검색어를 지워 보세요.'}</p></div>`;return;}
  const fold=new Set(state.yfold||[]), years=new Map();
  for(const p of posts){const y=(p.requestDate||p.createdAt||'').slice(0,4)||'날짜 없음';if(!years.has(y))years.set(y,[]);years.get(y).push(p);}
  $('#main').innerHTML=`<div class="postView">${[...years].map(([y,ps])=>{const c=fold.has(y);return `<section class="yGroup">
    <button type="button" class="yHead" data-year="${esc(y)}" aria-expanded="${!c}">${esc(y)}${/^\d+$/.test(y)?'년':''}<span class="legend">${ps.length}건</span><span aria-hidden="true">${c?'▼':'▲'}</span></button>
    ${c?'':`<ul class="postList">${ps.map(postRow).join('')}</ul>`}</section>`;}).join('')}<p class="legend">${posts.length}건 · 행을 누르면 게시물(댓글·업무 요청)을 열어요</p></div>`;
}

async function sendPost(p,btn){
  const text=$('#cpText').value.trim(), isReq=$('#cpReq').checked;
  if(!text){$('#cpErr').textContent=isReq?'요청 내용을 입력해 주세요.':'댓글 내용을 입력해 주세요.';return;}
  if(!isReq&&!actorId){$('#cpErr').textContent='사용자 정보를 확인할 수 없어 댓글을 남길 수 없어요.';return;}
  btn.disabled=true;
  try{
    if(isReq){const m=memOf($('#cpAs').value), now=new Date().toISOString();
      const data={projectId:p.projectId,part:$('#cpPart').value,title:text.split('\n')[0].slice(0,60),assignee:m?m.name:'',assigneeId:m?m.id:'',parentId:p.id,requester:myMember()?.name||nameCache[actorId]||'',
        jiraKey:'',rmsNo:'',rmsUrl:'',status:'wait',priority:p.priority??2,requestDate:todayStr(),dueDate:$('#cpDue').value,doneDate:'',estHours:'',actHours:'',link:'',note:text,updatedAt:now,createdAt:now};
      const ref=await db.collection('tasks').add(data);logChange('task','create',ref.id,data.title,null,data);toast('업무 요청을 등록했어요');}
    else await db.collection('comments').add({taskId:p.id,text,by:actorId,at:new Date().toISOString()});
    $('#cpText').value='';$('#cpDue').value='';$('#cpAs').value='';$('#cpReq').checked=false;$('#cpFields').hidden=true;$('#cpErr').textContent='';

async function setReqStatus(id,st){
  const t=tasks.find(x=>x.id===id);if(!t||t.status===st)return;
  const patch={status:st,doneDate:st==='done'?(t.doneDate||todayStr()):'',updatedAt:new Date().toISOString()};
  try{await db.collection('tasks').doc(id).update(patch);logChange('task','update',id,t.title,t,{...t,...patch});toast(`'${statusOf(st).label}'(으)로 바꿨어요`);}
  catch(err){handleWriteError(err);render();}
}

const adminUI=()=>!window.wbAuth||window.wbAuth.isAdmin;
// 프로필 사진: 가운데를 정사각형으로 잘라 160px JPEG로 줄여 구성원 문서(avatar)에 저장하고, 화면에서는 원으로 보여 줌
// ponytail: 사진을 문서에 바로 넣음(1장 약 10KB). 구성원이 수백 명이 되면 Supabase Storage로 옮길 것
const AVATAR_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
function avatarHtml(m,size=28){
  const st=`width:${size}px;height:${size}px`;
  return m?.avatar&&AVATAR_RE.test(m.avatar)?`<img class="avatar" src="${m.avatar}" alt="" style="${st}">`
    :`<span class="avatar avatarInit" style="${st};font-size:${Math.round(size*.42)}px" aria-hidden="true">${esc((m?.name||'?').trim().slice(0,1)||'?')}</span>`;
}
async function toAvatar(file){
  const img=await createImageBitmap(file);
  const n=Math.min(img.width,img.height), c=document.createElement('canvas');c.width=c.height=160;
  c.getContext('2d').drawImage(img,(img.width-n)/2,(img.height-n)/2,n,n,0,0,160,160);img.close?.();
  return c.toDataURL('image/jpeg',.85);
}
function openProfile(){
  const m=myMember();if(!m){openWhoAmI();return;}
  const nf={task:true,comment:true,leave:true,digest:true,...(m.notify||{})};
  const NF=[['task','내 업무 변동','담당자로 지정됨, 내 업무의 상태·완료 일정·우선순위 변경'],['comment','내 업무 댓글','내가 담당하거나 요청한 업무에 달린 댓글'],['digest','아침 요약','평일 08:30 오늘·내일 마감과 지연된 내 업무'],['leave','내 휴가·투입 변동','다른 사람이 내 휴가나 투입 기록을 바꿨을 때']];
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="profForm" style="max-width:520px" novalidate>
    <header><h2>내 프로필${roleBadge()}</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>
    <div class="body">
      <div class="f full pfPhoto"><div id="pfAvatar">${avatarHtml(m,96)}</div><div class="pfPhotoBtns"><span class="hint">프로필 사진은 관리자가 계정 관리에서 바꿔요.</span></div></div>
      <div class="f full"><label>로그인 메일</label><span>${esc(window.wbAuth?.email||'')}</span><span class="hint">알림 메일은 이 주소로 가요.</span></div>
      <div class="f full"><label for="pfName">이름</label><input id="pfName" maxlength="20" value="${esc(m.name||'')}"></div>
      <div class="f"><label for="pfPart">파트</label><select id="pfPart">${PARTS.map(p=>`<option value="${esc(p.k)}" ${m.part===p.k?'selected':''}>${esc(p.label)}</option>`).join('')}</select></div>
      <div class="f"><label for="pfProj">소속 프로젝트</label><select id="pfProj"><option value="">없음</option>${projects.map(p=>`<option value="${esc(p.id)}" ${m.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
      <div class="f full"><label>알림 메일</label><div class="nfList">${NF.map(([k,l,d])=>`<label class="nfItem"><input type="checkbox" data-nf="${k}" ${nf[k]!==false?'checked':''}><span><span class="nfName">${l}</span><span class="hint">${d}</span></span></label>`).join('')}</div>
        <span class="hint">내가 한 변경은 나에게 보내지 않아요. 몇 분 안에 생긴 변경은 한 통으로 묶어 보내요.</span></div>
    </div>
    <footer><span class="err" id="pfErr"></span><div class="r"><button class="btn" type="button" id="pfCancel">취소</button><button class="btn primary" type="submit" id="pfSave">저장</button></div></footer>
  </form></div>`;
  $('#xClose').onclick=$('#pfCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  $('#profForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const name=$('#pfName').value.trim();if(!name){$('#pfErr').textContent='이름을 입력해 주세요.';return;}
    if(members.some(x=>x.id!==m.id&&x.name===name)){$('#pfErr').textContent='같은 이름이 있어요. 이름 뒤에 구분을 붙여 주세요.';return;}
    const notify={};document.querySelectorAll('#profForm [data-nf]').forEach(c=>notify[c.dataset.nf]=c.checked);
    $('#pfSave').disabled=true;
    try{
      await db.collection('members').doc(m.id).update({name,part:$('#pfPart').value,projectId:$('#pfProj').value,notify});
      if(m.name!==name)for(const t of tasks.filter(t=>t.assigneeId===m.id||(!t.assigneeId&&t.assignee===m.name)))await db.collection('tasks').doc(t.id).update({assignee:name,assigneeId:m.id});
      logChange('member','update',m.id,name,{name:m.name,projectId:m.projectId||'',part:m.part||''},{name,projectId:$('#pfProj').value,part:$('#pfPart').value},'내 프로필');
      closeModal();toast('프로필을 저장했어요');render();
    }catch(err){$('#pfSave').disabled=false;handleWriteError(err,'#pfErr');}
  });
}

/* ---------- task modal ---------- */
function closeModal(){$('#modalRoot').innerHTML='';modalDirty=false;closeWarned=false;wlRefresh=null;}
// 입력한 내용이 있으면 바깥 클릭·Esc·취소로 바로 닫지 않고 한 번 알려 줌. 한 번 더 하면 닫힘
let modalDirty=false, closeWarned=false;
$('#modalRoot').addEventListener('input',()=>{modalDirty=true;closeWarned=false;});
function askClose(){if(modalDirty&&!closeWarned){closeWarned=true;toast('저장하지 않은 내용이 있어요. 한 번 더 누르면 닫혀요.');return;}closeModal();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML)askClose();});

function openTask(t,prefill){
  if(!projects.length){openProject(null);return;}
  const isNew=!t;
  t=t||{projectId:state.project!=='all'?state.project:projects[0].id,part:state.part!=='all'?state.part:PARTS[0].k,status:'wait',priority:2,requestDate:todayStr(),...prefill};
  const ro=!canWrite;
  const base={...t}; // 연 시점의 값. 저장할 때 다른 사람의 변경과 비교
  const people=[...new Set([...members.map(m=>m.name),...tasks.flatMap(x=>[x.assignee,x.requester])].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
  // 담당자는 구성원에서 고름. 예전 업무는 이름이 같은 구성원과 연결, 구성원에 없는 이름은 그대로 보여 줌
  const curMem=(t.assigneeId&&memOf(t.assigneeId))||members.find(m=>m.name===t.assignee);
  const orphan=t.assignee&&!curMem?t.assignee:'';
  const opt=(arr,cur)=>arr.map(([k,l])=>`<option value="${esc(k)}" ${String(cur)===String(k)?'selected':''}>${esc(l)}</option>`).join('');
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="taskForm" novalidate>
    <header><h2>${isNew?(t.parentId?'업무 요청 등록':'업무 등록'):ro?'업무 상세':'업무 수정'}</h2><button class="btn ghost" type="button" id="xClose" aria-label="닫기">닫기</button></header>
    <fieldset ${ro?'disabled':''} style="border:0;margin:0;padding:0;min-width:0"><div class="body">
      <div class="f"><label for="tProject">프로젝트 <b>*</b></label><select id="tProject">${opt(projects.map(p=>[p.id,p.name]),t.projectId)}</select></div>
      <div class="f"><label for="tPart">파트 <b>*</b></label><select id="tPart">${opt(PARTS.map(p=>[p.k,p.label]),t.part)}</select></div>
      ${t.parentId&&tasks.some(x=>x.id===t.parentId)?`<div class="f full"><button type="button" class="hlink" id="tParent">게시물 열기: ${esc(rootOf(t).title)}</button></div>`:''}
      <div class="f full"><label for="tTitle">요청내용 <b>*</b></label><input id="tTitle" value="${esc(t.title||'')}" placeholder="예: 메인 배너 영역 반응형 수정" maxlength="200"></div>
      <div class="f"><label for="tAssignee">담당자</label><select id="tAssignee"><option value="">미지정</option>${orphan?`<option value="name:${esc(orphan)}" selected>${esc(orphan)} (구성원 아님)</option>`:''}${members.map(m=>`<option value="${esc(m.id)}" ${curMem?.id===m.id?'selected':''}>${esc(m.name)}${projOf(m.projectId)?` · ${esc(projOf(m.projectId).name)}`:''}</option>`).join('')}</select>${members.length?'':'<span class="hint">휴가 관리 › 구성원 관리에서 구성원을 먼저 추가해 주세요.</span>'}${orphan?'<span class="hint">구성원 목록에 없는 이름이에요. 구성원을 골라 연결해 주세요.</span>':''}</div>
      <div class="f"><label for="tRequester">요청자</label><input id="tRequester" list="peopleList" value="${esc(t.requester||'')}" placeholder="이름 또는 부서"><span class="hint" id="reqHint"></span></div>
      <div class="f"><label for="tStatus">진행 현황</label><select id="tStatus">${opt(STATUSES.map(s=>[s.k,s.label]),t.status)}</select></div>
      <div class="f"><label for="tPri">우선순위</label><select id="tPri">${opt(PRIS.map((l,i)=>[i,l]),t.priority??2)}</select></div>
      <div class="f full"><div class="grid3">
        <div class="f"><label for="tReq">요청일자</label><input type="date" id="tReq" value="${esc(t.requestDate||'')}"></div>
        <div class="f"><label for="tDue">완료 일정</label><input type="date" id="tDue" value="${esc(t.dueDate||'')}"><span class="hint warnHint" id="dueLeave"></span></div>
        <div class="f"><label for="tDone">실제 완료일</label><input type="date" id="tDone" value="${esc(t.doneDate||'')}"></div>
      </div></div>
      <div class="f"><label for="tEst">예상 소요시간 (h)</label><input type="number" id="tEst" min="0" step="0.5" inputmode="decimal" value="${esc(t.estHours??'')}"><span class="hint">MD로 받았다면 1MD = 8h로 입력</span></div>
      <div class="f"><label for="tAct">실제 소요시간 (h)</label><input type="number" id="tAct" min="0" step="0.5" inputmode="decimal" value="${esc(t.actHours??'')}"></div>
      ${isNew?'':'<div class="f full wlBox" id="wlBox"></div><div class="f full cmBox" id="cmBox"></div>'}
      <!-- 자주 안 쓰는 칸은 접어 둠. 값이 있으면 펼친 채로 열림 -->
      <details class="f full moreF" ${t.jiraKey||t.rmsNo||t.rmsUrl||t.link||t.note?'open':''}><summary>상세 입력 <span class="hint">Jira · RMS · 관련 링크 · 메모</span></summary><div class="body sub">
      <div class="f"><label for="tJira">Jira 키</label><input id="tJira" value="${esc(t.jiraKey||'')}" placeholder="예: PROJ-123" autocapitalize="characters" spellcheck="false"></div>
      <div class="f"><label for="tRms">RMS 번호</label><input id="tRms" value="${esc(t.rmsNo||'')}" placeholder="예: 2026-00123" spellcheck="false"></div>
      <div class="f full"><label for="tRmsUrl">RMS 바로가기 링크</label><input id="tRmsUrl" value="${esc(t.rmsUrl||'')}" placeholder="${site?.rmsTemplate?'비워 두면 주소 규칙으로 자동 연결':'RMS 화면 주소 붙여넣기'}" spellcheck="false"></div>
      <div class="f full rmsRow"><span class="hint" id="rmsInfo"></span>${canWrite?'<button type="button" class="btn ghost" id="rmsRuleBtn">주소 규칙 설정</button>':''}<a class="rms" id="rmsGo" target="_blank" rel="noopener" hidden>RMS 바로가기 ↗</a>
        <div class="rmsRule" id="rmsRule" hidden><input id="rmsTpl" value="${esc(site?.rmsTemplate||'')}" placeholder="예: https://rms.회사.com/request/{no}" spellcheck="false"><button type="button" class="btn" id="rmsTplSave">저장</button><span class="hint">{no} 자리에 RMS 번호가 들어갑니다. 모든 업무에 공통 적용</span></div></div>
      <div class="f full"><label for="tLink">관련 링크</label><input id="tLink" value="${esc(t.link||'')}" placeholder="Figma, 설계서, Jira 등 URL"></div>
      <div class="f full"><label for="tNote">메모</label><textarea id="tNote" placeholder="요청 배경, 변경 이력, 이슈">${esc(t.note||'')}</textarea></div>
      ${t.link?`<div class="f full"><a href="${esc(/^https?:\/\//.test(t.link)?t.link:'https://'+t.link)}" target="_blank" rel="noopener" style="color:var(--accent-dark)">관련 링크 열기 ↗</a></div>`:''}
      </div></details>
    </div></fieldset>
    <datalist id="peopleList">${people.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <footer>
      <div id="delZone">${!isNew&&canWrite?'<button class="btn danger" type="button" id="tDel">삭제</button>':''}${!isNew&&canWrite&&nextPart(t.part)?`<button class="btn" type="button" id="tNext" title="같은 요청으로 다음 파트 업무를 만들어요">${esc(nextPart(t.part).label)}(으)로 넘기기</button>`:''}</div>
      <span class="err" id="tErr"></span>
      <div class="r"><button class="btn" type="button" id="tCancel">${ro?'닫기':'취소'}</button>${ro?'':`<button class="btn primary" type="submit" id="tSave">${isNew?'등록':'저장'}</button>`}</div>
    </footer>
  </form></div>`;
  $('#xClose').onclick=$('#tCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  $('#tStatus').addEventListener('change',e=>{if(e.target.value==='done'&&!$('#tDone').value)$('#tDone').value=todayStr();});
  const rmsSync=()=>{const h=rmsHref({rmsNo:$('#tRms').value,rmsUrl:$('#tRmsUrl').value});$('#rmsGo').hidden=!h;if(h)$('#rmsGo').href=h;
    $('#rmsInfo').textContent=site?.rmsTemplate?`주소 규칙: ${site.rmsTemplate}`:'RMS 주소 규칙이 없으면 링크를 직접 붙여넣어 주세요.';};
  rmsSync();['tRms','tRmsUrl'].forEach(id=>$('#'+id).addEventListener('input',rmsSync));
  $('#rmsRuleBtn')?.addEventListener('click',()=>{$('#rmsRule').hidden=!$('#rmsRule').hidden;if(!$('#rmsRule').hidden)$('#rmsTpl').focus();});
  $('#rmsTplSave')?.addEventListener('click',async()=>{
    const tpl=$('#rmsTpl').value.trim();
    if(tpl&&!tpl.includes('{no}')){$('#tErr').textContent='주소 규칙에 {no}를 넣어 주세요. 예: https://rms.회사.com/request/{no}';return;}
    try{const before={...site};await db.doc('settings/site').set({title:site.title,subtitle:site.subtitle||'',rmsTemplate:tpl,updatedAt:new Date().toISOString()});site={...site,rmsTemplate:tpl};logChange('site','update','site','RMS 주소 규칙',before,site);
      $('#tErr').textContent='';$('#rmsRule').hidden=true;rmsSync();toast('RMS 주소 규칙을 저장했습니다');}catch(err){handleWriteError(err,'#tErr');}
  });
  // 요청자는 부서명도 받아서 직접 입력으로 두되, 처음 보는 이름이면 오타 확인을 안내
  $('#tRequester').addEventListener('input',e=>{const v=e.target.value.trim();$('#reqHint').textContent=v&&!people.includes(v)?'처음 입력하는 이름이에요. 오타가 없는지 확인해 주세요.':'';});
  // 날짜별 작업 시간 기록(worklogs). 기록이 있으면 실제 소요시간 = 기록 합계
  if(!isNew){
    const wlSum=list=>Math.round(list.reduce((a,w)=>a+(+w.hours||0),0)*100)/100;
    const syncAct=async list=>{const sum=list.length?wlSum(list):'';$('#tAct').value=sum;base.actHours=sum;await db.collection('tasks').doc(t.id).update({actHours:sum,updatedAt:new Date().toISOString()});};
    wlRefresh=()=>{
      const box=$('#wlBox');if(!box)return;
      const list=wlogs.filter(w=>w.taskId===t.id).sort((x,y)=>x.date.localeCompare(y.date));
      $('#tAct').disabled=list.length>0;
      const keep={d:$('#wlDate')?.value||todayStr(),m:$('#wlMem')?.value||taskMember(t)?.id||'',h:$('#wlH')?.value||'',n:$('#wlNote')?.value||''};
      box.innerHTML=`<label>작업 시간 기록 <span class="legend">${list.length?`합계 ${hrs(wlSum(list))}h`:'아직 없음'}</span></label>
        ${list.length?`<ul class="hitems">${list.map(w=>`<li><span class="num">${md(w.date)}</span><b>${esc(memOf(w.memberId)?.name||w.member||'')}</b><span class="legend">${esc(w.note||'')}</span><span class="num hh">${hrs(w.hours)}h</span>${canWrite?`<button type="button" class="btn ghost wlDel" data-wl="${esc(w.id)}">삭제</button>`:''}</li>`).join('')}</ul>`:''}
        ${canWrite?`<div class="wlAdd"><input type="date" id="wlDate" value="${esc(keep.d)}" aria-label="작업한 날짜"><select id="wlMem" aria-label="작업한 사람">${members.map(m=>`<option value="${esc(m.id)}" ${keep.m===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><input type="number" id="wlH" min="0.25" step="0.25" inputmode="decimal" placeholder="시간(h)" value="${esc(keep.h)}" aria-label="작업 시간"><input id="wlNote" placeholder="메모 (선택)" value="${esc(keep.n)}" maxlength="80" aria-label="메모"><button type="button" class="btn" id="wlAddBtn">기록 추가</button></div>`:''}
        <span class="hint">기록이 있으면 실제 소요시간은 합계로 자동 계산되고, 업무 시간 화면은 기록한 날짜 기준으로 집계돼요.</span><span class="err" id="wlErr"></span>`;
    };
    wlRefresh();
    const addWl=async()=>{
      const h=+$('#wlH').value, d=$('#wlDate').value, m=memOf($('#wlMem').value);
      if(!d||!m){$('#wlErr').textContent='날짜와 작업한 사람을 골라 주세요.';return;}
      if(!(h>0)||h>24){$('#wlErr').textContent='시간은 0보다 크고 24 이하로 입력해 주세요.';return;}
      $('#wlAddBtn').disabled=true;
      try{const w={taskId:t.id,memberId:m.id,member:m.name,date:d,hours:h,note:$('#wlNote').value.trim(),by:actorId||'',createdAt:new Date().toISOString()};
        await db.collection('worklogs').add(w);$('#wlH').value='';$('#wlNote').value='';
        await syncAct([...wlogs.filter(x=>x.taskId===t.id&&!(x.date===w.date&&x.createdAt===w.createdAt)),w]);
        logChange('task','update',t.id,t.title,null,null,`작업 시간 기록 ${md(d)} ${m.name} ${hrs(h)}h`);toast('작업 시간을 기록했어요');
      }catch(err){handleWriteError(err,'#wlErr');}finally{if($('#wlAddBtn'))$('#wlAddBtn').disabled=false;}
    };
    $('#wlBox').addEventListener('click',async e=>{
      if(e.target.id==='wlAddBtn'){addWl();return;}
      const del=e.target.closest('.wlDel');if(!del)return;
      if(!del.dataset.sure){del.dataset.sure='1';del.textContent='정말 삭제';return;}
      try{const id=del.dataset.wl;await db.collection('worklogs').doc(id).delete();await syncAct(wlogs.filter(x=>x.taskId===t.id&&x.id!==id));toast('기록을 삭제했어요');}catch(err){handleWriteError(err,'#wlErr');}
    });
    $('#wlBox').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();addWl();}});
  }
  // A7: 댓글(comments 컬렉션, taskId로 연결). 내가 쓴 댓글만 지울 수 있음
  const cmDraw=()=>{
    const box=$('#cmBox');if(!box)return;
    const list=comments.filter(c=>c.taskId===t.id).sort((x,y)=>x.at.localeCompare(y.at));
    resolveNames(list.map(c=>c.by)).then(()=>{if($('#cmList'))$('#cmList').querySelectorAll('[data-by]').forEach(el=>el.textContent=actorName(el.dataset.by));});
    const draft=$('#cmText')?.value||'';
    box.innerHTML=`<label>댓글 <span class="legend">${list.length?list.length+'개':''}</span></label>
      <ul class="cmList" id="cmList">${list.map(c=>`<li><div class="cmHead"><b data-by="${esc(c.by)}">${esc(actorName(c.by))}</b><span class="legend">${esc(c.at.slice(0,16).replace('T',' '))}</span>${c.by&&c.by===actorId?`<button type="button" class="btn ghost cmDel" data-cm="${esc(c.id)}">삭제</button>`:''}</div><div class="cmBody">${esc(c.text)}</div></li>`).join('')}</ul>
      ${canWrite&&actorId?`<div class="cmAdd"><textarea id="cmText" rows="2" placeholder="진행 상황, 확인 요청 등을 남겨 주세요" maxlength="1000">${esc(draft)}</textarea><button type="button" class="btn" id="cmAddBtn">댓글 등록</button></div>`:''}<span class="err" id="cmErr"></span>`;
  };
  if(!isNew){
    const wlDraw=wlRefresh;wlRefresh=()=>{wlDraw?.();cmDraw();};cmDraw();
    $('#cmBox').addEventListener('click',async e=>{
      if(e.target.id==='cmAddBtn'){
        const text=$('#cmText').value.trim();if(!text){$('#cmErr').textContent='댓글 내용을 입력해 주세요.';return;}
        e.target.disabled=true;
        try{await db.collection('comments').add({taskId:t.id,text,by:actorId,at:new Date().toISOString()});$('#cmText').value='';$('#cmErr').textContent='';cmDraw();}
        catch(err){handleWriteError(err,'#cmErr');}finally{if($('#cmAddBtn'))$('#cmAddBtn').disabled=false;}
        return;}
      const del=e.target.closest('.cmDel');if(!del)return;
      if(!del.dataset.sure){del.dataset.sure='1';del.textContent='정말 삭제';return;}
      try{await db.collection('comments').doc(del.dataset.cm).delete();}catch(err){handleWriteError(err,'#cmErr');}
    });
    // 댓글 입력은 업무 저장과 상관없으니 닫기 경고 대상에서 뺌
    $('#cmBox').addEventListener('input',e=>e.stopPropagation());
  }
  // 담당자 휴가일에 마감이 걸리면 알려 줌
  const dueSync=()=>{const av=$('#tAssignee').value,m=av.startsWith('name:')?null:memOf(av),l=m&&leaveOn(m.id,$('#tDue').value);$('#dueLeave').textContent=l?`담당자가 이날 휴가예요 (${leaveLabel(l)})`:'';};
  dueSync();$('#tAssignee').addEventListener('change',dueSync);$('#tDue').addEventListener('change',dueSync);
  // 다음 파트로 넘기기: 같은 요청을 다음 파트 업무로 새로 만듦(parentId로 연결)
  $('#tParent')?.addEventListener('click',()=>{const r=rootOf(t);closeModal();openPost(r.id);});
  $('#tNext')?.addEventListener('click',()=>{const np=nextPart(t.part),pt=partOf(t.part);
    openTask(null,{projectId:t.projectId,part:np.k,title:t.title,jiraKey:t.jiraKey||'',rmsNo:t.rmsNo||'',rmsUrl:t.rmsUrl||'',link:t.link||'',requester:t.assignee||t.requester||'',priority:t.priority??2,parentId:rootOf(t).id,prevId:t.id,note:`이전 단계: ${pt.label} · ${t.title}`});});
  setTimeout(()=>{if(!ro)$('#tTitle').focus();},0);
  $('#tDel')?.addEventListener('click',()=>{
    $('#delZone').innerHTML=`<div class="confirm">이 업무를 삭제할까요? <button class="btn danger" type="button" id="tDelYes">삭제</button><button class="btn ghost" type="button" id="tDelNo">취소</button></div>`;
    $('#tDelNo').onclick=()=>openTask(t);
    $('#tDelYes').onclick=async()=>{try{await db.collection('tasks').doc(t.id).delete();logChange('task','delete',t.id,t.title);closeModal();toast('삭제했습니다');}catch(err){handleWriteError(err,'#tErr');}};
  });
  $('#taskForm').addEventListener('submit',async e=>{
    e.preventDefault();if(ro)return;
    const num=v=>v===''?'':Math.max(0,+v);
    const av=$('#tAssignee').value, am=av.startsWith('name:')?null:memOf(av);
    const data={
      projectId:$('#tProject').value,part:$('#tPart').value,title:$('#tTitle').value.trim(),
      assignee:am?am.name:av.slice(5),assigneeId:am?am.id:'',parentId:t.parentId||'',requester:$('#tRequester').value.trim(),
      jiraKey:$('#tJira').value.trim().toUpperCase(),rmsNo:$('#tRms').value.trim(),rmsUrl:$('#tRmsUrl').value.trim(),
      status:$('#tStatus').value,priority:+$('#tPri').value,
      requestDate:$('#tReq').value,dueDate:$('#tDue').value,doneDate:$('#tDone').value,
      estHours:num($('#tEst').value),actHours:num($('#tAct').value),
      link:$('#tLink').value.trim(),note:$('#tNote').value.trim(),
      updatedAt:new Date().toISOString(),createdAt:t.createdAt||new Date().toISOString()
    };
    if(!data.title){$('#tErr').textContent='요청내용을 입력해 주세요.';$('#tTitle').focus();return;}
    if(data.status!=='done'&&data.doneDate&&!t.doneDate)data.doneDate=data.doneDate; // 사용자가 직접 입력한 값 유지
    // 수정은 내가 바꾼 칸만 update로 저장해서, 같은 업무를 다른 사람이 동시에 고쳐도 서로 다른 칸은 둘 다 남게 함.
    // 같은 칸을 다른 사람이 먼저 바꿨으면 한 번 경고하고, 다시 누르면 내 값으로 저장
    // ponytail: 저장소에 트랜잭션이 없어 확인과 저장 사이 아주 짧은 순간의 충돌은 못 막음. 필요하면 doc.acquire() 잠금으로
    let patch=null, live=null;
    if(!isNew){
      live=tasks.find(x=>x.id===t.id);
      if(!live){$('#tErr').textContent='다른 사람이 이 업무를 삭제했어요. 창을 닫고 목록을 확인해 주세요.';return;}
      const same=sameVal, changed=changedKeys(data,base);
      if(!changed.length){closeModal();return;}
      const theirs=changed.filter(k=>!same(live[k],base[k])&&!same(live[k],data[k]));
      if(theirs.length&&!$('#taskForm').dataset.ok){
        const lab=k=>(HFIELDS.task.find(f=>f[0]===k)||[k,k==='assigneeId'?'담당자':k])[1];
        $('#tErr').textContent=`다른 사람이 먼저 ${[...new Set(theirs.map(lab))].join(', ')} 값을 바꿨어요. 그래도 내 값으로 저장하려면 한 번 더 누르세요.`;
        $('#taskForm').dataset.ok='1';return;
      }
      patch=Object.fromEntries(changed.map(k=>[k,data[k]]));patch.updatedAt=data.updatedAt;
    }
    $('#tSave').disabled=true;
    try{
      if(isNew){const ref=await db.collection('tasks').add(data);logChange('task','create',ref.id,data.title,null,data);
        // 다음 파트로 넘긴 업무면 이전 단계 업무를 완료로 바꿔 그 파트의 미완료 목록·현황에서 빠지게 함
        const prev=t.prevId&&tasks.find(x=>x.id===t.prevId);
        if(prev&&prev.status!=='done'){const pp={status:'done',doneDate:todayStr(),updatedAt:data.updatedAt};await db.collection('tasks').doc(prev.id).update(pp);logChange('task','update',prev.id,prev.title,prev,{...prev,...pp},`${partOf(data.part).label}(으)로 넘김`);}}
      else{await db.collection('tasks').doc(t.id).update(patch);logChange('task','update',t.id,data.title,live,{...live,...patch});}
      closeModal();toast(isNew?'등록했습니다':'저장했습니다');
    }catch(err){$('#tSave').disabled=false;handleWriteError(err,'#tErr');}
  });
}

    <div class="body" style="grid-template-columns:1fr">
      <div class="f"><label for="pName">프로젝트명 <b>*</b></label><input id="pName" value="${esc(p?.name||'')}" maxlength="40" placeholder="프로젝트명"></div>
      <div class="f"><label for="pClient">고객사 · 기간</label><input id="pClient" value="${esc(p?.client||'')}" maxlength="60" placeholder="고객사 · 기간"></div>
      <div class="f"><label>색</label><div class="swatches">${PCOLORS.slice(0,4).map(c=>`<button type="button" class="swatch" style="background:${c}" data-c="${c}" aria-label="색상" aria-pressed="${color0===c}"></button>`).join('')}</div></div>

      <div id="pConfirm"></div>
    </div>
    <footer>${isNew?'<span></span>':'<button class="btn danger" type="button" id="pDel">삭제</button>'}<span class="err" id="pErr"></span><div class="r"><button class="btn" type="button" id="pCancel">취소</button><button class="btn primary" type="submit">저장</button></div></footer>
  </form></div>`;
  $('#xClose').onclick=$('#pCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  $('#projForm').querySelector('.swatches').addEventListener('click',e=>{const sw=e.target.closest('.swatch');if(sw)sw.parentElement.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed',s===sw));});
  $('#pName').focus();

    const list=projects.slice(), j=idx+dir;[list[idx],list[j]]=[list[j],list[idx]];
    try{for(const [i,q] of list.entries())if(q.order!==i)await db.collection('projects').doc(q.id).update({order:i});
      logChange('project','update',p.id,p.name,{order:idx},{order:j},'탭 순서 변경');closeModal();toast('순서를 바꿨습니다');}
    catch(err){handleWriteError(err,'#pErr');}

  $('#pUp')?.addEventListener('click',()=>move(-1));
  $('#pDown')?.addEventListener('click',()=>move(1));

    $('#pConfirm').innerHTML=`<div class="confirm">'${esc(p.name)}' 프로젝트${n?`와 업무 ${n}건`:''}을 삭제할까요? <button class="btn danger" type="button" id="pDelYes">삭제</button><button class="btn ghost" type="button" id="pDelNo">취소</button></div>`;

        await db.collection('projects').doc(pid).delete();logChange('project','delete',pid,p.name,null,null,n?`업무 ${n}건 함께 삭제`:'');

/* ---------- leave (휴가 관리) ---------- */
// 반반차(오전·오후) = 2시간 = 0.25일 (1일 8시간 기준). 여러 날 휴가는 주말을 빼고 계산하며, 공휴일은 '차감 일수'에서 직접 조정
const LEAVE_TYPES=[
  {k:'annual',label:'연차',days:1,deduct:true,multi:true,cls:'lt-a'},
  {k:'am',label:'오전 반차',days:.5,deduct:true,cls:'lt-h'},
  {k:'pm',label:'오후 반차',days:.5,deduct:true,cls:'lt-h'},
  {k:'qam',label:'오전 반반차',days:.25,deduct:true,quarter:true,cls:'lt-q'},
  {k:'qpm',label:'오후 반반차',days:.25,deduct:true,quarter:true,cls:'lt-q'},
  {k:'quarter',label:'반반차',days:.25,deduct:true,quarter:true,legacy:true,cls:'lt-q'},
  {k:'sick',label:'병가',days:1,deduct:false,multi:true,cls:'lt-o'},
  {k:'family',label:'경조사',days:1,deduct:false,multi:true,cls:'lt-o'},
  {k:'other',label:'공가·기타',days:1,deduct:false,multi:true,cls:'lt-o'}
];
let members=[], leaves=[];
const lstate={year:+todayStr().slice(0,4),month:todayStr().slice(0,7),member:'all',project:'all'};
const ltype=k=>LEAVE_TYPES.find(t=>t.k===k)||LEAVE_TYPES[0];
const memOf=id=>members.find(m=>m.id===id);
const nextPart=k=>PARTS[PARTS.findIndex(p=>p.k===k)+1]||null;
// 그 구성원이 그날 휴가인지 (휴가 기록 또는 undefined)
const leaveOn=(memberId,d)=>d?leaves.find(l=>l.memberId===memberId&&leaveDates(l).includes(d)):undefined;
const taskMember=t=>(t.assigneeId&&memOf(t.assigneeId))||members.find(m=>m.name===t.assignee);
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const isWeekend=s=>{const g=new Date(s+'T00:00:00').getDay();return g===0||g===6;};
function eachDay(a,b){const out=[];if(!a)return out;const d=new Date(a+'T00:00:00'),e=new Date((b&&b>=a?b:a)+'T00:00:00');while(d<=e&&out.length<370){out.push(ymd(d));d.setDate(d.getDate()+1);}return out;}
function autoDays(type,a,b){const t=ltype(type);return t.multi?eachDay(a,b).filter(d=>!isWeekend(d)).length:t.days;}
const leaveDays=l=>(l.days===''||l.days==null||isNaN(l.days))?autoDays(l.type,l.date,l.endDate):+l.days;
const leaveDates=l=>ltype(l.type).multi?eachDay(l.date,l.endDate).filter(d=>!isWeekend(d)):(l.date?[l.date]:[]);
const fmtDays=n=>(+n).toFixed(2).replace(/\.?0+$/,'');
const quotaOf=(m,y)=>{const q=m?.quotas?.[String(y)];return q===''||q==null||isNaN(q)?null:+q;};
const leaveLabel=l=>ltype(l.type).label+(ltype(l.type).quarter&&l.time?` ${l.time}`:'');

function memberStats(m,y){
  const t=todayStr(), mine=leaves.filter(l=>l.memberId===m.id&&(l.date||'').startsWith(String(y)));
  let used=0,planned=0,other=0;
  for(const l of mine){const d=leaveDays(l);if(!ltype(l.type).deduct){other+=d;continue;}if(l.date<=t)used+=d;else planned+=d;}
  const q=quotaOf(m,y);
  return {used,planned,other,quota:q,remain:q==null?null:q-used-planned};
}

function renderTodayOff(){
  const el=$('#todayOff');
  if(!storeReady||!members.length){el.textContent='';return;}
  const t=todayStr();
  const off=leaves.filter(l=>leaveDates(l).includes(t)&&memOf(l.memberId));
  el.innerHTML=off.length?`오늘 부재 <b>${off.length}명</b> · ${off.map(l=>`${esc(memOf(l.memberId).name)}(${esc(leaveLabel(l))})`).join(', ')}`:'오늘 부재자 없음';
}

function renderLeave(){
  const area=$('#leaveArea');
  if(!storeReady){area.innerHTML=`<div class="empty"><h2>일정을 불러오는 중입니다</h2></div>`;return;}
  if(!members.length){
    area.innerHTML=`<div class="empty"><h2>구성원을 먼저 등록해 주세요</h2><p>사람별로 연간 연차 일수를 정해 두면, 연차·반차·반반차를 등록할 때마다 사용·예정·잔여 일수가 자동으로 계산됩니다.</p>${isAdminUser()?'<button class="btn primary" type="button" id="lEmptyAdd">구성원 추가</button>':''}</div>`;
    $('#lEmptyAdd')?.addEventListener('click',openMembers);return;
  }
  const Y=lstate.year;
  area.innerHTML=`
    ${calPanel(lstate,calFilter(),true,true)}`;
}
// 월 달력 하나: 일정 관리(lstate, 보기 필터 state.cf)와 연차 관리(astate, 연차만)가 같이 씀
function calPanel(st,cf,withFilters,leaveRo){
  const T=todayStr(), [cy,cm]=st.month.split('-').map(Number);
  const first=new Date(cy,cm-1,1), start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const last=new Date(cy,cm,0), end=new Date(last);end.setDate(last.getDate()+(7-((last.getDay()+6)%7)-1));
  const a0=ymd(start), b0=ymd(end);
  const byDay={};const push=(k,html)=>(byDay[k]=byDay[k]||[]).push(html);
  if(cf.leave)for(const l of [...leaves].filter(l=>memOf(l.memberId)).sort((a,b)=>memOf(a.memberId).name.localeCompare(memOf(b.memberId).name,'ko')))for(const d of leaveDates(l))
    push(d,`<div class="lv ${ltype(l.type).cls}${leaveRo?' lvRo':''}" ${leaveRo?'':`data-lid="${esc(l.id)}" tabindex="0"`} title="${esc(memOf(l.memberId).name+' · '+leaveLabel(l)+(l.note?' · '+l.note:''))}">${esc(memOf(l.memberId).name)} ${esc(ltype(l.type).label)}</div>`);
  if(cf.event)for(const ev of events.filter(e=>e.kind==='project'||e.kind==='event')){const p=ev.kind==='project'?projOf(ev.projectId):null;for(let d=ev.start;d&&d<=(ev.end||ev.start);d=addDays(d,1))
    push(d,`<div class="ev evp" data-eid="${esc(ev.id)}" data-date="${d}" tabindex="0" style="border-left-color:${esc((ev.kind==='event'?ev.color:p?.color)||'var(--muted)')}" title="${esc((p?p.name+' · ':'')+ev.title+(ev.note?' · '+ev.note:''))}">${esc(ev.title)}</div>`);}
  if(cf.event)for(const ev of events.filter(e=>e.kind==='deploy')){const p=projOf(ev.projectId);for(const d of deployDates(ev,a0,b0))
    push(d,`<div class="ev evd" data-eid="${esc(ev.id)}" data-date="${d}" tabindex="0" title="${esc((p?p.name+' · ':'')+ev.title)}"><span class="evtag">배포</span>${esc(p?.name||ev.title)}</div>`);}
  if(cf.due)for(const t of workItems().filter(t=>t.status!=='done'&&t.dueDate&&t.dueDate>=a0&&t.dueDate<=b0))
    push(t.dueDate,`<div class="ev evdue" title="${esc('마감 · '+t.title+' · '+(t.assignee||'미지정'))}">마감 · ${esc(t.title)}</div>`);
  let cells='';
  for(const d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const k=ymd(d), items=byDay[k]||[];
    const cls=['day',d.getMonth()!==cm-1?'out':'',isWeekend(k)?'we':'',k===T?'today':'',canWrite?'can':''].join(' ');
    cells+=`<div class="${cls}" data-date="${k}"><span class="dn">${d.getDate()}</span>${items.slice(0,4).join('')}${items.length>4?`<button type="button" class="more" data-more="${k}">+${items.length-4}건</button>`:''}</div>`;
  }
  lvDayItems=byDay;
  return `<div class="panel">
        <h3><div class="calnav"><button class="btn ghost" type="button" id="lPrev" aria-label="이전 달">◀</button><span class="mlabel">${cy}.${String(cm).padStart(2,'0')}</span><button class="btn ghost" type="button" id="lNext" aria-label="다음 달">▶</button><button class="btn ghost" type="button" id="lThis">이번 달</button></div>
          ${withFilters?`<span class="calFilters">${[['event','일정'],['leave','연차'],['due','업무 마감']].map(([k,l])=>`<label class="cfItem"><input type="checkbox" data-cf="${k}" ${cf[k]?'checked':''}>${l}</label>`).join('')}</span>`:''}</h3>
        <div class="cal">${['월','화','수','목','금','토','일'].map((d,i)=>`<div class="dow ${i>4?'we':''}">${d}</div>`).join('')}${cells}</div>
    </div>`;
}

onArea('#leaveArea','change',e=>{const c=e.target.dataset.cf;if(c){state.cf={...calFilter(),[c]:e.target.checked};persistUI();render();return;}});
// 달력에서 시작일을 누른 채 끌어 종료일에서 놓으면 그 기간으로 휴가 등록 창을 엶
let lvDrag=null, lvDragDone=false;
const lvMark=(sel,a,b)=>document.querySelectorAll(sel+' .day[data-date]').forEach(d=>d.classList.toggle('pick',!!a&&d.dataset.date>=(a<b?a:b)&&d.dataset.date<=(a<b?b:a)));
document.addEventListener('pointerup',()=>{if(!lvDrag)return;const {a,b,sel,only}=lvDrag;lvDrag=null;lvMark(sel);if(a!==b){lvDragDone=true;calNew(only,a<b?a:b,a<b?b:a);}});
const calNew=(only,a,b)=>only?openLeave(null,a,b,true):openSched(null,a,b);
function bindCal(sel,st,only){
  onArea(sel,'pointerdown',e=>{const day=e.target.closest('.day[data-date]');if(!day||!canWrite||e.target.closest('[data-lid],[data-eid],[data-more],.evdue,.lvRo')||e.button!==0)return;lvDrag={a:day.dataset.date,b:day.dataset.date,sel,only};});
  onArea(sel,'pointerover',e=>{if(!lvDrag)return;const day=e.target.closest('.day[data-date]');if(!day)return;lvDrag.b=day.dataset.date;lvMark(sel,lvDrag.a,lvDrag.b);});
  onArea(sel,'click',e=>{
    if(lvDragDone){lvDragDone=false;return;}
    const id=e.target.id;
    if(id==='lPrev'||id==='lNext'){const [y,m]=st.month.split('-').map(Number);const d=new Date(y,m-1+(id==='lNext'?1:-1),1);st.month=ymd(d).slice(0,7);st.year=d.getFullYear();render();return;}
    if(id==='lThis'){st.month=todayStr().slice(0,7);st.year=+todayStr().slice(0,4);render();return;}

  $('#xClose').onclick=closeModal;$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal();});
  $('#ov').addEventListener('click',e=>{const it=e.target.closest('[data-lid],[data-eid]');if(!it)return;closeModal();calItemOpen(it,k);});
}
function calItemOpen(it,k){
  if(it.dataset.lid){openLeave(leaves.find(l=>l.id===it.dataset.lid));return true;}
  if(it.dataset.eid){const ev=events.find(x=>x.id===it.dataset.eid);if(ev)ev.kind==='event'?openSched(ev):openEvent(ev.kind,ev,it.dataset.date||k);return true;}
  return false;
}

function openLeave(l,date,endDate,only){
  if(!members.length){openMembers();return;}
  const isNew=!l, ro=!canWrite;
  l=l||{memberId:lstate.member!=='all'?lstate.member:'',type:'annual',date:date||todayStr(),endDate:endDate||date||todayStr()};
  let daysTouched=!isNew&&l.days!==''&&l.days!=null&&+l.days!==autoDays(l.type,l.date,l.endDate);
  const opt=(arr,cur)=>arr.map(([k,v])=>`<option value="${esc(k)}" ${String(cur)===String(k)?'selected':''}>${esc(v)}</option>`).join('');
  $('#modalRoot').innerHTML=`<div class="overlay" id="ov"><form class="modal" id="leaveForm" novalidate>
    <header><h2>${isNew?'연차 신청':ro?'연차 신청 상세':'연차 신청 수정'}</h2><button class="btn ghost" type="button" id="xClose">닫기</button></header>
    <fieldset ${ro?'disabled':''} style="border:0;margin:0;padding:0;min-width:0"><div class="body">
      <div class="f"><label for="lvMember">구성원 <b>*</b></label><select id="lvMember"><option value="">선택</option>${opt(members.map(m=>[m.id,m.name]),l.memberId)}</select></div>
      <input type="hidden" id="lvType" value="${esc(l.type||'annual')}">${l.type&&l.type!=='annual'?`<div class="f"><label>종류</label><span>${esc(ltype(l.type).label)}</span></div>`:''}
      <div class="f"><label for="lvDate" id="lvDateLbl">날짜</label><input type="date" id="lvDate" value="${esc(l.date||'')}"></div>
      <div class="f" id="lvEndWrap"><label for="lvEnd">종료일</label><input type="date" id="lvEnd" value="${esc(l.endDate||l.date||'')}"></div>
      <div class="f full lvRange" id="lvRange" aria-live="polite"></div>
      <div class="f" id="lvTimeWrap"><label for="lvTime">사용 시간</label><input id="lvTime" value="${esc(l.time||'')}" placeholder="예: 09:00–11:00"></div>
      <div class="f"><label for="lvDays">일수</label><input type="number" id="lvDays" min="0" step="0.25" inputmode="decimal" value="${esc(isNew?'':leaveDays(l))}"><span class="hint" id="lvDaysHint"></span></div>
      <div class="f full"><label for="lvNote">메모</label><input id="lvNote" value="${esc(l.note||'')}" placeholder="사유, 대체 근무자, 비상 연락 등"></div>
    </div></fieldset>
    <footer>
      <div id="lvDelZone">${!isNew&&canWrite?'<button class="btn danger" type="button" id="lvDel">삭제</button>':''}</div>
      <span class="err" id="lvErr"></span>
      <div class="r"><button class="btn" type="button" id="lvCancel">${ro?'닫기':'취소'}</button>${ro?'':`<button class="btn primary" type="submit" id="lvSave">${isNew?'등록':'저장'}</button>`}</div>
    </footer></form></div>`;
  const sync=()=>{
    const t=ltype($('#lvType').value);
    $('#lvEndWrap').hidden=!t.multi;$('#lvTimeWrap').hidden=!t.quarter;
    $('#lvDateLbl').textContent=t.multi?'시작일':'날짜';
    if(t.multi&&(!$('#lvEnd').value||$('#lvEnd').value<$('#lvDate').value))$('#lvEnd').value=$('#lvDate').value;
    const auto=autoDays(t.k,$('#lvDate').value,t.multi?$('#lvEnd').value:'');
    if(!daysTouched)$('#lvDays').value=auto;
    $('#lvDaysHint').textContent=t.multi?`주말 제외 ${auto}일 · 공휴일이 끼면 직접 수정`:(t.deduct?'연차에서 차감':'연차에서 차감하지 않음');
    const dw=v=>v?`${+v.slice(5,7)}/${+v.slice(8,10)}(${'일월화수목금토'[new Date(v+'T00:00:00').getDay()]})`:'';
    const a=$('#lvDate').value,b=t.multi?$('#lvEnd').value:a;
    $('#lvRange').innerHTML=a?`<b>${dw(a)}${b&&b!==a?` ~ ${dw(b)}`:''}</b> · ${esc(t.label)} ${fmtDays(+$('#lvDays').value||0)}일${t.multi?' <span class="hint">· 여러 날이면 종료일을 바꾸거나, 달력에서 날짜를 끌어서 고르세요</span>':''}`:'';
    prevStart=a;
  };
  // 시작일을 바꾸면 종료일도 같은 간격만큼 따라 움직임 (5일짜리를 옮기면 그대로 5일)
  let prevStart=$('#lvDate').value;
  $('#lvDate').addEventListener('input',()=>{const a=$('#lvDate').value,b=$('#lvEnd').value;if(a&&b&&prevStart&&ltype($('#lvType').value).multi)$('#lvEnd').value=addDays(b,Math.round((new Date(a+'T00:00:00')-new Date(prevStart+'T00:00:00'))/864e5));});
  sync();
  ['lvType','lvDate','lvEnd'].forEach(id=>$('#'+id).addEventListener('change',()=>{if(id==='lvType')daysTouched=false;sync();}));
  $('#lvDays').addEventListener('input',()=>{daysTouched=true;sync();});
  $('#xClose').onclick=$('#lvCancel').onclick=askClose;
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')askClose();});
  $('#lvDel')?.addEventListener('click',()=>{
    $('#lvDelZone').innerHTML=`<div class="confirm">이 연차 신청을 삭제할까요? <button class="btn danger" type="button" id="lvDelYes">삭제</button><button class="btn ghost" type="button" id="lvDelNo">취소</button></div>`;
    $('#lvDelNo').onclick=()=>openLeave(l);
    $('#lvDelYes').onclick=async()=>{try{await db.collection('leaves').doc(l.id).delete();logChange('leave','delete',l.id,`${memOf(l.memberId)?.name||''} ${leaveLabel(l)} ${fmtDate(l.date)}`);closeModal();toast('삭제했습니다');}catch(err){handleWriteError(err,'#lvErr');}};
  });
  $('#leaveForm').addEventListener('submit',async e=>{
    e.preventDefault();if(ro)return;
    const t=ltype($('#lvType').value);
    const data={memberId:$('#lvMember').value,type:t.k,date:$('#lvDate').value,endDate:t.multi?$('#lvEnd').value:'',
      time:t.quarter?$('#lvTime').value.trim():'',days:$('#lvDays').value===''?autoDays(t.k,$('#lvDate').value,$('#lvEnd').value):Math.max(0,+$('#lvDays').value),
      note:$('#lvNote').value.trim(),updatedAt:new Date().toISOString(),createdAt:l.createdAt||new Date().toISOString()};
    if(!data.memberId){$('#lvErr').textContent='구성원을 선택해 주세요.';return;}
    if(!data.date){$('#lvErr').textContent='날짜를 입력해 주세요.';return;}
    if(t.multi&&data.endDate<data.date){$('#lvErr').textContent='종료일이 시작일보다 빠릅니다.';return;}
    const clash=leaves.find(x=>x.id!==l.id&&x.memberId===data.memberId&&leaveDates(x).some(d=>leaveDates(data).includes(d)));
    if(clash&&!$('#leaveForm').dataset.ok){$('#lvErr').textContent=`${fmtDate(clash.date)}에 이미 ${leaveLabel(clash)}이(가) 있습니다. 그래도 저장하려면 한 번 더 누르세요.`;$('#leaveForm').dataset.ok='1';return;}
    $('#lvSave').disabled=true;
    try{const lab=`${memOf(data.memberId)?.name||''} ${leaveLabel(data)} ${fmtDate(data.date)}`;if(isNew){const ref=await db.collection('leaves').add(data);logChange('leave','create',ref.id,lab,null,data);}else{const pt=patchOf(data,l);if(pt)await db.collection('leaves').doc(l.id).update(pt);logChange('leave','update',l.id,lab,l,data);}
      closeModal();toast(isNew?'휴가를 등록했습니다':'저장했습니다');
      if(data.date.slice(0,7)!==lstate.month){lstate.month=data.date.slice(0,7);lstate.year=+data.date.slice(0,4);render();}}
    catch(err){$('#lvSave').disabled=false;handleWriteError(err,'#lvErr');}
  });
}

        if(ch){await db.collection('members').doc(m.id).update({name,email,projectId,part,role,quotas:{[Y]:q},...(avCh?{avatar}:{})});logChange('member','update',m.id,name,{name:old.name,projectId:old.projectId||'',part:old.part||'',quota:quotaOf(old,Y)??''},{name,projectId,part,quota:q});
          // 이름을 바꾸면 이 사람이 담당한 업무의 담당자 이름도 함께 바꿈(집계·필터가 이름 기준이라)
          if(old.name!==name)for(const t of tasks.filter(t=>t.assigneeId===m.id||(!t.assigneeId&&t.assignee===old.name)))await db.collection('tasks').doc(t.id).update({assignee:name,assigneeId:m.id});}
      }
      closeModal();toast(isNew?'계정을 추가했어요':'저장했어요');navKey='';render();
    }catch(err){$('#acSave').disabled=false;$('#acErr').textContent=err?.code==='admin'?(err.message||'관리자 지정을 바꾸지 못했어요.'):'';if(err?.code!=='admin')handleWriteError(err,'#acErr');}
  });
  setTimeout(()=>$('#acName')?.focus(),0);
}


/* ---------- weekly report (주간 보고) ---------- */
let reports=[];
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const mondayOf=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);};
const rstate={week:mondayOf(todayStr()),project:'all',week3:null,view:'sum',fold:new Set()};
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'';
const DOW=['일','월','화','수','목','금','토'];
const reportId=(w,p)=>`${w}__${p}`;
const NOTE_FIELDS=[['summary','주요 성과 · 요약'],['issues','이슈 및 리스크'],['plan','다음 주 계획 메모'],['asks','요청 · 건의사항']];

// 보고서 구조: 프로젝트 → 파트 → (금주 완료 / 진행 중 / 차주 예정 / 지연·보류 / 신규 요청) + 프로젝트별 휴가·부재
const RBLOCKS=[['done','금주 완료'],['doing','진행 중'],['next','차주 예정'],['late','지연 · 보류'],['new','신규 요청']];
function buildReport(ws,pid){
  const we=addDays(ws,6), nws=addDays(ws,7), nwe=addDays(ws,13), T0=todayStr();
  const inR=(d,a,b)=>!!d&&d>=a&&d<=b;
  const T=workItems().filter(t=>pid==='all'||t.projectId===pid);
  const key=t=>(t.jiraKey?`${t.jiraKey} `:'')+(t.rmsNo?`RMS ${t.rmsNo} `:'');
  const who=t=>t.assignee||'담당 미지정';
  const rules={
    done:[t=>t.status==='done'&&inR(t.doneDate,ws,we),t=>`${key(t)}${t.title} — ${who(t)} · 완료 ${md(t.doneDate)}${t.actHours!==''&&t.actHours!=null?` · ${hrs(t.actHours)}h`:''}`],
    doing:[t=>t.status==='doing'||t.status==='review',t=>`${key(t)}${t.title} — ${who(t)} · ${statusOf(t.status).label}${t.dueDate?` · 마감 ${md(t.dueDate)}`:''}`],
    next:[t=>t.status!=='done'&&inR(t.dueDate,nws,nwe),t=>`${key(t)}${t.title} — ${who(t)} · 마감 ${md(t.dueDate)}(${DOW[new Date(t.dueDate+'T00:00:00').getDay()]})`],
    late:[t=>t.status==='hold'||(t.status!=='done'&&t.dueDate&&t.dueDate<=we&&t.dueDate<T0),t=>`${key(t)}${t.title} — ${who(t)} · ${t.status==='hold'?'보류':`마감 ${md(t.dueDate)} 경과`}${t.note?` · ${t.note.slice(0,40)}`:''}`],
    new:[t=>inR(t.requestDate,ws,we),t=>`${key(t)}${t.title} — ${t.requester||'요청자 미기재'} → ${who(t)} · 요청 ${md(t.requestDate)}`]
  };
  const week=eachDay(ws,we);
  const projList=(pid==='all'?projects:projects.filter(p=>p.id===pid)).map(p=>({id:p.id,name:p.name,color:p.color}));
  if(pid==='all'&&(T.some(t=>!projOf(t.projectId))||members.some(m=>!memberProjectIds(m).size)))projList.push({id:'__none',name:'프로젝트 미지정',color:'var(--muted)'});
  const partList=[...PARTS,{k:'__none',label:'파트 미지정',c:'var(--muted)'}];
  const kpi={done:0,doing:0,next:0,late:0,newReq:0,hours:0,leave:0};
  const out=projList.map(P=>{
    const PT=T.filter(t=>P.id==='__none'?!projOf(t.projectId):t.projectId===P.id);
    const cnt={done:0,doing:0,late:0};
    const parts=partList.map(pt=>{
      const PP=PT.filter(t=>pt.k==='__none'?!PARTS.some(x=>x.k===t.part):t.part===pt.k);
      const blocks=RBLOCKS.map(([k,title])=>{
        const list=PP.filter(rules[k][0]).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
        if(k==='done'){kpi.done+=list.length;cnt.done+=list.length;kpi.hours+=list.reduce((a,t)=>a+(+t.actHours||0),0);}
        if(k==='doing'){kpi.doing+=list.length;cnt.doing+=list.length;}
        if(k==='next')kpi.next+=list.length;
        if(k==='late'){kpi.late+=list.length;cnt.late+=list.length;}
        if(k==='new')kpi.newReq+=list.length;
        return {k,title,items:list.map(rules[k][1])};
      }).filter(b=>b.items.length);
      return {label:pt.label,color:pt.c,blocks};
    }).filter(p=>p.blocks.length);
    const mem=members.filter(m=>P.id==='__none'?!memberProjectIds(m).size:memberIn(m,P.id));
    const lv=[];
    for(const l of leaves){const m=mem.find(x=>x.id===l.memberId);if(!m)continue;const ds=leaveDates(l).filter(d=>week.includes(d));if(!ds.length)continue;
      lv.push({sort:ds[0]+m.name,text:`${m.name} · ${ds.length>1?`${md(ds[0])}~${md(ds[ds.length-1])}`:`${md(ds[0])}(${DOW[new Date(ds[0]+'T00:00:00').getDay()]})`} ${leaveLabel(l)}${ds.length>1?` ${ds.length}일`:''}`});}
    lv.sort((a,b)=>a.sort.localeCompare(b.sort));kpi.leave+=lv.length;
    return {name:P.name,color:P.color,counts:cnt,parts,leaves:lv.map(x=>x.text)};
  }).filter(p=>p.parts.length||p.leaves.length);
  const P=pid==='all'?null:projOf(pid);
  return {v:2,ws,we,projectId:pid,projectName:P?P.name:'전체 프로젝트',generatedAt:new Date().toISOString(),kpi,projects:out};
}

function reportText(m,notes){
  const L=[`■ 주간 업무 보고 (${m.ws.replace(/-/g,'.')} ~ ${m.we.slice(5).replace('-','.')})`,`· 범위: ${m.projectName}`,
    `· 완료 ${m.kpi.done}건 / 진행 ${m.kpi.doing}건 / 신규 ${m.kpi.newReq}건 / 지연·보류 ${m.kpi.late}건 / 완료 소요 ${hrs(m.kpi.hours)}h`,''];
  const note=k=>(notes?.[k]||'').trim();
  if(note('summary'))L.push('[주요 성과 · 요약]',note('summary'),'');
  if(m.projects){
    if(!m.projects.length)L.push('이 주에 해당하는 업무가 없습니다.','');
    for(const p of m.projects){
      L.push(`━ ${p.name}  (완료 ${p.counts.done} · 진행 ${p.counts.doing} · 지연 ${p.counts.late})`);
      for(const pt of p.parts){L.push(`  ▸ ${pt.label}`);for(const b of pt.blocks){L.push(`    · ${b.title}`);b.items.forEach(i=>L.push(`      - ${i}`));}}
      if(p.leaves.length){L.push('  ▸ 휴가 · 부재');p.leaves.forEach(x=>L.push(`      - ${x}`));}
      L.push('');
    }
  }else{ // 이전 형식으로 확정된 보고서
    for(const s of m.sections||[]){L.push(`[${s.title}] ${s.count}건`);for(const g of s.groups){L.push(`  ◦ ${g.label}`);g.items.forEach(i=>L.push(`    - ${i}`));}L.push('');}
    L.push(`[휴가 · 부재] ${(m.leaves||[]).length}건`);(m.leaves||[]).forEach(x=>L.push(`  - ${x}`));L.push('');
  }
  if(m.people?.length){L.push('[담당자별 주간 집계]  (집계 = 완료 실제 소요 + 진행 중 입력 소요 / 가용 = 40h − 휴가)');m.people.forEach(p=>L.push(`  - ${p.name}: 집계 ${hrs(p.total)}h / 가용 ${hrs(p.avail)}h  (완료 ${p.doneN}건 ${hrs(p.doneH)}h · 진행 ${p.doingN}건 ${hrs(p.doingH)}h${p.leaveH?` · 휴가 ${hrs(p.leaveH)}h`:''})`));L.push('');}
  for(const [k,label] of NOTE_FIELDS.slice(1))if(note(k))L.push(`[${label}]`,note(k),'');
  return L.join('\n').trim()+'\n';
}
function reportMarkdown(m,notes){
  if(!m.projects)return reportText(m,notes);
  const note=k=>(notes?.[k]||'').trim();
  const L=[`# 주간 업무 보고 (${m.ws.replace(/-/g,'.')} ~ ${m.we.slice(5).replace('-','.')})`,'',`- 범위: ${m.projectName}`,`- 완료 ${m.kpi.done}건 / 진행 ${m.kpi.doing}건 / 신규 ${m.kpi.newReq}건 / 지연·보류 ${m.kpi.late}건 / 완료 소요 ${hrs(m.kpi.hours)}h`,''];
  if(note('summary'))L.push('## 주요 성과 · 요약','',note('summary'),'');
  for(const p of m.projects){
    L.push(`## ${p.name}`,'',`완료 ${p.counts.done} · 진행 ${p.counts.doing} · 지연 ${p.counts.late}`,'');
    for(const pt of p.parts){L.push(`### ${pt.label}`,'');for(const b of pt.blocks){L.push(`**${b.title}**`,'');b.items.forEach(i=>L.push(`- ${i}`));L.push('');}}
    if(p.leaves.length){L.push('### 휴가 · 부재','');p.leaves.forEach(x=>L.push(`- ${x}`));L.push('');}
  }
  if(m.people?.length){L.push('## 담당자별 주간 집계','','| 담당자 | 집계(h) | 가용(h) | 완료 | 완료 소요(h) | 진행 | 진행 소요(h) | 휴가(h) |','|---|---:|---:|---:|---:|---:|---:|---:|');m.people.forEach(p=>L.push(`| ${p.name} | ${hrs(p.total)} | ${hrs(p.avail)} | ${p.doneN} | ${hrs(p.doneH)} | ${p.doingN} | ${hrs(p.doingH)} | ${hrs(p.leaveH)} |`));L.push('');}
  for(const [k,label] of NOTE_FIELDS.slice(1))if(note(k))L.push(`## ${label}`,'',note(k),'');
  return L.join('\n').trim()+'\n';
}
function reportCsv(m,notes){
  // 한 줄 = 업무 1건. 내용은 '업무명'과 '상세(담당·날짜·소요)'로 나눔
  const cell=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const wk=`${m.ws.replace(/-/g,'.')}~${m.we.slice(5).replace('-','.')}`;
  const split=i=>{const k=i.indexOf(' — ');return k<0?[i,'']:[i.slice(0,k),i.slice(k+3)];};
  const rows=[['주간','프로젝트','파트','구분','업무','상세']];
  const note=k=>(notes?.[k]||'').trim();
  rows.push([wk,m.projectName,'','요약',`완료 ${m.kpi.done} / 진행 ${m.kpi.doing} / 신규 ${m.kpi.newReq} / 지연·보류 ${m.kpi.late} / 완료 소요 ${hrs(m.kpi.hours)}h`,'']);
  if(note('summary'))rows.push([wk,m.projectName,'','주요 성과 · 요약',note('summary'),'']);
  if(m.projects){
    for(const p of m.projects){
      for(const pt of p.parts)for(const b of pt.blocks)for(const i of b.items){const [a,d]=split(i);rows.push([wk,p.name,pt.label,b.title,a,d]);}
      for(const x of p.leaves){const k=x.indexOf(' · ');rows.push([wk,p.name,'휴가 · 부재','휴가',k<0?x:x.slice(0,k),k<0?'':x.slice(k+3)]);}
    }
  }else{
    for(const s of m.sections||[])for(const g of s.groups)for(const i of g.items){const [a,d]=split(i);rows.push([wk,m.projectName,g.label,s.title,a,d]);}
    for(const x of m.leaves||[]){const k=x.indexOf(' · ');rows.push([wk,m.projectName,'휴가 · 부재','휴가',k<0?x:x.slice(0,k),k<0?'':x.slice(k+3)]);}
  }
  for(const p of m.people||[])rows.push([wk,(m.projectId&&m.projectId!=='all')?m.projectName:((p.projects||[]).join(' / ')||'프로젝트 미지정'),'','담당자별 집계',p.name,`집계 ${hrs(p.total)}h / 가용 ${hrs(p.avail)}h · 완료 ${p.doneN}건 ${hrs(p.doneH)}h · 진행 ${p.doingN}건 ${hrs(p.doingH)}h · 휴가 ${hrs(p.leaveH)}h`]);
  for(const [k,label] of NOTE_FIELDS.slice(1))if(note(k))rows.push([wk,m.projectName,'',label,note(k),'']);
  return '\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n');
}

      ${p.leaves.length?`<div class="rpartcard"><div class="rpart"><span class="sw" style="background:var(--muted)"></span>휴가 · 부재</div><ul>${p.leaves.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    </div></section>`).join('');
}

// 보고서가 이미 있으면 바뀐 필드만 update(메모는 칸별로 합쳐짐), 없을 때만 set으로 새로 만듦.
// 여러 사람이 같은 주 보고서의 다른 메모 칸을 써도 서로 지우지 않게 하려는 것
async function saveReport(patch){
  const id=reportId(rstate.week,rstate.project), cur=reports.find(r=>r.id===id), at=new Date().toISOString();
  if(cur){await db.collection('reports').doc(id).update({...patch,updatedAt:at});return;}
  await db.collection('reports').doc(id).set({week:rstate.week,projectId:rstate.project,notes:{},confirmed:false,model:null,confirmedAt:'',...patch,updatedAt:at});
}
// 화면에 불러온 뒤(data-base) 내가 고친 메모 칸만 모음
function changedNotes(){const n={};document.querySelectorAll('#reportArea [data-note]').forEach(t=>{if(t.value!==(t.dataset.base??''))n[t.dataset.note]=t.value;});return n;}
function markNotesSaved(n){document.querySelectorAll('#reportArea [data-note]').forEach(t=>{if(t.dataset.note in n)t.dataset.base=n[t.dataset.note];});}
function saveChangedNotes(){const notes=changedNotes();if(!Object.keys(notes).length)return Promise.resolve();return saveReport({notes}).then(()=>markNotesSaved(notes));}
let noteTimer=null, noteBusy=Promise.resolve();
function queueNoteSave(){
  clearTimeout(noteTimer);
  const st=$('#rSaveState');if(st)st.textContent='입력 중…';
  noteTimer=setTimeout(()=>{
    noteBusy=noteBusy.then(saveChangedNotes).then(()=>{const s=$('#rSaveState');if(s)s.textContent='메모 저장됨';}).catch(err=>handleWriteError(err,'#rSaveState'));
  },1200);
}
function flushNotes(){if(noteTimer){clearTimeout(noteTimer);noteTimer=null;noteBusy=noteBusy.then(saveChangedNotes).catch(()=>{});}}

/* ---------- 주간 보고(팀 양식): 목~수 한 주, 카테고리(프로젝트)별 운영 건수와 본문 ---------- */
// 주는 목요일 시작·수요일 끝. n주는 끝나는 수요일이 그 달 몇째 주(월요일 시작, 1일이 든 주 = 1주)인지로 셈 — 팀 양식 표기(10/15~10/21 = 10월 4주)와 같게
const thursdayOf=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+3)%7));return ymd(d);};
rstate.week3=thursdayOf(todayStr());
function rWeekLabel(thu){const wed=addDays(thu,6),firstMon=mondayOf(wed.slice(0,8)+'01');
  return `${wed.slice(2,4)}년 ${+wed.slice(5,7)}월 ${Math.round((new Date(mondayOf(wed)+'T00:00:00')-new Date(firstMon+'T00:00:00'))/(7*864e5))+1}주`;}
const rRange=thu=>`${mdot(thu)} 목 ~ ${mdot(addDays(thu,6))} 수`;
const rTabs=cur=>`<div class="vbar"><div class="vtabs" role="tablist">${[['sum','주간보고'],['detail','주간보고(상세)']].map(([v,l])=>`<button type="button" class="vtab" role="tab" data-goto="report" data-rview="${v}" aria-selected="${cur===v}">${l}</button>`).join('')}</div></div>`;
const R_KINDS=[['done','반영'],['doing','진행'],['recv','접수']];
const v3Id=thu=>`w_${thu}`;
const v3Doc=()=>reports.find(r=>r.id===v3Id(rstate.week3));
const fmtDT=s=>{const d=new Date(s);return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
// 카테고리 = 프로젝트 + 사용자가 추가한 것(그 주 문서에 없으면 가장 최근 주의 것을 이어받음)
function v3Custom(doc){if(doc?.cats)return doc.cats;const prev=reports.filter(r=>r.kind==='v3'&&r.week<rstate.week3&&r.cats).sort((a,b)=>b.week.localeCompare(a.week))[0];return prev?.cats||[];}
function v3Auto(c,thu){
  const wed=addDays(thu,6),inR=d=>!!d&&d>=thu&&d<=wed;
  if(!c.project)return {counts:{done:0,doing:0,recv:0},deploy:0,lists:{done:[],doing:[],recv:[]}};
  const T=workItems().filter(t=>t.projectId===c.id);
  const lists={done:T.filter(t=>t.status==='done'&&inR(t.doneDate)),doing:T.filter(t=>t.status==='doing'||t.status==='review'),recv:T.filter(t=>t.status==='wait')};
  const deploy=events.filter(e=>e.kind==='deploy'&&e.projectId===c.id).reduce((n,e)=>n+deployDates(e,thu,wed).length,0);
  return {counts:{done:lists.done.length,doing:lists.doing.length,recv:lists.recv.length},deploy,lists};
}
// 처음 열 때 그 주 업무로 만드는 본문 초안: ■ 소제목 아래 [파트] 내용(날짜)
function v3Draft(c,thu){const a=v3Auto(c,thu),pl=t=>`[${partOf(t.part).label}] `,L=[],ln=t=>L.push({t,hl:false});
  ln(`■ 반영 ${a.counts.done}건${a.deploy?`(배포 ${a.deploy}건)`:''}`);a.lists.done.forEach(t=>ln(`${pl(t)}${t.title}(${md(t.doneDate)})`));ln('');
  ln(`■ 진행 ${a.counts.doing}건`);a.lists.doing.forEach(t=>ln(`${pl(t)}${t.title}${t.dueDate?`(~${md(t.dueDate)})`:''}`));ln('');
  ln(`■ 접수(검토 중) ${a.counts.recv}건`);a.lists.recv.forEach(t=>ln(`${pl(t)}${t.title}${t.requestDate?`(${md(t.requestDate)})`:''}`));ln('');
  ln('----------');ln('');return L;}
function v3Data(){
  const thu=rstate.week3,doc=v3Doc();
  const cats=[...projects.map(p=>({id:p.id,name:p.name,color:p.color,inCount:true,project:true})),...v3Custom(doc).map(c=>({...c,project:false}))];
  return {thu,doc,cats:cats.map(c=>{const sec=doc?.sections?.[c.id]||{};
    return {...c,sec,counts:sec.countsEdited&&sec.counts?sec.counts:v3Auto(c,thu).counts,lines:Array.isArray(sec.lines)?sec.lines:v3Draft(c,thu)};})};
}
// 편집칸은 줄 목록(lines: [{t, hl}])으로만 저장하고 다시 그림 — 서식·스크립트가 섞이지 않게
const linesHtml=L=>L.map(l=>`<div${l.hl?' class="hl"':''}>${l.t?esc(l.t):'<br>'}</div>`).join('');
function readLines(ed){const out=[];ed.childNodes.forEach(n=>{if(n.nodeType===3){if(n.textContent.trim()||out.length)out.push({t:n.textContent,hl:false});return;}
  if(n.nodeType===1)out.push({t:n.textContent,hl:n.classList.contains('hl')});});return out;}
function edLinesInSel(ed){const sel=getSelection();if(!sel.rangeCount)return [];const r=sel.getRangeAt(0);
  const kids=[...ed.children].filter(c=>r.intersectsNode(c));if(kids.length)return kids;
  let n=r.startContainer;while(n&&n.parentNode!==ed)n=n.parentNode;return n&&n.nodeType===1?[n]:[];}
function toggleHl(ed){const ls=edLinesInSel(ed);if(!ls.length)return;const on=!ls.every(l=>l.classList.contains('hl'));
  ls.forEach(l=>{l.classList.toggle('hl',on);const t=l.textContent;if(on&&!t.startsWith('✔'))l.textContent='✔ '+t;if(!on&&t.startsWith('✔'))l.textContent=t.replace(/^✔\s?/,'');if(!l.textContent)l.innerHTML='<br>';});}
function insertHr(ed){const ls=edLinesInSel(ed),d=document.createElement('div');d.textContent='----------';(ls.length?ls[ls.length-1]:ed.lastChild)?.after?.(d)||ed.append(d);}
// 저장: 구역 단위 부분 저장(다른 사람이 다른 구역을 고쳐도 덮어쓰지 않음)
async function v3SaveDoc(patch){const id=v3Id(rstate.week3),doc=v3Doc(),at=new Date().toISOString();
  if(doc)return db.collection('reports').doc(id).update({...patch,updatedAt:at});
  return db.collection('reports').doc(id).set({kind:'v3',week:rstate.week3,sections:{},cats:v3Custom(null),confirmed:false,confirmedAt:'',...patch,updatedAt:at});}
const v3Save=(cid,patch)=>{const me=myMember();return v3SaveDoc({sections:{[cid]:{...patch,updatedAt:new Date().toISOString(),updatedBy:actorId||'',updatedByName:me?.name||''}}});};
const v3Timer={};
function v3SaveLines(cid){const ed=document.querySelector(`#reportArea [data-cid="${CSS.escape(cid)}"] .rEditor`);if(!ed)return;v3Save(cid,{lines:readLines(ed)}).catch(err=>handleWriteError(err));}
function v3Queue(cid){clearTimeout(v3Timer[cid]);v3Timer[cid]=setTimeout(()=>{delete v3Timer[cid];v3SaveLines(cid);},1000);}
function v3Flush(){for(const cid of Object.keys(v3Timer)){clearTimeout(v3Timer[cid]);delete v3Timer[cid];v3SaveLines(cid);}}

function v3Text(d){const L=[`■ ${rWeekLabel(d.thu)} 주간 업무 보고 (${rRange(d.thu)})`,'','[운영 건수]'],inc=d.cats.filter(c=>c.inCount);

function v3Md(d){const inc=d.cats.filter(c=>c.inCount),L=[`# ${rWeekLabel(d.thu)} 주간 업무 보고`,'',`${rRange(d.thu)}`,'','## 운영 건수','',`| 구분 | ${inc.map(c=>c.name).join(' | ')} | 합계 |`,`|---|${inc.map(()=>'---:').join('|')}|---:|`];
  R_KINDS.forEach(([k,l])=>L.push(`| ${l} | ${inc.map(c=>+c.counts[k]||0).join(' | ')} | **${inc.reduce((n,c)=>n+(+c.counts[k]||0),0)}** |`));
  d.cats.forEach(c=>{L.push('',`## ${c.name}`,'',`반영 ${+c.counts.done||0} · 진행 ${+c.counts.doing||0} · 접수 ${+c.counts.recv||0}`,'');c.lines.forEach(l=>L.push(l.hl?`**✔ ${l.t.replace(/^✔\s?/,'')}**  `:l.t?`${l.t}  `:''));});return L.join('\n');}
function v3Csv(d){const cell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;},inc=d.cats.filter(c=>c.inCount);
  const rows=[['구분',...inc.map(c=>c.name),'합계'],...R_KINDS.map(([k,l])=>[l,...inc.map(c=>+c.counts[k]||0),inc.reduce((n,c)=>n+(+c.counts[k]||0),0)])];
  return '﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n');}
async function v3Xlsx(X,d){const wb=new X.Workbook(),ws=wb.addWorksheet('주간보고'),inc=d.cats.filter(c=>c.inCount),n=inc.length+2;
  ws.columns=[{width:14},...inc.map(()=>({width:16})),{width:10}];
  ws.addRow([`${rWeekLabel(d.thu)} 주간 업무 보고 (${rRange(d.thu)})`]).font={bold:true,size:14};ws.addRow([]);
  const h=ws.addRow(['구분',...inc.map(c=>c.name),'합계']);h.font={bold:true};h.eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEEF1F4'}};c.border={bottom:{style:'thin'}};});
  R_KINDS.forEach(([k,l])=>{const r=ws.addRow([l,...inc.map(c=>+c.counts[k]||0),inc.reduce((m,c)=>m+(+c.counts[k]||0),0)]);r.getCell(n).font={bold:true};});
  d.cats.forEach(c=>{ws.addRow([]);const t=ws.addRow([c.name]);t.font={bold:true,size:12};ws.mergeCells(t.number,1,t.number,n);
    const cr=ws.addRow([`반영 ${+c.counts.done||0} · 진행 ${+c.counts.doing||0} · 접수 ${+c.counts.recv||0}`]);ws.mergeCells(cr.number,1,cr.number,n);cr.font={color:{argb:'FF4B5765'}};
    c.lines.forEach(l=>{const r=ws.addRow([l.t]);ws.mergeCells(r.number,1,r.number,n);if(l.hl)r.font={color:{argb:'FFB00727'}};});});
  return wb.xlsx.writeBuffer();}

/* 주간 보고 엑셀(.xlsx) — 화면과 같은 '프로젝트 → 파트 → 구분' 양식으로 서식을 입혀 저장. ExcelJS는 버튼을 누를 때 한 번만 불러옴 */
let excelLoading=null;
function loadExcel(){
  if(window.ExcelJS)return Promise.resolve(window.ExcelJS);
  if(!excelLoading)excelLoading=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';sc.onload=()=>window.ExcelJS?res(window.ExcelJS):rej(new Error('load'));sc.onerror=()=>{excelLoading=null;rej(new Error('load'));};document.head.appendChild(sc);});
  return excelLoading;
}
function xHex(c,fb){return /^#[0-9a-f]{6}$/i.test(c||'')?c.slice(1).toUpperCase():fb;}
function xTint(hex,t){const n=parseInt(hex,16),r=n>>16&255,g=n>>8&255,b=n&255,f=v=>Math.round(v+(255-v)*t).toString(16).padStart(2,'0');return (f(r)+f(g)+f(b)).toUpperCase();}
// 같은 업무가 '금주 완료'와 '신규 요청'에 모두 있으면 완료 쪽 1건만 남기고 상세에 '금주 신규'를 붙임
function dedupDoneNew(blocks){
  const name=i=>{const k=i.indexOf(' — ');return k<0?i:i.slice(0,k);};
  const done=blocks.find(b=>b.k==='done');if(!done)return blocks;
  const nw=blocks.find(b=>b.k==='new');if(!nw)return blocks;
  const doneNames=new Set(done.items.map(name)), newNames=new Set(nw.items.map(name));
  const out=blocks.map(b=>b.k==='done'?{...b,items:b.items.map(i=>newNames.has(name(i))?i+' · 금주 신규':i)}:b.k==='new'?{...b,items:b.items.filter(i=>!doneNames.has(name(i)))}:b);
  return out.filter(b=>b.items.length);
}
// 화면·텍스트·Markdown·CSV·엑셀 모두 같은 규칙 적용 (확정된 보고서도 보여줄 때 적용)
function dedupModel(m){if(!m)return m;if(m.people){m={...m};delete m.people;}if(!m.projects)return m;return {...m,projects:m.projects.map(p=>({...p,parts:p.parts.map(pt=>({...pt,blocks:dedupDoneNew(pt.blocks)}))}))};}
async function buildReportXlsx(ExcelJS,m,notes){
  const wb=new ExcelJS.Workbook();wb.creator='업무 관리 대시보드';
  const ws=wb.addWorksheet('주간보고',{views:[{showGridLines:false}],pageSetup:{paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0}});
  ws.columns=[{width:14},{width:13},{width:54},{width:42}];
  const FONT='맑은 고딕', thin={style:'thin',color:{argb:'FFD5DCE3'}}, box={top:thin,left:thin,bottom:thin,right:thin};
  const C={ok:'2F7D4F',bad:'B33A2E',acc:'1D5C84',warn:'A46A0B',muted:'5D6B78',head:'E9EDF1',fg:'17212B'};

  if(!projectsList.length){ws.mergeCells(r,1,r,4);put(r,1,'이 주에 해당하는 업무와 휴가가 없습니다.',{font:{color:{argb:'FF'+C.muted}}});r+=2;}
  for(const p of projectsList){

/* ---------- hours (시간 집계) ---------- */
// 담당자별 기간 집계: 완료 업무의 실제 소요(비어 있으면 예상) + 진행 중 업무에 입력된 실제 소요. 가용 = 평일 수 × 8h − 휴가
// 소요시간은 업무 단위 누적값이라, 요청일~완료일(진행 중이면 오늘)의 평일에 고르게 나눠 이 기간 몫만 셈
// ponytail: 날짜별 실제 기록이 없어 균등 배분. 정확히 하려면 일자별 시간 기록(worklog)을 따로 받아야 함
function periodShare(t,end,a,b){
  const s=t.requestDate&&t.requestDate<=end?t.requestDate:end, wd=eachDay(s,end).filter(d=>!isWeekend(d));
  if(!wd.length)return end>=a&&end<=b?1:0;
  return wd.filter(d=>d>=a&&d<=b).length/wd.length;
}
function peopleStats(a,b,pid,withItems){
  const days=eachDay(a,b), work=days.filter(d=>!isWeekend(d)).length*8, today=todayStr();
  const T=workItems().filter(t=>pid==='all'||t.projectId===pid);
  const ppl={};
  const P0=n=>ppl[n]||(ppl[n]={name:n,doneN:0,doneH:0,doingN:0,doingH:0,leaveH:0,noAct:0,items:[],pj:new Set()});
  for(const t of T){
    const L=wlogs.filter(w=>w.taskId===t.id);
    if(L.length){ // 날짜별 기록이 있으면 기록한 날짜·사람 그대로
      const byP={};for(const w of L)if(w.date>=a&&w.date<=b){const nm=memOf(w.memberId)?.name||w.member||'';if(nm)byP[nm]=(byP[nm]||0)+(+w.hours||0);}
      for(const [nm,h] of Object.entries(byP)){const p=P0(nm);if(projOf(t.projectId))p.pj.add(t.projectId);const kind=t.status==='done'?'done':'doing';if(kind==='done'){p.doneN++;p.doneH+=h;}else{p.doingN++;p.doingH+=h;}if(withItems)p.items.push({t,h,est:false,kind,logged:true});}
      continue;
    }
    const n=(t.assignee||'').trim();if(!n)continue;
    if(t.status==='done'&&t.doneDate){const f=periodShare(t,t.doneDate,a,b);if(!f)continue;const p=P0(n);if(projOf(t.projectId))p.pj.add(t.projectId);p.doneN++;const est=t.actHours===''||t.actHours==null;const h=(est?(+t.estHours||0):(+t.actHours||0))*f;p.doneH+=h;if(est)p.noAct++;if(withItems)p.items.push({t,h,est,kind:'done'});}
    else if(t.status==='doing'||t.status==='review'){const f=periodShare(t,today,a,b);if(!f)continue;const p=P0(n);if(projOf(t.projectId))p.pj.add(t.projectId);p.doingN++;const h=(+t.actHours||0)*f;p.doingH+=h;if(withItems)p.items.push({t,h,est:false,kind:'doing'});}
  }
  for(const m of members.filter(m=>memberIn(m,pid))){
    const p=P0(m.name);for(const id of memberProjectIds(m))p.pj.add(id);
    for(const l of leaves.filter(l=>l.memberId===m.id)){const ds=leaveDates(l).filter(d=>days.includes(d));if(!ds.length)continue;const lt=ltype(l.type);p.leaveH+=lt.multi?ds.length*8:lt.days*8;if(withItems)p.items.push({leave:l,h:lt.multi?ds.length*8:lt.days*8,ds,kind:'leave'});}
  }
  return {work,people:Object.values(ppl).map(p=>{const o={...p,projects:[...p.pj].map(id=>projOf(id).name),avail:Math.max(0,work-p.leaveH),total:p.doneH+p.doingH};delete o.pj;if(!withItems)delete o.items;return o;}).sort((x,y)=>y.total-x.total||x.name.localeCompare(y.name,'ko'))};
}
const hrState={period:'month',anchor:null,project:'all',open:new Set()};
function hrRange(){
  const t=todayStr();
  if(!hrState.anchor)hrState.anchor=hrState.period==='week'?mondayOf(t):t.slice(0,7)+'-01';
  if(hrState.period==='week'){hrState.anchor=mondayOf(hrState.anchor);return [hrState.anchor,addDays(hrState.anchor,6)];}
  const a=hrState.anchor.slice(0,7)+'-01',d=new Date(a+'T00:00:00');hrState.anchor=a;return [a,ymd(new Date(d.getFullYear(),d.getMonth()+1,0))];
}

  const rate=sum.avail?Math.round(sum.total/sum.avail*100):0;
  const max=Math.max(work,...people.map(p=>p.total),1);
  const rows=people.map(p=>{

    return `<tr class="hrow ${open?'on':''}" data-person="${esc(p.name)}" tabindex="0"><td class="nowrap"><span class="caret">${open?'▾':'▸'}</span><b>${esc(p.name)}</b>${hrState.project==='all'&&p.projects.length?`<div class="legend" style="padding-left:14px">${esc(p.projects.join(' · '))}</div>`:''}</td>
      <td class="r num"><b class="${over?'late':''}">${hrs(p.total)}h</b></td><td class="r num">${hrs(p.avail)}h</td><td class="r num ${over?'late':''}">${r}%</td>
      <td><div class="hbar" title="가용 ${hrs(p.avail)}h 대비 ${r}%"><i class="d" style="width:${p.doneH/max*100}%"></i><i class="g" style="width:${p.doingH/max*100}%"></i><span class="cap" style="left:${Math.min(100,p.avail/max*100)}%"></span></div></td>
      <td class="r num">${p.doneN}건 · ${hrs(p.doneH)}h${p.noAct?`<span class="legend" title="실제 소요가 비어 예상 소요로 계산"> *${p.noAct}</span>`:''}</td>

  area.innerHTML=`
    <div class="rtool">
      <select class="sel" id="hrPer" aria-label="기간 단위"><option value="week" ${hrState.period==='week'?'selected':''}>주간</option><option value="month" ${hrState.period==='month'?'selected':''}>월간</option></select>
            ${periodSelects(hrState.period,hrState.anchor,'hrPick')}
      <span class="spacer"></span>
      ${exportMenu(downloads&&people.length?[['hrCsv','CSV']]:[])}
    </div>
    ${statTable([[`총 집계`,`${hrs(sum.total)}<small>h</small>`,``],[`총 가용`,`${hrs(sum.avail)}<small>h</small>`,``],[`투입률`,`${rate}<small>%</small><div class="bar"><i style="width:${Math.min(100,rate)}%"></i></div>`,`${rate>100?'alert':''}`],[`완료 소요`,`${hrs(sum.done)}<small>h</small>`,``],[`진행 중 소요`,`${hrs(sum.doing)}<small>h</small>`,``],[`휴가`,`${hrs(sum.leave)}<small>h</small>`,``]])}
    ${people.length?`<div class="tablebox"><table class="ptable"><thead><tr><th>담당자</th><th class="r">집계</th><th class="r">가용</th><th class="r">투입률</th><th style="min-width:180px">투입</th><th class="r">완료</th><th class="r">진행 중</th><th class="r">휴가</th></tr></thead><tbody>${rows}</tbody></table></div>

function memberProjectIds(m){const s=new Set();if(projOf(m.projectId))s.add(m.projectId);for(const a of assigns)if(a.memberId===m.id&&projOf(a.projectId)&&asgStatus(a)!=='end')s.add(a.projectId);return s;}
